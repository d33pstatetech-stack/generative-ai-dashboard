variants: same identity, age, facial proportions, hairstyle, clothing colors and body proportions in every panel\"<\/td>\n<\/tr>\n<tr>\n<td>Reference-image roles for edits<\/td>\n<td>\"Image 1: edit target ... Image 2: product identity reference\" \u2014 never \"\u53c2\u8003\u4e00\u4e0b\u8fd9\u51e0\u5f20\u56fe\"<\/td>\n<\/tr>\n<tr>\n<td>Realism cues for photos<\/td>\n<td>Lens + distance (\"50mm eye-level medium close-up\"), light source direction/size/color temperature, materials, imperfections, contact shadows<\/td>\n<\/tr>\n<tr>\n<td>Anti-hallucination constraints<\/td>\n<td>\"\u4e0d\u7ffb\u8bd1\u3001\u4e0d\u6539\u5199\u3001\u4e0d\u589e\u52a0\u6807\u70b9\u6216\u5ba3\u4f20\u8bcd\" / \"\u4e0d\u751f\u6210\u4efb\u4f55\u5176\u4ed6\u53ef\u8bfb\u6587\u5b57\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Style-first openers (\"\u9ad8\u7ea7\u3001\u7535\u5f71\u611f\")<\/td>\n<td>Task-first: use case, audience, what must be understood<\/td>\n<\/tr>\n<tr>\n<td>Vague text requests (\"add a nice title\")<\/td>\n<td>Verbatim numbered copy + typography map + placement<\/td>\n<\/tr>\n<tr>\n<td>\"Free layout\" for dense content<\/td>\n<td>Explicit grids, node counts, edge lists<\/td>\n<\/tr>\n<tr>\n<td>Generic negative constraints (\"\u4e0d\u8981\u4e11\u3001\u4e0d\u8981 AI \u611f\")<\/td>\n<td>Executable: \"Avoid: duplicate products or floating props; malformed hands, mirrored labels or extra letters; unrelated logos, signatures and watermarks; decorative microtext that is not listed in Text (verbatim).\"<\/td>\n<\/tr>\n<tr>\n<td>Demanding \"flawless\" AND \"candid\" simultaneously<\/td>\n<td>Decide: catalog product shot vs documentary photo<\/td>\n<\/tr>\n<tr>\n<td>Changing style mid-iteration when text is wrong<\/td>\n<td>Single-variable iteration: V1 composition \u2192 V2 exact text \u2192 V3 materials/light \u2192 V4 publish crop<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>(Not published: 3.0 is API-only and no official sampler/steps/guidance values are documented. Community API notes: use PNG output to preserve text sharpness; avoid high acceleration settings for images containing text. Aspect ratios offered on third-party apps: 16:9, 9:16, 1:1, 4:3, 3:4.)<\/p>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Image<\/h3>\n<p>The full four-layer spec applies: task \u2192 visual \u2192 content \u2192 acceptance. Example patterns: infographic with panel count, arrangement, per-panel icon/text/marker colors; newspaper/exam sheet with masthead, column count, question numbers, image zones, answer zones, and prohibitions. For high-stakes factual content (data, science, medical), prepare the content from a reliable source first and let the model handle layout only \u2014 do not ask the image model to derive facts.<\/p>\n<h3>Image-to-Image<\/h3>\n<p>Declare the change and the invariants. Number input images and define each one's role; state the primary edit, then what must be preserved (architecture, camera, crop, people, text, lighting) and match perspective, contact shadows, and existing light. If an edit fails, repeat the invariants and narrow the change scope rather than rewriting the prompt as a brand-new scene description.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>Infographic with exact copy<\/h3>\n<p><strong>Intended content:<\/strong> A clean industrial-tech infographic with two vertical panels titled \"Actual Issues\", three rows with icons/labels/checkmarks.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A beautiful modern infographic about actual issues, professional design, data visualization, high quality, 4K\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Create a clean modern infographic on a dark blue industrial-tech background. The layout is split into two large vertical panels. The left panel title is &quot;Actual Issues&quot; inside a blue rounded rectangle. It contains three stacked rows with icons, labels, and green check marks. Labels: each row uses the supplied label exactly once. No invented numbers, citations, percentages or footnotes. No other text.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> 3.0's strength is honoring long layout instructions \u2014 the good prompt spends its length on copy and layout (panel count, arrangement, per-row contents) instead of adjectives. The bad prompt's \"beautiful/professional\" defines no layout, so the model invents labels and filler statistics.<\/p>\n<h3>Product packaging stability<\/h3>\n<p><strong>Intended content:<\/strong> An amber bottle product shot where the silhouette, cap, and label must stay identical across iterations.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Premium amber bottle product photography, luxurious, stunning, studio lighting, masterpiece\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Product lock: cylindrical amber bottle, height-to-width ratio 3.2:1; forest-green ribbed cap; rectangular ivory paper label, front-facing; do not change silhouette, camera angle, cap, label size or liquid color.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> For product work, invariants beat adjectives. The good prompt locks measurable geometry and forbids the exact failure modes (silhouette drift, label resizing) instead of asking for \"premium\".<\/p>\n<h3>Multi-panel comic<\/h3>\n<p><strong>Intended content:<\/strong> A four-panel comic: cat staring at empty bowl (\"Monday\"), knocking a mug off, owner sighing (\"Again?\"), cat eating (\"Victory\").<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A funny four-panel comic about a cat, clean ink lines, flat color\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Four-panel comic page. Panel 1: a cat stares at an empty bowl, caption &quot;Monday&quot;. Panel 2: cat knocks a mug off the table. Panel 3: owner sighs, speech bubble &quot;Again?&quot;. Panel 4: cat eating, caption &quot;Victory&quot;. Clean ink lines, flat color, 3:4. Invariants: same cat, same bowl, same kitchen in every panel. No other text.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Multi-panel output needs panel-by-panel specs plus continuity invariants (\"same cat ... in every panel\") and the \"no other text\" close; the bad prompt leaves panel contents, captions, and character consistency to chance.<\/p>\n<h3>Precise edit with invariants<\/h3>\n<p><strong>Intended content:<\/strong> Replace four black plastic chairs with pale oak chairs in a cafe interior photo, changing nothing else.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Make the chairs wooden and nicer, keep it photorealistic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Input images: Image 1: edit target, original cafe interior. Primary edit: replace only the four black plastic chairs with pale oak chairs. Invariants: preserve architecture, camera position, crop, table positions, people, window view, wall artwork and all text; match existing perspective, contact shadows and warm afternoon light; do not add or remove any other object.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The edit-mode prompt must declare the change AND the invariants. \"Nicer\" is not a spec; \"pale oak\" is. Listing exactly what must be preserved (including \"all text\" and \"wall artwork\") prevents collateral regeneration.<\/p>\n<h3>Newspaper/exam-sheet layout<\/h3>\n<p><strong>Intended content:<\/strong> A newspaper-style page: masthead, two columns, three article blocks with headlines and captions.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A realistic newspaper page with interesting headlines and photos, vintage style\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Newspaper page, masthead &quot;\u6668\u62a5&quot; centered at top in large bold serif. Two columns. Block 1: headline &quot;\u57ce\u5e02\u7f13\u6162\u751f\u6d3b\u8282\u5f00\u5e55&quot;, body text (verbatim): [paste approved body copy]. Block 2: photo zone with caption &quot;\u6cb3\u7554\u65e7\u4ed3\u5e93\u5916\u666f&quot;. Block 3: headline &quot;\u4ea4\u901a\u7ba1\u5236\u901a\u77e5&quot;, bullet list (verbatim): [paste items]. Footer: page number &quot;03&quot;. Constraints: use only the supplied headlines and copy; no invented articles, dates, or statistics; no other readable text.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Document-style images are 3.0's core use case and they need a section-by-section spec with verbatim copy. The bad prompt invites invented headlines and fake news \u2014 exactly the failure mode the acceptance layer (\"no invented articles, dates, or statistics\") prevents.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Poster with verbatim copy (English + Chinese)<\/h3>\n<pre><code>A vertical science poster. Title &quot;\u8f68\u9053\u529b\u5b66&quot; in large bold characters across the upper third, subtitle &quot;Orbital Mechanics&quot; in small widely-spaced capitals directly beneath. Three labelled diagram panels down the centre, captions &quot;\u8fd1\u5730\u70b9&quot;, &quot;\u8fdc\u5730\u70b9&quot;, &quot;\u8f6c\u79fb\u8f68\u9053&quot; under each. A thin rule separates the diagram block from a footer reading &quot;\u7b2c\u4e09\u7248 \u00b7 2026&quot;. Flat editorial illustration, two-colour palette. No other text.\n<\/code><\/pre>\n<h3>Product packaging (from a third-party 3.0 guide)<\/h3>\n<pre><code>Green tea box, front panel, brand name 'Kiyomizu' in Latin letters above the same name in Japanese, subline 'Organic Sencha, 100g', cream paper texture, minimal, 3:4\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Leading with style instead of the task<\/strong> \u2014 \"stunning, cinematic\" defines no success criteria; lead with use case, audience, and what must be readable.<\/li>\n<li><strong>Describing text instead of supplying it<\/strong> \u2014 paste exact copy verbatim; the model renders what you give it, not what you mean.<\/li>\n<li><strong>Leaving dense layouts \"free\"<\/strong> \u2014 specify panel counts, grids, node/edge lists, and reading order.<\/li>\n<li><strong>Skipping the acceptance layer<\/strong> \u2014 without explicit prohibitions (\"no invented numbers\", \"no other text\"), the model fills gaps with plausible fabrications.<\/li>\n<li><strong>Iterating on multiple variables at once<\/strong> \u2014 if V2 changes style while fixing text, you can't tell which change caused the result.<\/li>\n<li><strong>Reviewing only at zoom<\/strong> \u2014 check 10\u201314px small text at the intended display size, not just enlarged.<\/li>\n<li><strong>Trusting model-generated facts<\/strong> \u2014 for data/science/medical diagrams, supply reviewed content; use the model for layout, not derivation.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong><\/li>\n<li><strong>Text Encoder:<\/strong><\/li>\n<li><strong>Max Prompt Tokens:<\/strong> ~4,500 tokens (per Alibaba's launch announcement; an order of magnitude beyond typical image prompts)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Closed model \u2014 no weights, license, model card, parameter count, technical report, or published benchmarks at launch. Text legible down to ~10px; 12 native languages; 20+ fonts; 100+ art styles; full LaTeX page rendering. Standard and Pro editions; Pro aimed at production/API use via Alibaba Cloud Model Studio.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://www.neura.market/news/alibaba-qwen-image-3-0-renders-infographics-tiny-text (4,500 tokens, 10px text, 12 languages, \"Real\" positioning, no open weights)<\/li>\n<li>https://decrypt.co/374084/alibaba-qwen-image-3-ai-useful-not-just-pretty (launch coverage: rich content, authentic details, LaTeX, single-pass multi-panel demos)<\/li>\n<li>https://tech-insider.org/how-to-use-qwen-image-3-0-2026/ (no benchmarks/model card/weights at launch; 20+ fonts, 100+ art styles; Pro vs Standard)<\/li>\n<li>https://www.orcarouter.ai/blog/qwen-image-2-1-vs-qwen-image-3-0 (timeline: 3.0 shipped 2026-07-21, GA 2026-08-05; 2.1 newer; licensing positions)<\/li>\n<li>https://auraai.app/models/qwen-image-3 (aspect ratios 16:9/9:16/1:1/4:3/3:4, example packaging/comic prompts)<\/li>\n<li>https://miraflow.ai/blog/qwen-image-3-pro-prompts-infographics-text-layouts-2026 (Pro vs Standard positioning; 4,500-token budget practical notes)<\/li>\n<li>https://github.com/bestimageai/awesome-qwen-image-3 (180-prompt library; prompt-structure and multilingual-typography docs)<\/li>\n<li>https://raw.githubusercontent.com/bestimageai/awesome-qwen-image-3/HEAD/docs/qwen-image-3-prompt-guide.md (four-layer structure, verbatim-text templates, panel specs, identity anchors, edit invariants, single-variable iteration)<\/li>\n<li>https://github.com/yrn-dev/operator-alem-image-plus/blob/HEAD/skills/alem-image-plus/references/qwen-image-2512-guide.md (layout-spec approach for text-heavy graphics, \"same approximate person\" phrasing)<\/li>\n<li>https://github.com/cozy-art/super-skills/blob/HEAD/skills/image/qwen-image-v2/SKILL.md (prompt-length-by-use-case table, text workflow: PNG output, avoid high acceleration for text)<\/li>\n<li>https://github.com/brndngln/nodetool/blob/HEAD/packages/system-skills/qwen-image-prompting/SKILL.md (prompt budget 5000 chars / negative 500 on API endpoints; \"no other text\" habit)<\/li>\n<\/ul>", "pairs": 5, "file": "models/image/qwen-image-3.x.md"}, "image/general-image/0": {"title": "General Image-Prompting Tips (Cross-Family)", "html": "\n<p><strong>Model:<\/strong> N/A \u2014 cross-family guidance\n<strong>Developer:<\/strong> N/A\n<strong>Type:<\/strong> Image\n<strong>Text Encoder:<\/strong> Varies (see per-family sections)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>This file collects prompting knowledge that applies beyond a single model: universal principles that hold across nearly all modern image generators, plus per-family notes on Seedance (video-only \u2014 included so nobody looks for it here), the WAN image-capable models, and other major image families (Stable Diffusion 3.5, the SDXL/SD tag-style family, HunyuanImage, and brief notes where documentation exists). Every section marks what transfers and what does <strong>not<\/strong>.<\/p>\n<hr />\n<h2>Core Principle<\/h2>\n<p>Describe what should be <em>visible<\/em>, concretely and in order of importance. Modern encoders (LLM/VLM or T5) reward specific visual language \u2014 subject, camera, light, material \u2014 and punish vague praise. The two things that do <strong>not<\/strong> transfer across families are negative-prompt behavior and tag-vs-prose style: those are architecture-specific and are called out per family below.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>beautiful stunning masterpiece, 8k, ultra HD, amazing quality photo\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>Portrait of a woman in her 30s, soft window light from the left, 85mm lens, shallow depth of field, natural skin texture\n<\/code><\/pre>\n<hr />\n<h2>Universal Principles (Nearly All Image Models)<\/h2>\n<ol>\n<li><strong>Front-load the subject.<\/strong> Encoders weight early tokens more heavily (documented explicitly for Qwen-VL; true in practice for CLIP/T5 pipelines too). The most important element goes in the first sentence.<\/li>\n<li><strong>Be specific about the visible, not the vibe.<\/strong> Replace adjectives (\"beautiful\", \"cinematic\", \"stunning\") with observable facts: camera/lens (\"85mm\", \"aerial drone shot\"), light direction and quality (\"soft window light from the left\", \"golden hour backlit\"), materials (\"brushed copper\", \"ivory paper\"), and composition (\"rule of thirds\", \"top third\").<\/li>\n<li><strong>One style anchor per prompt.<\/strong> Pick one medium/style (\"editorial photography\", \"flat vector illustration\", \"ukiyo-e woodblock\") and don't contradict it later in the prompt.<\/li>\n<li><strong>Quote in-image text.<\/strong> Exact strings in quotation marks are treated as literal copy by text-capable models (Qwen-Image, SD 3.5, HunyuanImage); described text (\"a sign with Chinese characters\") is never rendered correctly. Always paste the actual characters.<\/li>\n<li><strong>Iterate on one variable at a time.<\/strong> Lock the seed while refining wording; change composition, then text, then materials/light \u2014 never all at once, or you can't attribute the change.<\/li>\n<li><strong>Match aspect ratio to the composition.<\/strong> Panoramas want 16:9/3:2, posters 3:4/9:16; forcing a portrait composition into a square wastes the frame.<\/li>\n<li><strong>For edits, instruct \u2014 don't re-describe.<\/strong> Edit-capable models (Qwen-Image-Edit, FLUX Kontext, Wan Chrono Edit) want \"Replace X with Y, keep Z unchanged\", not a fresh scene description.<\/li>\n<li><strong>Describe the visual instead of boosting quality.<\/strong> On VLM/T5-encoder models, \"masterpiece, 8k, ultra HD\" is ignored \u2014 but note this does <strong>not<\/strong> transfer to the SDXL/SD1.5 tag family, where quality tags are load-bearing (see below).<\/li>\n<\/ol>\n<hr />\n<h2>Seedance Family \u2014 Image Generation<\/h2>\n<p><strong>Seedance is video-only; there is no Seedance image-generation model.<\/strong> Seedance 1.0, 2.0 (Standard/Fast/Studio), and 2.5 are ByteDance text-to-video / image-to-video / reference-to-video models with native audio generation. If you need still images in a Seedance workflow, generate them with ByteDance's companion <strong>image<\/strong> model family, <strong>Seedream<\/strong> (e.g. Seedream 4.x/4.5), and feed those frames into Seedance as first/last frames or references. Do not write Seedance prompts expecting image output \u2014 its prompt schema (content, visuals, camera, motion, audio, storyboard timelines) describes video clips.<\/p>\n<table>\n<thead>\n<tr>\n<th>Transfers from video prompting<\/th>\n<th>Does NOT transfer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Scene description habits (subject, environment, lighting, camera terms)<\/td>\n<td>Motion, duration, audio, and timeline structure have no meaning for stills<\/td>\n<\/tr>\n<tr>\n<td>Reference-image discipline (roles per image)<\/td>\n<td>Negative-prompt conventions are Seedance-API-specific<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>WAN Family \u2014 Image Generation Models<\/h2>\n<p>WAN is primarily a video family, but <strong>Wan2.1 is a unified image+video model<\/strong>: the T2V checkpoints generate stills via the <code>t2i-14B<\/code> task (<code>--frame_num 1<\/code>, e.g. <code>generate.py --task t2i-14B --size 1024*1024 --ckpt_dir ./Wan2.1-T2V-14B<\/code>). Alibaba Cloud's DashScope also serves dedicated image SKUs: <code>wanx2.1-t2i-plus<\/code>, <code>wanx2.1-t2i-turbo<\/code>, and (per community API docs) <code>wan2.7-image<\/code>. No separate per-version image prompting docs were found for 2.2+; the guidance below is documented for Wan2.1 and generalizes within the family where the T5-XXL encoder is shared (labeled as generalization).<\/p>\n<p><strong>How WAN image prompting differs:<\/strong>\n- <strong>Long, cinematic, narrative prompts.<\/strong> The 14B architecture + T5-XXL encoder is built for <em>semantic understanding<\/em> of detailed scene descriptions, not keyword matching. Community prompting guides recommend <strong>100\u2013150 words<\/strong> written as coherent narrative sentences \u2014 \"describe the scene to a professional cinematographer,\" with rich subject detail, environment, lighting, camera/lens terminology, and mood.\n- <strong>Prompt extension is a first-class feature.<\/strong> Wan2.1's official tooling offers <code>--use_prompt_extend<\/code> (via DashScope or local Qwen) which rewrites short prompts into detailed ones before generation. For iteration control, disable it while testing wording.\n- <strong>Classic negative prompts work.<\/strong> Unlike Qwen-Image, Wan's official examples use a conventional SD-style negative keyword list (\"Bright tones, overexposed, static, blurred details, subtitles, ... low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands ... deformed, disfigured ...\"). Tag-style negatives are fine here.\n- <strong>Text rendering is a weak spot, not a feature.<\/strong> Community comparisons note good prompt adherence and high resolution, but anatomy issues and weak typography relative to Qwen-Image. Don't choose WAN for text-heavy graphics; do choose it for cinematic, high-detail scenes.\n- <strong>Slow inference.<\/strong> Reported ~3\u20134\u00d7 slower than SD 3.5/FLUX at the same resolution \u2014 plan fewer, more deliberate iterations.<\/p>\n<table>\n<thead>\n<tr>\n<th>Prompting habit<\/th>\n<th>WAN image models<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Natural-language narrative, 100\u2013150 words<\/td>\n<td>\u2705 Core strength<\/td>\n<\/tr>\n<tr>\n<td>Cinematic camera/lighting vocabulary<\/td>\n<td>\u2705 Core strength<\/td>\n<\/tr>\n<tr>\n<td>Tag lists<\/td>\n<td>\u26a0\ufe0f Underperforms vs. prose (T5 semantic encoder)<\/td>\n<\/tr>\n<tr>\n<td>Weight syntax <code>(x:1.3)<\/code><\/td>\n<td>Not documented \u2014 leave blank<\/td>\n<\/tr>\n<tr>\n<td>SD-style negative keyword lists<\/td>\n<td>\u2705 Officially exemplified<\/td>\n<\/tr>\n<tr>\n<td>Exact in-image text in quotes<\/td>\n<td>\u26a0\ufe0f Weak text rendering \u2014 keep text short or avoid<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Other Major Image Model Families<\/h2>\n<h3>Stable Diffusion 3.5 (MMDiT + CLIP/T5)<\/h3>\n<p>Stability's official prompt guide: <strong>use clear natural language and define the style first<\/strong>, then subject + action, composition, lighting, and color; use camera/framing terms; short phrases in quotes for text; negative prompts refine unwanted elements. Recommended structure: style/medium \u2192 subject + action \u2192 composition/framing \u2192 lighting/color \u2192 technical cues (lens, viewpoint) \u2192 text in quotes \u2192 negative prompt. Example: \"Photography, wide shot of a modern cabin in snow, blue hour light, warm interior glow, crisp detail.\"<\/p>\n<h3>SDXL / SD 1.5 tag-style family (CLIP, 75-token limit)<\/h3>\n<p>The <strong>opposite<\/strong> convention from the VLM/T5 families \u2014 and the main thing that does not transfer:\n- <strong>Tag/keyword prompts work and are often better<\/strong>, especially for anime/checkpoint models trained on Danbooru-style tags (<code>1girl, blue_hair, sunset<\/code>). Order matters; 10\u201330 well-chosen tags beat long sentences.\n- <strong>Quality boosters are load-bearing<\/strong>: <code>(masterpiece:1.4), (best quality:1.4)<\/code> genuinely steer these models \u2014 the reverse of Qwen/FLUX/Z-Image guidance.\n- <strong>Negative prompts are essential<\/strong>, often via embeddings (e.g. EasyNegative) or long keyword lists.\n- <strong>Weight syntax works<\/strong>: <code>(word:1.3)<\/code>, <code>((word))<\/code> are parsed.\n- <strong>75-token CLIP chunks<\/strong> \u2014 very long prompts get truncated; keep prompts tight or use a T5-based model instead.\n- Negation must go in the negative prompt field, never the positive prompt (\"No blur, no noise\" in the positive prompt is an anti-pattern here too).<\/p>\n<h3>HunyuanImage 3.0 (Tencent, native multimodal)<\/h3>\n<p>HunyuanImage-3.0 ships an official <strong>prompt self-rewrite / recaption pipeline<\/strong>: sparse user prompts are expanded by the model (<code>think_recaption<\/code> mode) into detailed descriptions, with structured thinking across subject, composition, environment/background, and lighting. Its system prompt explicitly instructs: <strong>mention the core style 3\u20135 times and end with a style declaration sentence<\/strong>; avoid self-reference (\"this image shows...\"); retain user-specified text exactly. Official showcase prompts are dense Chinese descriptive prose with exact quoted bilingual copy (e.g. <code>\u5370 \"HAPPY AGAIN\" \u7684\u9a6c\u514b\u676f<\/code>, <code>\u914d\u8d85\u5927\u53f7\u85cf\u84dd\u7c97\u4f53 \"\u9a6c\u4e0a\u4e0b\u73ed\"<\/code>), and it handles Chinese typography well. Practical takeaway: short prompts are fine (the model expands them), but pasting exact text strings and repeating the style anchor matches its training.<\/p>\n<h3>PixArt-Sigma, Playground, Kolors<\/h3>\n<p>No dedicated, verifiable prompting documentation was found for these families in this research pass \u2014 sections left intentionally blank rather than guessed. As labeled generalizations from shared architecture traits (not verified per-model docs): PixArt-family models were trained on dense long captions and generally reward detailed prose; Playground v2.5/v3 leans natural-language; Kolors is Chinese-lab bilingual. Verify against each model's own card before relying on this.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples (Universal Principles)<\/h2>\n<h3>Specificity beats adjectives<\/h3>\n<p><strong>Intended content:<\/strong> A photorealistic portrait of a woman in soft window light.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A beautiful woman, stunning portrait, masterpiece, 8k, ultra high quality, amazing lighting\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Photorealistic portrait of a woman in her 30s, friendly confident expression, soft diffused window light from the left, 85mm lens, shallow depth of field, natural skin texture, subtle blurred gray background\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Every adjective in the bad prompt (\"beautiful\", \"stunning\", \"amazing\") names no visible fact, and quality boosters are ignored by VLM/T5 encoders. The good prompt specifies age, expression, light direction/quality, lens, depth of field, and background \u2014 things a renderer can actually draw.<\/p>\n<h3>Front-loading the subject<\/h3>\n<p><strong>Intended content:<\/strong> A red fox in tall grass at dawn.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Illustration with soft morning light and a muted palette, featuring somewhere a red fox in tall grass, shallow depth of field\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Illustration, a red fox in tall grass, soft morning light, muted palette, shallow depth of field\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Encoders weight early tokens more; burying the subject (\"featuring somewhere a red fox\") weakens its presence. The good version (adapted from the SD 3.5 guide's example) leads with style, then subject, then light/color/technique.<\/p>\n<h3>Quoting in-image text<\/h3>\n<p><strong>Intended content:<\/strong> A coffee shop sign reading \"The Daily Grind\".<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A vintage coffee shop sign with nice welcoming text on it, weathered wood, morning light\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A vintage coffee shop sign that says &quot;The Daily Grind&quot; in elegant serif font, weathered wood background, morning light casting shadows\n<\/code><\/pre>\n<p><strong>Why:<\/strong> \"Nice welcoming text\" renders as plausible gibberish on every model; the exact quoted string is treated as literal copy by text-capable models (Qwen-Image, SD 3.5, HunyuanImage). Font + material + light complete the spec.<\/p>\n<h3>Edit as instruction, not description<\/h3>\n<p><strong>Intended content:<\/strong> Remove background people from a photo, keep the main subject untouched.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>a woman with a red hat in a rainy street\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Add a red wool hat to the woman, keep her face, hairstyle, and the rainy street unchanged.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Edit models (Qwen-Image-Edit, FLUX Kontext, Wan Chrono Edit) apply the prompt as an instruction to the input image. Re-describing the scene invites full regeneration; naming the change plus invariants (\"keep ... unchanged\") preserves the rest. (Example pair from the Wan2GP prompting docs.)<\/p>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Copying SDXL tag habits onto VLM/T5 models<\/strong> (or vice versa) \u2014 tag soup, weight syntax, and booster tags are architecture-specific; check the family first.<\/li>\n<li><strong>Assuming negative prompts behave the same everywhere<\/strong> \u2014 essential on SDXL, sentence-form on Qwen-2.0 APIs, near-useless on 1.x-era Qwen, keyword-list on WAN, minimal effect on FLUX.<\/li>\n<li><strong>Describing text instead of quoting it<\/strong> \u2014 universal failure across all families.<\/li>\n<li><strong>Vague adjectives as a substitute for camera/light/material language<\/strong> \u2014 \"cinematic\" is not a lighting setup.<\/li>\n<li><strong>Changing seed and wording simultaneously<\/strong> \u2014 lock the seed to isolate what the wording changed.<\/li>\n<li><strong>Expecting text rendering from models that are weak at it<\/strong> (WAN, FLUX.1) \u2014 route text-heavy work to Qwen-Image/HunyuanImage.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> N/A (cross-family)<\/li>\n<li><strong>Text Encoder:<\/strong> Family-dependent: CLIP (SDXL/SD1.5, 75-token limit) \u00b7 T5-XXL (WAN, FLUX, PixArt) \u00b7 Qwen2.5-VL/Qwen3-VL (Qwen-Image) \u00b7 MLLM (HunyuanImage-3.0)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> Family-dependent (see per-family sections)<\/li>\n<li><strong>Training Data / Notes:<\/strong> The single biggest predictor of prompt style is the text encoder: CLIP-era models \u2192 tags/weighting/boosters; T5/VLM-era models \u2192 natural-language prose, front-loading, quoted literal text.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/nickpittas/directorsconsole/blob/HEAD/CinemaPromptEngineering/Documentation/model_prompting/stable_diffusion_3.md (SD 3.5 official-guidance summary: natural language, style first, structure)<\/li>\n<li>https://stability.ai/learning-hub/stable-diffusion-3-5-prompt-guide (cited as the SD 3.5 source)<\/li>\n<li>https://github.com/Wan-Video/Wan2.1 (official: Wan2.1 unified image+video, <code>t2i-14B<\/code> task)<\/li>\n<li>https://huggingface.co/Wan-AI/Wan2.1-FLF2V-14B-720P (official t2i command examples)<\/li>\n<li>https://github.com/s-nagaev/chibi/blob/HEAD/skills/wan_prompting_skill.md (WAN prompting skill: 100\u2013150 word narrative, T5-XXL semantic understanding)<\/li>\n<li>https://github.com/fastflair/wan2gp/blob/HEAD/docs/PROMPTS.md (instruction-style edit prompts; Wan2.1 Chrono Edit strictness)<\/li>\n<li>https://gist.github.com/joshalanwagner/66fea2d0b2bf33e29a7527e7f225d11e (T2I shootout: WAN adherence wins, speed, anatomy issues)<\/li>\n<li>https://github.com/issac-new/swarmteam/blob/HEAD/skills/devops/chinese-image-api-integration/SKILL.md (DashScope SKUs: <code>qwen-image-3.0-pro<\/code>, <code>wanx2.1-t2i-plus/turbo<\/code>, <code>wan2.7-image<\/code>, <code>z-image-turbo<\/code>)<\/li>\n<li>https://github.com/modbender/skill-library-mcp/blob/HEAD/data/seedance2-api/SKILL.md (Seedance video-only workflow; Seedream 4.5 as the image companion)<\/li>\n<li>https://pixverse.ai/en/blog/seedance-2-0-now-available-on-pixverse (Seedance 2.0 T2V/I2V/transition/reference modes)<\/li>\n<li>https://github.com/kinovi-ai/kinovi-models/blob/HEAD/models/seedance2-5/README.md (Seedance 2.5 video generation)<\/li>\n<li>https://huggingface.co/tencent/HunyuanImage-3.0/blob/main/system_prompt.py (official recaption system prompt: style reinforcement 3\u20135\u00d7, subject/composition/environment/lighting dimensions)<\/li>\n<li>https://github.com/Tencent-Hunyuan/HunyuanImage-3.0 (official: prompt self-rewrite, showcase prompts with exact quoted bilingual copy)<\/li>\n<li>https://huggingface.co/hollowstrawberry/stable-diffusion-guide (SD tag-style conventions: quality tags, EasyNegative)<\/li>\n<li>https://www.bonsaistudio.io/blog/prompting-guide (Danbooru tag prompting rules)<\/li>\n<li>https://github.com/eagleeyevisionlabz/wayland-m3ta-0s/blob/HEAD/src/process/resources/skills-library/bodies/skills/design-creative/stable-diffusion-prompting/SKILL.md (FLUX natural-language rules, negative-prompt minimal effect)<\/li>\n<li>https://github.com/slahiri/comfyui-ai-photography-toolkit/blob/HEAD/docs/Z-IMAGE-PROMPTING-GUIDE.md (Z-Image vs SD differences table)<\/li>\n<li>https://github.com/mohamedabdallah-14/prompt-to-asset/blob/HEAD/docs/research/06-stable-diffusion-flux/6b-flux-family-prompting.md (FLUX family prompting research)<\/li>\n<\/ul>", "pairs": 4, "file": "models/image/general-image-tips.md"}, "video/wan/0": {"title": "Prompt Guide: Wan 2.1", "html": "\n<p><strong>Model:<\/strong> Wan 2.1 (T2V-1.3B / T2V-14B / I2V-14B)\n<strong>Developer:<\/strong> Alibaba (Wan-Video team)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong> UMT5-XXL (bilingual Chinese/English)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Wan 2.1 is Alibaba's second-generation open-weight video diffusion family, built on a DiT (diffusion transformer) with flow matching and a 3D causal VAE (Wan-VAE). It ships as text-to-video (1.3B and 14B) and image-to-video (14B) variants at 480p and 720p, and became the open-source baseline for cinematic short clips. Relative to the later Wan 2.2, it is a dense single-model architecture rather than a mixture-of-experts, and its I2V model is separate from T2V (2.2 adds the unified TI2V-5B model). Official guidance recommends enabling <strong>prompt extension<\/strong> (Qwen-based rewriting) to enrich detail before generation.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Wan's UMT5-XXL encoder rewards full-sentence, cinematography-flavored natural language over keyword tag soup \u2014 describe the scene the way you would brief a cinematographer, and always name the motion explicitly, since video capacity is allocated to change-over-time.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>cinematic, sunset, horse, desert, 4k, detailed, fast motion\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A lone horse galloping across rippling sand dunes at sunset, its mane whipping in the wind, shot in a low tracking shot at golden hour, cinematic color grading.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not supported<\/td>\n<td>Community testing reports weighting syntax is unreliable with T5-based encoders; use wording order instead<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not supported<\/td>\n<td>No evidence it works; T5 reads natural language<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not supported<\/td>\n<td>No evidence<\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not supported<\/td>\n<td>No evidence<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td>Strongly recommended; a Chinese default negative prompt is the ecosystem standard (see below)<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Unknown<\/td>\n<td>No documented trigger tokens for the base models<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td>Not for base T2V/I2V (see Wan2.1-Fun variants under Prompt Modes)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The default English negative prompt used in the official \ud83e\udd17 Diffusers example:<\/p>\n<pre><code>Bright tones, overexposed, static, blurred details, subtitles, style, works, paintings, images, static, overall gray, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn faces, deformed, disfigured, misshapen limbs, fused fingers, still picture, messy background, three legs, many people in the background, walking backwards\n<\/code><\/pre>\n<p>Community guides note the Chinese version of this negative prompt is considered the strongest in the ecosystem:<\/p>\n<pre><code>\u8272\u8c03\u8273\u4e3d\uff0c\u8fc7\u66dd\uff0c\u9759\u6001\uff0c\u7ec6\u8282\u6a21\u7cca\u4e0d\u6e05\uff0c\u5b57\u5e55\uff0c\u98ce\u683c\uff0c\u4f5c\u54c1\uff0c\u753b\u4f5c\uff0c\u753b\u9762\uff0c\u9759\u6b62\uff0c\u6574\u4f53\u53d1\u7070\uff0c\u6700\u5dee\u8d28\u91cf\uff0c\u4f4e\u8d28\u91cf\uff0cJPEG\u538b\u7f29\u6b8b\u7559\uff0c\u4e11\u964b\u7684\uff0c\u6b8b\u7f3a\u7684\uff0c\u591a\u4f59\u7684\u624b\u6307\uff0c\u753b\u5f97\u4e0d\u597d\u7684\u624b\u90e8\uff0c\u753b\u5f97\u4e0d\u597d\u7684\u8138\u90e8\uff0c\u7578\u5f62\u7684\uff0c\u6bc1\u5bb9\u7684\uff0c\u5f62\u6001\u7578\u5f62\u7684\u80a2\u4f53\uff0c\u624b\u6307\u878d\u5408\uff0c\u9759\u6b62\u4e0d\u52a8\u7684\u753b\u9762\uff0c\u6742\u4e71\u7684\u80cc\u666f\uff0c\u4e09\u6761\u817f\uff0c\u80cc\u666f\u4eba\u5f88\u591a\uff0c\u5012\u7740\u8d70\n<\/code><\/pre>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Under-uses the encoder; the model fills gaps with generic motion and composition<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>~100\u2013150 words of coherent descriptive sentences; one documented rule of thumb: lead with subject and action since the model weighs the start of the prompt most heavily<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>UMT5-XXL truncates at 512 tokens; community measurement shows quality degrades around 320\u2013350 tokens (~200\u2013250 words) as it exits the cross-attention training distribution<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<h3>Wan version quick comparison<\/h3>\n<table>\n<thead>\n<tr>\n<th>Model Version<\/th>\n<th>Target Prompt Length<\/th>\n<th>Key Sequence Control<\/th>\n<th>Preferred Camera Jargon<\/th>\n<th>Distinction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Wan 2.1<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single-beat focus; transition words (<code>Initially... -&gt; Then...<\/code>)<\/td>\n<td><code>dolly in/out<\/code>, <code>push-in<\/code>, <code>tracking shot<\/code><\/td>\n<td>Open foundation; concise single shots<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.2<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single 5s motion arc<\/td>\n<td><code>dolly zoom<\/code>, <code>tilt up/down<\/code>, 360-degree <code>camera roll<\/code><\/td>\n<td>MoE architecture; high/low-noise LoRAs<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.5<\/strong><\/td>\n<td>Medium length<\/td>\n<td>One committed move per 5s clip<\/td>\n<td><code>panoramic drone push<\/code>, <code>tracking shot<\/code><\/td>\n<td>Flash tier; strong atmospheric layering<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.6<\/strong><\/td>\n<td>Up to 800 chars<\/td>\n<td>Timing brackets (<code>Shot 1 [0-4s]: ...<\/code>)<\/td>\n<td><code>push<\/code>, <code>pull<\/code>, <code>orbit<\/code>, <code>FPV drone<\/code><\/td>\n<td>Multi-shot cuts; R2V (<code>@Video1<\/code>); native audio<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.7<\/strong><\/td>\n<td>6-part shot list<\/td>\n<td>Thinking-Mode reasoning directives<\/td>\n<td><code>dolly in<\/code>, <code>tracking shot<\/code>, <code>slow push<\/code><\/td>\n<td>Pre-render reasoning; FLF2V 5s control<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 3.0<\/strong><\/td>\n<td>30s narrative arc<\/td>\n<td>SPACE framework (continuous take)<\/td>\n<td>One single sustained camera move<\/td>\n<td>Native 30s takes; Omni-Reference (20 assets)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Source: user's Wan prompting reference (Oct 2026).<\/em><\/p>\n<p>Official prompt formula (Alibaba Cloud Model Studio guidance):<\/p>\n<p><strong>Basic (beginners):<\/strong><\/p>\n<pre><code>Subject + Scene + Motion\n<\/code><\/pre>\n<p><strong>Advanced (more control):<\/strong><\/p>\n<pre><code>Subject (Description) + Scene (Description) + Motion (Description) + Aesthetic Control + Stylization\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject (Description)<\/td>\n<td>Main character/object with rich detail, materials, attributes<\/td>\n<td>\"A small robot with a rusted dome head and glowing amber eyes\"<\/td>\n<\/tr>\n<tr>\n<td>Scene (Description)<\/td>\n<td>Environment, time of day, weather, layered background<\/td>\n<td>\"exploring a neon-lit alleyway in the rain at night\"<\/td>\n<\/tr>\n<tr>\n<td>Motion (Description)<\/td>\n<td>What moves and how \u2014 always explicit; video models reward named motion<\/td>\n<td>\"slowly rolling forward as rain falls around it\"<\/td>\n<\/tr>\n<tr>\n<td>Aesthetic Control<\/td>\n<td>Lighting, shot size, camera angle, lens, camera movement<\/td>\n<td>\"soft rim lighting, slow dolly in, 35mm lens\"<\/td>\n<\/tr>\n<tr>\n<td>Stylization<\/td>\n<td>Style keywords: cyberpunk, anime, watercolor, line-drawing<\/td>\n<td>\"cyberpunk, cinematic color grading\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Named motion<\/td>\n<td>\"waves rolling in\", \"hair blowing in the wind\", \"camera slowly dollying right\"<\/td>\n<\/tr>\n<tr>\n<td>Subject-first ordering<\/td>\n<td>Subject \u2192 Motion \u2192 Camera \u2192 Scene; the start of the prompt is weighted most<\/td>\n<\/tr>\n<tr>\n<td>Camera terminology<\/td>\n<td>\"tracking shot\", \"shallow depth of field\", \"slow pan left to right\", \"overhead crane shot\", \"handheld\"<\/td>\n<\/tr>\n<tr>\n<td>Lighting quality<\/td>\n<td>\"golden hour\", \"volumetric fog\", \"soft morning light\", \"rim lighting\", \"neon city lights\"<\/td>\n<\/tr>\n<tr>\n<td>Materials/textures<\/td>\n<td>\"weathered wood\", \"brushed steel\", \"rain-slicked asphalt\"<\/td>\n<\/tr>\n<tr>\n<td>One scene per clip<\/td>\n<td>Single continuous shot; prompts describing scene cuts produce mush<\/td>\n<\/tr>\n<tr>\n<td>Language choice<\/td>\n<td>English and Chinese both work (bilingual training); keep each prompt in one language<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Keyword soup: \"cinematic, sunset, horse, desert, 4k, detailed\"<\/td>\n<td>A coherent sentence: \"A lone horse galloping across rippling sand dunes at sunset...\"<\/td>\n<\/tr>\n<tr>\n<td>Static scene description with no motion<\/td>\n<td>Explicit change-over-time: \"waves rolling in, hair blowing in the wind\"<\/td>\n<\/tr>\n<tr>\n<td>Vague quality words: \"nice lighting\", \"good quality\", \"professional\"<\/td>\n<td>Specifics: \"soft morning light filtering through venetian blinds\"<\/td>\n<\/tr>\n<tr>\n<td>Multiple scenes / cuts in one prompt<\/td>\n<td>One scene per clip (5-second clips are shots, not films)<\/td>\n<\/tr>\n<tr>\n<td>Over-prompting style<\/td>\n<td>Trust the cinematic engine; excessive style keywords can conflict with its native look<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>50 (official generate.py default); 20\u201330 acceptable for local drafts<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>5.0 (official default)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>832\u00d7480 (480p) or 1280\u00d7720 (720p); frame count follows the 4n+1 grid (81 frames typical)<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>UniPC (flow matching, order 2); flow shift 8\u201312 (5 for 720p, 12 for 480p per community recipes)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>bfloat16<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt must carry the <strong>full scene<\/strong>: subject, setting, lighting, style, plus explicit motion and camera work. Use the Basic or Advanced formula above. Official examples on the model card are long single-paragraph scene descriptions (~80\u2013150 words). Enable prompt extension so the Qwen-based rewriter enriches short inputs automatically.<\/p>\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>T2V + LoRA template:<\/strong><\/p>\n<pre><code>[LoRA Trigger Word], [Subject Description], [Primary Motion], in [Scene/Environment Description], [Camera Movement], [Lighting &amp; Atmosphere], [Visual Style], [Negative Prompt]\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>cxx_cyberpunk_style, a cybernetic samurai with a glowing visor, slowly draws a katana from his sheath while stepping forward on a rain-slick Tokyo alley at night, slow camera push-in at waist height, volumetric pink neon backlight reflecting off wet asphalt, 4K cinematic film grain.<\/code>\n<strong>Negative Prompt:<\/strong> <code>morphing, warping, face deformation, flickering, jittering, sudden cuts, subtitles, low quality, JPEG compression residue<\/code><\/p>\n<\/blockquote>\n<p><strong>Tips:<\/strong> Target 80-120 words and build the complete scene (subject, motion, camera, atmosphere, style) \u2014 under-specifying makes the model fall back to generic choices. Do NOT use timestamp/shot brackets like <code>[0-3s]<\/code>; focus on one primary motion, sequencing with <code>Initially... -&gt; Then... -&gt; Finally...<\/code>. Avoid whip pans and crash zooms (they cause warping). Place LoRA trigger words near the start of the prompt, weight 0.5-1.0.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>The image supplies subject, style, and setting \u2014 the prompt's job shifts to <strong>motion, action, and camera movement<\/strong>. The documented I2V formula is:<\/p>\n<pre><code>Motion Description + Camera Movement\n<\/code><\/pre>\n<p>Example from official guidance: <em>\"The character waves slowly while the camera pans left. Soft breeze moves the surrounding leaves.\"<\/em><\/p>\n<p>Do <strong>not<\/strong> re-describe what is already in the image; conflicting content directives weaken motion fidelity. For the Fun-Control variants (Canny/Depth/Pose/MLSD control), the prompt describes motion style, atmosphere, or visual texture while control maps handle structure \u2014 keep depth-map blacks slightly lifted, since pure black trips the control models.<\/p>\n<p><strong>Instruction-style variants:<\/strong> Wan2.1 Chrono Edit and Wan2.1 VACE are instruction/edit models \u2014 the prompt should be an imperative instruction (\"Remove the people in the background and keep the main subject untouched\"), not a scene description. These models are stricter about prompt format, so the prompt enhancer is recommended.<\/p>\n<p><strong>Spicy variants:<\/strong> Community \"NSFW\" finetunes and abliterated text encoders (e.g. <code>nsfw_wan_umt5-xxl<\/code>) exist for the Wan 2.1 ecosystem, and NSFW-focused spaces run Wan 2.1. No source documents a prompting <em>syntax<\/em> difference for these variants \u2014 they accept the same cinematic, subject-first prompt structure; the difference is in the finetuned weights / encoder, not the prompt format.<\/p>\n<hr />\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>I2V template:<\/strong><\/p>\n<pre><code>[Primary Subject Motion], [Camera Movement], [Environmental Changes], [Pacing/Speed Modifier]\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>The knight slowly turns his head to look toward the camera, camera dollies back slowly to reveal wind whipping through the surrounding trees, falling autumn leaves drifting across the frame, smooth cinematic motion.<\/code><\/p>\n<\/blockquote>\n<p><strong>Rule:<\/strong> Do NOT re-describe static visual details already present in the image \u2014 prompt only for subject motion, camera movement, and atmospheric changes.<\/p>\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V: Rainy street scene<\/h3>\n<p><strong>Intended content:<\/strong> A detective walking through a rainy neon city street at night, cinematic.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>detective, city, rain, night, neon, cinematic, 4k, masterpiece, best quality\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A weary detective in a trench coat walks slowly down a rain-soaked street at night, neon signs reflecting in the puddles around his boots. Rain falls steadily as the camera tracks beside him in a medium shot, shallow depth of field blurring the glowing storefronts. Teal and orange color grading, volumetric fog, cinematic lighting, shot on a 35mm lens.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt is keyword soup with no motion \u2014 the video model has no change-over-time to animate. The good prompt leads with the subject, names the motion (walks, rain falls, camera tracks), and ends with camera/lens/style, matching Wan's semantic ordering.<\/p>\n<h3>I2V: Animate a portrait still<\/h3>\n<p><strong>Intended content:<\/strong> Make a still photo of a woman in a garden come alive.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A beautiful woman with long brown hair standing in a lush green garden full of colorful flowers, golden sunlight, photorealistic portrait\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>She turns her head slowly toward the camera and smiles gently, her hair lifting in a soft breeze. Flower petals drift past the lens as the camera slowly pushes in.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> In I2V the image already carries subject, setting, and style \u2014 re-describing them wastes the prompt and can fight the input image. The good prompt describes only motion and camera, which is the prompt's actual job in I2V.<\/p>\n<h3>T2V: Coffee shop morning<\/h3>\n<p><strong>Intended content:<\/strong> A cozy coffee shop interior, barista pouring latte art, warm morning light.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A nice coffee shop with a barista making coffee in the morning with good lighting and warm colors\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Inside a cozy coffee shop at dawn, a barista pours steamed milk into a cup, drawing rosetta latte art. Warm morning light streams through tall windows, catching the rising steam. The camera slowly dollies in toward the counter, gentle motion blur on the pour, cinematic warm grading.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> \"Nice\" and \"good lighting\" give the encoder nothing concrete. The good version specifies the action (pours, drawing), the lighting source and behavior (streams through windows, catching steam), and an explicit camera move \u2014 exactly the Subject \u2192 Motion \u2192 Camera ordering Wan rewards.<\/p>\n<h3>I2V: City skyline, camera move only<\/h3>\n<p><strong>Intended content:<\/strong> Animate a city skyline still with a gentle camera move and living clouds.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Zoom in on the skyscrapers, then zoom out, then a helicopter flies through the frame, then fireworks explode, then the sun sets\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Slow gentle zoom in with subtle parallax, clouds drifting slowly across the sky, sunlight shifting softly on the glass facades.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt crams multiple scenes and cuts into one 5-second clip \u2014 Wan treats one prompt as one shot, and scene-cut prompts produce mush. The good prompt is one continuous shot with two named motions and one camera move.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Cinematic T2V<\/h3>\n<pre><code>A black-haired Miao girl wearing traditional clothing stands in a misty mountain village. The camera slowly dollies in as lanterns sway in the wind. Soft rim lighting, cinematic color grading, 35mm lens, gentle motion blur.\n<\/code><\/pre>\n<h3>Dynamic T2V<\/h3>\n<pre><code>Two anthropomorphic cats in comfy boxing gear and bright gloves fight intensely on a spotlighted stage.\n<\/code><\/pre>\n<h3>I2V motion prompt<\/h3>\n<pre><code>Cherry blossoms swaying gently in the breeze, petals falling, smooth motion\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Prompting I2V like T2V<\/strong> \u2014 re-describing the image's content instead of describing motion and camera; the prompt should be Motion Description + Camera Movement.<\/li>\n<li><strong>Leaving motion unnamed<\/strong> \u2014 a static scene description gives the model nothing to animate; every prompt needs change-over-time (\"waves rolling in, hair blowing\").<\/li>\n<li><strong>Multiple scenes per prompt<\/strong> \u2014 one clip is one shot; cuts and timelines produce mush (except specialist Enhanced/Timeline LoRAs that expect them).<\/li>\n<li><strong>Keyword soup<\/strong> \u2014 the UMT5 encoder is instruction-grade; grammatically coherent sentences beat comma-separated tags.<\/li>\n<li><strong>Overlong prompts<\/strong> \u2014 quality degrades past ~320\u2013350 tokens; lead with subject/action since the start is weighted most.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Wan-AI/Wan2.1-T2V-14B, Wan2.1-T2V-1.3B, Wan2.1-I2V-14B-720P / 480P<\/li>\n<li><strong>Text Encoder:<\/strong> UMT5-XXL (bilingual Chinese/English instruction-grade)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> 512 (quality degrades ~320\u2013350 tokens per community measurement)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Flow-matching DiT with 3D causal VAE; 81-frame clips on the 4n+1 grid; official prompt extension via Qwen rewriter; official negative prompts provided in English and Chinese<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://huggingface.co/Wan-AI/Wan2.1-T2V-14B-Diffusers (official model card: prompts, negative prompt, prompt extension, settings)<\/li>\n<li>https://huggingface.co/jc-builds/Wan2.2-TI2V-5B-iOS (community prompting guide: order matters, name the motion, Chinese negative prompt)<\/li>\n<li>https://github.com/s-nagaev/chibi/blob/HEAD/skills/wan_prompting_skill.md (Wan 2.1/2.2 prompting rules: 100\u2013150 words, narrative structure)<\/li>\n<li>https://medium.com/@mvpkenlin/mastering-ai-video-generation-with-alibaba-cloud-model-studio-a-practical-guide-to-wan-prompt-d7c8c22d1a0e (official Basic/Advanced/I2V prompt formulas)<\/li>\n<li>https://github.com/fastflair/wan2gp/blob/HEAD/docs/PROMPTS.md (instruction-style prompting for edit models; timeline prompts for Enhanced models)<\/li>\n<li>https://github.com/willhs/lossy/blob/HEAD/docs/tasks/0004-prompt-reformatting/task.md (512-token truncation, quality degradation ~320\u2013350 tokens, weighting unreliable)<\/li>\n<li>https://github.com/flyinggiraffe/vidax/blob/HEAD/docs/models/wan2_1.md (I2V architecture, negative prompt default)<\/li>\n<li>https://github.com/vllm-project/vllm-omni/blob/main/recipes/Wan-AI/Wan2.1-VACE.md (VACE T2V/I2V/V2LF/FLF2V recipes: steps 30, guidance 5.0, 81 frames)<\/li>\n<li>https://github.com/mreflow/ai-slop-detector/blob/HEAD/eval/WAN_GENERATION_RUNTIME.md (UniPC scheduler, flow shift, max text length 512)<\/li>\n<\/ul>", "pairs": 4, "file": "models/video/wan-2.1.md"}, "video/wan/1": {"title": "Prompt Guide: Wan 2.2", "html": "\n<p><strong>Model:<\/strong> Wan 2.2 (T2V-A14B / I2V-A14B MoE, TI2V-5B, S2V-14B, Animate-14B)\n<strong>Developer:<\/strong> Alibaba (Wan-Video team)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong> UMT5-XXL (bilingual Chinese/English)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Wan 2.2 is Alibaba's third-generation open-weight video diffusion family and the first to use a <strong>Mixture-of-Experts (MoE) architecture<\/strong> in video generation. The flagship A14B models (T2V and I2V) split the denoising process between a <strong>high-noise expert<\/strong> (early steps, overall layout/composition) and a <strong>low-noise expert<\/strong> (later steps, detail refinement) \u2014 ~14B parameters per expert, 27B total, but only 14B active per step, so inference cost stays near Wan 2.1's. A separate <strong>TI2V-5B<\/strong> dense model unifies text-to-video and image-to-video in one checkpoint and renders 720p at <strong>24fps<\/strong> thanks to a high-compression Wan2.2-VAE. The lineup also includes <strong>S2V-14B<\/strong> (audio-driven speech-to-video from a reference image + audio) and <strong>Animate-14B<\/strong> (character animation/replacement). Relative to Wan 2.1: richer cinematic training labels (lighting, composition, contrast, color tone), stronger complex motion, and official prompt extension via Qwen (qwen-plus for T2V, qwen-vl-max for I2V).<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Wan 2.2's UMT5-XXL encoder rewards full-sentence, cinematography-flavored natural language over keyword tag soup \u2014 order matters: <strong>subject \u2192 motion \u2192 camera \u2192 scene<\/strong>, with the prompt's start weighted most heavily. Name the motion explicitly, since video capacity is allocated to change-over-time.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>cinematic, sunset, horse, desert, 4k, detailed, fast motion\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A lone horse galloping across rippling sand dunes at sunset, mane whipping in the wind, tracking shot low to the ground, golden-hour light.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not supported<\/td>\n<td>Same encoder family as 2.1: weighting syntax is unreliable with T5-based encoders; use prompt ordering instead<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not supported<\/td>\n<td>No evidence it works; T5 reads natural language<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not supported<\/td>\n<td>No evidence<\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not supported<\/td>\n<td>No evidence<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td>The Chinese default negative prompt is the ecosystem standard (see below)<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Unknown<\/td>\n<td>No documented trigger tokens for the base models<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td>Not for base T2V/I2V (see Fun variants under Prompt Modes)<\/td>\n<\/tr>\n<tr>\n<td>Timeline slash commands<\/td>\n<td>Supported (select models)<\/td>\n<td>The \"Enhanced\"/wan2gp class of Wan 2.2 builds accepts segmented prompts with commands like <code>[/duration=30%,/overlap=9]<\/code> and a second-by-second <code>(at N seconds: ...)<\/code> format<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The upstream default negative prompt (recommended as-is):<\/p>\n<pre><code>\u8272\u8c03\u8273\u4e3d\uff0c\u8fc7\u66dd\uff0c\u9759\u6001\uff0c\u7ec6\u8282\u6a21\u7cca\u4e0d\u6e05\uff0c\u5b57\u5e55\uff0c\u98ce\u683c\uff0c\u4f5c\u54c1\uff0c\u753b\u4f5c\uff0c\u753b\u9762\uff0c\u9759\u6b62\uff0c\u6574\u4f53\u53d1\u7070\uff0c\u6700\u5dee\u8d28\u91cf\uff0c\u4f4e\u8d28\u91cf\uff0cJPEG\u538b\u7f29\u6b8b\u7559\uff0c\u4e11\u964b\u7684\uff0c\u6b8b\u7f3a\u7684\uff0c\u591a\u4f59\u7684\u624b\u6307\uff0c\u753b\u5f97\u4e0d\u597d\u7684\u624b\u90e8\uff0c\u753b\u5f97\u4e0d\u597d\u7684\u8138\u90e8\uff0c\u7578\u5f62\u7684\uff0c\u6bc1\u5bb9\u7684\uff0c\u5f62\u6001\u7578\u5f62\u7684\u80a2\u4f53\uff0c\u624b\u6307\u878d\u5408\uff0c\u9759\u6b62\u4e0d\u52a8\u7684\u753b\u9762\uff0c\u6742\u4e71\u7684\u80cc\u666f\uff0c\u4e09\u6761\u817f\uff0c\u80cc\u666f\u4eba\u5f88\u591a\uff0c\u5012\u7740\u8d70\n<\/code><\/pre>\n<p>(It reads: garish tones, overexposure, static image, blurry details, subtitles, watermark-style artifacts, gray cast, worst quality, JPEG residue, malformed anatomy, fused fingers, still frame, cluttered background, walking backwards \u2014 the classic video-model failure modes.)<\/p>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Under-uses the encoder; the model fills gaps with generic motion and composition<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>One community guide for Wan 2.2 cites <strong>80\u2013120 words<\/strong> as optimal; another Wan 2.2 guide uses ~100\u2013150 words of coherent descriptive sentences. Rule of thumb: lead with subject and action since the model weighs the start of the prompt most heavily<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>UMT5-XXL truncates at 512 tokens (per official config logs). The Wan-family rule carries over: quality degrades past ~320\u2013350 tokens (~200\u2013250 words) as the prompt exits the cross-attention training distribution<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<h3>Wan version quick comparison<\/h3>\n<table>\n<thead>\n<tr>\n<th>Model Version<\/th>\n<th>Target Prompt Length<\/th>\n<th>Key Sequence Control<\/th>\n<th>Preferred Camera Jargon<\/th>\n<th>Distinction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Wan 2.1<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single-beat focus; transition words (<code>Initially... -&gt; Then...<\/code>)<\/td>\n<td><code>dolly in/out<\/code>, <code>push-in<\/code>, <code>tracking shot<\/code><\/td>\n<td>Open foundation; concise single shots<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.2<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single 5s motion arc<\/td>\n<td><code>dolly zoom<\/code>, <code>tilt up/down<\/code>, 360-degree <code>camera roll<\/code><\/td>\n<td>MoE architecture; high/low-noise LoRAs<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.5<\/strong><\/td>\n<td>Medium length<\/td>\n<td>One committed move per 5s clip<\/td>\n<td><code>panoramic drone push<\/code>, <code>tracking shot<\/code><\/td>\n<td>Flash tier; strong atmospheric layering<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.6<\/strong><\/td>\n<td>Up to 800 chars<\/td>\n<td>Timing brackets (<code>Shot 1 [0-4s]: ...<\/code>)<\/td>\n<td><code>push<\/code>, <code>pull<\/code>, <code>orbit<\/code>, <code>FPV drone<\/code><\/td>\n<td>Multi-shot cuts; R2V (<code>@Video1<\/code>); native audio<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.7<\/strong><\/td>\n<td>6-part shot list<\/td>\n<td>Thinking-Mode reasoning directives<\/td>\n<td><code>dolly in<\/code>, <code>tracking shot<\/code>, <code>slow push<\/code><\/td>\n<td>Pre-render reasoning; FLF2V 5s control<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 3.0<\/strong><\/td>\n<td>30s narrative arc<\/td>\n<td>SPACE framework (continuous take)<\/td>\n<td>One single sustained camera move<\/td>\n<td>Native 30s takes; Omni-Reference (20 assets)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Source: user's Wan prompting reference (Oct 2026).<\/em><\/p>\n<p><strong>Basic:<\/strong><\/p>\n<pre><code>Subject + Scene + Motion\n<\/code><\/pre>\n<p><strong>Advanced (more control):<\/strong><\/p>\n<pre><code>Subject + Scene + Motion + Camera + Aesthetics\n<\/code><\/pre>\n<p>(One documented Wan 2.2-specific variant structures this as <code>Subject + Scene + Motion + Camera + Aesthetics<\/code>; the family-standard <code>Subject + Scene + Motion + Aesthetic Control + Stylization<\/code> formula also applies.)<\/p>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject<\/td>\n<td>Main character/object with rich detail, materials, attributes \u2014 first in the prompt<\/td>\n<td>\"A small robot with a rusted dome head and glowing amber eyes\"<\/td>\n<\/tr>\n<tr>\n<td>Scene<\/td>\n<td>Environment, time of day, weather, layered background<\/td>\n<td>\"exploring a neon-lit alleyway in the rain at night\"<\/td>\n<\/tr>\n<tr>\n<td>Motion<\/td>\n<td>What moves and how \u2014 always explicit; video models reward named motion<\/td>\n<td>\"slowly rolling forward as rain falls around it\"<\/td>\n<\/tr>\n<tr>\n<td>Camera<\/td>\n<td>Shot size, angle, movement, lens<\/td>\n<td>\"slow dolly in, 35mm lens, medium tracking shot\"<\/td>\n<\/tr>\n<tr>\n<td>Aesthetics<\/td>\n<td>Lighting, color, style keywords<\/td>\n<td>\"cinematic color grading, volumetric fog, cyberpunk\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject \u2192 motion \u2192 camera \u2192 scene ordering<\/td>\n<td>The start of the prompt is weighted most heavily<\/td>\n<\/tr>\n<tr>\n<td>Named motion with concrete verbs<\/td>\n<td>\"waves crash\", \"the corgi paddles\", \"she spins slowly\"<\/td>\n<\/tr>\n<tr>\n<td>Explicit camera direction<\/td>\n<td>\"tracking shot\", \"shallow depth of field\", \"slow pan left\", \"aerial view\", \"push in\"<\/td>\n<\/tr>\n<tr>\n<td>Light and mood<\/td>\n<td>\"golden hour\", \"volumetric fog\", \"rim lighting\", \"neon glow\", \"heavy rain\"<\/td>\n<\/tr>\n<tr>\n<td>One scene per clip<\/td>\n<td>A 2\u20135 second clip is a shot, not a film; scene-cut prompts produce mush<\/td>\n<\/tr>\n<tr>\n<td>Materials/textures<\/td>\n<td>\"weathered wood\", \"brushed steel\", \"rain-slicked asphalt\"<\/td>\n<\/tr>\n<tr>\n<td>Language choice<\/td>\n<td>English and Chinese both work (bilingual training); keep each prompt in one language<\/td>\n<\/tr>\n<tr>\n<td>Prompt extension<\/td>\n<td>Officially recommended: <code>--use_prompt_extend<\/code> enriches short prompts via Qwen rewriting before generation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Keyword soup: \"cinematic, sunset, horse, desert, 4k, detailed\"<\/td>\n<td>A coherent sentence: \"A lone horse galloping across rippling sand dunes at sunset...\"<\/td>\n<\/tr>\n<tr>\n<td>Static scene description with no motion<\/td>\n<td>Explicit change-over-time: \"waves rolling in, hair blowing in the wind\"<\/td>\n<\/tr>\n<tr>\n<td>Vague quality words: \"nice lighting\", \"good quality\", \"professional\"<\/td>\n<td>Specifics: \"soft morning light filtering through venetian blinds\"<\/td>\n<\/tr>\n<tr>\n<td>Multiple scenes / cuts in one prompt<\/td>\n<td>One scene per clip \u2014 except Enhanced/wan2gp builds that explicitly take timeline formats<\/td>\n<\/tr>\n<tr>\n<td>Over-prompting style<\/td>\n<td>Trust the cinematic engine; the model is trained with detailed aesthetic labels, so excessive style keywords can conflict<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>40 (official <code>generate.py<\/code> default; 20\u201330 acceptable for local drafts)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>Default <code>sample_guide_scale=(3.5, 3.5)<\/code> in <code>generate.py<\/code>. Documented community recipes vary by implementation: Diffusers <code>guidance_scale<\/code> 3.5\u20134.0 for the A14B MoE models (with a separate <code>guidance_scale_2<\/code> for the second expert in the Lightning Diffusers example: 4.0 / 3.0); TI2V-5B Diffusers example uses 5.0<\/td>\n<\/tr>\n<tr>\n<td><strong>MoE boundary<\/strong><\/td>\n<td>Default <code>boundary<\/code> 0.9 in official config (SNR split point between the high-noise and low-noise experts); some community recipes use a boundary ratio of 0.875 with dual guidance values (e.g. 5.0 low-noise / 6.0 high-noise)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>1280\u00d7720 (720p) or 832\u00d7480 (480p) for T2V/I2V-A14B; TI2V-5B does 720p<\/td>\n<\/tr>\n<tr>\n<td><strong>Frame count / FPS<\/strong><\/td>\n<td>81 frames at 16fps for the A14B models; 121 frames at 24fps for TI2V-5B<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>UniPC (flow matching); sample shift 5.0 in official configs (community 720p recipes use 5, 480p use 12 \u2014 generalization from Wan family recipes)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>bfloat16<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt must carry the <strong>full scene<\/strong>: subject, setting, lighting, style, plus explicit motion and camera work. Use the Basic or Advanced formula above, ordered subject \u2192 motion \u2192 camera \u2192 scene. Officially recommended: enable <strong>prompt extension<\/strong> (<code>--use_prompt_extend<\/code> with <code>--prompt_extend_method 'dashscope'<\/code> or <code>'local_qwen'<\/code>, <code>--prompt_extend_target_lang 'zh'<\/code>) \u2014 qwen-plus handles T2V rewriting, enriching short prompts before generation.<\/p>\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>T2V + LoRA template:<\/strong><\/p>\n<pre><code>[LoRA Trigger Word], [Subject &amp; Action], [Camera Movement], [Environmental Lighting], [Aesthetic Tag/Style]\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>m3d_retro_poster, Walter White sitting in a yellow jumpsuit on a metal folding chair, staring forward calmly, camera slowly dollies out to reveal an abandoned dim factory with light filtering through dusty windows, warm directional rim light, 1970s film texture.<\/code><\/p>\n<\/blockquote>\n<p><strong>Tips:<\/strong> 80-120 words, one coherent 5-second motion arc. Wan 2.2 follows technical camera jargon well (<code>dolly in/out<\/code>, <code>tilt up/down<\/code>, <code>pan left/right<\/code>, <code>tracking shot<\/code>, <code>dolly zoom<\/code>, 360-degree <code>camera roll<\/code>); whip pans remain unreliable. Use LoRAs trained specifically for Wan 2.2, loaded across both the high-noise and low-noise expert stages.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>The image supplies subject, style, and setting \u2014 the prompt's job shifts to <strong>motion, action, and camera movement<\/strong>. Same documented I2V formula as the Wan family:<\/p>\n<pre><code>Motion Description + Camera Movement\n<\/code><\/pre>\n<p>Do <strong>not<\/strong> re-describe what is already in the image; conflicting content directives weaken motion fidelity. For prompt extension on I2V tasks, the official recipe switches to <code>qwen-vl-max<\/code> (vision-aware) or a local <code>Qwen2.5-VL<\/code> model.<\/p>\n<p><strong>TI2V-5B unified model:<\/strong> Text-to-video and image-to-video both work from the same weights (pass an <code>initImage<\/code> for I2V) \u2014 the prompt conventions are identical; native output is 720p at 24fps. One community note: at cfg 1.0 the negative branch is skipped entirely, so the negative prompt only matters above cfg 1.0.<\/p>\n<p><strong>Fun family variants (InP / Control / Camera Control):<\/strong>\n- <strong>Fun-InP<\/strong> (inpainting / first-last-frame): takes a start frame and end frame; the first frame defines the starting condition, the last frame defines the target condition, and <strong>the prompt describes the allowed action between them<\/strong> (what must remain fixed, what action is permitted, where, in which direction).\n- <strong>Fun-Control<\/strong> (Canny / Depth / OpenPose / MLSD control inputs): the control maps carry structure, so the prompt should focus on motion style, atmosphere, and visual texture rather than composition.\n- <strong>Fun Camera Control:<\/strong> takes explicit camera-movement values as input \u2014 pair the numeric camera values with a short prompt that reinforces the intended move rather than describing a different one.\n- <em>Depth-map quirk (generalization from the Wan family, not verified specifically for 2.2's Fun-Control):<\/em> keep blacks in depth maps slightly lifted \u2014 pure black trips control models.<\/p>\n<p><strong>Speech-to-Video (S2V-14B):<\/strong> Inputs are a reference image, an audio track, and a prompt. The prompt <strong>describes the video content<\/strong> \u2014 the audio drives lip sync and rhythm via a wav2vec encoder, and the model preserves the reference image's content (it does not start from the image). CosyVoice TTS support was added for synthesizing speech for S2V tasks.<\/p>\n<p><strong>Animate-14B:<\/strong> Unified model for character animation and replacement with holistic movement and expression replication. (No 2.2-specific prompting guidance was found in public documentation; the family rule \u2014 natural-language description of subject, motion, and camera \u2014 applies unless guides surface.)<\/p>\n<p><strong>Enhanced / Lightning / distilled variants (community builds, e.g. wan2gp's <code>Wan2.2 Image2video Enhanced Lightning v2 14B<\/code>):<\/strong> These expect <strong>segmented timeline prompts<\/strong> rather than one paragraph \u2014 the model's default prompt uses the second-by-second format, and wan2gp docs prescribe treating the whole structured block as one prompt with slash commands like <code>[/duration=30%,/overlap=9]<\/code>:<\/p>\n<pre><code>(at 0 seconds: the man stands in front of the fridge, camera static)\n(at 1 second: he opens the fridge and reaches for a can)\n(at 2 seconds: the camera shifts to a side angle as he drinks)\n<\/code><\/pre>\n<p>Only one start image is supported in the multi-segment mode.<\/p>\n<p><strong>Spicy / uncensored variants:<\/strong> Community NSFW finetunes exist in the Wan 2.2 line \u2014 e.g. <strong>Dasiwa<\/strong> (a Wan 2.2-based I2V model finetuned for uncensored generation with enhanced anatomy and pose stability, beating \"Smooth Mix\" and \"Remix\"), an NSFW character-consistency finetune (<code>Wan2_2-I2V-A14B-LOW_SVI_consistent_face_nsfw<\/code>), and NSFW anime finetunes (e.g. <code>NSFW-Anime-wan-5B<\/code> ships a Wan2.2 demo pack). Dasiwa workflows pair the model with <strong>uncensored/abliterated UMT5 text encoders<\/strong> and Qwen3-VL prompt enhancement expanded into the <strong>time-separated timeline format<\/strong> Wan 2.2 prefers. No source documents a prompting <em>syntax<\/em> difference for these variants \u2014 they accept the same cinematic, subject-first prompt structure; the difference is in the finetuned weights and the unablated encoder, not the prompt format. For explicit content, direct anatomical/pose language in the same structured format works; euphemisms tend to produce the generic \"hallucinations\" short prompts cause on the base model.<\/p>\n<hr />\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>I2V template (4-part framework):<\/strong><\/p>\n<pre><code>[Motion Description] + [Camera Behavior] + [Environmental Effects] + [Speed &amp; Intensity]\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>The mountaineer's feet remain planted on the grassy cliff, camera slowly tilts up from his boots to reveal his full body looking toward towering rocky peaks in the distance, mountain mist drifting through the valley, slow smooth movement.<\/code>\n<strong>Negative Prompt:<\/strong> <code>morphing, warping, distortion, blurry, low quality, face deformation, flickering, jittering, inconsistent lighting<\/code><\/p>\n<\/blockquote>\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V: Rainy street scene<\/h3>\n<p><strong>Intended content:<\/strong> A detective walking through a rainy neon city street at night, cinematic.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>detective, city, rain, night, neon, cinematic, 4k, masterpiece, best quality\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A weary detective in a trench coat walks slowly down a rain-soaked street at night, neon signs reflecting in the puddles around his boots. Rain falls steadily as the camera tracks beside him in a medium shot, shallow depth of field blurring the glowing storefronts. Teal and orange color grading, volumetric fog, cinematic lighting, shot on a 35mm lens.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt is keyword soup with no motion \u2014 the video model has no change-over-time to animate. The good prompt leads with the subject, names the motion (walks, rain falls, camera tracks), and ends with camera/lens/style, matching Wan's semantic ordering and its weigh-the-start rule.<\/p>\n<h3>I2V: Animate a portrait still<\/h3>\n<p><strong>Intended content:<\/strong> Make a still photo of a woman in a garden come alive.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A beautiful woman with long brown hair standing in a lush green garden full of colorful flowers, golden sunlight, photorealistic portrait\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>She turns her head slowly toward the camera and smiles gently, her hair lifting in a soft breeze. Flower petals drift past the lens as the camera slowly pushes in.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> In I2V the image already carries subject, setting, and style \u2014 re-describing them wastes the prompt and can fight the input image. The good prompt describes only motion and camera, which is the prompt's actual job in I2V.<\/p>\n<h3>T2V: One scene per clip<\/h3>\n<p><strong>Intended content:<\/strong> A surfer catching a wave at dawn.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A surfer paddles out through the breaking waves, then catches a big wave and rides it to shore, then walks back up the beach at sunset with the sun setting over the mountains\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A surfer paddles hard through the breaking waves at dawn, cresting over the swell as the camera tracks alongside in a low water-level shot. Mist hangs over the sea, soft pink morning light, slow motion.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt crams three scenes and a time-of-day change into one clip \u2014 Wan treats one prompt as one shot, and scene-cut prompts produce mush. The good prompt is one continuous shot with named motion and one camera move. (Exception: the Enhanced/Lightning builds that explicitly accept timeline formats \u2014 see below.)<\/p>\n<h3>Enhanced model: Timeline prompt<\/h3>\n<p><strong>Intended content:<\/strong> A man grabbing a drink from the fridge over a few seconds, for an Enhanced/Lightning build.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A man standing in a kitchen walks to the fridge, opens it, takes a can, and drinks while the camera moves around\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>(at 0 seconds: the man stands in front of the fridge, camera static)\n(at 1 second: he opens the fridge and reaches for a can)\n(at 2 seconds: the camera shifts to a side angle as he drinks)\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Enhanced/Lightning builds (e.g. wan2gp's Enhanced Lightning v2) default to a second-by-second timeline format \u2014 the bad single-paragraph version flattens the temporal beats into mush, while the good version gives each beat its own timed window, which is what these models were trained to follow. (Do not use this format on the base T2V-A14B model, which expects one continuous scene description.)<\/p>\n<h3>S2V: Talking head with audio<\/h3>\n<p><strong>Intended content:<\/strong> A woman's portrait, animated to match a spoken audio t
