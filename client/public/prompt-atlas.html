om lit by a single overhead lamp. A detective in a rumpled gray suit slides a photograph across the metal table toward the suspect. He leans back in his chair. A beat of silence \u2014 only the hum of the fluorescent light. Then he says quietly, &quot;We found the car.&quot; The camera pushes in slowly on the suspect's face as his jaw tightens.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The official guidance explicitly says the model \"won't stretch a moment or add a pause you didn't prompt for\" \u2014 beats like \"a beat of silence\" must be written into the action so the pacing lands as written.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Cinematic action<\/h3>\n<pre><code>An action-packed cinematic shot of a monster truck driving fast toward the camera. The truck passes the camera and it pans left to follow the truck's reckless drive. Dust and motion blur swirl around the truck; the camera has a handheld feel as it tries to track the ride into the distance. The truck then drifts and turns around, driving back toward the camera until seen in extreme close-up.\n<\/code><\/pre>\n<p>(based on an official LTX-2 sample prompt \u2014 note the chronological action chain and camera-relative language)<\/p>\n<h3>Stylized dialogue scene<\/h3>\n<pre><code>Pinocchio sits in an interrogation room, looking nervous and slightly sweating. He says very quietly to himself, &quot;I didn't do it... I didn't do it... I'm not a murderer.&quot; Pinocchio's nose grows longer and longer. The camera zooms in on the double-sided mirror in the back of the room. The mirror turns black as the camera approaches it, exposing a blurry silhouette of two FBI detectives standing in the dark room on the other side.\n<\/code><\/pre>\n<p>(based on an official LTX-2 sample prompt)<\/p>\n<h3>I2V motion prompt<\/h3>\n<pre><code>She turns slowly toward the window, reaching for the curtain. Rain streams down the glass. The camera dollies in gently, keeping her in shallow focus.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Pasting a Kling/Seedance prompt unchanged<\/strong> \u2192 tag syntax and shot-list formatting from other models underperform on LTX; rewrite into a flowing paragraph or use the prompt enhancer.<\/li>\n<li><strong>Describing appearance without action in t2v<\/strong> \u2192 appearance alone gives the model nothing to animate; every sentence needs an active verb.<\/li>\n<li><strong>Re-describing the input image in i2v<\/strong> \u2192 the model already sees the image; spend the prompt on motion, action sequencing, and camera moves.<\/li>\n<li><strong>Using abstract emotion words<\/strong> \u2192 \"sad,\" \"confused\" don't render; describe posture, gesture, and facial expression instead.<\/li>\n<li><strong>Stacking too many characters/actions<\/strong> \u2192 crowded scenes lose clarity; keep the shot focused on a few clear subjects.<\/li>\n<li><strong>Forgetting to write pauses into the prompt<\/strong> \u2192 the model will not add beats you didn't describe.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> LTX-2.3 \u2014 DiT-based audio-video diffusion foundation model (reported ~22B parameters by third-party integrators; not officially confirmed)<\/li>\n<li><strong>Text Encoder:<\/strong> Gemma 3 (per third-party integration reports noting a gated Gemma 3 dependency)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> (leave blank \u2014 not documented)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Open weights (<code>Lightricks/LTX-2.3<\/code>); Fast/Pro/Ultra operating modes; joint audio-video generation (synchronized dialogue, ambience, music); video-to-video and audio-to-video workflows; LoRA / IC-LoRA support; single continuous takes only (no native multi-shot \u2014 that arrived in 2.5)<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/Lightricks/LTX-2 (official repo \u2014 \"Prompting for LTX-2\" section, prompt enhancement)<\/li>\n<li>https://ltx.io/blog/prompting-guide-for-ltx-2 (official LTX-2 prompting guide: key aspects, what works/avoid)<\/li>\n<li>https://docs.ltx.io/api-documentation/implementation-guides/prompting-guide (official LTX docs prompting guide: structure, enhancer, multi-shot)<\/li>\n<li>https://github.com/babakarto/promptiusmaximus/blob/HEAD/02-VIDEO/ltx-cineclaw/prompting-guide.md (community prompting guide citing official LTX Studio tips)<\/li>\n<li>https://github.com/babakarto/promptiusmaximus/blob/HEAD/02-VIDEO/ltx-cineclaw/ltx2-prompt-guide-advanced.md (community advanced guide)<\/li>\n<li>https://replicate.com/lightricks/ltx-2-pro (prompt guidelines for the LTX-2 family)<\/li>\n<li>https://github.com/liunix61/vllm-omni/blob/HEAD/recipes/LTX/LTX-2.md (pipeline defaults: steps, CFG, default negative prompt)<\/li>\n<li>https://huggingface.co/Kijai/LTX2.3_comfy/discussions/49 (community i2v motion-prompting and negative-prompt practice)<\/li>\n<li>https://en.wikipedia.org/wiki/LTX_(text-to-video_model) (release timeline, feature overview)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/ltx-2.3.md"}, "video/ltx/1": {"title": "Prompt Guide: LTX-2.5", "html": "\n<p><strong>Model:<\/strong> LTX-2.5\n<strong>Developer:<\/strong> Lightricks\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong> Gemma 4 12B (reported in family feature summaries; automatic prompt enhancer uses a separate Gemma 4 E2B LLM)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>LTX-2.5 is the August 2026 open-weight release of the LTX-2 family (weights on HuggingFace as <code>Lightricks/LTX-2.5<\/code>; code repo <code>Lightricks/LTX-2<\/code>). It keeps the LTX-2 formula \u2014 synchronized audio-video generation in one diffusion model, very fast iteration \u2014 and adds two headline capabilities with no equivalent in LTX-2/2.3: <strong>native multi-shot generation<\/strong> (several distinct shots in a single inference pass, cutting together as one cohesive scene) and an optional <strong>duration predictor head<\/strong> that sizes the clip to the action described in the prompt. It also ships an optional <strong>diffusion decoder<\/strong> (replacing the convolutional VAE decoder) and a pretrained checkpoint intended for domain-specific fine-tuning. Reported speed: a 10-second video in under 7 seconds. Prompting is the same flowing-paragraph style as 2.3, plus a new prose-based multi-shot pattern \u2014 explicitly <em>not<\/em> a shot list.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Same family rule as 2.3: write a single flowing, present-tense paragraph with chronological action \u2014 and for multi-shot scenes, write the cuts <strong>in prose<\/strong> (\"A hard cut transitions to\u2026\"), never as a shot list or screenplay sluglines.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>[0-3s] Shot 1 \u2014 Wide establishing: rainy city. [3-6s] Shot 2 \u2014 Close-up: woman's face. Audio: synth music.\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A wide shot frames a rainy city intersection at dusk, neon signs reflecting on wet asphalt. A young woman in a yellow raincoat walks down the sidewalk toward camera while rain falls and cars drive past behind her; soft synth music and traffic noise fill the air. The shot transitions to a medium close-up of her face under the hood, raindrops catching the neon as she looks off-screen left; the synth score continues across the cut, traffic muffled. She speaks quietly to herself, &quot;He's late.&quot;\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support in official prompting guidance<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported (pipeline-level)<\/td>\n<td>Pipeline recipes supply a default negative prompt; community integrations expose it. The official prompting guide has \"no general negative-prompt instruction\" (per independent capability audit).<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Under-described motion/scene; the prompt enhancer is recommended when the prompt is short, rough, or written for another model<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>Single shot: 4\u20138 descriptive sentences, within ~200 words. Multi-shot: a full scene as one chronological paragraph; prefer 2\u20134 shots per generation, with shorter, clearer beats per shot as cuts increase<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Too many characters, layered actions, or excessive objects reduce clarity; with the duration predictor on, overstuffed prompts also mislead the predicted clip length<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>Single-shot (same as 2.3):<\/p>\n<pre><code>[Scene/Environment]. [Subject]. [Action/Motion]. [Camera movement]. [Style/Aesthetic]. [Audio]\n<\/code><\/pre>\n<p>Multi-shot (2.5+ only) \u2014 one chronological paragraph where each cut is written in natural language:<\/p>\n<pre><code>[Shot 1 scene + subject + action + camera + audio].\n[Name the transition: &quot;A hard cut transitions to\u2026&quot; / &quot;The view cuts to a close-up of\u2026&quot;].\n[Re-establish the new shot: scale, angle, who/what is in frame, lighting].\n[Re-identify recurring subjects (&quot;the woman in the red coat, earlier at the table, now\u2026&quot;)].\n[State audio continuity: &quot;the piano score continues across the cut&quot; / &quot;the dialogue drops; only wind remains&quot;].\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Main action (first sentence)<\/td>\n<td>Start with the action in a single sentence<\/td>\n<td>\"A monster truck drives fast toward the camera.\"<\/td>\n<\/tr>\n<tr>\n<td>Subject details<\/td>\n<td>Age, appearance, clothing, distinguishing features; emotions via physical cues only<\/td>\n<td>\"A young woman in a yellow raincoat\"<\/td>\n<\/tr>\n<tr>\n<td>Movement &amp; gestures<\/td>\n<td>Present-tense verbs, chronological sequence<\/td>\n<td>\"She walks toward camera, then looks off-screen left\"<\/td>\n<\/tr>\n<tr>\n<td>Background &amp; environment<\/td>\n<td>Lighting, color palette, textures, atmosphere<\/td>\n<td>\"Rainy city intersection at dusk, neon signs on wet asphalt\"<\/td>\n<\/tr>\n<tr>\n<td>Camera<\/td>\n<td>Shot scale, movement relative to subject, speed<\/td>\n<td>\"The shot transitions to a medium close-up; camera pans slowly left\"<\/td>\n<\/tr>\n<tr>\n<td>Audio<\/td>\n<td>Ambient, music, dialogue in quotation marks<\/td>\n<td>\"Soft synth music continues across the cut\"<\/td>\n<\/tr>\n<tr>\n<td>Cut transitions (multi-shot)<\/td>\n<td>Name the edit in prose; give each shot a clear job (establish \u2192 detail \u2192 reaction)<\/td>\n<td>\"A hard cut jumps to a low-angle shot of the man's boots\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Scene set FIRST<\/td>\n<td>Prevents morphing/scene changes<\/td>\n<\/tr>\n<tr>\n<td>Present-tense action verbs<\/td>\n<td>\"walks, turns, exhales, reaches\" \u2014 every sentence needs a verb that does something<\/td>\n<\/tr>\n<tr>\n<td>Chronological sequencing<\/td>\n<td>\"Initially\u2026\", \"A moment later\u2026\", \"Simultaneously\u2026\"<\/td>\n<\/tr>\n<tr>\n<td>Cinematic camera language<\/td>\n<td>\"slow dolly in, handheld tracking, over-the-shoulder, rack focus\"<\/td>\n<\/tr>\n<tr>\n<td>Precise physical detail<\/td>\n<td>Age, clothing, micro-expressions; exact body/hand positions<\/td>\n<\/tr>\n<tr>\n<td>Lighting and color specifics<\/td>\n<td>\"golden hour, neon glow, flickering candles, muted palette\"<\/td>\n<\/tr>\n<tr>\n<td>Atmospheric elements<\/td>\n<td>\"fog, rain, dust, mist, reflections\"<\/td>\n<\/tr>\n<tr>\n<td>Audio description<\/td>\n<td>Dialogue in quotation marks with language/accent; ambient sounds<\/td>\n<\/tr>\n<tr>\n<td>Era/genre terms<\/td>\n<td>\"1940s film, film noir, documentary, 80s news broadcast\"<\/td>\n<\/tr>\n<tr>\n<td>At every cut (multi-shot): transition named, shot re-established, identities re-stated, audio continuity stated<\/td>\n<td>\"A match cut connects\u2026\"; \"the woman in the red coat, earlier at the table, now\u2026\"; \"the music drops to a low drone\"<\/td>\n<\/tr>\n<tr>\n<td>Written-in pauses<\/td>\n<td>\"she pauses\", \"a beat of silence\" \u2014 the duration predictor times the clip to the action you describe and will not add pauses you didn't prompt for<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Emotional labels (\"she is sad, confused\")<\/td>\n<td>Physical cues: \"her face crumples; she takes a shaky breath\"<\/td>\n<\/tr>\n<tr>\n<td>Shot lists, numbered beats, screenplay sluglines (unless the cut is also described in prose)<\/td>\n<td>One chronological paragraph with transitions in natural language<\/td>\n<\/tr>\n<tr>\n<td>Prompts for other models pasted unchanged (Kling/Seedance shot lists)<\/td>\n<td>Rewrite into LTX's flowing-paragraph structure or use the prompt enhancer<\/td>\n<\/tr>\n<tr>\n<td>Conflicting geography or unexplained costume changes between cuts<\/td>\n<td>Only jump time/place/costume if you say so explicitly<\/td>\n<\/tr>\n<tr>\n<td>Mixed/conflicting light sources<\/td>\n<td>One coherent light logic per shot<\/td>\n<\/tr>\n<tr>\n<td>Comma-separated tag lists<\/td>\n<td>Single flowing paragraph, present tense<\/td>\n<\/tr>\n<tr>\n<td>Text, signage, logos (as relied-upon elements)<\/td>\n<td>Leave out \u2014 2.5 improves short-text accuracy but exact spelling/consistency is not guaranteed; add titles in post<\/td>\n<\/tr>\n<tr>\n<td>Chaotic fast-twisting motion<\/td>\n<td>Simpler, plausible motion; dancing works better than acrobatics<\/td>\n<\/tr>\n<tr>\n<td>Crowded frames<\/td>\n<td>A few clear characters and actions per shot<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>(leave blank \u2014 2.5-specific defaults not published; 2.3 one-stage default is 30, base LTX-2 40)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>Video 3.0 / audio 7.0 (family pipeline defaults; 2.5-specific values not published)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>Up to 4K rendering reported for the family; OpenEXR/HDR input-output workflows<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>(leave blank \u2014 not documented in official materials)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>(leave blank \u2014 not documented in official materials)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>2.5-specific options: <code>--auto-duration<\/code> (duration head predicts clip length from the caption instead of a fixed frame count), <code>--use-diffusion-decoder<\/code> (diffusion video decoder replacing the convolutional VAE decoder), two-stage pipeline with a spatial \u00d72 latent upsampler. Reported: 10 s video in under 7 s.<\/p>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt must carry the FULL scene: environment, subject(s) with distinguishing details, chronological action, camera behavior, lighting, style, and audio. Single-shot guidance is identical to 2.3 (4\u20138 sentences, \u2264200 words, present tense). New in 2.5: if you want several shots, write them as <strong>one chronological paragraph<\/strong> with cuts described in prose \u2014 do not use a shot list. With the duration predictor enabled, pace the action in the prompt itself: \"It won't stretch a moment or add a pause you didn't prompt for. Write the beats you want into the prompt ('she pauses', 'a beat of silence') so they're part of the action, or set an explicit duration.\"<\/p>\n<h3>Image-to-Video<\/h3>\n<p>Same as 2.3: the prompt's job is MOTION, not content. Describe the <em>sequence of actions<\/em> (\"first this happens, then this, after that this happens\") plus camera movement; do not re-describe the image. Official docs add: \"For image-to-video from a first frame, prefer a <strong>single continuous take<\/strong> unless you intentionally describe a cut away from that opening image.\" If outputs come back stiff/still, use a motion-oriented negative prompt (\"still image, no movements, frozen still image\") where the pipeline exposes it, and emphasize action sequencing over image description.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V single shot: coastal lighthouse<\/h3>\n<p><strong>Intended content:<\/strong> A lighthouse at dusk, waves crashing, beam sweeping, cinematic mood.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>lighthouse, dusk, waves, cinematic, dramatic, 8k, beautiful lighting, moody\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A rocky coastline at dusk under heavy clouds. White-capped waves crash against the base of a tall striped lighthouse as its beam sweeps slowly across the darkening sky from left to right. The camera holds steady at a low angle, then tilts up to follow the beam. Cold blue twilight mixes with the warm amber glow of the lamp; a distant foghorn sounds over the low roar of surf.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Every sentence carries an active verb with a clear temporal order, the camera behavior is specified relative to the subject, and audio is described \u2014 exactly the \"each sentence needs a verb that does something\" rule. The tag list gives the model no motion to animate.<\/p>\n<h3>T2V multi-shot: rainy rendezvous (2.5's native capability)<\/h3>\n<p><strong>Intended content:<\/strong> Two shots \u2014 a woman waiting in the rain, then a hard cut to a man's boots stepping into a puddle \u2014 with continuous music.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>[0-4s] Shot 1 \u2014 Wide: woman in yellow raincoat, rainy city, neon. [4-8s] Shot 2 \u2014 Low angle: man's boots in puddle. Audio: synth music. Keep wardrobe consistent.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A wide shot frames a rainy city intersection at dusk, neon signs reflecting on wet asphalt. A young woman in a yellow raincoat walks down the sidewalk toward camera, carrying a small bag, while rain falls and cars drive past behind her; soft synth music and traffic noise fill the air. A hard cut jumps to a low-angle shot of a man's scuffed boots stepping into a puddle at the curb; the music drops to a low drone. The man she has been waiting for \u2014 short dark hair, soaked jacket \u2014 lifts his head into frame as he smiles at her off-screen.\n<\/code><\/pre>\n<p>(adapted from the official LTX multi-shot example)<\/p>\n<p><strong>Why:<\/strong> Per official 2.5 guidance, shot lists and numbered beats underperform; cuts must be written in prose with the transition named (\"A hard cut jumps to\u2026\"), the new shot re-established, the recurring subject re-identified (\"The man she has been waiting for\u2026\"), and audio continuity stated (\"the music drops to a low drone\").<\/p>\n<h3>I2V: First-frame animation<\/h3>\n<p><strong>Intended content:<\/strong> A still photo of a barista handing over a coffee should show the handoff, steam rising, and a slow push-in.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A photorealistic image of a smiling barista in a caf\u00e9 handing a coffee cup to a customer, warm lighting, cozy atmosphere, highly detailed\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>First, the barista extends the coffee cup across the counter toward the customer. Steam rises from the cup in slow curls. The customer reaches out and takes it. The camera pushes in very slowly toward the cup as it's handed over. Warm caf\u00e9 ambience, soft clinking of cups.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The good prompt spends everything on a chronological action sequence plus camera movement and audio \u2014 the image already supplies the barista and the caf\u00e9. The bad prompt re-describes the static frame with no motion, inviting a still or morphing output.<\/p>\n<h3>T2V: Dialogue with audio<\/h3>\n<p><strong>Intended content:<\/strong> A news reporter does a live broadcast when an oil geyser erupts behind him.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>News reporter excited about oil discovery, oil geyser erupts, dramatic, funny\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>EXT. SMALL TOWN STREET \u2013 MORNING \u2013 LIVE NEWS BROADCAST. The shot opens on a news reporter standing in front of a row of cordoned-off cars, yellow caution tape fluttering behind him. The light is warm, early sun catching the camera lens; a faint hum of chatter and distant drilling fills the air. The reporter looks directly into the camera, microphone in hand. Reporter: &quot;Thank you, Sylvia \u2014 but this morning, here in the quiet town of New Castle, Vermont\u2026 black gold has been found!&quot; A beat of silence \u2014 then, with a sudden roar, a geyser of oil erupts from the ground and blasts upward in a violent plume. The camera shakes slightly, trying to stay focused through the chaos.\n<\/code><\/pre>\n<p>(adapted from the official LTX-2.5 sample prompt)<\/p>\n<p><strong>Why:<\/strong> Screenplay-style structure is explicitly supported for dialogue/multi-beat scenes: scene header, physical description instead of emotion labels, dialogue in quotation marks, a written-in pause (\"A beat of silence\"), and the sudden event noted as a change in the action \u2014 all official \"Key Elements to Include.\"<\/p>\n<h3>T2V: Duration-aware pacing (2.5 duration predictor)<\/h3>\n<p><strong>Intended content:<\/strong> A slow, lingering shot of a frog yoga class that needs unhurried timing.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Frog yoga studio, frogs meditating, one catches a fly, funny, zen\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A wide shot opens in a warm, sunlit frog yoga studio. Golden morning light pours through tall windows as thin wisps of incense smoke curl through the air. A large green frog instructor sits in lotus position at the center, eyes gently closed, a serene half-smile. The instructor breathes in slowly, then speaks in a deep, calm voice, drawing out each word. &quot;We are one\u2026 with the pond.&quot; A pause. The camera pans slowly left to a small frog in the front row, who twitches, eyes darting. Suddenly its tongue snaps out, catching a housefly mid-air. A lingering shot holds on the embarrassed frog.\n<\/code><\/pre>\n<p>(adapted from the official LTX-2.5 sample prompt)<\/p>\n<p><strong>Why:<\/strong> With 2.5's optional duration predictor, the clip is sized and timed to the action described \u2014 pauses must be written in (\"A pause\", \"A lingering shot holds\") or the model will not stretch the moment. The bad version gives no timing cues at all.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Multi-shot with audio continuity<\/h3>\n<pre><code>A wide shot frames a rainy city intersection at dusk, neon signs reflecting on wet asphalt. A young woman in a yellow raincoat walks down the sidewalk toward camera while rain falls and cars drive past behind her; soft synth music and traffic noise fill the air. The shot transitions to a medium close-up of her face under the hood, raindrops catching the neon as she looks off-screen left; the synth score continues across the cut, traffic muffled. She speaks quietly to herself, &quot;He's late.&quot;\n<\/code><\/pre>\n<p>(official LTX multi-shot example \u2014 note the prose transitions and stated audio continuity)<\/p>\n<h3>Screenplay-style dialogue scene<\/h3>\n<pre><code>INT. OVEN \u2013 DAY. Static camera from inside the oven, looking outward through the slightly fogged glass door. Warm golden light glows around freshly baked cookies. The baker's face fills the frame, eyes wide with focus, his breath fogging the glass as he leans in. Baker (whispering dramatically): &quot;Today\u2026 I achieve perfection.&quot; He leans even closer, nose nearly touching the glass. Quick zoom back to the baker's horrified face, pressed against the oven door, as cookies deflate behind the glass. Steam drifts upward in slow motion. Pixar-style acting and timing.\n<\/code><\/pre>\n<p>(based on an official LTX-2 sample prompt)<\/p>\n<h3>I2V motion prompt<\/h3>\n<pre><code>She turns slowly toward the window, reaching for the curtain. Rain streams down the glass. The camera dollies in gently, keeping her in shallow focus.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Using a shot list for multi-shot prompts<\/strong> \u2192 LTX-2.5's multi-shot mode explicitly wants cuts described in prose; numbered shots/sluglines without prose transitions underperform.<\/li>\n<li><strong>Forgetting audio continuity across cuts<\/strong> \u2192 at every cut, state whether music/dialogue/ambience continues or changes, or the soundscape will drift.<\/li>\n<li><strong>Not re-identifying subjects after a cut<\/strong> \u2192 reuse the same visual identifiers (\"the woman in the red coat, earlier at the table, now\u2026\") to keep identity consistent across shots.<\/li>\n<li><strong>Writing pacing for the duration predictor without writing the beats<\/strong> \u2192 \"she pauses\", \"a beat of silence\" must be in the prompt; the model adds no pauses of its own.<\/li>\n<li><strong>Pasting other models' prompts unchanged<\/strong> \u2192 tag syntax and shot-list formatting from Kling/Seedance don't carry over; rewrite into flowing paragraphs or run the prompt enhancer.<\/li>\n<li><strong>Re-describing the input image in i2v<\/strong> \u2192 spend the prompt on action sequencing and camera movement instead.<\/li>\n<li><strong>Abstract emotion labels<\/strong> \u2192 describe posture, gesture, facial expression; never rely on \"sad\"/\"confused\" alone.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> LTX-2.5 \u2014 DiT-based audio-video diffusion foundation model; native multi-shot generation in a single inference pass; optional duration-prediction head; optional diffusion video decoder; pretrained checkpoint for domain-specific fine-tuning; 50 fps output and HDR/OpenEXR workflows reported for the family<\/li>\n<li><strong>Text Encoder:<\/strong> Gemma 4 12B (per family feature summaries); prompt-enhancer LLM is Gemma 4 E2B<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> (leave blank \u2014 not documented)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Open weights (<code>Lightricks/LTX-2.5<\/code>); Fast/Pro/Ultra operating modes; joint audio-video generation (dialogue, ambience, music); video-to-video, audio-to-video, and keyframe workflows; LoRA / IC-LoRA support (incl. Dub-It speech-replacement IC-LoRA: prompt template <code>[Speaker] is speaking [Language/Accent], saying: \"[Dialogue]\"<\/code>, validated for EN/FR/ES/DE/RU); reported 10 s video in &lt; 7 s<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/Lightricks/LTX-2 (official repo \u2014 \"Prompting for LTX-2\" section, prompt enhancement)<\/li>\n<li>https://ltx.io/blog/prompting-guide-for-ltx-2 (official LTX-2 prompting guide)<\/li>\n<li>https://docs.ltx.io/api-documentation/implementation-guides/prompting-guide (official LTX docs: structure, multi-shot, prompt enhancer, Dub-It, sample prompts)<\/li>\n<li>https://github.com/babakarto/promptiusmaximus/blob/HEAD/02-VIDEO/ltx-cineclaw/prompting-guide.md (community guide citing official LTX Studio tips)<\/li>\n<li>https://github.com/babakarto/promptiusmaximus/blob/HEAD/02-VIDEO/ltx-cineclaw/ltx2-prompt-guide-advanced.md (community advanced guide)<\/li>\n<li>https://github.com/liunix61/vllm-omni/blob/HEAD/recipes/LTX/LTX-2.md (pipeline defaults: steps, CFG, negative prompt, duration head, diffusion decoder)<\/li>\n<li>https://github.com/rh-runninghub/minimax-h3-multigpu-lightning/blob/HEAD/sglang/docs/cookbook/diffusion/LTX/LTX2.5.mdx (LTX-2.5 components: duration head, diffusion decoder)<\/li>\n<li>https://www.scriptbyai.com/local-ai-video-editor-ltx-desktop/ (LTX Desktop / LTX-2.5 Fast as default local model)<\/li>\n<li>https://gen-ai.news/stories/ltx-2-5-ltx-s-latest-ai-open-source-foundation-model-ltx-2e69a2 (LTX-2.5 release overview: multi-shot, speed)<\/li>\n<li>https://huggingface.co/Kijai/LTX2.3_comfy/discussions/49 (community i2v motion-prompting practice, applicable across 2.x)<\/li>\n<li>https://github.com/nickpittas/directorsconsole/blob/HEAD/CinemaPromptEngineering/Documentation/model_prompting/video_capability_matrix.md (capability audit: no general negative-prompt instruction in official guide)<\/li>\n<li>https://en.wikipedia.org/wiki/LTX_(text-to-video_model) (release timeline, feature overview)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/ltx-2.5.md"}, "video/kling/0": {"title": "Prompt Guide: Kling 2.x", "html": "\n<p><strong>Model:<\/strong> Kling 2.x family (2.0, 2.1, 2.5 Turbo, 2.6 Pro)\n<strong>Developer:<\/strong> Kuaishou\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong> (leave blank \u2014 not documented)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Kling 2.x is Kuaishou's closed, cloud-based video generation family between Kling 1.x (2024) and the Kling 3.0 series (Feb 2026). Verified releases: <strong>Kling 2.0<\/strong> (April 15, 2025 \u2014 major motion/realism jump; Master tier), <strong>Kling 2.1<\/strong> (May 29, 2025 \u2014 three quality tiers: Standard/Pro/Master; cost-efficient quality at Pro), <strong>Kling 2.5 Turbo<\/strong> (September 23, 2025 \u2014 fastest inference, ~30% lower cost than 2.1 Pro, aimed at simple scenes and rapid drafts), and <strong>Kling 2.6 Pro<\/strong> (December 3, 2025 \u2014 native audio generation in English and Chinese, smoother motion, 1080p at 48 fps). All 2.x models top out at 10-second clips (5 or 10 s) at up to 1080p, with no native audio before 2.6 and no multi-shot in a single generation (that arrives in 3.0) \u2014 every prompt describes <strong>one continuous take<\/strong>. The platform offers a DeepSeek prompt enhancer, Motion Brush, first-and-last-frame control, and an Elements/reference feature for visual consistency.<\/p>\n<h3>Per-version prompting differences<\/h3>\n<table>\n<thead>\n<tr>\n<th>Version<\/th>\n<th>Prompting differences<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2.0<\/td>\n<td>Baseline formula (Subject + Movement + Scene + Camera + Lighting + Atmosphere). Master tier = premium prompt precision. No native audio \u2014 no audio cues needed in prompt.<\/td>\n<\/tr>\n<tr>\n<td>2.1<\/td>\n<td>Same formula; Master tier offers the highest prompt precision of the 2.x line. Three tiers (Standard/Pro/Master) \u2014 keep prompts within the model's single-take, 5/10 s scope.<\/td>\n<\/tr>\n<tr>\n<td>2.5 Turbo<\/td>\n<td>Optimized for fast drafts of simple scenes: 3\u20134 elements max, 50\u201380 words, short prompts. No audio. Over-detailed prompts waste its speed advantage.<\/td>\n<\/tr>\n<tr>\n<td>2.6 Pro<\/td>\n<td>5\u20137 elements, 50\u201380 words. <strong>Native audio is on<\/strong> \u2014 include audio cues in the prompt: ambient sounds, music mood, and dialogue in quotation marks (English/Chinese voice output; other languages auto-translated to English; use lowercase for English speech, uppercase for acronyms/proper nouns).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write <strong>cinematic direction in flowing prose<\/strong>, not keyword soup: a complete shot description with a specific subject, one clean action, scene, camera, lighting, and atmosphere. Kling 1.x\u20132.x dislikes fragmented tag-style inputs and punishes overlong prompts with melted outputs.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>cinematic, woman, red dress, tokyo, night, neon, street, beautiful, 4k, masterpiece\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A young woman in a red dress walking through a bustling Tokyo street at night, neon lights reflecting on wet pavement, cinematic shot with shallow depth of field, moody blue and pink lighting\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support in official materials or API schemas<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Unknown<\/td>\n<td>Community prompting skills report a <code>++emphasis++<\/code> convention (max 2), but this is not officially verified<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td>Dedicated <code>negative_prompt<\/code> field (API default: <code>\"blur, distort, and low quality\"<\/code>). Critical rule: the field auto-interprets input as exclusion \u2014 write the thing itself, never \"no X\" (write <code>robots<\/code>, not <code>no robots<\/code>). Keep the list short; long negative stacks reduce motion and detail.<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Partially<\/td>\n<td>Platform-side Motion Brush tool exists; not a prompt-syntax feature<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Vague prompts (\"make it cool\") produce generic results; short prompts miss the subject/scene specificity 2.x needs<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>Text-to-video: <strong>50\u201380 words<\/strong> (2.5 Turbo: 3\u20134 elements max; 2.6 Pro: 5\u20137 elements). Image-to-video: <strong>20\u201340 words<\/strong>, motion-focused. Community references put the API prompt ceiling around ~2500 characters.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>On 1.x\u20132.x, long prompts = melted outputs. Compress ruthlessly; one continuous take can only hold so much. (Longer, structured prompts become viable in 3.0.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<pre><code>[Subject (with specific details)] + [Subject Movement (one clean verb phrase)]\n+ [Scene (3\u20135 elements max)] + [Camera Language] + [Lighting] + [Atmosphere]\n<\/code><\/pre>\n<p>Write as flowing prose, most-important first.<\/p>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject<\/td>\n<td>Specific, detailed \u2014 age, appearance, clothing<\/td>\n<td>\"A young woman in a red dress\"<\/td>\n<\/tr>\n<tr>\n<td>Movement<\/td>\n<td>One clean verb phrase: start \u2192 end, with speed<\/td>\n<td>\"walking briskly, then slowing to a stop\"<\/td>\n<\/tr>\n<tr>\n<td>Scene<\/td>\n<td>3\u20135 elements max + lighting context<\/td>\n<td>\"bustling Tokyo street at night, wet pavement, neon signs\"<\/td>\n<\/tr>\n<tr>\n<td>Camera<\/td>\n<td>Movement with motivation + lens/framing<\/td>\n<td>\"cinematic shot with shallow depth of field, slow push-in\"<\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>Key light + mood<\/td>\n<td>\"moody blue and pink lighting, neon reflections\"<\/td>\n<\/tr>\n<tr>\n<td>Atmosphere<\/td>\n<td>Tone, ambience, weather, mood words<\/td>\n<td>\"humid, electric, melancholic\"<\/td>\n<\/tr>\n<tr>\n<td>Audio (2.6+ only)<\/td>\n<td>Dialogue in quotes, ambient sounds, music mood<\/td>\n<td><code>She whispers, \"wait for me.\"<\/code> + \"distant traffic, soft rain\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Specific subject details<\/td>\n<td>Age, ethnicity, clothing, distinguishing features<\/td>\n<\/tr>\n<tr>\n<td>One clean action verb phrase<\/td>\n<td>\"slowly turns toward the window\", \"first\u2026 then\u2026 finally\u2026\"<\/td>\n<\/tr>\n<tr>\n<td>Limited scene elements (3\u20135)<\/td>\n<td>Street, weather, key props \u2014 not a laundry list<\/td>\n<\/tr>\n<tr>\n<td>Camera language with motivation<\/td>\n<td>\"tracking shot, dolly zoom, slow push-in, gentle pan right, handheld\"<\/td>\n<\/tr>\n<tr>\n<td>Lens/framing terms<\/td>\n<td>\"35mm, 50mm, shallow depth of field, wide shot, medium shot, close-up\"<\/td>\n<\/tr>\n<tr>\n<td>Lighting specifics<\/td>\n<td>\"warm kitchen light, cool palette, golden hour, neon glow\"<\/td>\n<\/tr>\n<tr>\n<td>Atmosphere words<\/td>\n<td>\"melancholic, triumphant, eerie, hopeful, quiet ambience\"<\/td>\n<\/tr>\n<tr>\n<td>On 2.6: audio cues<\/td>\n<td>Quoted dialogue, \"ambient city noise\", music mood; lowercase English speech, uppercase acronyms/proper nouns<\/td>\n<\/tr>\n<tr>\n<td>First/last frame intent<\/td>\n<td>\"Take the start frame, camera slowly zooms out revealing\u2026\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tag soup: \"cinematic, woman, neon, 4k, masterpiece\"<\/td>\n<td>Flowing prose with subject + action + scene + camera + lighting<\/td>\n<\/tr>\n<tr>\n<td>Vague asks: \"make it cool\"<\/td>\n<td>Concrete subject, action, and camera direction<\/td>\n<\/tr>\n<tr>\n<td>Negative field: \"no robots, no blurry faces\"<\/td>\n<td><code>robots, blurry faces, distorted hands, melted features<\/code> (the field already excludes)<\/td>\n<\/tr>\n<tr>\n<td>Multiple locations/scene changes in one prompt<\/td>\n<td>One continuous take per generation; split scenes into separate clips<\/td>\n<\/tr>\n<tr>\n<td>Overlong prompts stuffed with elements<\/td>\n<td>3\u20137 elements max; compress ruthlessly<\/td>\n<\/tr>\n<tr>\n<td>Open-ended/looping motion<\/td>\n<td>A defined action with a start and an end<\/td>\n<\/tr>\n<tr>\n<td>Relying on native audio on 2.0/2.1/2.5<\/td>\n<td>No audio generation exists before 2.6 \u2014 add sound in post<\/td>\n<\/tr>\n<tr>\n<td>Describing the input image in i2v<\/td>\n<td>Motion only \u2014 the frame already exists<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>(leave blank \u2014 cloud API; not exposed/documented)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td><code>cfg_scale<\/code> 0\u20131, default 0.5; 0.3\u20130.4 = more creative freedom, 0.7\u20131.0 = strict prompt adherence (product/explainer work)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>1080p (Master/Pro tiers); 720p base with AI upscaling to 1080p/4K in pro modes per third-party reports<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>(leave blank \u2014 not exposed)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>(leave blank \u2014 not exposed)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Duration: 5 or 10 seconds. Aspect ratio: 16:9, 9:16, or 1:1. Tiers: Standard / Pro / Master (2.1). Negative prompt default: <code>\"blur, distort, and low quality\"<\/code>.<\/p>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt must carry the FULL scene: 50\u201380 words covering subject, one clean action, 3\u20135 scene elements, camera language, lighting, and atmosphere. Most-important-first ordering. For text-to-video without visual references, more detail produces richer results \u2014 but stay within the single-take limit: too many scene changes melt. On 2.6, add audio cues (quoted dialogue, ambience) since native audio is generated from the prompt.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>Short, motion-focused prompts of 20\u201340 words: describe only what moves. The composition, subject, and style already exist in the image \u2014 re-describing them wastes the prompt budget and can fight the reference frame. Describe interactions between elements, the environment's motion, and visual/camera direction. Workflow: upload 1\u20137 reference images/elements, describe element interactions, define motion, optionally set a start and/or end frame (\"Take [@Image1] as the start frame, camera slowly zooms out revealing a medieval castle courtyard, characters begin dancing\"). A reference video (3\u201310 s) can also drive camera movement or action patterns.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V: Tokyo night walk<\/h3>\n<p><strong>Intended content:<\/strong> A young woman in a red dress walks through a neon-lit Tokyo street at night.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>cinematic, woman, red dress, tokyo, night, neon, street, beautiful, 4k, masterpiece\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A young woman in a red dress walking through a bustling Tokyo street at night, neon lights reflecting on wet pavement, cinematic shot with shallow depth of field, moody blue and pink lighting\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The good prompt is the documented formula (subject + movement + scene + camera + lighting + atmosphere) as flowing prose with an actual action verb. The bad one is keyword soup \u2014 Kling 2.x dislikes fragmented tag-style inputs and renders them as vague, low-intent clips.<\/p>\n<h3>T2V: Kitchen scene (2.1)<\/h3>\n<p><strong>Intended content:<\/strong> A chef plating pasta in a warm kitchen, slow push-in, steam rising.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Make a cool cooking video with a chef, warm and cozy vibes\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Medium shot of a chef plating pasta in a warm rustic kitchen. He twirls the noodles with tongs and sets them gently onto a ceramic plate. Slow push-in as steam rises through shafts of window light. Warm tungsten lighting, soft golden tones, quiet focused atmosphere.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> \"Make it cool\" is vague \u2014 the model needs a concrete subject, a clean verb phrase (twirls, sets), a defined camera move (slow push-in), and specific lighting. Every component of the formula is present in the good version.<\/p>\n<h3>I2V: Animating a product still<\/h3>\n<p><strong>Intended content:<\/strong> A still photo of a perfume bottle should rotate slowly with golden light sweeping across it.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A closeup rotating product shot of a luxury perfume bottle placed on a marble pedestal. Golden light shines from above, casting soft reflections on the surface. The background is a gradient cinematic fade, with camera angles sweeping to highlight glass textures and liquid movement inside.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>The perfume bottle rotates slowly on its axis as golden light sweeps across the glass, catching the liquid inside. The camera orbits gently to the right, keeping the bottle centered.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> For image-to-video, the frame already exists \u2014 the prompt's job is motion only (20\u201340 words). The bad prompt re-describes the image (pedestal, background, textures) at t2v length; the good one describes only what moves and how the camera moves. (Adapted from documented Kling 2.5 commercial prompting practice.)<\/p>\n<h3>Negative prompt usage<\/h3>\n<p><strong>Intended content:<\/strong> Exclude deformed hands and blur from a portrait video.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>no blurry faces, no distorted hands, no extra fingers, no watermark\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>blurry faces, distorted hands, extra fingers, melted features, watermark, subtitles\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Kling's negative-prompt field auto-interprets input as exclusion \u2014 writing \"no X\" is a double negative that confuses it. Write the undesired thing itself, and keep the list short (long negative stacks reduce motion and detail).<\/p>\n<h3>T2V with native audio (2.6)<\/h3>\n<p><strong>Intended content:<\/strong> A woman whispers a line on a rainy street; ambient rain should be audible.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Woman on a rainy street at night, she says something emotional, cinematic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A woman in a soaked trench coat stands alone on a rain-slicked street at night, neon signs blurred behind her. She looks into the camera and whispers, &quot;wait for me.&quot; Rain patters on the pavement, distant traffic hums. Cool blue lighting, melancholic atmosphere, shallow depth of field.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> On 2.6, native audio is generated from the prompt \u2014 dialogue must be written in quotation marks (lowercase for English speech) and ambience explicitly described (\"rain patters\", \"traffic hums\"). The bad version gives the audio pipeline nothing to work with.<\/p>\n<h3>T2V: Overstuffed prompt (2.5 Turbo)<\/h3>\n<p><strong>Intended content:<\/strong> A car commercial spot \u2014 the model is 2.5 Turbo, built for fast simple scenes.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A sleek sports car racing along a coastal highway at sunrise, drone overhead view of ocean waves, low angle tracking shot past cliffs, lens flares across the hood, sunlight glinting off metallic paint, seagulls crying, palm trees swaying, distant mountains, dramatic clouds, epic music building, slow motion water spray\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A sleek sports car races along a coastal highway at sunrise. Low-angle tracking shot follows the car past rocky cliffs as lens flares streak across the hood. Golden morning light glints off the metallic paint, ocean waves blurred in the background.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> On 2.x \u2014 especially 2.5 Turbo, designed for 3\u20134 element scenes \u2014 overlong prompts produce melted outputs. The good version compresses to one action, one camera move, and a few scene elements within the 50\u201380 word band.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Cinematic portrait (t2v)<\/h3>\n<pre><code>Intimate close-up portrait of an elderly fisherman with weathered skin and deep-set eyes, salt-and-pepper stubble. He gazes off-camera as sea wind moves through his gray hair. Slow push-in. Cold overcast daylight, muted blue-gray palette, quiet contemplative atmosphere.\n<\/code><\/pre>\n<h3>Nature motion (i2v)<\/h3>\n<pre><code>Sunlight dapples through budding branches as a pair of robins weave twigs into a nest, their tiny forms a whirlwind of activity. The camera holds steady with a gentle, observational pace.\n<\/code><\/pre>\n<h3>Start/end frame control (i2v)<\/h3>\n<pre><code>Take the start frame as the opening and the end frame as the destination: smooth transition from sunrise to sunset over a mountain landscape, light shifting gradually across the peaks, clouds drifting slowly. Static camera.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Tag soup instead of prose<\/strong> \u2192 Kling 1.x\u20132.x dislikes fragmented keyword inputs; write flowing shot descriptions.<\/li>\n<li><strong>\"no X\" in the negative prompt<\/strong> \u2192 the field already excludes; write the thing itself.<\/li>\n<li><strong>Multiple scene changes in one prompt<\/strong> \u2192 2.x generates one continuous take; split scenes into separate clips.<\/li>\n<li><strong>Overlong prompts<\/strong> \u2192 melted outputs on 2.x; stay in the 50\u201380 word t2v band, 20\u201340 for i2v.<\/li>\n<li><strong>Re-describing the image in i2v<\/strong> \u2192 describe motion only.<\/li>\n<li><strong>Expecting audio on 2.0/2.1/2.5<\/strong> \u2192 native audio starts at 2.6; add sound in post for earlier versions.<\/li>\n<li><strong>Long negative stacks<\/strong> \u2192 they reduce motion and detail; keep negatives short.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Kling 2.x family \u2014 transformer-based video diffusion with 3D spatio-temporal attention (per third-party technical reviews)<\/li>\n<li><strong>Text Encoder:<\/strong> (leave blank \u2014 not documented)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> (leave blank \u2014 community references cite ~2500 characters API-side, unverified officially)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Closed, cloud-only (klingai.com / app.klingai.com, API at the Kuaishou developer portal). 5/10 s durations, up to 1080p, 16:9/9:16/1:1. Platform tools: DeepSeek prompt enhancer, Motion Brush, first/last frame control, Elements/reference consistency, Lip Sync module (2.1). 2.6 adds simultaneous audio-visual generation (EN/ZH). No open weights.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://aiwiki.ai/wiki/kling_2_1 (2.x release table: 2.0/2.1/2.5 Turbo/2.6 dates, tiers, audio)<\/li>\n<li>https://fal.ai/models/fal-ai/kling-video/v2.1/master/text-to-video/api (2.1 Master t2v schema: negative_prompt, cfg_scale)<\/li>\n<li>https://fal.ai/models/fal-ai/kling-video/v2.1/master/image-to-video/api (2.1 Master i2v schema and motion-focused example prompt)<\/li>\n<li>https://fal.ai/models/fal-ai/kling-video/v2.1/standard/image-to-video/api (2.1 Standard i2v schema)<\/li>\n<li>https://fal.ai/models/fal-ai/kling-video/v2.5-turbo/standard/image-to-video/api (2.5 Turbo i2v schema and motion-focused example prompt)<\/li>\n<li>https://fal.ai/learn/devs/kling-2-6-pro-vs-kling-2-5-turbo-pro (2.6 vs 2.5 Turbo: native audio, Elements, speed)<\/li>\n<li>https://github.com/smixs/visual-skills/blob/HEAD/video/references/kling.md (prompt formula 1.x\u20132.x, per-model length bands, negative-prompt rules, 2.x vs 3.0 differences)<\/li>\n<li>https://github.com/chirag6653/visual-skills/blob/HEAD/video/references/kling.md (same reference, corroborating length bands and formulas)<\/li>\n<li>https://github.com/falling-ts/comfy/blob/HEAD/.agents/skills/comfyui/MODELS/video-api.md (2.x five-part style, emphasis convention, prompt ~2500 chars)<\/li>\n<li>https://gaga.art/blog/kling-ai/ (official-style prompt structures for t2v and i2v, start/end frame workflows)<\/li>\n<li>https://www.cometapi.com/kling-2-1-vs-veo-3/ (2.1 tiers, durations, reference/multi-image features)<\/li>\n<li>https://github.com/brndngln/nodetool/blob/HEAD/packages/system-skills/kling-video-prompting/SKILL.md (per-version feature table incl. cfg_scale/negative-prompt support)<\/li>\n<li>https://github.com/santiagoromero27/creative-workflow/blob/HEAD/.claude/skills/kling-ai/SKILL.md (2.x i2v/t2v workflows, Turbo prototyping pattern)<\/li>\n<\/ul>", "pairs": 6, "file": "models/video/kling-2.x.md"}, "video/kling/1": {"title": "Prompt Guide: Kling 3.0", "html": "\n<p><strong>Model:<\/strong> Kling 3.0 (VIDEO 3.0 series)\n<strong>Developer:<\/strong> Kuaishou\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong> (leave blank \u2014 not documented)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Kling 3.0 is the February 2026 flagship series (community release trackers cite Jan 31\u2013Feb 5, 2026), succeeding the 2.x line on Kuaishou's Multi-modal Visual Language (MVL) framework \u2014 a shift from basic video generation toward professional shot orchestration. Verified existence is confirmed by multiple independent sources; note \"Kling 3.0\" is a <strong>series, not one model<\/strong>: <strong>VIDEO 3.0<\/strong> (base: cinematic storytelling, multi-shot, native audio), <strong>VIDEO 3.0 Turbo<\/strong> (faster/cheaper per second, strongest lip sync, no 4K), <strong>VIDEO 3.0 Omni<\/strong> (adds video element reference, element voice control, and video editing), <strong>VIDEO 3.0 Motion Control<\/strong> (motion transfer with high facial consistency, up to 30 s), and <strong>Avatar 2.0<\/strong> (talking avatars from 1 image + 1 audio, up to 5 min). Headline changes vs 2.x: multi-shot generation (up to 6 shots) in a single call, native audio with lip sync on by default, 3\u201315 s durations, up to 4K output (native 4K as a separate April 2026 release), tagged character elements (<code>@Element1<\/code>), and full cinematic-language understanding (\"shot-reverse-shot\", \"POV\", \"macro close-up\" are read as instructions).<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write shots, not paragraphs: a 3.0 prompt is a structured multi-shot plan with labeled characters, explicit per-shot framing/action/camera, and named edits \u2014 a single dense paragraph throws away multi-shot, audio, and character-tagging and comes back as one drifting take.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>A tense negotiation scene in a glass office at dusk, two people talking, dramatic lighting, cinematic, 4k\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>[Character A: Exhausted Partner \u2014 late 40s, gray-streaked beard, navy peacoat, hollow eyes]\n[Character B: Female Investor \u2014 early 30s, sharp blazer, calm posture]\n\nMaster intent: tense negotiation in a glass-walled office at dusk.\n\nShot 1 (0-3s). Wide tracking shot. Character A enters frame from left, crosses to the table.\nShot 2 (3-6s). Profile close-up on Character A. He sets down a brown leather folder.\nShot 3 (6-9s). Shot-reverse-shot. Cut to Character B's face. She does not blink.\n\nCamera. Slow, deliberate. 35mm and 85mm feel.\nLighting. Cold blue dusk through floor-to-ceiling windows. Single amber desk lamp.\nAudio. Distant city ambience. No music. Footsteps on hardwood.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td><code>negative_prompt<\/code> field supported on v3 (API default <code>\"blur, distort, and low quality\"<\/code>). Same rule as 2.x: write the thing itself, never \"no X\".<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Supported<\/td>\n<td>Element tags: reference uploaded elements in the prompt as <code>@Element1<\/code>, <code>@Element2<\/code>, etc. Character labels like <code>[Character A: \u2026]<\/code> are a documented community convention for locking identity across shots.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Partially<\/td>\n<td>Motion Control variant transfers motion from a reference clip; Omni supports video element reference and video editing. Not prompt-syntax features.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Under-structured prompts collapse multi-shot into one drifting take; empty shot descriptions (\"static frame, ambient mood\") do the same<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td><strong>100\u2013200 words<\/strong> total; plan ~30\u201360 words per shot. Longer prompts are welcome on 3.0 \u2014 structure beats length.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Unstructured walls of text still underperform; the answer is explicit shot structure, not more adjectives<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<pre><code>[Character/Element labels] \u2192 [Master intent] \u2192 [Shot 1 (timing). Framing. Subject + action. Camera.]\n\u2192 [Shot 2 \u2026] \u2192 [Camera] \u2192 [Lighting] \u2192 [Audio]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Output contract (first line)<\/td>\n<td>Duration, aspect ratio, single/multi-shot, overall finish<\/td>\n<td>\"12 seconds, 9:16, one continuous handheld take\"<\/td>\n<\/tr>\n<tr>\n<td>Character/element labels<\/td>\n<td>Unique consistent identifiers introduced BEFORE any shot; reuse verbatim across shots<\/td>\n<td><code>[Character A: Exhausted Partner \u2014 late 40s, gray-streaked beard, navy peacoat]<\/code> / <code>@Element1<\/code><\/td>\n<\/tr>\n<tr>\n<td>Master intent<\/td>\n<td>One line: what the scene is<\/td>\n<td>\"Master intent: tense negotiation in a glass-walled office at dusk.\"<\/td>\n<\/tr>\n<tr>\n<td>Per-shot block<\/td>\n<td>Timing + framing + subject + motion; each shot must answer framing + subject + motion<\/td>\n<td>\"Shot 2 (3-6s). Profile close-up on Character A. He sets down a brown leather folder.\"<\/td>\n<\/tr>\n<tr>\n<td>Edits<\/td>\n<td>Name the cut: shot-reverse-shot, match cut, smash cut, J-cut, L-cut<\/td>\n<td>\"Shot-reverse-shot. Cut to Character B's face.\"<\/td>\n<\/tr>\n<tr>\n<td>Camera<\/td>\n<td>Moves with motivation + lens feel<\/td>\n<td>\"Slow, deliberate. Sony FX6 feel, 35mm and 85mm.\"<\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>Key light + mood<\/td>\n<td>\"Cold blue dusk through floor-to-ceiling windows. Single amber desk lamp.\"<\/td>\n<\/tr>\n<tr>\n<td>Audio<\/td>\n<td>Dialogue cues, ambience, music \u2014 or explicit \"No music\"<\/td>\n<td>\"Distant city ambience. No music. Footsteps on hardwood.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Cinematic vocabulary 3.0 treats as instructions: framing (profile shot, three-quarter, macro insert, two-shot, OTS, POV, low angle, high angle, Dutch), edits (shot-reverse-shot, match cut, smash cut, J-cut, L-cut), camera moves (tracking, dolly, push-in, pull-out, whip pan, crane, handheld), lens feel (35mm, 50mm, 85mm, 100mm macro, anamorphic 40mm).<\/p>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Labeled characters/elements anchored early<\/td>\n<td><code>[Character A: \u2026]<\/code>, <code>@Element1 walks into the coffee shop\u2026<\/code><\/td>\n<\/tr>\n<tr>\n<td>Explicit per-shot timing<\/td>\n<td><code>Shot 1 (0-3s).<\/code>, durations summing to \u2264 15 s<\/td>\n<\/tr>\n<tr>\n<td>Named edits between shots<\/td>\n<td>\"shot-reverse-shot, match cut, smash cut, J-cut, L-cut\"<\/td>\n<\/tr>\n<tr>\n<td>Full cinematic vocabulary<\/td>\n<td>See structure table \u2014 used as instructions, not flavor<\/td>\n<\/tr>\n<tr>\n<td>Audio design<\/td>\n<td>Quoted dialogue, ambient beds, explicit \"No music\" when scoring later<\/td>\n<\/tr>\n<tr>\n<td>Consistency instructions<\/td>\n<td>\"Keep wardrobe and weather consistent.\"<\/td>\n<\/tr>\n<tr>\n<td>Identity-locking across shots<\/td>\n<td>Same label reused verbatim; reference images via Elements<\/td>\n<\/tr>\n<tr>\n<td>Native-audio language cues<\/td>\n<td>EN/ZH/JA/KO/ES supported; lowercase English speech, uppercase acronyms/proper nouns<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One dense paragraph for a multi-shot scene<\/td>\n<td>Labeled shot blocks with timing, framing, subject, motion<\/td>\n<\/tr>\n<tr>\n<td>Empty shot descriptions (\"static frame, ambient mood\")<\/td>\n<td>Every shot answers: framing + subject + motion<\/td>\n<\/tr>\n<tr>\n<td>Pronouns/synonyms for characters across shots<\/td>\n<td>The same <code>[Character A]<\/code> / <code>@Element1<\/code> label every time<\/td>\n<\/tr>\n<tr>\n<td>Combining every control by default (elements + refs + multi-shot + audio)<\/td>\n<td>The smallest set of controls that fixes the problem; more references can conflict<\/td>\n<\/tr>\n<tr>\n<td>Relying on post-hoc stitching for audio<\/td>\n<td>Generate dialogue scenes in one multi-shot call \u2014 separately generated clips drop sound at each join<\/td>\n<\/tr>\n<tr>\n<td>Open-ended looping motion<\/td>\n<td>Defined actions with starts and ends<\/td>\n<\/tr>\n<tr>\n<td>\"no X\" in the negative prompt<\/td>\n<td>The thing itself: <code>robots<\/code>, <code>blurry faces<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>(leave blank \u2014 cloud API; not exposed)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td><code>cfg_scale<\/code> 0\u20131, default 0.5; 0.3\u20130.4 = creative freedom, 0.7\u20131.0 = strict adherence<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>Up to 1080p base; 4K tier available (separate native-4K release, April 2026). Turbo: 720p\u20131080p, no 4K<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>(leave blank \u2014 not exposed)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>(leave blank \u2014 not exposed)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Duration: 3\u201315 s (per-shot durations must sum to \u2264 15 s). Aspect ratio: 16:9 / 9:16 / 1:1. <code>generate_audio<\/code>: on by default for VIDEO 3.0 and Turbo; off by default on O3. Prompt cap: ~3072 characters (per community skill documentation). Motion Control: up to 30 s, 1080p.<\/p>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt carries the full scene AND the full directing plan: output contract, labeled characters, master intent, per-shot blocks with timing/framing/action/camera, lighting, and audio. Two-stage pattern recommended for commercial work: prototype on <strong>3.0 Turbo<\/strong> (720p, cheap, silent-if-prompted) to lock framing/motion/structure, then re-run the winning prompt on <strong>VIDEO 3.0/Omni<\/strong> for the delivery pass (native audio, higher resolution, consistency tooling).<\/p>\n<h3>Image-to-Video<\/h3>\n<p>Upload a start image (min 300\u00d7300px, \u226410 MB) and write a <strong>motion-focused<\/strong> prompt \u2014 describe only what moves; the scene already exists in the image. Optionally set an end frame to control where motion resolves. Match the aspect ratio to the source image; render 1080p first, 4K only for final delivery. Example pattern: \"The craftsman slowly examines the bowl, turning it gently in his weathered hands\u2026 Dust particles drift in warm light. Breathing motion, blinking eyes.\" For reference-heavy identity work, use <strong>Omni<\/strong> with element references (<code>@Element1<\/code>) instead of relying on the prompt alone.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V multi-shot: office negotiation<\/h3>\n<p><strong>Intended content:<\/strong> A tense 9-second negotiation across three shots with consistent characters.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A tense negotiation in a glass office at dusk. A bearded man in a peacoat and a woman investor talk intensely, dramatic lighting, cinematic, 4k, photorealistic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>[Character A: Exhausted Partner \u2014 late 40s, gray-streaked beard, navy peacoat, hollow eyes]\n[Character B: Female Investor \u2014 early 30s, sharp blazer, calm posture]\n\nMaster intent: tense negotiation in a glass-walled office at dusk.\n\nShot 1 (0-3s). Wide tracking shot. Character A enters frame from left, crosses to the table.\nShot 2 (3-6s). Profile close-up on Character A. He sets down a brown leather folder.\nShot 3 (6-9s). Shot-reverse-shot. Cut to Character B's face. She does not blink.\n\nCamera. Slow, deliberate. 35mm and 85mm feel.\nLighting. Cold blue dusk through floor-to-ceiling windows. Single amber desk lamp.\nAudio. Distant city ambience. No music.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Documented guidance is explicit: a single dense paragraph on 3.0 \"comes back as one drifting take\" \u2014 the good version anchors both characters with reusable labels before any shot, gives each shot timing/framing/subject/motion, names the edit (shot-reverse-shot), and designs the audio bed including an explicit \"No music\".<\/p>\n<h3>T2V single shot with native audio<\/h3>\n<p><strong>Intended content:<\/strong> A craftsman examines a bowl; quiet ambient audio.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Old man looking at a bowl, nice lighting, peaceful\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>The craftsman slowly examines the bowl, turning it gently in his weathered hands. His eyes reflect years of wisdom. A subtle smile forms on his face. Dust particles drift in warm light. Breathing motion, blinking eyes. Faint workshop ambience, soft wood creaks.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> 3.0 generates native audio from the prompt \u2014 the good version describes both micro-motion (turning, blinking, breathing) and the ambient bed. The bad version gives the motion and audio pipelines nothing concrete to render.<\/p>\n<h3>I2V: Animating a still portrait<\/h3>\n<p><strong>Intended content:<\/strong> A still portrait photo should come alive with subtle motion.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A photorealistic portrait of a middle-aged man with gray-streaked beard wearing a navy peacoat, dramatic lighting, highly detailed, 8k\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Animate the subject in the reference image. Motion: he turns his head slowly toward camera, eyes narrowing slightly, then looks away. Camera: slow push-in. Keep face identity, clothing, and background layout consistent. Natural motion blur, realistic physics, photorealistic.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> I2V prompts describe only motion \u2014 the image supplies everything else. The documented i2v template pattern (animate + motion + camera + consistency instruction) keeps identity locked while the bad prompt re-describes the frame and invites morphing.<\/p>\n<h3>Element reference (Omni)<\/h3>\n<p><strong>Intended content:<\/strong> A character from a reference image walks into a coffee shop rendered in a second reference's style.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A person walks into a coffee shop and sits at a table near the window, cozy style\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>@Element1 walks into a coffee shop and sits down at a table near the window. The interior matches the style of @Element2.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> On Omni, uploaded reference images/elements must be explicitly bound with <code>@ElementN<\/code> tags \u2014 without the tags, the model has no instruction linking the references to the described subjects, and identity/style consistency is lost.<\/p>\n<h3>Character label consistency<\/h3>\n<p><strong>Intended content:<\/strong> Two characters recur across shots 1 and 3.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Shot 1: the bearded guy enters. Shot 3: the tired man argues with the businesswoman.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>[Character A: Exhausted Partner \u2014 late 40s, gray-streaked beard, navy peacoat, hollow eyes]\nShot 1 (0-3s). Wide shot. Character A enters frame from left.\nShot 3 (6-9s). Medium shot. Character A raises his voice; Character B does not blink.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Documented rule: introduce every character once with a unique label at the start, then reuse the exact same label in every shot \u2014 pronouns and synonyms (\"the bearded guy\" / \"the tired man\") break identity tracking across cuts.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Multi-shot racing film<\/h3>\n<pre><code>Style: Hollywood professional racing film, cinematic night rain, high stakes.\nDuration: 12s. Multi-shot.\n\n[0-4s] Shot 1 \u2014 Interior close-up: veteran driver in helmet, rain lashes windshield, dashboard lights on visor, calm nod, mouths &quot;Let's go.&quot;\n[4-8s] Shot 2 \u2014 Rival cockpit: younger driver grips wheel, heavy breathing, adrenaline eyes, whispers &quot;Focus.&quot;\n[8-12s] Shot 3 \u2014 Wide action: starting lights turn green, both cars accelerate on wet asphalt, water sprays into lens, stadium lights streak with motion blur.\n\nPhotorealistic, IMAX feel, coherent faces, natural rain physics, 4K.\n<\/code><\/pre>\n<p>(documented community pattern for 3.0 multi-shot with per-shot audio/visual beats)<\/p>\n<h3>I2V motion prompt (fal example pattern)<\/h3>\n<pre><code>Fine grains of salt drift across the flats in a slow, low wind, streaming past the figure's feet. The figure's robe ripples. Light crawls down the face of the monolith as the sun rises millimeter by millimeter. The figure tilts their head upward. Camera creeps forward almost imperceptibly. Monumental, spiritual, glacial.\n<\/code><\/pre>\n<h3>Turbo draft \u2192 3.0 final<\/h3>\n<pre><code>Single continuous take, 5 seconds, 16:9. A lighthouse at dusk, waves crashing against the rocks, beam sweeping left to right. Static camera, slow tilt up. No audio.\n<\/code><\/pre>\n<p>(run at 720p on 3.0 Turbo to validate, then re-run the locked prompt on VIDEO 3.0 for the delivery pass)<\/p>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Single dense paragraph for multi-shot<\/strong> \u2192 one drifting take; use labeled shot blocks.<\/li>\n<li><strong>Empty shot descriptions<\/strong> \u2192 every shot must answer framing + subject + motion.<\/li>\n<li><strong>Pronouns/synonyms across shots<\/strong> \u2192 reuse the exact <code>[Character A]<\/code> / <code>@ElementN<\/code> label.<\/li>\n<li><strong>Stacking every control at once<\/strong> \u2192 smallest effective control set; extra references can conflict.<\/li>\n<li><strong>Stitching separately generated clips for dialogue<\/strong> \u2192 sound drops at each join; generate multi-shot dialogue in one call.<\/li>\n<li><strong>\"no X\" in the negative prompt<\/strong> \u2192 write the thing itself.<\/li>\n<li><strong>Expecting 4K or audio from Turbo<\/strong> \u2192 Turbo is 720p\u20131080p with no 4K tier; choose the variant for the job (Turbo = drafts, 3.0/Omni = delivery).<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Kling 3.0 series \u2014 Multi-modal Visual Language (MVL) framework; unified text/image/reference/video-to-video generation with native audio synthesis and lip sync<\/li>\n<li><strong>Text Encoder:<\/strong> (leave blank \u2014 not documented)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> (leave blank \u2014 community references cite a ~3072-character prompt cap, unverified officially)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Closed, cloud-only (klingai.com). 3\u201315 s, up to 4K, 16:9/9:16/1:1. Variants: VIDEO 3.0, 3.0 Turbo (fast/cheap, best lip sync, no 4K), 3.0 Omni (element reference + voice control + video editing), 3.0 Motion Control (motion transfer, up to 30 s), Avatar 2.0 (talking avatars up to 5 min). generate_audio on by default (3.0, Turbo), off by default (O3). Languages: EN, ZH, JA, KO, ES + dialects.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/mandjouh/kling-ai-prompt-generator (3.0 series model table: variants, prompt lengths, release dates)<\/li>\n<li>https://github.com/watreesir/awesome-kling-4 (Kling release timeline 1.0\u21923.0, 3.0 feature summary)<\/li>\n<li>https://github.com/brndngln/nodetool/blob/HEAD/packages/system-skills/kling-video-prompting/SKILL.md (per-version feature table: shot lists, tagged elements, native audio, cfg_scale/negative support; \"write shots, not paragraphs\")<\/li>\n<li>https://github.com/smixs/visual-skills/blob/HEAD/video/references/kling.md (2.x vs 3.0 capability table, five-layer structure, multi-shot syntax, character labels)<\/li>\n<li>https://github.com/dseastar/awesome-kling/blob/HEAD/README-en.md (3.0 prompt formula, multi-shot template, i2v template)<\/li>\n<li>https://github.com/flaqai/awesome-kling-4-0/blob/HEAD/docs/PROMPT-GUIDE.md (seven-layer prompt, input-mode selection)<\/li>\n<li>https://github.com/santiagoromero27/creative-workflow/blob/HEAD/.claude/skills/kling-ai/SKILL.md (3.0 i2v/t2v workflows, Turbo prototyping pattern)<\/li>\n<li>https://github.com/neurodropp/prompt-resources/blob/HEAD/prompt_docs/kling-ai/kling-ai-kling-video-30-omni-readme.md (Omni: element references, @-style tags, video editing)<\/li>\n<li>https://fal.ai/models/fal-ai/kling-video/v3/4k/image-to-video/api (v3 i2v schema: negative_prompt, cfg_scale, elements, end frames, multi_prompt)<\/li>\n<li>https://lifestyle.pluralist.com/story/769365/kling-ai-launches-3-0-model-ushering-in-an-era-where-everyone-can-be-a-director-5/ (3.0 launch: MVL framework, Omni storyboarding, multi-shot)<\/li>\n<li>https://www.versely.studio/blog/kling-v3-standard-i2v-is-63-credits (3.0 variant/credit catalog: Turbo silent, Standard/O3 audio rows)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/kling-3.0.md"}, "video/veo/0": {"title": "Prompt Guide: Veo 2", "html": "\n<p><strong>Model:<\/strong> Veo 2 (<code>veo-2.0-generate-001<\/code>)\n<strong>Developer:<\/strong> Google DeepMind (via Gemini API / Vertex AI)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong><\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Veo 2 is Google DeepMind's earlier-generation video model: silent 8-second clips at up to 720p from text or a single input image. It has <strong>no native audio<\/strong> \u2014 dialogue, SFX, and ambience prompts are ignored, so sound design belongs in post-production. Its standout prompting feature is <code>enhancePrompt<\/code>, an automatic prompt rewriter (Veo 2 only) that enriches sparse prompts with cinematic detail. Prompt structure follows Google's documented prompt-writing basics \u2014 subject/context, action, style, camera motion &amp; composition, ambiance \u2014 with the Vertex AI best-practice rule of <strong>one focused scene per short clip<\/strong>.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write <strong>one richly specific sentence or two, aimed at a single focused moment<\/strong> \u2014 then let <code>enhancePrompt<\/code> do the cinematic expansion. Vague one-liners (\"a cool video of a car\") starve the model; chaining multiple events (\"then he drives away, then...\") muddies it.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>A cool video of a detective, then he drives across the city and confronts a suspect\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>Close-up on a detective's gloved hand brushing dust off an old book in a dark library, revealing a hidden symbol\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not documented<\/td>\n<td>No weight syntax; use descriptive language instead.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported (Vertex AI)<\/td>\n<td><code>negativePrompt<\/code> parameter \u2014 describe what to exclude.<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Generic, under-composed output \u2014 e.g. \"sunset over ocean\" gives a flat default render.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>1\u20133 well-structured sentences naming subject, action, setting, style, mood, and camera (per Google's documented prompt elements). Official docs show markedly better results from the \"more detail\" revision of the same prompt.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>Google's documented prompt-writing basics for Veo \u2014 a good prompt specifies each element:<\/p>\n<pre><code>[Subject] + [Action] + [Context] + [Style] + [Camera motion &amp; composition] + [Ambiance]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject and context<\/td>\n<td>Main focus and its environment<\/td>\n<td><code>a desperate man in a weathered green trench coat<\/code>, <code>on a gritty brick wall<\/code><\/td>\n<\/tr>\n<tr>\n<td>Action<\/td>\n<td>What the subject does (movement is vital)<\/td>\n<td><code>dials a rotary phone<\/code>, <code>snow falling gently<\/code><\/td>\n<\/tr>\n<tr>\n<td>Style<\/td>\n<td>Aesthetic keywords<\/td>\n<td><code>cinematic<\/code>, <code>film noir<\/code>, <code>3D cartoon style<\/code><\/td>\n<\/tr>\n<tr>\n<td>Camera motion &amp; composition<\/td>\n<td>How the camera moves and frames<\/td>\n<td><code>The camera dollies in<\/code>, <code>close-up<\/code>, <code>aerial shot<\/code>, <code>POV shot<\/code><\/td>\n<\/tr>\n<tr>\n<td>Ambiance<\/td>\n<td>Lighting, palette, mood<\/td>\n<td><code>bathed in the eerie glow of a green neon sign<\/code>, <code>cool blue tones, sad mood<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Official docs demonstrate the difference: a \"less detail\" prompt (\"The camera dollies to show a close up of a desperate man... It looks like a movie scene\") yields a flat result, while the \"more detail\" revision (jaw tension, shallow depth of field, blurring background) produces the intended urgency and isolation.<\/p>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Richly specific, concise description<\/td>\n<td>1\u20133 sentences; \"be richly specific, yet concise\"<\/td>\n<\/tr>\n<tr>\n<td>Visual, camera-readable language<\/td>\n<td>Describe what the camera sees, not how you feel about it<\/td>\n<\/tr>\n<tr>\n<td>Film terminology<\/td>\n<td><code>slow dolly-in<\/code>, <code>wide establishing shot<\/code>, <code>tracking drone view<\/code>, <code>top-down<\/code>, <code>low angle<\/code><\/td>\n<\/tr>\n<tr>\n<td>Focus and lens effects<\/td>\n<td><code>shallow focus<\/code>, <code>deep focus<\/code>, <code>macro<\/code>, <code>wide-angle<\/code><\/td>\n<\/tr>\n<tr>\n<td>One scene, one action per clip<\/td>\n<td>A single focused moment; generate multi-event
