rack.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A woman speaks happily about her vacation while birds chirp and music plays in the background\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A woman in a sunlit kitchen speaks directly to the camera with a warm, animated expression, gesturing naturally as she talks. Soft daylight from the window, gentle camera drift.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> In S2V the audio \u2014 not the prompt \u2014 carries the speech, rhythm, and (where TTS is used) the words themselves. The bad prompt tries to script the audio in words and invents background events. The good prompt describes only the video content: who is speaking, the setting, and the on-screen behavior that should stay in sync with the audio.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Official T2V example (used across the 2.2 model cards)<\/h3>\n<pre><code>Two anthropomorphic cats in comfy boxing gear and bright gloves fight intensely on a spotlighted stage.\n<\/code><\/pre>\n<h3>Official I2V example (used across the 2.2 model cards)<\/h3>\n<pre><code>Summer beach vacation style, a white cat wearing sunglasses sits on a surfboard. The fluffy-furred feline gazes directly at the camera with a relaxed expression. Blurred beach scenery forms the background featuring crystal-clear waters, distant green hills, and a blue sky dotted with white clouds. The cat assumes a naturally relaxed posture, as if savoring the sea breeze and warm sunlight. A close-up shot highlights the feline's intricate details and the refreshing atmosphere of the seaside.\n<\/code><\/pre>\n<h3>I2V motion prompt (short, community style)<\/h3>\n<pre><code>Cherry blossoms swaying gently in the breeze, petals falling, smooth motion\n<\/code><\/pre>\n<h3>Enhanced timeline prompt (wan2gp convention)<\/h3>\n<pre><code>(at 0 seconds: the man stands in front of the fridge, camera static)\n(at 1 second: he opens the fridge and reaches for a can)\n(at 2 seconds: the camera shifts to a side angle as he drinks)\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Prompting I2V like T2V<\/strong> \u2014 re-describing the image's content instead of describing motion and camera; the prompt should be Motion Description + Camera Movement.<\/li>\n<li><strong>Leaving motion unnamed<\/strong> \u2014 a static scene description gives the model nothing to animate; every prompt needs change-over-time (\"waves rolling in, hair blowing\").<\/li>\n<li><strong>Multiple scenes per prompt<\/strong> \u2014 one clip is one shot; cuts produce mush (except Enhanced/Lightning builds that expect timeline formats).<\/li>\n<li><strong>Keyword soup<\/strong> \u2014 the UMT5 encoder is instruction-grade; grammatically coherent sentences beat comma-separated tags.<\/li>\n<li><strong>Using the timeline format on the base A14B models<\/strong> \u2014 <code>(at N seconds: ...)<\/code> structure is for Enhanced/Lightning builds; the base T2V/I2V models expect one continuous scene description.<\/li>\n<li><strong>Skipping the negative prompt<\/strong> \u2014 the Chinese default is the ecosystem standard for suppressing video-model failure modes (above cfg 1.0, where the negative branch is active).<\/li>\n<li><strong>Ignoring prompt extension<\/strong> \u2014 short prompts are officially recommended for Qwen-based extension; writing the extension yourself is wasted effort the pipeline does better.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Wan-AI/Wan2.2-T2V-A14B, Wan-AI/Wan2.2-I2V-A14B (MoE: two ~14B experts, 27B total, 14B active/step; high-noise expert handles early layout, low-noise expert refines details, split by SNR threshold); Wan-AI/Wan2.2-TI2V-5B (unified T2V+I2V, 720P@24fps, high-compression Wan2.2-VAE at 4\u00d716\u00d716); Wan2.2-S2V-14B (audio-driven); Wan2.2-Animate-14B (character animation/replacement); Fun family (InP, Control, Camera Control) as separate official branches<\/li>\n<li><strong>Text Encoder:<\/strong> UMT5-XXL (bilingual Chinese/English; text_len 512 per official configs)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> 512 (community guides: quality degrades ~320\u2013350 tokens \u2014 family measurement, not 2.2-specific)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Flow-matching DiT with 3D causal VAE; 81 frames at 16fps for A14B models, 121 frames at 24fps for TI2V-5B; meticulous cinematic training labels (lighting, composition, contrast, color tone); +65.6% more images / +83.2% more videos vs 2.1; official prompt extension via Dashscope Qwen (qwen-plus for T2V, qwen-vl-max for I2V) or local Qwen models<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/Wan-Video/Wan2.2 (official repo: MoE architecture, model lineup, prompt extension, generate.py defaults)<\/li>\n<li>https://huggingface.co/Wan-AI/Wan2.2-T2V-A14B-Diffusers (official T2V model card: examples, negative prompt, prompt extension, guidance_scale)<\/li>\n<li>https://huggingface.co/Wan-AI/Wan2.2-I2V-A14B-Diffusers (official I2V model card: examples, settings)<\/li>\n<li>https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B (official TI2V-5B card: MoE design, VAE compression, 720P@24fps, unified T2V+I2V)<\/li>\n<li>https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B-Diffusers (Diffusers example: 121 frames, steps 50, guidance 5.0, 704\u00d71280, fps=24)<\/li>\n<li>https://huggingface.co/Wan-AI/Wan2.2-T2V-A14B-Diffusers/discussions/8 (official config log: sample_guide_scale=(3.5,3.5), boundary 0.9, sample_shift 5.0, sample_fps 16, text_len 512)<\/li>\n<li>https://huggingface.co/magespace/Wan2.2-I2V-A14B-Lightning-Diffusers (Lightning example: guidance_scale=4.0, guidance_scale_2=3.0, steps 40)<\/li>\n<li>https://huggingface.co/jc-builds/Wan2.2-TI2V-5B-iOS (prompting guide: subject\u2192motion\u2192camera\u2192scene, weigh the start, name the motion, one scene per clip, Chinese negative prompt)<\/li>\n<li>https://huggingface.co/jc-builds/Wan2.2-TI2V-5B-Turbo-iOS (prompting guide: ordering, concrete verbs, camera direction, cfg 1.0 note, bilingual training)<\/li>\n<li>https://huggingface.co/geceff/Wan2.2-Custom-Models-GGUF (community quant notes: high-noise expert for creative motion/camera, low-noise expert for fidelity and prompt adherence; NSFW finetune entry)<\/li>\n<li>https://github.com/vllm-project/vllm-omni/blob/HEAD/examples/offline_inference/image_to_video/README.md (MoE I2V recipe: guidance-scale 5.0, guidance-scale-high 6.0, boundary-ratio 0.875, flow-shift 5/12)<\/li>\n<li>https://github.com/deepbeepmeep/wan2gp/blob/HEAD/docs/PROMPTS.md (Enhanced timeline format <code>(at N seconds: ...)<\/code>, <code>[/duration=30%,/overlap=9]<\/code>, Enhanced Lightning v2 default prompt)<\/li>\n<li>https://github.com/xujinghao221/construction-video-prompt-skill (FLF2V/InP prompt semantics: first frame = start condition, last frame = target, prompt = allowed action between)<\/li>\n<li>https://civitai.com/articles/22845/wan22-studio-prompt-generator-and-guide (Wan 2.2 community guide: 80\u2013120 words optimal, Subject + Scene + Motion + Camera + Aesthetics, I2V = Motion + Camera)<\/li>\n<li>https://arxiv.org/pdf/2508.18621v1 (Wan-S2V paper: reference image + audio + content-describing prompt, wav2vec audio conditioning)<\/li>\n<li>https://www.youtube.com/watch?v=laAj4N-Es4w (Dasiwa Wan 2.2 uncensored I2V workflows: uncensored text encoders, Qwen3-VL time-separated prompting, vs \"Smooth Mix\"/\"Remix\")<\/li>\n<li>https://www.youtube.com/watch?v=uFIoiIrRmP0 (ComfyUI update notes: Wan 2.2 FLF2V, Fun Inpaint, Fun Control [Canny/Depth/OpenPose/MLSD], Fun Camera Control, S2V)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/wan-2.2.md"}, "video/wan/2": {"title": "Prompt Guide: Wan 2.5", "html": "\n<p><strong>Model:<\/strong> Wan 2.5 (T2V / I2V, \"Wan-25-Preview\")\n<strong>Developer:<\/strong> Alibaba (Wan-Video / Alibaba Cloud Model Studio)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong> (multilingual text encoder; exact architecture not publicly specified \u2014 leave blank per rules)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p><strong>Note: this version is verified to exist as of October 2026.<\/strong> Wan 2.5 was unveiled as Wan 2.5-Preview in September 2025 on Alibaba Cloud's Model Studio and released as a text/image-to-video model with <strong>native audio generation<\/strong> \u2014 voice/dialogue, sound effects, and background music synthesized in the same pass, synced to the visuals. It produces up to <strong>10-second 1080p<\/strong> clips (720p also available, 5s or 10s durations), is offered on DashScope/fal/WaveSpeed, and is reported open-weight (Apache 2.0) by third parties. Prompting adds a fourth slot to the Wan formula: <strong>Subject + Scene + Motion + Sound Description<\/strong>. The core visual-prompting language (full sentences, cinematographic vocabulary, subject-first ordering) is the same family as Wan 2.1/2.2.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Wan 2.5 keeps the family rule \u2014 natural-language, cinematography-flavored prompts ordered subject-first \u2014 and adds an audio slot: describe what is <em>heard<\/em> (voice tone, sound effects, music) as plainly as what is seen. Keep each prompt in a single language (Chinese or English) for best compliance.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>rainy city street, cinematic, jazz soundtrack, 4k\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>Rain falls on an empty neon-lit city street at night, puddles rippling as the camera slowly pushes forward. Soft jazz piano plays in the background with the distant sound of rain and passing traffic.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support; assume unreliable as with earlier Wan encoders<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Unknown<\/td>\n<td>No evidence<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Unknown<\/td>\n<td>No evidence<\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Unknown<\/td>\n<td>No evidence<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td><code>negative_prompt<\/code> parameter exposed on API endpoints<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Unknown<\/td>\n<td>No documented trigger tokens<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td>Not documented for 2.5<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>One API parameter worth noting: <strong><code>enable_prompt_expansion<\/code><\/strong> \u2014 when true, the prompt optimizer rewrites/enriches the prompt before generation (the 2.5 successor to Qwen-based prompt extension in 2.1/2.2).<\/p>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Model fills gaps itself; less control over pacing, sound, and camera<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>Start with a concise scene sentence, then add 2\u20133 temporal beats; keep camera motion explicit and sparse (<code>slow push in<\/code>, <code>track left<\/code>, <code>hold<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Max token count not publicly specified \u2014 leave blank<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<h3>Wan version quick comparison<\/h3>\n<table>\n<thead>\n<tr>\n<th>Model Version<\/th>\n<th>Target Prompt Length<\/th>\n<th>Key Sequence Control<\/th>\n<th>Preferred Camera Jargon<\/th>\n<th>Distinction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Wan 2.1<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single-beat focus; transition words (<code>Initially... -&gt; Then...<\/code>)<\/td>\n<td><code>dolly in/out<\/code>, <code>push-in<\/code>, <code>tracking shot<\/code><\/td>\n<td>Open foundation; concise single shots<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.2<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single 5s motion arc<\/td>\n<td><code>dolly zoom<\/code>, <code>tilt up/down<\/code>, 360-degree <code>camera roll<\/code><\/td>\n<td>MoE architecture; high/low-noise LoRAs<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.5<\/strong><\/td>\n<td>Medium length<\/td>\n<td>One committed move per 5s clip<\/td>\n<td><code>panoramic drone push<\/code>, <code>tracking shot<\/code><\/td>\n<td>Flash tier; strong atmospheric layering<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.6<\/strong><\/td>\n<td>Up to 800 chars<\/td>\n<td>Timing brackets (<code>Shot 1 [0-4s]: ...<\/code>)<\/td>\n<td><code>push<\/code>, <code>pull<\/code>, <code>orbit<\/code>, <code>FPV drone<\/code><\/td>\n<td>Multi-shot cuts; R2V (<code>@Video1<\/code>); native audio<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.7<\/strong><\/td>\n<td>6-part shot list<\/td>\n<td>Thinking-Mode reasoning directives<\/td>\n<td><code>dolly in<\/code>, <code>tracking shot<\/code>, <code>slow push<\/code><\/td>\n<td>Pre-render reasoning; FLF2V 5s control<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 3.0<\/strong><\/td>\n<td>30s narrative arc<\/td>\n<td>SPACE framework (continuous take)<\/td>\n<td>One single sustained camera move<\/td>\n<td>Native 30s takes; Omni-Reference (20 assets)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Source: user's Wan prompting reference (Oct 2026).<\/em><\/p>\n<p>Documented Wan 2.5 formula (Alibaba guidance):<\/p>\n<pre><code>Subject + Scene + Motion + Sound Description\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject<\/td>\n<td>Main character/object with key attributes<\/td>\n<td>\"A man speaking calmly about insomnia\"<\/td>\n<\/tr>\n<tr>\n<td>Scene<\/td>\n<td>Environment and context<\/td>\n<td>\"in a dimly lit study at night\"<\/td>\n<\/tr>\n<tr>\n<td>Motion<\/td>\n<td>What moves and how, in temporal beats<\/td>\n<td>\"he leans back in his chair; rain streaks the window\"<\/td>\n<\/tr>\n<tr>\n<td>Sound Description<\/td>\n<td>Voice (tone, emotion, accent, pacing), sound effects (object + action + ambience), background music (genre, mood)<\/td>\n<td>\"His voice is bright and clear, moderate pace, American English. Soft ambient rain and gentle piano music play in the background.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Documented sound example:<\/p>\n<pre><code>A man speaks calmly about insomnia, saying &quot;love is not getting but giving.&quot; His voice is bright and clear, moderate pace, American English. Soft ambient rain and gentle piano music play in the background.\n<\/code><\/pre>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Concise scene sentence first<\/td>\n<td>\"A robot chef stirs a glowing soup in a futuristic pantry\"<\/td>\n<\/tr>\n<tr>\n<td>2\u20133 temporal beats<\/td>\n<td>Sequential actions within the shot<\/td>\n<\/tr>\n<tr>\n<td>Explicit but sparse camera motion<\/td>\n<td><code>slow push in<\/code>, <code>track left<\/code>, <code>hold<\/code> \u2014 strong consistency from minimal moves<\/td>\n<\/tr>\n<tr>\n<td>Sound slot components<\/td>\n<td>Voice: tone, emotion, accent, pacing; SFX: object + action + ambience; music: genre, mood<\/td>\n<\/tr>\n<tr>\n<td>Emotional anchors for faces<\/td>\n<td>\"focus on soft eyes\", \"small confident smile\", \"eyes track the door\"<\/td>\n<\/tr>\n<tr>\n<td>Atmospheric cues as motion direction<\/td>\n<td>\"mist drifting\", \"light shifting through trees\", \"leaves falling, water reflecting\"<\/td>\n<\/tr>\n<tr>\n<td>Single language per prompt<\/td>\n<td>Chinese or English \u2014 the model was trained on a bilingual Chinese-English corpus with separate semantic pathways; mixing languages degrades compliance<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tag soup: \"rainy city street, jazz soundtrack, cinematic\"<\/td>\n<td>Sentence + audio: \"Rain falls on an empty neon-lit city street at night... Soft jazz piano plays in the background...\"<\/td>\n<\/tr>\n<tr>\n<td>Mixing Chinese and English in one prompt<\/td>\n<td>One language per prompt<\/td>\n<\/tr>\n<tr>\n<td>Conflicting camera movement in I2V<\/td>\n<td>Motion that inherits the source composition; explicit but sparse moves<\/td>\n<\/tr>\n<tr>\n<td>Overstuffing sound and visual demands into one short prompt<\/td>\n<td>Prioritize: scene sentence first, then 2\u20133 temporal beats, then sound<\/td>\n<\/tr>\n<tr>\n<td>Silence where audio should be (when generating with audio)<\/td>\n<td>Always fill the sound slot \u2014 voice, SFX, music \u2014 since 2.5 syncs them<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>(not publicly specified \u2014 blank)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>(not publicly specified \u2014 blank)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>480p / 720p / 1080p<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>(not publicly specified \u2014 blank)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>(not publicly specified \u2014 blank)<\/td>\n<\/tr>\n<tr>\n<td><strong>Duration<\/strong><\/td>\n<td>5s or 10s<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>Prompt carries the full scene <strong>plus the soundtrack<\/strong>: Subject + Scene + Motion + Sound Description. Even simple prompts yield strong results (\"rainy city street, jazz soundtrack\" produced an indie-film-looking clip in testing), but the documented formula gives control: visual detail first, then voice/SFX/music. The <code>enable_prompt_expansion<\/code> flag can enrich short prompts automatically. Audio generation roughly doubles per-second cost on hosted endpoints (~$0.05/s video-only vs ~$0.10/s with audio \u2014 third-party pricing, labeled).<\/p>\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>Fast-iteration T2V + LoRA template:<\/strong><\/p>\n<pre><code>[LoRA Trigger Word], [Subject &amp; Action], [Atmospheric Layers], [Single Camera Move], [Aspect Ratio Goal]\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>fantasy_art_style, a lone knight riding a black horse through a misty meadow, golden sunlight breaking through morning fog, panoramic drone shot pushes slowly forward, 16:9 cinematic framing.<\/code><\/p>\n<\/blockquote>\n<p><strong>Tips:<\/strong> Medium-length prompts. Commit to ONE single camera move per 5-second clip \u2014 combining moves degrades the output. Lean on atmospheric language (<code>mist drifting<\/code>, <code>light shifting through trees<\/code>, <code>leaves falling<\/code>, <code>water reflecting<\/code>) as motion drivers; Wan 2.5 interprets it unusually well.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>The source image defines subject and style; the prompt focuses on <strong>motion, camera, and audio direction<\/strong>. Documented guidance: for I2V, let motion inherit from the source composition and avoid conflicting movement directives. Same prompt language as the rest of the WAN family \u2014 atmospheric cues, named camera moves, time-of-day anchors \u2014 with the 2.5 addition of a sound slot (e.g. describe ambience or dialogue to accompany the animated frame).<\/p>\n<p><strong>Spicy variants:<\/strong> No research found documented uncensored or \"spicy\" finetunes of Wan 2.5 specifically. Community NSFW finetune activity documented so far centers on the Wan 2.2 Remix line, not 2.5. Nothing to report here \u2014 left explicit rather than invented.<\/p>\n<hr />\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>I2V Flash template:<\/strong><\/p>\n<pre><code>[Atmospheric Layer 1] + [Lighting Shift Layer 2] + [Subject/Camera Motion Layer 3] + [Single Camera Move Commit]\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>Misty Yunnan rice terrace at sunrise, golden light catching the water reflections, a single farmer walks along the paddy edge with a buffalo, panoramic drone shot pushes slowly forward.<\/code><\/p>\n<\/blockquote>\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V: Robot chef with sound<\/h3>\n<p><strong>Intended content:<\/strong> A robot chef stirring glowing soup in a futuristic pantry, with matching kitchen sounds.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>robot chef, soup, futuristic kitchen, cooking sounds, cinematic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A robot chef stirs a glowing soup in a futuristic pantry, lifting the ladle to let the luminous broth cascade back into the pot. Warm under-counter lights sweep slowly across steel surfaces as the camera holds a medium shot. Metallic clang and bubbling sounds fill the background with a soft ambient hum.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt names no action beats, no camera, and only vague \"cooking sounds\" \u2014 2.5's audio engine needs object + action + ambience (clang + bubbling + hum) to sync sound to visuals. The good prompt follows the documented formula: subject, scene, motion in beats, then a concrete sound description.<\/p>\n<h3>I2V: Animate a rainy street photo<\/h3>\n<p><strong>Intended content:<\/strong> Bring a still photo of a rainy neon street to life with sound.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Neon street at night in the rain, wet road, glowing signs, cars, people, cinematic, add jazz music\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Rain streaks down past the neon signs, ripples spreading across the wet road as the camera slowly pushes forward. Distant traffic hums beneath a soft jazz piano.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt re-describes the photo's contents (already in the image) and tacks \"jazz music\" on as a tag. The good prompt is motion + camera + sound only \u2014 what I2V needs \u2014 with the audio slot filled as ambience and music.<\/p>\n<h3>T2V: Dialogue scene<\/h3>\n<p><strong>Intended content:<\/strong> A man delivering a reflective line, with voice and ambience synced.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>man talking about love, emotional, indoor, cinematic, voiceover\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A man sits in a dimly lit study, speaking calmly about insomnia, saying &quot;love is not getting but giving.&quot; His voice is bright and clear, moderate pace, American English. Soft ambient rain and gentle piano music play in the background.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> \"Man talking about love\" gives no voice character and no syncable audio. The documented-style good prompt specifies voice tone, emotion, accent, pacing, plus ambience and music \u2014 the four sub-slots of the 2.5 sound description \u2014 so dialogue and lip movement can align.<\/p>\n<h3>T2V: Mixed-language prompt<\/h3>\n<p><strong>Intended content:<\/strong> A Miao girl in a mountain village, lanterns swaying.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>\u7a7f\u7740\u4f20\u7edf\u670d\u9970\u7684 Miao girl \u7ad9\u5728 mountain village \u91cc\uff0clanterns sway in the wind, \u7535\u5f71\u611f\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A black-haired Miao girl wearing traditional clothing stands in a misty mountain village. The camera slowly dollies in as lanterns sway in the wind. Soft rim lighting, cinematic color grading, 35mm lens, gentle motion blur.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Wan 2.5 maintains separate semantic pathways per language \u2014 mixed-language prompts degrade compliance. The good prompt is all-English, subject-first, with named motion and explicit camera work.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>T2V with audio<\/h3>\n<pre><code>A man speaks calmly about insomnia, saying &quot;love is not getting but giving.&quot; His voice is bright and clear, moderate pace, American English. Soft ambient rain and gentle piano music play in the background.\n<\/code><\/pre>\n<h3>Fast I2V turnaround<\/h3>\n<pre><code>Mist drifting over a lake at dawn, light shifting through the trees, subtle camera pan right, distant birdsong and water lapping.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Leaving the sound slot empty<\/strong> \u2014 2.5's headline feature is synced audio; a prompt with no voice/SFX/music description wastes it.<\/li>\n<li><strong>Mixing languages in one prompt<\/strong> \u2014 keep Chinese or English throughout for best compliance.<\/li>\n<li><strong>Prompting I2V like T2V<\/strong> \u2014 re-describing the image instead of giving motion, camera, and audio direction.<\/li>\n<li><strong>Vague audio tags<\/strong> (\"jazz soundtrack\", \"cooking sounds\") \u2014 specify voice tone/pace, SFX object + action + ambience, music genre + mood.<\/li>\n<li><strong>Overcomplicated single prompts<\/strong> \u2014 scene sentence first, then 2\u20133 temporal beats; don't cram multi-scene narratives into one clip.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Wan 2.5 / wan-25-preview (T2V and I2V endpoints via Alibaba Cloud Model Studio / DashScope; fal-ai/wan-25-preview)<\/li>\n<li><strong>Text Encoder:<\/strong> Not publicly specified (multilingual; bilingual Chinese/English training corpus confirmed by third parties)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> Not publicly specified<\/li>\n<li><strong>Training Data / Notes:<\/strong> Native audio generation (voice, SFX, music) in one pass; up to 10s 1080p at 24fps; <code>enable_prompt_expansion<\/code> prompt optimizer on API; reported open-weight (Apache 2.0) by third parties; multilingual prompting (Chinese/English) with separate semantic pathways<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://bluelightningtv.com/2025/09/26/alibaba-unveils-wan-2-5-preview-native-multimodality-for-synchronized-text-image-video-and-audio/ (Wan 2.5-Preview launch: 10s 1080p, native audio, director-style control)<\/li>\n<li>https://medium.com/@mvpkenlin/mastering-ai-video-generation-with-alibaba-cloud-model-studio-a-practical-guide-to-wan-prompt-d7c8c22d1a0e (Subject + Scene + Motion + Sound Description formula; documented sound example)<\/li>\n<li>https://web.archive.org/web/20250924034839/<a href=\"https://wavespeed.ai/models/alibaba/wan-2.5/image-to-video\" target=\"_blank\" rel=\"noopener\">https://wavespeed.ai/models/alibaba/wan-2.5/image-to-video<\/a> (WaveSpeed Wan 2.5 I2V docs: resolutions, prompt, negative_prompt, enable_prompt_expansion)<\/li>\n<li>https://mixhubai.com/blog/what-is-wan-2-5-alibabas-game-changing-audio-visual-synced-ai-video-model-explained- (prompt formula; Subject + Scene + Motion + Sound Description)<\/li>\n<li>https://github.com/buildoak/fieldwork-skills/blob/HEAD/skills/video-gen/references/model-wan.md (Wan 2.5/2.6: T2V/I2V modes, native audio flag, one-language rule, sparse camera motion, emotional anchors, pricing)<\/li>\n<li>https://pixeldojo.ai/guides/wan-2-5-prompting-guide (Wan 2.5 I2V flash guide: same prompt language as the family, atmospheric cues as motion)<\/li>\n<li>https://veemo.ai/wan-2.5 (FAQ: open-source Apache 2.0, bilingual training, cost-effectiveness, Wan 2.6 context confirming 2.5 as released)<\/li>\n<\/ul>", "pairs": 4, "file": "models/video/wan-2.5.md"}, "video/wan/3": {"title": "Prompt Guide: Wan 2.6", "html": "\n<p><strong>Model:<\/strong> Wan 2.6 (wan2.6-t2v, wan2.6-i2v, wan2.6-r2v, wan2.6-i2v-flash)\n<strong>Developer:<\/strong> Alibaba (Tongyi Lab)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong><\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Wan 2.6 is the December 2025 generation of Alibaba's Wan video family, released as a commercial, API-served model. It ships three video modes \u2014 text-to-video, image-to-video, and the series' first reference-to-video model (R2V, which carries a subject's appearance <em>and<\/em> voice from a reference clip) \u2014 plus a fast <code>i2v-flash<\/code> variant for drafts. Its headline additions over the previous generation are intelligent multi-shot storytelling (several timed shots inside one generation), audio-guided generation (supply an audio file to drive the clip, including lip-sync for dialogue), and longer clips up to 15 seconds. A faster \"Prime\" tier exists on some providers.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Each of the three modes wants a differently shaped prompt \u2014 getting the shape wrong is the most common reason a clip comes back generic. Text-to-video takes a global style line followed by timing-bracketed shots; image-to-video should describe only what changes over time (the image already supplies the look); reference-to-video tags subjects as <code>@Video1<\/code> / <code>@Video2<\/code> / <code>@Video3<\/code>.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>a cool video of a city at night, camera moving, cinematic\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A cinematic night in a rain-soaked neon city. Photoreal, film grain.\n\nShot 1 [0-3s] Wide aerial of wet streets reflecting neon signs.\nShot 2 [3-7s] Camera descends to street level, tracking a lone figure with an umbrella.\nShot 3 [7-10s] Close-up of raindrops on neon glass, reflections rippling.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support; use word order and repetition of key details across shots instead<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td><code>negative_prompt<\/code> parameter, max 500 characters; prioritize visible artifacts<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Supported<\/td>\n<td><code>@Video1<\/code>, <code>@Video2<\/code>, <code>@Video3<\/code> tag reference clips in R2V mode<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>A vague prompt gets rewritten by prompt expansion anyway \u2014 you keep less control, and the clip tends toward generic \"AI video\" looks<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>A global style line plus 2\u20134 timing-bracketed shots, comfortably inside the 800-character budget<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Main prompt is capped at 800 characters; excess is cut, so spend words on camera action and motion first<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<h3>Wan version quick comparison<\/h3>\n<table>\n<thead>\n<tr>\n<th>Model Version<\/th>\n<th>Target Prompt Length<\/th>\n<th>Key Sequence Control<\/th>\n<th>Preferred Camera Jargon<\/th>\n<th>Distinction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Wan 2.1<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single-beat focus; transition words (<code>Initially... -&gt; Then...<\/code>)<\/td>\n<td><code>dolly in/out<\/code>, <code>push-in<\/code>, <code>tracking shot<\/code><\/td>\n<td>Open foundation; concise single shots<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.2<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single 5s motion arc<\/td>\n<td><code>dolly zoom<\/code>, <code>tilt up/down<\/code>, 360-degree <code>camera roll<\/code><\/td>\n<td>MoE architecture; high/low-noise LoRAs<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.5<\/strong><\/td>\n<td>Medium length<\/td>\n<td>One committed move per 5s clip<\/td>\n<td><code>panoramic drone push<\/code>, <code>tracking shot<\/code><\/td>\n<td>Flash tier; strong atmospheric layering<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.6<\/strong><\/td>\n<td>Up to 800 chars<\/td>\n<td>Timing brackets (<code>Shot 1 [0-4s]: ...<\/code>)<\/td>\n<td><code>push<\/code>, <code>pull<\/code>, <code>orbit<\/code>, <code>FPV drone<\/code><\/td>\n<td>Multi-shot cuts; R2V (<code>@Video1<\/code>); native audio<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.7<\/strong><\/td>\n<td>6-part shot list<\/td>\n<td>Thinking-Mode reasoning directives<\/td>\n<td><code>dolly in<\/code>, <code>tracking shot<\/code>, <code>slow push<\/code><\/td>\n<td>Pre-render reasoning; FLF2V 5s control<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 3.0<\/strong><\/td>\n<td>30s narrative arc<\/td>\n<td>SPACE framework (continuous take)<\/td>\n<td>One single sustained camera move<\/td>\n<td>Native 30s takes; Omni-Reference (20 assets)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Source: user's Wan prompting reference (Oct 2026).<\/em><\/p>\n<pre><code>[Global style line] + [Shot 1 [start-end] camera action + scene elements] + [Shot 2 ...]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Global style line<\/td>\n<td>One line locking look, lighting, quality<\/td>\n<td><code>A cinematic journey through ancient ruins at sunset. Photoreal, 4K, film grain.<\/code><\/td>\n<\/tr>\n<tr>\n<td>Timing bracket<\/td>\n<td>Which seconds this shot occupies<\/td>\n<td><code>[0-3s]<\/code>, <code>[3-7s]<\/code>, <code>[7-10s]<\/code><\/td>\n<\/tr>\n<tr>\n<td>Camera action<\/td>\n<td>Named camera movement<\/td>\n<td>push, pull, pan, orbit, track<\/td>\n<\/tr>\n<tr>\n<td>Scene elements<\/td>\n<td>Subject position, lighting change, environmental detail<\/td>\n<td><code>Close-up of ancient inscriptions as dust particles float in light beams<\/code><\/td>\n<\/tr>\n<tr>\n<td>Continuity anchor<\/td>\n<td>Repeat the same characters, locations, objects across shots<\/td>\n<td>Same coat, same street, same lighting palette<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Timing brackets per shot<\/td>\n<td><code>Shot 1 [0-3s]<\/code>, <code>Shot 2 [3-7s]<\/code><\/td>\n<\/tr>\n<tr>\n<td>Explicit camera movement<\/td>\n<td><code>camera tracks forward<\/code>, <code>slow push-in<\/code>, <code>gentle orbit<\/code>, <code>pull back to reveal<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting changes over time<\/td>\n<td><code>light changes from morning to golden hour<\/code>, <code>neon flickers on<\/code><\/td>\n<\/tr>\n<tr>\n<td>Environmental animation<\/td>\n<td><code>clouds drift<\/code>, <code>rain ripples in puddles<\/code>, <code>dust floats in light beams<\/code>, <code>fabric moves in breeze<\/code><\/td>\n<\/tr>\n<tr>\n<td>Dialogue speaker cues (with audio input)<\/td>\n<td><code>she says \"...\"<\/code>, <code>a deep narrator voice<\/code> \u2014 guides lip-sync when supplying audio<\/td>\n<\/tr>\n<tr>\n<td>Quality descriptors in the style line<\/td>\n<td><code>photoreal<\/code>, <code>cinematic<\/code>, <code>4K<\/code>, <code>film grain<\/code><\/td>\n<\/tr>\n<tr>\n<td>Motion intensity wording<\/td>\n<td>Minimal: <code>subtle camera drift<\/code>, <code>gentle movement<\/code> \u00b7 Moderate: <code>smooth camera track<\/code>, <code>flowing motion<\/code> \u00b7 Dramatic: <code>dynamic sweeping motion<\/code>, <code>rapid camera movement<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Re-describing the input image in I2V (<code>a mountain with snow and a lake...<\/code>)<\/td>\n<td>Describe only the change: <code>gentle camera push toward the peak as clouds drift overhead<\/code><\/td>\n<\/tr>\n<tr>\n<td>Stacking several camera moves in one shot (<code>orbit while zooming and panning<\/code>)<\/td>\n<td>One camera action per shot: <code>slow push-in<\/code><\/td>\n<\/tr>\n<tr>\n<td>Unrelated shots with new characters each time<\/td>\n<td>Repeat the same characters, locations, and objects across every shot<\/td>\n<\/tr>\n<tr>\n<td>Framing that ignores the aspect ratio<\/td>\n<td>Wide establishing shots and horizontal movement for 16:9; tighter framing and vertical composition for 9:16; centered subjects for 1:1<\/td>\n<\/tr>\n<tr>\n<td>A one-line vague prompt relying on expansion<\/td>\n<td>A style line plus shot-by-shot beats you control<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>720p or 1080p (T2V); 480p / 720p / 1080p (I2V)<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Additional parameters (API): <code>duration<\/code> 5/10/15s (T2V, I2V); 5/10s only (R2V); <code>negative_prompt<\/code> max 500 chars; <code>audio_url<\/code> (WAV/MP3, 3\u201330s, max 15MB \u2014 longer audio is truncated, shorter leaves the rest silent); <code>enable_prompt_expansion<\/code> default on; <code>multi_shots<\/code> on by default in T2V, off by default in I2V. Aspect ratios: 16:9, 9:16, 1:1, 4:3, 3:4.<\/p>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt carries everything: a global style line (lighting, quality, aesthetic) followed by individual shot descriptions with timing brackets. <code>multi_shots<\/code> is on by default. Keep continuity by referencing the same characters, locations, and objects across shots \u2014 unrelated shots produce disjointed results. Prompt expansion runs over your text by default; it adds detail without consuming your 800-character budget, and it works best when you give it style references, visual descriptors, and precise terminology to expand from.<\/p>\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>Multi-shot T2V + LoRA template:<\/strong><\/p>\n<pre><code>Overall visual world: [Global aesthetic, lighting, palette, LoRA trigger word].\nConsistent character: [Explicit character wardrobe &amp; facial details].\n\nShot 1 [0-Xs]: [Shot type &amp; camera movement], [Action description], [Audio cues].\nShot 2 [Xs-Ys]: Cut. [Shot type &amp; camera movement], [Next action], [Audio cues].\nShot 3 [Ys-Zs]: Cut. [Shot type &amp; camera movement], [Final action], [Audio cues].\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>Overall visual world: Morning cafe interior, warm amber tones, film grain, sci_fi_cinematic_lora.<\/code> <code>Consistent character: Barista in his early 30s, dark apron over grey shirt, focused expression.<\/code>\n<code>Shot 1 [0-4s]: Wide shot of empty cafe at dawn, chairs upturned on tables, warm sunlight entering from left, barista walking through background, soft ambient room tone.<\/code> <code>Shot 2 [4-9s]: Medium shot, barista at espresso machine working deliberately, steam rising from portafilter, gentle hiss of steam.<\/code> <code>Shot 3 [9-14s]: Close-up overhead on espresso cup as golden crema extracts, shallow depth of field, clinking cup audio.<\/code><\/p>\n<\/blockquote>\n<p><strong>Tips:<\/strong> Structure hierarchically \u2014 a global visual-world header first, then shot blocks with timing brackets. Restate continuity anchors (wardrobe, facial features) inside every shot block to prevent identity drift. Use in-pass audio prompts (<code>low rain bed, no music<\/code>) for synchronized dialogue, ambience, or music beds.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>Describe the temporal change, not the image. The model already has the frame \u2014 words spent re-describing it are words not spent on motion. Spend the prompt on camera motion, lighting shifts, and environmental animation (water, clouds, foliage, smoke). <code>multi_shots<\/code> is off by default here; set it true to use the bracketed shot format. Images animate best when high resolution, with clear depth of field, atmospheric elements, an uncluttered composition, and a well-defined subject (input images: 360\u20132000px per side, up to 100MB).<\/p>\n<hr />\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>Reference-to-Video (R2V) template:<\/strong><\/p>\n<pre><code>[Reference Tag Assignment, e.g. @Video1], [Character Role], in [New Setting/Environment], [Camera Action], [In-Pass Audio Direction]\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>@Video1 character - the presenter from the reference video - standing at a bright modern studio desk, explaining product features naturally to camera, warm confident tone, medium shot, soft background bokeh, 10 seconds.<\/code><\/p>\n<\/blockquote>\n<p><strong>Tip:<\/strong> Use <code>@Video1<\/code>, <code>@Video2<\/code> tags to lock character appearance and motion across clips.<\/p>\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V \u2014 Desert caravan at dawn<\/h3>\n<p><strong>Intended content:<\/strong> A camel caravan crossing dunes at sunrise, cinematic.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>a camel caravan in the desert at sunrise, cinematic, beautiful\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A cinematic desert crossing at sunrise. Photoreal, warm haze, film grain.\n\nShot 1 [0-4s] Wide aerial of a camel caravan crossing rippled dunes, long shadows stretching.\nShot 2 [4-9s] Camera tracks low beside the lead camel as dust glows in the backlight.\nShot 3 [9-15s] Slow pull-back revealing the caravan winding toward a distant oasis.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The good prompt gives the model a global style line plus three timed shots with named camera actions (aerial, track, pull-back) and evolving light; the bad one leaves every decision to the model, which defaults to a static, generic postcard shot.<\/p>\n<h3>T2V \u2014 Continuity across shots<\/h3>\n<p><strong>Intended content:<\/strong> A detective moving through a rainy city at night, consistent identity.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Shot 1 [0-5s] A detective in a neon city. Shot 2 [5-10s] A man walks into a bar. Shot 3 [10-15s] Close-up of someone finding a clue.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A rain-soaked noir city at night. Cinematic, wet reflections, muted neon palette.\n\nShot 1 [0-5s] Wide shot of a rain-soaked street; a detective in a dark trench coat crosses toward an old building.\nShot 2 [5-10s] Slow handheld follow as the detective in the dark trench coat enters the building and climbs the stairs.\nShot 3 [10-15s] Close-up of the detective's gloved hand lifting a clue under a narrow flashlight beam, rain streaking the window behind.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The good prompt repeats the same character (trench coat, gloves), location, and palette across every shot, which is what keeps identity stable. The bad prompt introduces loosely related fragments with new subjects, producing disjointed results.<\/p>\n<h3>I2V \u2014 Animating a mountain photo<\/h3>\n<p><strong>Intended content:<\/strong> A still photo of a mountain lake comes alive with drifting clouds and changing light.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A majestic snow-capped mountain with a clear blue lake in front, pine trees on the sides, dramatic sky with white clouds, photorealistic landscape photo\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Continue from first frame. Gentle camera push toward the mountain peak as clouds drift overhead. Light changes from morning to golden hour. Cinematic and serene movement.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The model already has the frame, so re-describing the mountain wastes the 800-character budget on content it can see. The good prompt spends every word on temporal change: camera push, drifting clouds, shifting light.<\/p>\n<h3>I2V \u2014 One camera move, not three<\/h3>\n<p><strong>Intended content:<\/strong> A portrait photo animated with a slow, elegant camera move.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>She smiles and waves. Camera orbits around her while zooming in and panning left, fast dynamic motion, dramatic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>She turns toward the camera and gives a small smile as her hair moves in a light breeze. The camera makes a slow push-in. Keep the background stable.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Stacking orbit + zoom + pan in one shot reads as conflicting instructions and produces warped, unnatural motion. One named camera behavior (slow push-in) plus subtle secondary motion (hair in breeze) yields smooth, believable movement.<\/p>\n<h3>R2V \u2014 Two subjects interacting<\/h3>\n<p><strong>Intended content:<\/strong> Two reference characters meet in a market square.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>@Video1 and @Video2 in a market. Cinematic.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>@Video1 walks through a sunlit market square toward @Video2, who waits beside a fruit stall; they greet each other with a handshake. Handheld camera follows @Video1. Warm afternoon light, shallow depth of field.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> With multiple references, the model needs the spatial relationship and the interaction stated explicitly \u2014 otherwise it places subjects from prompt context and the result won't match intent. The bad prompt also omits camera and lighting direction.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>T2V \u2014 Single-shot product moment<\/h3>\n<pre><code>A potter's hands centre a ball of grey clay on a spinning wheel in a sunlit studio, water glistening as the walls rise between their fingers. Slow push-in. Natural realistic motion, warm window light, shallow depth of field.\n<\/code><\/pre>\n<h3>I2V \u2014 Landscape with shifting light<\/h3>\n<pre><code>Continue from first frame. Slow zoom out revealing more of the valley as the river catches the light. Evening shadows lengthen across the hills. Calm, steady motion.\n<\/code><\/pre>\n<h3>R2V \u2014 Character placement<\/h3>\n<pre><code>Dance battle between @Video1 and @Video2 in an ancient colosseum. @Video3 watches from a throne above the arena. Dynamic camera movement, dramatic lighting.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li>Writing a vague one-liner and trusting prompt expansion to fix it \u2014 expansion helps, but a style line plus shot beats keeps you in control.<\/li>\n<li>Re-describing the input image in image-to-video \u2014 the prompt's job is motion, camera, and lighting change; anything else wastes the character budget.<\/li>\n<li>Multiple simultaneous camera moves in one shot \u2014 name one: push, pull, pan, orbit, or track.<\/li>\n<li>New characters or locations per shot \u2014 repeat the same descriptors across all shots to hold continuity.<\/li>\n<li>Putting critical elements late in a shot description \u2014 move the must-have details earlier; elements placed late are more likely to be ignored.<\/li>\n<li>Ignoring the chosen aspect ratio \u2014 write wide horizontal movement for 16:9 and tight vertical composition for 9:16.<\/li>\n<\/ol>\n<hr />\n<h2>Spicy / Uncensored Variants<\/h2>\n<p>No uncensored or \"spicy\" community finetunes of Wan 2.6 were found during research. The model is served as a closed commercial API (Alibaba Cloud Model Studio and third-party resellers such as fal, WaveSpeed, and Runware), so community LoRAs/finetunes do not circulate the way they do for open-weight models. Prompting for adult content on the official API is subject to the provider's content policy.<\/p>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Wan 2.6 (T2V / I2V / R2V / I2V-Flash variants)<\/li>\n<li><strong>Text Encoder:<\/strong><\/li>\n<li><strong>Max Prompt Tokens:<\/strong> 800 characters (main prompt); 500 characters (negative prompt)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Changes from Wan 2.5: new reference-to-video model (appearance + voice carried from a reference clip), intelligent multi-shot storytelling, audio-guided generation via <code>audio_url<\/code>, clip length extended to 15s, and multi/single camera shot types. License status could not be verified consistently \u2014 a December 2025 report describes the 2.6 series as a commercial release, while some later roundups list it as open-weight; treated as unverified.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://fal.ai/learn/devs/wan-2-6-prompt-guide-mastering-all-three-generation-modes (fal Wan 2.6 prompt guide)<\/li>\n<li>https://github.com/brndngln/nodetool/blob/HEAD/packages/system-skills/wan-2-6-prompting/SKILL.md (Wan 2.6 prompting skill, adapted from fal's guide)<\/li>\n<li>https://wan2.video/wan2.7 (Wan 2.6 vs 2.7 capability comparison)<\/li>\n<li>https://mid-east.info/alibaba-unveils-wan2-6-series-enabling-everyone-to-star-in-videos/ (Wan 2.6 launch details)<\/li>\n<li>https://runware.ai/docs/models/alibaba-wan2-6-flash.md (Wan 2.6 Flash prompting examples)<\/li>\n<li>https://github.com/seventailcat/skills/blob/HEAD/skills/wan-video/SKILL.md (Wan 2.6 model IDs and workflows)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/wan-2.6.md"}, "video/wan/4": {"title": "Prompt Guide: Wan 2.7", "html": "\n<p><strong>Model:<\/strong> Wan 2.7 (wan2.7-t2v, wan2.7-i2v, wan2.7-r2v, wan2.7-videoedit)\n<strong>Developer:<\/strong> Alibaba (Tongyi Lab)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong><\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Wan 2.7 is the April 2026 generation of Alibaba's Wan video family, framed as a \"director-level\" toolkit: four specialized models \u2014 text-to-video, image-to-video, reference-to-video, and a dedicated video-editing model \u2014 that unify text, image, video, and audio inputs. The headline shift from 2.6 is control: dozens of named camera movements expressed in natural language, shot plans written directly into the prompt, cross-video consistency for up to five characters (with per-subject reference voices), automatic lip-sync for rewritten dialogue, and an i2v endpoint that now covers first-frame, first/last-frame, and continuation in one place. Clips run 2\u201315 seconds at 720p or 1080p. A rolling alias (e.g. <code>wan2.7-t2v<\/code>) can move to newer provider snapshots; dated IDs (e.g. <code>wan2.7-t2v-2026-06-12<\/code>) pin a specific build.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>The prompt is a compact storyboard: Wan 2.7 interprets shot changes written directly into the prompt with time ranges, replacing the separate shot-control parameter that 2.6 used. Write natural language like a director \u2014 subject, action, camera, lighting, style \u2014 and keep the same identity descriptors repeated across every shot so characters hold together.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>a cat running, cinematic\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A cinematic close-up of a ginger cat sprinting through a neon-lit cyberpunk street at night. Camera tracks low beside the cat, neon reflections streaking in puddles. Restless energy, shallow depth of field, no text or logos.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support; use word order and repeated identity descriptors instead<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td>Max 500 characters; use for failure modes (deformed hands, flicker, unstable face, watermark), not to re-describe the scene<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Changed<\/td>\n<td>2.6's <code>@Video1<\/code> tags replaced by a typed media array; name references as <code>Image 1<\/code>, <code>Image 2<\/code>, <code>Video 1<\/code> in per-type order (per official Alibaba Cloud docs)<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Thin prompts lean on <code>prompt_extend<\/code> (on by default), which rewrites them \u2014 convenient for ideas, risky once you are art directing; disable it when wording must be honored exactly<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>One rich paragraph for a single shot, or a timed shot plan (<code>Shot 1 [0\u20132s]...<\/code>) for multi-shot sequences; third-party API docs report a 5,000-character prompt limit for native T2V<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Extremely long prompts dilute the must-have beats; keep one dominant action per shot and put critical details early<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<h3>Wan version quick comparison<\/h3>\n<table>\n<thead>\n<tr>\n<th>Model Version<\/th>\n<th>Target Prompt Length<\/th>\n<th>Key Sequence Control<\/th>\n<th>Preferred Camera Jargon<\/th>\n<th>Distinction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Wan 2.1<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single-beat focus; transition words (<code>Initially... -&gt; Then...<\/code>)<\/td>\n<td><code>dolly in/out<\/code>, <code>push-in<\/code>, <code>tracking shot<\/code><\/td>\n<td>Open foundation; concise single shots<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.2<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single 5s motion arc<\/td>\n<td><code>dolly zoom<\/code>, <code>tilt up/down<\/code>, 360-degree <code>camera roll<\/code><\/td>\n<td>MoE architecture; high/low-noise LoRAs<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.5<\/strong><\/td>\n<td>Medium length<\/td>\n<td>One committed move per 5s clip<\/td>\n<td><code>panoramic drone push<\/code>, <code>tracking shot<\/code><\/td>\n<td>Flash tier; strong atmospheric layering<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.6<\/strong><\/td>\n<td>Up to 800 chars<\/td>\n<td>Timing brackets (<code>Shot 1 [0-4s]: ...<\/code>)<\/td>\n<td><code>push<\/code>, <code>pull<\/code>, <code>orbit<\/code>, <code>FPV drone<\/code><\/td>\n<td>Multi-shot cuts; R2V (<code>@Video1<\/code>); native audio<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.7<\/strong><\/td>\n<td>6-part shot list<\/td>\n<td>Thinking-Mode reasoning directives<\/td>\n<td><code>dolly in<\/code>, <code>tracking shot<\/code>, <code>slow push<\/code><\/td>\n<td>Pre-render reasoning; FLF2V 5s control<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 3.0<\/strong><\/td>\n<td>30s narrative arc<\/td>\n<td>SPACE framework (continuous take)<\/td>\n<td>One single sustained camera move<\/td>\n<td>Native 30s takes; Omni-Reference (20 assets)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Source: user's Wan prompting reference (Oct 2026).<\/em><\/p>\n<p>A practical video prompt defines what stays stable and what changes over time:<\/p>\n<pre><code>[Subject + action] + [environment] + [camera movement] + [lighting] + [visual style] + [timeline] + [audio direction] + [constraints]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject + action<\/td>\n<td>Who/what, doing what \u2014 concrete verbs<\/td>\n<td><code>A red vintage roadster drives along a wet coastal highway<\/code><\/td>\n<\/tr>\n<tr>\n<td>Environment<\/td>\n<td>Setting and atmosphere<\/td>\n<td><code>at blue hour, ocean cliffs beyond<\/code><\/td>\n<\/tr>\n<tr>\n<td>Camera movement<\/td>\n<td>One named move (dozens supported)<\/td>\n<td><code>camera tracks low beside the front wheel, then rises smoothly<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>Light quality and consistency cues<\/td>\n<td><code>warm light gradually increases<\/code>, <code>consistent lighting across shots<\/code><\/td>\n<\/tr>\n<tr>\n<td>Visual style<\/td>\n<td>Look and quality descriptors<\/td>\n<td><code>cinematic 35mm look<\/code>, <code>realistic reflections, restrained motion blur<\/code><\/td>\n<\/tr>\n<tr>\n<td>Timeline<\/td>\n<td>Shot plan with time ranges for multi-shot<\/td>\n<td><code>Shot 1 [0\u20132s]: ... Shot 2 [2\u20134s]: ...<\/code><\/td>\n<\/tr>\n<tr>\n<td>Audio direction<\/td>\n<td>Dialogue quotes, speaker, voice, ambience<\/td>\n<td><code>she says \"...\"<\/code>, <code>ambient rain, no music<\/code><\/td>\n<\/tr>\n<tr>\n<td>Constraints<\/td>\n<td>What to suppress<\/td>\n<td><code>no text or logos<\/code>, <code>no captions<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>For i2v the community-tested formula is: main action + progression + one camera instruction + subtle ambient motion + optional continuity guard.<\/p>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Timed shot plan for multi-shot<\/td>\n<td><code>Shot 1 [0\u20132s]: ... Shot 2 [2\u20134s]: ... Shot 3 [4\u20135s]: ...<\/code><\/td>\n<\/tr>\n<tr>\n<td>One explicit camera behavior per shot<\/td>\n<td><code>locked camera<\/code>, <code>slow push-in<\/code>, <code>pullback<\/code>, <code>pan<\/code>, <code>tilt<\/code>, <code>tracking shot<\/code>, <code>gentle orbit<\/code>, <code>FPV drone dive<\/code>, <code>360-degree orbital<\/code><\/td>\n<\/tr>\n<tr>\n<td>Repeated identity anchors<\/td>\n<td>Same coat, face, and lighting palette restated in every shot; per-subject <code>reference_voice<\/code> in R2V<\/td>\n<\/tr>\n<tr>\n<td>Dialogue as quoted speech with speaker<\/td>\n<td><code>\"Why is no one coming to play with me?\"<\/code> \u2014 lip-sync follows automatically<\/td>\n<\/tr>\n<tr>\n<td>Ordered action beats (i2v)<\/td>\n<td><code>she laughs, glances away, then looks back to camera<\/code> \u2014 one progression, not competing actions<\/td>\n<\/tr>\n<tr>\n<td>Continuity guard only where needed (i2v)<\/td>\n<td><code>Keep her face unchanged<\/code>, <code>no new objects<\/code>, <code>keep the background stable<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting consistency cues<\/td>\n<td><code>maintain perfect lighting consistency<\/code>, <code>context-aware lighting<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2.6-style <code>@Video1<\/code> tags in 2.7 prompts<\/td>\n<td><code>Image 1<\/code>, <code>Video 1<\/code> \u2014 the typed media array naming<\/td>\n<\/tr>\n<tr>\n<td>Re-describing the whole input image in i2v<\/td>\n<td>Motion, timing, and camera direction only<\/td>\n<\/tr>\n<tr>\n<td>Several simultaneous camera moves (<code>orbit while zooming and panning<\/code>)<\/td>\n<td>One camera behavior per shot<\/td>\n<\/tr>\n<tr>\n<td>Cramming 10\u201315 seconds with unrelated actions<\/td>\n<td>One continuous shot per generation; longer clips extend the same action<\/td>\n<\/tr>\n<tr>\n<td>Long choreographed multi-scene sequences<\/td>\n<td>One dominant verb per clip; rapid scene changes are unreliable<\/td>\n<\/tr>\n<tr>\n<td>Relying on the prompt to fix a bad source image<\/td>\n<td>Choose a clean frame first \u2014 a motion prompt cannot repair anatomy, pose, or missing detail<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>720P or 1080P<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Additional parameters (API): <code>duration<\/code> 2\u201315s (default 5); aspect ratios 16:9, 9:16, 1:1, 4:3, 3:4; <code>prompt_extend<\/code> default true; <code>watermark<\/code> default false; <code>negative_prompt<\/code> max 500 chars; audio input WAV/MP3, 2\u201330s, up to 15MB; R2V audio is always on. Invocation is asynchronous.<\/p>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt carries the entire production brief: full scene, cast, camera, lighting, style, and audio. For multi-shot clips, write the shot plan directly into the prompt with time ranges instead of relying on a shot-control field \u2014 <code>Shot 1 [0\u20132s]: a rain-soaked street... Shot 2 [2\u20134s]: the detective enters...<\/code> \u2014 and preserve the same wardrobe, face, and lighting palette across all shots. Alibaba's launch framing: a single prompt can yield a fully realized storyboard with paced transitions and complex camera moves.<\/p>\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>Narrative beat sequence (T2V + LoRA) template \u2014 6-part shot list:<\/strong><\/p>\n<pre><code>1. Subject &amp; Identity: [Concrete subject description + LoRA trigger].\n2. Setting: [Location, time of day, environment].\n3. Action &amp; Beats: [Beat 1] -&gt; [Beat 2] -&gt; [Beat 3].\n4. Camera Language: [Specific camera move over time].\n5. Lighting &amp; Mood: [Lighting setup &amp; emotional tone].\n6. Audio: [Ambient sound, voice, or music instructions].\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>Subject &amp; Identity: A woman in her late 20s with short dark hair, wearing a charcoal coat, lora_film_look.<\/code> <code>Setting: A dimly lit bookshop in late afternoon, winter sunlight streaming through windows.<\/code> <code>Action &amp; Beats: The shot opens as she enters from the right, scans the wooden shelves, stops at a hardcover book, and pulls it out to face the window.<\/code> <code>Camera Language: The camera tracks her slowly from a medium-wide shot, then dollies in to a tight medium shot as she pulls the book.<\/code> <code>Lighting &amp; Mood: Warm directional light, quiet contemplative atmosphere.<\/code> <code>Audio: Soft ambient room tone, muffled footsteps on wood, no music.<\/code><\/p>\n<\/blockquote>\n<p><strong>Tips:<\/strong> Thinking Mode runs a pre-render reasoning pass over narrative structure \u2014 use temporal markers (<code>The shot opens on...<\/code>, <code>halfway through the clip...<\/code>, <code>the final frame lands on...<\/code>). For instruction-based editing, specify one precise change and explicitly state what must remain untouched. In 9-grid reference mode, assign explicit priorities per reference image (e.g. center = character identity).<\/p>\n<h3>Image-to-Video<\/h3>\n<p>Let the image define the look; use the prompt for motion, timing, and camera direction. Community guidance for this mode distills to nine rules: don't re-describe the image; choose one dominant action with concrete verbs (turns, walks, lifts, smiles, reaches); put multi-step motion in order; pick one camera behavior; add only one or two subtle supporting motions (drifting hair, rain, smoke, reflections, changing light); add a continuity guard only if a detail keeps drifting; match the action to the clip length (one beat per 5 seconds; longer clips extend the same action, not new ones); start from a clean, unobstructed frame with room to move; and change one variable at a time when iterating. A motion prompt cannot repair poor anatomy or an awkward pose in the source image, and required readable text should already be in the starting frame (generated text is approximate).<\/p>\n<hr />\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>First-and-Last Frame (FLF2V, fixed 5s) template:<\/strong><\/p>\n<pre><code>[Starting State Description] + [Ending State Description] + [Transition Path &amp; Motion] + [Camera Behavior] + [Continuity Constraints]\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>The runner starts at the edge of a forest trail and ends on a rocky mountain overlook, shot depicts a smooth uphill climb between the two frames, camera tracks forward and tilts upward, lighting stays consistent from late-afternoon sun.<\/code><\/p>\n<\/blockquote>\n<p><strong>Tip:<\/strong> The two frames are fixed \u2014 describe the transition path between them; the motion between endpoints is the prompt's job.<\/p>\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V \u2014 Coastal drive at blue hour<\/h3>\n<p><strong>Intended content:<\/strong> A red vintage roadster driving along a coastal highway at blue hour, cinematic.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>a red car driving on a road near the ocean, cinematic, beautiful\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A red vintage roadster drives along a wet coastal highway at blue hour. The camera tracks low beside the front wheel, then rises smoothly to reveal ocean cliffs. Realistic reflections, restrained motion blur, cinematic 35mm look, no text or logos.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The good prompt names the subject, environment, a specific two-phase camera move, lighting quality, and constraints \u2014 the full brief the mode requires. The bad prompt leaves subject detail, camera, and mood unspecified, producing a generic clip.<\/p>\n<h3>T2V \u2014 Multi-shot detective sequence<\/h3>\n<p><strong>Intended content:<\/strong> A three-shot noir sequence with a consistent detective character.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A detective story in a rainy city. First he's outside in the rain, then he goes inside a building, then he finds a clue. Cinematic with neon lights.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Create a cinematic detective sequence with consistent character identity. Shot 1 [0\u20132s]: a rain-soaked city street at night, neon reflected in puddles. Shot 2 [2\u20134s]: the detective enters an old building; slow handheld follow shot. Shot 3 [4\u20135s]: close-up of a clue under a narrow flashlight beam. Preserve the same coat, face and lighting palette across all shots. No captions.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Wan 2.7 reads time ranges as a storyboard, so explicit <code>Shot N [x\u2013ys]<\/code> markers buy real shot control. Repeating the coat, face, and palette across shots is the cheapest defense against identity drift; the bad prompt's loose narration gets neither shot discipline nor consistency.<\/p>\n<h3>I2V \u2014 Portrait comes alive<\/h3>\n<p><strong>Intended content:<\/strong> Animate a portrait photo: the subject smiles and the camera pushes in.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A beautiful young woman with long dark hair wearing a red dress, standing in a garden with flowers, golden hour lighting, photorealistic portrait\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>She turns toward the camera and gives a small smile as her hair moves in a light breeze. The camera makes a slow push-in. Keep the background stable.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The model already has the image \u2014 re-describing her hair, dress, and the garden spends words on visible content. The good prompt follows the i2v formula: one dominant action (turns, smiles), one camera instruction (slow push-in), subtle ambient motion (hair in breeze), and a continuity guard.<\/p>\n<h3>I2V \u2014 Walking shot with one camera behavior<\/h3>\n<p><strong>Intended content:<\/strong> Subject walks toward the camera in a street scene.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>She walks forward. Camera orbits around her while zooming in, then pans across the street. Fast, dramatic, dynamic sweeping motion.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>She walks toward the camera at a steady pace, then glances over her shoulder with a small smile. Her hair and coat move naturally. The camera tracks backward and keeps her centered.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> One camera behavior per shot \u2014 the bad prompt stacks orbit, zoom, and pan, which reads as conflicting instructions and warps the motion. The good prompt pairs one readable action progression (walk, glance) with one move (track backward) and small secondary motion (hair, coat).<\/p>\n<h3>R2V \u2014 Reference naming (2.6 vs 2.7 syntax)<\/h3>\n<p><strong>Intended content:<\/strong> A reference character walks through a futuristic city.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>@Video1 walks through a futuristic cityscape as holographic displays activate around them. Cinematic lighting, shallow depth of field.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Image 1 walks through a futuristic cityscape as holographic displays activate around them. Cinematic lighting, shallow depth of field.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> On 2.7 the media schema changed: references arrive in a typed media array and are named <code>Image 1<\/code>, <code>Video 1<\/code> in per-type order (per official Alibaba Cloud docs). The <code>@Video1<\/code> tag is 2.6 syntax and no longer addresses the reference on 2.7 \u2014 same intended scene, but the good prompt uses the naming the model actually resolves.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>T2V \u2014 Single shot with dialogue<\/h3>\n<pre><code>A small neighborhood bakery before dawn. A baker slides a tray of loaves from the oven and turns to open the shutter as grey light comes through the window. She says &quot;Fresh out of the oven.&quot; Handheld camera drifts with her, never cutting. Warm practical lighting, cinematic.\n<\/code><\/pre>\n<h3>I2V \u2014 Small gesture<\/h3>\n<pre><code>She looks down, brushes loose hair behind one ear, then raises her eyes to the camera. A light breeze moves a few strands. The camera stays locked.\n<\/code><\/pre>\n<h3>I2V \u2014 Environmental animation<\/h3>\n<pre><code>Over five seconds, she leans slightly closer, keeps warm eye contact, and ends with a subtle smile. Gentle light shift across her face. Locked camera.\n<\/code><\/pre>\n<h3>R2V \u2014 Typed reference (official docs pattern)<\/h3>\n<pre><code>An overhead shot of a blue planet. The camera gradually zooms in to a close-up of Image 1 on the planet. He is holding Image 2 and eating it, while saying, &quot;Why is no one coming to play with me?&quot;\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li>Using 2.6's <code>@Video1<\/code> tagging on 2.7 \u2014 name references <code>Image 1<\/code>, <code>Video 1<\/code>, <code>Audio 1<\/code> in per-type order.<\/li>\n<li>Re-describing the input image in image-to-video \u2014 the prompt's job is action, progression, camera, and ambient motion.<\/li>\n<li>Stacking multiple camera moves in one shot \u2014 choose one: locked, push-in, pullback, pan, tilt, tracking, or orbit.<\/li>\n<li>One clip, five unrelated actions \u2014 treat each generation as one continuous shot; extend the same action for longer durations.<\/li>\n<li>Leaving <code>prompt_extend<\/code> on once the prompt is art-directed \u2014 the rewrite can quietly redirect a blocked-out shot; disable it when wording must be exact.<\/li>\n<li>Asking the motion prompt to fix the source image \u2014 bad anatomy, awkward poses, and missing detail must be fixed in the starting frame.<\/li>\n<\/ol>\n<hr />\n<h2>Spicy / Uncensored Variants<\/h2>\n<p>Yes \u2014 community \"spicy\" offerings exist for Wan 2.7. The clearest documented case is remix.camera's \"WAN Spicy Video\" product, which offers Wan 2.7 generation with a published \"WAN 2.7 Spicy Prompt Guide for Image-to-Video.\" Prompting differences versus the standard model: the guide's core discipline is identical to standard i2v (main action + progression + one camera instruction + subtle ambient motion + optional continuity guard), but mature themes are accepted, so the guidance is to describe wardrobe, framing, and action directly rather than hinting around them. Community uncensored LoRAs/finetunes for Wan 2.7 also circulate outside official channels; prompting them follows the same motion-first structure with direct, explicit description of the intended content.<\/p>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Wan 2.7 (t2v / i2v / r2v / videoedit variants)<\/li>\n<li><strong>Text Encoder:<\/strong><\/li>\n<li><strong>Max Prompt Tokens:<\/strong> 5,000 characters reported for native T2V (third-party API docs); 500 characters negative prompt<\/li>\n<li><strong>Training Data / Notes:<\/strong> Changes from Wan 2.6 (per capability comparison): i2v unified to first-frame / first-last-frame / continuation in one endpoint; media schema moved to a typed array with <code>Image N<\/code> / <code>Video N<\/code> references; resolution control is now tier + ratio rather than explicit sizes; shot control moved into the prompt as natural-language shot plans/timestamps; new dedicated video-editing model plus per-subject <code>reference_voice<\/code> (audio always on in 2.7 R2V). Cross-video consistency for up to five characters; 50+ emotional expressions; FPV drone dives and 360\u00b0 orbital shots supported.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://remix.camera/blog/wan-2-7-spicy-prompt-guide (WAN 2.7 Spicy Prompt Guide for Image-to-Video)<\/li>\n<li>https://medium.com/@olivia.hayes_21886/wan-2-7-api-capabilities-parameters-prompts-and-cometapi-access-a9bbace7bfb9 (Wan 2.7 API capabilities, parameters, prompt structure)<\/li>\n<li>https://help.aliyun.com/en/model-studio/video-to-video-guide (Alibaba Cloud: using the Wan reference-to-video model, typed media array, Image N naming)<\/li>\n<li>https://wan2.video/wan2.7 (Wan 2.6 vs 2.7 capability comparison)<\/li>\n<li>https://www.4rfv.co.uk/industrynews/329211/alibaba_launches_wan2_7_video (Wan2.7-Video launch, four models)<\/li>\n<li>https://github.com/openclaw/skills/blob/HEAD/skills/dlazyai/dlazy-wan2-7/SKILL.md (Wan 2.7 parameters: prompt_extend, duration, resolution)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/wan-2.7.md"}, "video/wan/5": {"title": "Prompt Guide: Wan 3.0", "html": "\n<p><strong>Model:<\/strong> Wan 3.0 (wan3.0-video, single unified endpoint)\n<strong>Developer:<\/strong> Alibaba (Tongyi Lab)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong><\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Wan 3.0, released August 24, 2026 (public beta from August 6) via Alibaba Cloud Model Studio, is the first Wan generation built as one unified model: a single endpoint covers text-to-video, image-to-video (first frame and first/last frame), reference-to-video, and video editing, with the mode inferred from whatever media you attach. It generates up to 30 seconds in a single pass at a fixed 30fps \u2014 double Wan 2.7's ceiling \u2014 at 480p, 720p, or 1080p, with a synchronized soundtrack generated in the same pass as the picture (native audio, on by default, free). It accepts unusually rich context: up to 10 reference images, 5 reference videos, 5 audio clips, and \u2014 upstream only \u2014 one public document (PDF/DOC/PPT up to 100MB, 50 pages) or one public webpage. Some providers offer a faster \"Prime\" tier. Alibaba's own caveat: audio texture and on-screen text rendering are \"improving but not yet where we want them.\"<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>The prompt is one input among many \u2014 Wan 3 decides the mode from the shape of your payload, not from a mode flag. So the prompt's job is to be a precise production brief of every visible beat and every sound: describe the action, the camera, the exact spoken words with their speaker, and the diegetic audio sources. For image-led work the frame sets the composition and the prompt invents only the motion.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>a bakery video with nice music, morning vibes\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A single continuous handheld take inside a small neighborhood bakery before dawn. A baker slides a tray of loaves from the oven, sets it on the steel bench, and turns to open the shutter as the first grey light comes through the window. The camera drifts with her, never cutting. Ambient room tone only: the scrape of the tray, the click of the oven door, the rattle of the shutter. No music.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support; assign reference roles and repeat key descriptors instead<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td><code>negative_prompt<\/code> parameter: what to keep out<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Supported (naming convention)<\/td>\n<td>Name loose references as <code>Image 1<\/code>, <code>Video 1<\/code>, <code>Audio 1<\/code> in per-type order and give each one explicit role in the prompt<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td><code>prompt_extend<\/code> (on by default) rewrites short prompts into richer ones \u2014 helpful for a five-word idea, harmful once you have blocked out the shot yourself<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>A complete production brief: visible beats, camera behavior, quoted dialogue with speaker, voice/ambience/effects description \u2014 long enough that expansion has nothing useful to add<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>No published character limit found; but overstuffed prompts with competing beats produce muddled 30-second takes \u2014 keep to one continuous shot's worth of action<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<h3>Wan version quick comparison<\/h3>\n<table>\n<thead>\n<tr>\n<th>Model Version<\/th>\n<th>Target Prompt Length<\/th>\n<th>Key Sequence Control<\/th>\n<th>Preferred Camera Jargon<\/th>\n<th>Distinction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Wan 2.1<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single-beat focus; transition words (<code>Initially... -&gt; Then...<\/code>)<\/td>\n<td><code>dolly in/out<\/code>, <code>push-in<\/code>, <code>tracking shot<\/code><\/td>\n<td>Open foundation; concise single
