<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Atlas &mdash; AI Image &amp; Video Prompt Guides</title>
<style>
:root{
  --bg:#0d1017; --panel:#141926; --panel2:#101622; --sidebar:#0a0d14;
  --text:#e8ebf4; --muted:#98a2b8; --faint:#6b7590;
  --border:#1f2635; --accent:#8b7cf6; --accent-dim:rgba(139,124,246,.14);
  --cyan:#38bdf8; --green:#34d399; --red:#f87171; --amber:#fbbf24;
  --code:#080b12; --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:#a99cff}
.app{display:flex;min-height:100vh}
/* sidebar */
#sidebar{width:300px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px 40px}
.brand{padding:2px 10px 14px}
.brand h1{font-size:20px;margin:0;letter-spacing:.2px}
.brand h1 .atlas{color:var(--accent)}
.brand p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
#navSearch{width:100%;margin:2px 0 6px;padding:9px 12px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:13.5px;outline:none}
#navSearch:focus{border-color:var(--accent)}
.nav-group-label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);padding:16px 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px}
.nav-item:hover{background:var(--panel)}
.nav-item.active{background:var(--accent-dim);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-image{background:var(--accent)} .dot-video{background:var(--cyan)} .dot-components{background:var(--amber)}
.nav-item .nav-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--faint);background:var(--panel);padding:1px 8px;border-radius:20px;flex-shrink:0}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:rgba(13,16,23,.95);position:sticky;top:0;z-index:40}
.topbar .brand-mini{font-weight:700;font-size:16px}
.topbar .brand-mini .atlas{color:var(--accent)}
#hamburger{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;
  font-size:18px;padding:6px 12px;cursor:pointer}
#tabbar{position:sticky;top:0;z-index:30;background:rgba(13,16,23,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:16px 32px 0}
.crumbs{font-size:12px;color:var(--faint);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.g-badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;font-weight:700;letter-spacing:.4px}
.g-image{background:rgba(139,124,246,.16);color:#b7a8ff}
.g-video{background:rgba(56,189,248,.14);color:#7dd3fc}
.g-components{background:rgba(251,191,36,.14);color:#fcd34d}
.model-title{font-size:23px;font-weight:700;margin:0 0 4px;letter-spacing:.2px}
.model-meta{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:14px}
.tab{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);
  font-size:13.5px;cursor:pointer;font-family:var(--font)}
.tab:hover{color:var(--text);border-color:var(--faint)}
.tab.active{background:var(--accent-dim);border-color:var(--accent);color:#fff;font-weight:600}
/* content */
#content{max-width:1000px;padding:30px 36px 90px;width:100%;margin:0 auto}
#content h1{font-size:27px;margin:2px 0 4px;letter-spacing:.2px}
#content h2{font-size:19px;margin:36px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
#content h3{font-size:16px;margin:26px 0 10px;color:#dfe4f0}
#content h4{font-size:14.5px;margin:20px 0 8px}
#content p{margin:10px 0}
#content ul,#content ol{margin:10px 0;padding-left:24px}
#content li{margin:5px 0}
#content li::marker{color:var(--faint)}
#content hr{border:none;border-top:1px solid var(--border);margin:28px 0}
#content blockquote{border-left:3px solid var(--accent);margin:14px 0;padding:8px 16px;background:var(--panel2);border-radius:0 8px 8px 0;color:var(--muted)}
#content strong{color:#fff}
.table-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:var(--radius)}
.table-wrap table{margin:0;border:none}
#content table{width:100%;border-collapse:collapse;font-size:13.5px;margin:14px 0}
#content th,#content td{border:1px solid var(--border);padding:8px 12px;text-align:left;vertical-align:top}
#content th{background:var(--panel);font-weight:600;white-space:nowrap}
#content tr:nth-child(even) td{background:rgba(255,255,255,.016)}
#content td code,#content th code,#content p code,#content li code{font-family:var(--mono);font-size:.86em;
  background:rgba(139,124,246,.13);padding:2px 7px;border-radius:5px;color:#d7ccff}
.code-wrap{position:relative;margin:14px 0}
.code-wrap pre{margin:0;background:var(--code);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.65;color:#dbe2f2}
.code-wrap pre code{background:none;padding:0;color:inherit}
.copy-btn{position:absolute;top:8px;right:8px;background:var(--panel);border:1px solid var(--border);color:var(--muted);
  border-radius:7px;font-size:12px;padding:5px 11px;cursor:pointer;font-family:var(--font)}
.copy-btn:hover{color:#fff;border-color:var(--accent)}
/* good vs bad pair cards */
.pair-card{border:1px solid var(--border);border-radius:var(--radius);margin:20px 0;overflow:hidden;background:var(--panel2)}
.pair-card>p{margin:0;padding:11px 18px}
.pair-card>p.pair-bad{background:rgba(248,113,113,.08);border-bottom:1px solid var(--border);font-weight:600}
.pair-card>p.pair-good{background:rgba(52,211,153,.08);border-bottom:1px solid var(--border);font-weight:600}
.pair-card .code-wrap{margin:0}
.pair-card .code-wrap pre{border:none;border-radius:0;border-bottom:1px solid var(--border)}
.pair-card>p.pair-why{font-size:13.5px;color:var(--muted);background:transparent}
.pair-card>p.pair-why strong{color:var(--text)}
/* principle callouts */
.callout-bad,.callout-good{border-radius:0 8px 8px 0;padding:10px 16px;margin:12px 0}
.callout-bad{border-left:3px solid var(--red);background:rgba(248,113,113,.06)}
.callout-good{border-left:3px solid var(--green);background:rgba(52,211,153,.06)}
/* home */
.hero{padding:26px 4px 8px}
.hero-kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);font-weight:600}
.hero h1{font-size:40px;margin:8px 0 10px;letter-spacing:.3px}
.hero h1 .atlas{color:var(--accent)}
.hero-sub{color:var(--muted);max-width:640px;font-size:15.5px}
.hero-stats{display:flex;gap:14px;margin:22px 0 8px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 22px;min-width:130px}
.stat-num{display:block;font-size:26px;font-weight:700;color:#fff}
.stat-label{font-size:12px;color:var(--muted)}
.home-h2{display:flex;align-items:center;gap:10px;font-size:17px;margin:34px 0 14px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.home-card{display:block;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}
.home-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.home-card-title{font-weight:700;font-size:15.5px;margin-bottom:8px}
.home-card-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:11.5px;background:var(--accent-dim);color:#c9bfff;padding:2px 9px;border-radius:20px}
.home-card-meta{font-size:12px;color:var(--faint)}
.howto{margin-top:40px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px}
.howto h2{margin-top:0;border:none;padding:0}
.fineprint{font-size:12.5px;color:var(--faint);margin-top:14px}
#content a{color:#a99cff;text-decoration:none}
#content a:hover{text-decoration:underline}
.src-note{font-size:12.5px;color:var(--faint);margin-top:26px;padding-top:14px;border-top:1px solid var(--border)}
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s ease;z-index:60;width:284px;box-shadow:0 0 40px rgba(0,0,0,.5)}
  body.nav-open #sidebar{transform:none}
  .topbar{display:flex}
  #tabbar{padding:14px 18px 0}
  #content{padding:22px 18px 70px}
  .hero h1{font-size:32px}
}
</style>
</head>

<a class="nav-item" data-model="video/veo" data-search="veo 2 3 3.1" href="#/video/veo/0"><span class="dot dot-video"></span><span class="nav-label">Veo</span><span class="count">3</span></a>

</div></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button id="hamburger" aria-label="Menu">&#9776;</button>
      <div class="brand-mini">Prompt <span class="atlas">Atlas</span></div>

<script>
const MANIFEST = {"groups": [{"id": "image", "label": "Image Models", "models": [{"id": "flux", "label": "FLUX", "tabs": [{"file": "models/image/flux.1-dev.md", "label": "1-dev"}, {"file": "models/image/flux.2-klein.md", "label": "2-Klein"}]}, {"id": "sdxl", "label": "SDXL", "tabs": [{"file": "models/image/sdxl.md", "label": "SDXL"}]}, {"id": "z-image", "label": "Z-Image", "tabs": [{"file": "models/image/z-image.md", "label": "Z-Image"}]}, {"id": "krea-2", "label": "Krea 2", "tabs": [{"file": "models/image/krea-2.md", "label": "Raw"}, {"file": "models/image/krea-2-turbo.md", "label": "Turbo"}]}, {"id": "qwen-image", "label": "Qwen-Image", "tabs": [{"file": "models/image/qwen-image-2.x.md", "label": "2.x"}, {"file": "models/image/qwen-image-3.x.md", "label": "3.x"}]}, {"id": "general-image", "label": "General Image Tips", "tabs": [{"file": "models/image/general-image-tips.md", "label": "Families & Universals"}]}]}, {"id": "video", "label": "Video Models", "models": [{"id": "wan", "label": "WAN", "tabs": [{"file": "models/video/wan-2.1.md", "label": "2.1"}, {"file": "models/video/wan-2.2.md", "label": "2.2"}, {"file": "models/video/wan-2.5.md", "label": "2.5"}, {"file": "models/video/wan-2.6.md", "label": "2.6"}, {"file": "models/video/wan-2.7.md", "label": "2.7"}, {"file": "models/video/wan-3.0.md", "label": "3.0"}]}, {"id": "seedance", "label": "Seedance", "tabs": [{"file": "models/video/seedance-2.0.md", "label": "2.0"}, {"file": "models/video/seedance-2.5.md", "label": "2.5"}]}, {"id": "ltx", "label": "LTX-Video", "tabs": [{"file": "models/video/ltx-2.3.md", "label": "2.3"}, {"file": "models/video/ltx-2.5.md", "label": "2.5"}]}, {"id": "kling", "label": "Kling", "tabs": [{"file": "models/video/kling-2.x.md", "label": "2.x"}, {"file": "models/video/kling-3.0.md", "label": "3.0"}]}, {"id": "veo", "label": "Veo", "tabs": [{"file": "models/video/veo-2.md", "label": "2"}, {"file": "models/video/veo-3.md", "label": "3"}, {"file": "models/video/veo-3.1.md", "label": "3.1"}]}]}, {"id": "components", "label": "Prompt Components", "models": [{"id": "image-components", "label": "Image Components", "tabs": [{"label": "Lighting", "file": "models/components/image-lighting.md"}, {"label": "Framing & Composition", "file": "models/components/image-framing-composition.md"}, {"label": "Camera Bodies", "file": "models/components/image-camera-bodies.md"}, {"label": "Lenses", "file": "models/components/image-lenses.md"}, {"label": "Aperture & Depth of Field", "file": "models/components/image-aperture-depth-of-field.md"}, {"label": "Style & Medium", "file": "models/components/image-style-medium.md"}, {"label": "Color & Mood", "file": "models/components/image-color-mood.md"}]}, {"id": "video-components", "label": "Video Components", "tabs": [{"label": "Camera Movements", "file": "models/components/video-camera-movements.md"}, {"label": "Shot Types & Framing", "file": "models/components/video-shot-types-framing.md"}, {"label": "Lighting", "file": "models/components/video-lighting.md"}, {"label": "Camera Bodies", "file": "models/components/video-camera-bodies.md"}, {"label": "Lenses", "file": "models/components/video-lenses.md"}, {"label": "Aperture & Depth of Field", "file": "models/components/video-aperture-depth-of-field.md"}, {"label": "Audio & Sound", "file": "models/components/video-audio.md"}]}]}], "subtitle": "Model-by-model prompting guides for AI image & video generation", "title": "Prompt Atlas"};
const GUIDES = {"image/flux/0": {"title": "Prompt Guide: FLUX.1-dev", "html": "\n<p><strong>Model:<\/strong> FLUX.1 [dev]\n<strong>Developer:<\/strong> Black Forest Labs (BFL)\n<strong>Type:<\/strong> Image\n<strong>Text Encoder:<\/strong> T5-XXL + CLIP-L (dual text encoders)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>FLUX.1 [dev] is a 12-billion-parameter rectified-flow transformer for text-to-image generation, released August 2024 as the open-weights member of the FLUX.1 family (pro / dev / schnell). It is guidance-distilled from the unreleased FLUX.1 base model, which makes it efficient (28\u201350 steps, single forward pass per step) and removes the unconditional branch that negative prompts rely on. It excels at photorealism, complex lighting, accurate spatial relationships, and legible short text in images. Unlike SDXL-era models, it understands paragraph-length natural-language descriptions through its 512-token T5-XXL encoder rather than comma-separated tag lists.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write in natural, descriptive language \u2014 full sentences and detailed prose \u2014 rather than SDXL-style keyword/tag soup. FLUX.1's T5-XXL encoder was trained on prose, so grammar, word order, and spatial relationships (who/what is where, doing what) matter. Early words carry more weight. Describe what you want, affirmatively \u2014 there is no negative prompt, so \"not X\" must be rephrased as the desired alternative.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>portrait, woman, 30yo, freckles, green eyes, red hair, blurry, bad hands, watermark, lowres, masterpiece, best quality, 8k, uhd\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A portrait of a woman in her thirties with shoulder-length red hair and freckles across her nose, bright green eyes looking into the camera with a slight smile. She wears a dark green turtleneck. Soft window light from the left, neutral studio background. Sharp focus on the face, natural skin texture, 85mm portrait lens.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>No<\/td>\n<td>Not natively supported by the FLUX.1 pipeline; weighting syntax is an SDXL-era convention. Some third-party UIs emulate it, but it is not part of the model's semantics.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>No<\/td>\n<td>Repeating words for \"fake emphasis\" is discouraged in FLUX prompting guidance; use more descriptive language instead.<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>No<\/td>\n<td>SDXL-era syntax; not applicable to FLUX.1's T5-based conditioning.<\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>No<\/td>\n<td>SDXL-era syntax; not applicable.<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>No<\/td>\n<td>FLUX.1 is guidance-distilled: the CFG behavior is baked into the weights, so there is no unconditional branch for a negative prompt to plug into. BFL documents this as an intended constraint \u2014 rewrite negatives as affirmative descriptions.<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Yes (community)<\/td>\n<td>Trigger words / LoRA trigger tokens work when a LoRA trained with one is loaded (e.g. <code>&lt;lora:...&gt;<\/code> naming conventions in ComfyUI); no model-native special tokens beyond the text encoders' standard vocab.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Partial<\/td>\n<td>Native inpainting/outpainting via FLUX.1 Fill [dev] with masks; masked/regional prompting is a feature of specific tools (e.g. FLUX.1 Fill), not the base dev model.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Underspecifies the scene; the model fills in defaults that may not match intent. Very terse prompts (a few words) yield generic, less controlled results.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>Paragraph-length descriptive prompts, roughly 50\u2013150 words, with subject, action, style, environment, lighting, and camera specs. BFL's recommended scaffold is <strong>Subject + Action + Style + Context<\/strong>; early tokens are weighted more heavily, so front-load the most important elements.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Prompts beyond the 512-token T5-XXL context get truncated; detail beyond the limit is silently ignored. Extremely long prompts can also bury key details and dilute attention.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<pre><code>[Subject] + [Action / Pose] + [Style / Medium] + [Environment / Context] + [Lighting] + [Camera / Lens] + [Quality / Finish]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject<\/td>\n<td>Who/what is depicted, with specific physical characteristics<\/td>\n<td>\"A woman in her thirties with shoulder-length red hair and freckles\"<\/td>\n<\/tr>\n<tr>\n<td>Action / Pose<\/td>\n<td>What the subject is doing, spatial relationships<\/td>\n<td>\"sitting at a caf\u00e9 table, leaning forward, holding a coffee cup with both hands\"<\/td>\n<\/tr>\n<tr>\n<td>Style / Medium<\/td>\n<td>Artistic medium or photographic treatment<\/td>\n<td>\"35mm film photograph\", \"oil painting\", \"cinematic still\"<\/td>\n<\/tr>\n<tr>\n<td>Environment / Context<\/td>\n<td>Setting, background, time, weather<\/td>\n<td>\"a Parisian caf\u00e9 terrace at dusk, rain-slicked street behind her\"<\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>Light source, quality, direction<\/td>\n<td>\"warm golden-hour sunlight from the right, soft rim light on her hair\"<\/td>\n<\/tr>\n<tr>\n<td>Camera / Lens<\/td>\n<td>Camera body, lens, aperture, shot type<\/td>\n<td>\"shot on Canon 5D Mark IV, 85mm portrait lens, f/1.8, shallow depth of field\"<\/td>\n<\/tr>\n<tr>\n<td>Quality / Finish<\/td>\n<td>Affirmative quality descriptors (not vague hype words)<\/td>\n<td>\"sharp focus on the eyes, natural skin texture, clean composition\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Affirmative descriptions (replaces negative prompts)<\/td>\n<td>\"anatomically correct hands\", \"clean un-watermarked composition\", \"sharp focus throughout\"<\/td>\n<\/tr>\n<tr>\n<td>Camera specifications (FLUX.1 responds exceptionally well)<\/td>\n<td>\"85mm portrait lens, f/1.4\", \"wide angle 24mm lens\", \"macro photography, 100mm lens\", \"shot on Canon 5D Mark IV\"<\/td>\n<\/tr>\n<tr>\n<td>Detailed lighting<\/td>\n<td>\"natural window light\", \"golden hour sunlight\", \"dramatic Rembrandt lighting\", \"soft diffused studio lighting\"<\/td>\n<\/tr>\n<tr>\n<td>Materials, textures, colors<\/td>\n<td>\"weathered oak table\", \"brushed stainless steel\", \"emerald green silk dress\"<\/td>\n<\/tr>\n<tr>\n<td>Spatial relationships in full sentences<\/td>\n<td>\"The cat sits on the left side of the couch. A lamp glows behind it.\"<\/td>\n<\/tr>\n<tr>\n<td>Exact text in quotes (for text in image)<\/td>\n<td>\"a neon sign that reads 'OPEN' above the door\"<\/td>\n<\/tr>\n<tr>\n<td>Subject, age, ethnicity, expression for people<\/td>\n<td>\"a man in his forties, weathered face, calm expression\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tag soup: <code>beach, woman, sunset, realistic, 8k<\/code><\/td>\n<td>\"A woman standing on a beach at sunset. Photorealistic, warm golden light on the water.\"<\/td>\n<\/tr>\n<tr>\n<td>Negative lists: <code>no blur, no watermark, no extra fingers<\/code><\/td>\n<td>\"sharp focus throughout, clean un-watermarked composition, anatomically correct hands\"<\/td>\n<\/tr>\n<tr>\n<td>Vague hype words: <code>masterpiece, best quality, ultra detailed<\/code><\/td>\n<td>Concrete descriptors: \"intricate fabric weave, individual strands of hair, fine skin texture\"<\/td>\n<\/tr>\n<tr>\n<td>Repeated words for fake emphasis: <code>red red red dress<\/code><\/td>\n<td>\"a vivid crimson dress\"<\/td>\n<\/tr>\n<tr>\n<td>Contradictory instructions: <code>sitting, standing, walking<\/code><\/td>\n<td>Pick one: \"standing\"<\/td>\n<\/tr>\n<tr>\n<td>Parenthesized weight syntax: <code>(word:1.4)<\/code><\/td>\n<td>More descriptive language for that element<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>28\u201350 (50 in the HF reference example; 20\u201330 is a common quality/speed trade-off)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>3.5 (default). Useful range roughly 2.5\u20134.5 for photorealism, 3.5\u20137 for stylized work. Note: this is a distilled guidance input, not true CFG \u2014 there is no negative prompt. Above ~6 risks over-saturation and distortion.<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>1024\u00d71024 default; any aspect ratio supported. Keep dimensions multiples of 16 for the VAE. 1 MP total is the reference; higher res benefits from upscaler workflows.<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>FlowMatch Euler (default in diffusers); Euler is the standard community choice in ComfyUI.<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>bfloat16 for the full model (~24 GB VRAM with T5-XXL). fp8 / quantized checkpoints (e.g. Kijai fp8, t5xxl_fp8_e4m3fn) run in ~16 GB VRAM.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Image<\/h3>\n<p>The prompt carries the entire scene: subject, action, environment, lighting, camera, and style. Paragraph-length natural-language descriptions work best; front-load the most important elements since early tokens carry more weight.<\/p>\n<h3>Image-to-Image<\/h3>\n<p>For img2img workflows (denoising an existing image), the prompt should describe the desired end state in the same descriptive style \u2014 the model uses the input image's composition and structure as a starting point, so the prompt's job is to steer content, style, lighting, and detail, not to restate every pixel. With FLUX.1 Fill [dev], the prompt describes what should appear in the masked region while the unmasked image stays fixed.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>Photorealistic portrait<\/h3>\n<p><strong>Intended content:<\/strong> A portrait photo of a freckled red-haired woman in a green turtleneck, soft window light.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>portrait, woman, freckles, red hair, green eyes, turtleneck, window light, masterpiece, best quality, 8k, no blur, no watermark, no bad hands\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A portrait of a woman in her thirties with shoulder-length red hair and freckles across her nose, bright green eyes looking into the camera. She wears a dark green turtleneck. Soft window light from the left, neutral studio background. Sharp focus on the face, natural skin texture, 85mm portrait lens, f/1.8.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt is SDXL-style tag soup plus a negative list that FLUX.1 cannot process \u2014 negative prompts are silently ignored, and \"(word)\" emphasis has no native support. The good prompt uses full sentences (T5-XXL was trained on prose), names spatial relationships (\"soft window light from the left\"), camera specs FLUX.1 responds to, and rewrites the negatives affirmatively (\"sharp focus\", \"natural skin texture\").<\/p>\n<h3>Landscape with camera detail<\/h3>\n<p><strong>Intended content:<\/strong> A mountain lake at sunrise, mist, photorealistic.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>mountain lake, sunrise, mist, beautiful, stunning, wallpaper, 4k, uhd, (cinematic:1.3)\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A photorealistic landscape of a mountain lake at sunrise. Low mist drifts across the still water, reflecting the jagged snow-capped peaks. Warm orange and pink light breaks through the clouds on the right side of the frame. Shot on a wide angle 24mm lens, long exposure, crisp detail in the foreground rocks.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt's vague adjectives (\"beautiful\", \"stunning\", \"wallpaper\") give the model nothing concrete to visualize, and <code>(cinematic:1.3)<\/code> weighting is not natively supported. The good prompt specifies the light's color, direction, and placement in the frame plus a lens spec \u2014 concrete, visualizable details T5-XXL can act on.<\/p>\n<h3>Text rendered in the image<\/h3>\n<p><strong>Intended content:<\/strong> A neon \"OPEN\" sign above a shop door at night.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>neon sign, open, shop, door, night, glowing\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A storefront at night with a red neon sign above the door that reads &quot;OPEN&quot; in glowing capital letters. The glass door reflects the neon light. Wet pavement, dark street, cinematic night photography.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Quoting the exact string in the prompt (\"OPEN\") is the documented technique for legible text in FLUX images; the bare tag \"open\" is ambiguous and may not render as text at all. The good prompt also binds the color to the sign and describes the surrounding context.<\/p>\n<h3>Stylized illustration<\/h3>\n<p><strong>Intended content:<\/strong> A fox in a forest, Studio Ghibli-inspired watercolor style.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>fox, forest, ghibli style, watercolor, cute, masterpiece, best quality\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A red fox sitting among tall pine trees in a misty forest, painted in a soft watercolor style reminiscent of Studio Ghibli films. Dappled sunlight filters through the canopy onto the fox's fur. Gentle brushstrokes, muted greens and warm amber tones, storybook illustration feel.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> \"Ghibli style\" alone underspecifies; describing the actual look (watercolor brushstrokes, muted palette, dappled light) gives the T5 encoder visualizable attributes. Full sentences establish the fox's pose and the light's behavior, which tag lists leave to chance.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Photorealistic portrait<\/h3>\n<pre><code>A portrait of an elderly fisherman with deep wrinkles and a gray beard, wearing a weathered yellow raincoat. He stands on a rocky shore at dawn, looking out at the sea. Overcast morning light, mist on the water, shot on 85mm lens, shallow depth of field, sharp focus on his eyes, natural skin texture.\n<\/code><\/pre>\n<h3>Product shot<\/h3>\n<pre><code>A luxury wristwatch with a black leather strap and brushed steel case, floating above a dark reflective surface. Dramatic studio lighting from the left, soft rim light tracing the watch's edge. Macro photography, 100mm lens, tack-sharp focus on the dial, commercial product photography.\n<\/code><\/pre>\n<h3>Sci-fi concept<\/h3>\n<pre><code>A lone astronaut in a white spacesuit standing on the surface of Mars, red dust swirling around her boots. A massive ringed planet hangs low in the orange sky behind her. Cinematic wide shot, 24mm lens, dramatic rim lighting, highly detailed suit textures.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Using a negative prompt field<\/strong> \u2014 FLUX.1 is guidance-distilled; there is no unconditional branch, so negative prompts are ignored (or dropped) by every production endpoint. Rewrite as affirmative descriptions.<\/li>\n<li><strong>Tag-soup prompting<\/strong> \u2014 comma-separated keyword lists underperform natural-language sentences on T5-XXL. Write prose, not tags.<\/li>\n<li><strong>Cranking guidance above ~6<\/strong> \u2014 guidance is a distilled conditioning scalar, not true CFG; values above ~6 cause over-saturation, plastic skin, and distorted hands rather than \"more prompt adherence.\"<\/li>\n<li><strong>Treating <code>(word:1.4)<\/code> and <code>BREAK<\/code> as supported syntax<\/strong> \u2014 these are SDXL-era conventions with no native support in the FLUX pipeline.<\/li>\n<li><strong>Writing prompts longer than ~512 tokens<\/strong> \u2014 the T5-XXL context ceiling silently truncates anything beyond it; put the essential subject and action early.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> FLUX.1 [dev] \u2014 12B parameter rectified-flow transformer (MM-DiT hybrid: 19 double-stream + 38 single-stream blocks), guidance-distilled from the unreleased FLUX.1 base. Released 2024-08-01.<\/li>\n<li><strong>Text Encoder:<\/strong> T5-XXL (512 tokens) + CLIP-L (77 tokens, pooled aesthetic signal)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> 512 (T5-XXL path; diffusers <code>max_sequence_length<\/code> default is 256, HF example uses 512)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Trained on detailed image captions; prompt following is heavily influenced by prompting style (per HF model card). License: FLUX.1 [dev] Non-Commercial License. Excels at typography/short in-image text relative to SDXL-era models.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://huggingface.co/black-forest-labs/FLUX.1-dev<\/li>\n<li>https://github.com/glazed-ai/black-forest-labs-FLUX.1-dev<\/li>\n<li>https://github.com/mohamedabdallah-14/prompt-to-asset/blob/HEAD/docs/research/06-stable-diffusion-flux/6b-flux-family-prompting.md<\/li>\n<li>https://huggingface.co/docs/diffusers/main/en/api/pipelines/flux<\/li>\n<\/ul>", "pairs": 4, "file": "models/image/flux.1-dev.md"}, "image/flux/1": {"title": "Prompt Guide: FLUX.2-Klein", "html": "\n<p><strong>Model:<\/strong> FLUX.2 [klein] (\"Klein\" = German for \"small\")\n<strong>Developer:<\/strong> Black Forest Labs (BFL)\n<strong>Type:<\/strong> Image\n<strong>Text Encoder:<\/strong> Qwen3 text embedder (Qwen3-4B on the 4B variant; Qwen3 8B on the 9B variant)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>FLUX.2 [klein] is the compact, distilled member of the FLUX.2 family, released January 2026. It is a sub-second image generator designed for consumer GPUs: the distilled 4B and 9B variants run in just 4 steps at guidance 1.0. Unlike FLUX.1 (which used T5-XXL + CLIP-L) and FLUX.2 [dev]/[pro] (which use a Mistral-3 24B vision-language model), Klein uses a Qwen3 LLM as its sole text encoder \u2014 so prompting is pure natural-language prose aimed at an instruction-tuned language model, not CLIP-era tag lists. All distilled variants are step-distilled AND guidance-distilled (CFG effectively off), which means negative prompts have no mechanism to work. Base (undistilled) variants exist for fine-tuning and LoRA training, and official FP8 / NVFP4 quantized checkpoints reduce VRAM further.<\/p>\n<p>Variants:<\/p>\n<table>\n<thead>\n<tr>\n<th>Variant<\/th>\n<th>Distilled?<\/th>\n<th>License<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FLUX.2 [klein] 4B<\/td>\n<td>Yes (step + guidance)<\/td>\n<td>Apache 2.0<\/td>\n<td>~13 GB VRAM, sub-second consumer-GPU<\/td>\n<\/tr>\n<tr>\n<td>FLUX.2 [klein] 9B<\/td>\n<td>Yes (step + guidance)<\/td>\n<td>FLUX Non-Commercial<\/td>\n<td>~29 GB VRAM (RTX 4090), flagship small model<\/td>\n<\/tr>\n<tr>\n<td>FLUX.2 [klein] 9B KV<\/td>\n<td>Yes (step + guidance)<\/td>\n<td>FLUX Non-Commercial<\/td>\n<td>KV caching for fast image editing \u2014 the recommended pick for multi-reference editing<\/td>\n<\/tr>\n<tr>\n<td>FLUX.2 [klein] 4B Base<\/td>\n<td>No (undistilled)<\/td>\n<td>Apache 2.0<\/td>\n<td>For fine-tuning / LoRA / research; higher output diversity<\/td>\n<\/tr>\n<tr>\n<td>FLUX.2 [klein] 9B Base<\/td>\n<td>No (undistilled)<\/td>\n<td>FLUX Non-Commercial<\/td>\n<td>For fine-tuning / LoRA / maximum flexibility<\/td>\n<\/tr>\n<tr>\n<td>FP8 / NVFP4 quants<\/td>\n<td>\u2014<\/td>\n<td>Same as parent size<\/td>\n<td>Official, built with NVIDIA: FP8 up to ~1.6\u00d7 faster; NVFP4 up to ~2.7\u00d7 faster on RTX 5080/5090<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Describe the scene like a novelist, not a search engine \u2014 flowing prose with the subject first, then setting, details, and lighting. The Qwen3 encoder is an instruction-tuned LLM that understands relationships between elements, so sentences beat tag lists. Every source agrees: <strong>word order signals priority<\/strong> \u2014 the most important content comes first. Unlike FLUX.2 [dev], Klein does not auto-enhance or upsample your prompt: what you write is what you get, so iteration is cheap (sub-second) and the recommended loop is write \u2192 generate \u2192 adjust one detail at a time.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>woman, blonde, short hair, neutral background, earrings, colorful, necklace, hand on chin, portrait, soft lighting\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A woman with short, blonde hair is posing against a light, neutral background. She is wearing colorful earrings and a necklace, resting her chin on her hand. Soft, diffused light from a large window camera-left defines her features.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>No<\/td>\n<td>Explicitly not supported: \"Flux 2 [klein] does not use explicit weight syntax\" (fal.ai guide). Signal priority with natural-language emphasis instead: \"prominently featuring\", \"with particular attention to\", \"especially detailed\".<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>No<\/td>\n<td>Word repetition for fake emphasis (\"detailed detailed detailed\") is listed as an anti-pattern; use more descriptive language instead.<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Unknown<\/td>\n<td>No Klein-specific documentation found; leave unsupported.<\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Unknown<\/td>\n<td>No Klein-specific documentation found; leave unsupported.<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>No<\/td>\n<td>All distilled Klein variants are guidance-distilled and run at guidance 1.0 (CFG effectively off), so a negative prompt has no mechanism to act. Describe what you want, never what you don't want. (Base/undistilled variants can use guidance &gt; 1.0.)<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Unknown<\/td>\n<td>No model-native special tokens documented for the base models; third-party Klein LoRAs may have their own trigger words.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td>No documented Klein-native regional/masked prompting found.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Works for quick concepts and style exploration, but with no prompt upsampling on Klein, a 3-word prompt leaves almost everything to the model. Underspecified prompts yield generic results \u2014 the model cannot enhance what you don't describe.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td><strong>Medium 30\u201380 words<\/strong> is \"usually ideal for most projects\" (BFL's FLUX.2 guide). Klein-specific guidance adds a Long tier of 80\u2013300+ words for complex editorial and detailed product shots \u2014 but only when every detail serves the image. fal.ai's Klein guide warns prompts over ~100 words create confusion. Every sentence should add visual information.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>BFL documents prompt lengths up to 300+ words for complex scenes, but overstuffed prompts bury key details \u2014 with only 4 denoising steps on distilled variants, front-load what matters. The diffusers pipeline exposes <code>max_sequence_length<\/code> (default 512); explicit truncation behavior is not documented by BFL.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<pre><code>[Subject] + [Action] + [Style] + [Context]   \u2190 BFL's official FLUX.2 scaffold\n[Subject] \u2192 [Setting] \u2192 [Details] \u2192 [Lighting] \u2192 [Atmosphere]   \u2190 Klein-specific ordering\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject<\/td>\n<td>Main subject with concrete specifics, first in the prompt<\/td>\n<td>\"An elderly woman with silver hair\"<\/td>\n<\/tr>\n<tr>\n<td>Setting / Action<\/td>\n<td>Where the subject is and what it's doing<\/td>\n<td>\"carefully arranges wildflowers in a ceramic vase\"<\/td>\n<\/tr>\n<tr>\n<td>Details<\/td>\n<td>Materials, textures, colors, clothing, props<\/td>\n<td>\"wearing a salt-stained wool sweater, hands gripping frayed rope\"<\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>Source, quality, direction, temperature, surface interaction<\/td>\n<td>\"soft afternoon light streams through lace curtains, casting delicate shadows\"<\/td>\n<\/tr>\n<tr>\n<td>Atmosphere / Style<\/td>\n<td>Mood and aesthetic placed near the end<\/td>\n<td>\"creating a sense of quiet determination and solitude\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Photographer-grade lighting (single highest-impact element)<\/td>\n<td>\"golden hour sunlight\", \"soft diffused light from a large window camera-left\", \"Rembrandt lighting\", \"rim light\", \"volumetric light\", \"chiaroscuro\", \"studio softbox\"; describe source, quality, direction, temperature, and how light interacts with surfaces (\"filters through\", \"catches\", \"reflects\")<\/td>\n<\/tr>\n<tr>\n<td>Specific camera language<\/td>\n<td>\"85mm portrait lens\", \"35mm film\", \"f/1.8\", \"Kodak Portra 400\", \"shot on Canon EOS R5\", \"80s vintage\", \"2000s digicam\"<\/td>\n<\/tr>\n<tr>\n<td>Concrete subject specifics<\/td>\n<td>\"A woman in her mid-30s with shoulder-length auburn hair\" (not \"a person\")<\/td>\n<\/tr>\n<tr>\n<td>Spatial relationships and composition<\/td>\n<td>\"centered composition\", \"rule of thirds\", \"bird's eye view\", \"the ocean behind her\"<\/td>\n<\/tr>\n<tr>\n<td>HEX color codes for precise colors<\/td>\n<td>\"color #FF5733\", \"Apple: #0047AB\" \u2014 signal with \"color\" or \"hex\" and bind the code to a specific object; gradients also work<\/td>\n<\/tr>\n<tr>\n<td>Exact text in quotation marks for in-image typography<\/td>\n<td>\"a sign that reads 'OPEN' in glowing capital letters\" \u2014 plus placement, style, size, color<\/td>\n<\/tr>\n<tr>\n<td>Style/mood annotations at the end<\/td>\n<td>\"Style: Country chic meets luxury lifestyle editorial. Mood: Serene, romantic, grounded.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Comma tag soup: <code>beach, woman, camera, sitting, black dress, realistic<\/code><\/td>\n<td>\"A realistic photo of a woman sitting on a beach. She is looking at the camera. She is wearing a black dress. The ocean is behind her.\"<\/td>\n<\/tr>\n<tr>\n<td>Quality-booster tags: <code>masterpiece, best quality, ultra detailed<\/code><\/td>\n<td>Concrete visualizable detail: \"intricate fabric weave, individual strands of hair\"<\/td>\n<\/tr>\n<tr>\n<td>Word repetition: <code>detailed detailed detailed<\/code><\/td>\n<td>\"with particular attention to detail in the fabric\"<\/td>\n<\/tr>\n<tr>\n<td>Contradictory instructions: <code>sitting, standing, walking<\/code> / <code>photorealistic portrait, watercolor painting style<\/code><\/td>\n<td>Pick one per prompt; commit to a primary aesthetic<\/td>\n<\/tr>\n<tr>\n<td>Explicit negatives: <code>no blur, without text, don't make it dark<\/code><\/td>\n<td>Affirmative descriptions: \"sharp focus throughout\", \"bright, well-lit scene\"<\/td>\n<\/tr>\n<tr>\n<td>Vague style: <code>make it look good<\/code><\/td>\n<td>A concrete aesthetic: \"shot on 35mm film, muted greens and warm amber tones\"<\/td>\n<\/tr>\n<tr>\n<td>Vague edit instructions: <code>make it better, fix the image<\/code><\/td>\n<td>\"Change her dress from blue to deep burgundy\" / \"Add dramatic storm clouds to the sky\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>4 (distilled 4B / 9B / 9B KV \u2014 official HF example). Base variants: 50 steps, guidance 4.0 (official diffusers example).<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>1.0 for distilled variants (CFG effectively off \u2014 distilled guidance). Base variants support guidance above 1.0 (e.g. 4.0).<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>1024\u00d71024 is the official benchmark resolution and HF example. Family-wide guidance (BFL FLUX.2 guide): 1:1 \u2192 1024\u00d71024 / 1536\u00d71536; 16:9 \u2192 1920\u00d71080; 9:16 \u2192 1080\u00d71920; 21:9 \u2192 2048\u00d7864; min 64\u00d764, max 4 MP; dimensions multiples of 16; up to 2 MP recommended for most use cases.<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>Not documented for Klein by BFL \u2014 left blank (the model is a rectified-flow transformer).<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>bfloat16 in official examples; official FP8 and NVFP4 quantized variants available.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Image<\/h3>\n<p>The prompt carries the entire scene as descriptive prose: subject first, then setting, details, lighting, atmosphere. Because Klein does not upsample prompts, describe thoroughly on the first pass and iterate cheaply \u2014 generation is sub-second, so adjust one detail at a time.<\/p>\n<h3>Image-to-Image / Editing<\/h3>\n<p>Klein unifies generation and editing in one model (T2I + single-reference + multi-reference editing). For editing, <strong>the reference image carries the visual details \u2014 the prompt describes what changes, not what exists<\/strong>. Use explicit transformation patterns:<\/p>\n<ul>\n<li>\"Turn into [style]\"<\/li>\n<li>\"Replace [element] with [new element]\"<\/li>\n<li>\"Add [element] to [location]\"<\/li>\n<li>\"Change [aspect] to [new state]\"<\/li>\n<\/ul>\n<p>With multiple references, assign each image a role: \"Change image 1 to match the style of image 2\", \"the subject from the first image wearing the jacket from the second image\". The <strong>9B KV variant<\/strong> is the recommended choice for multi-reference editing (KV caching speeds reference attention up to ~2.5\u00d7). Leave unchanged content out of the prompt \u2014 describing what already exists risks the model re-rendering it.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>Tag soup vs prose<\/h3>\n<p><strong>Intended content:<\/strong> A blonde woman's portrait with jewelry against a neutral background.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>woman, blonde, short hair, neutral background, earrings, colorful, necklace, hand on chin, portrait, soft lighting\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A woman with short, blonde hair is posing against a light, neutral background. She is wearing colorful earrings and a necklace, resting her chin on her hand. Soft, diffused light from a large window camera-left defines her features.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The Qwen3 encoder needs relationships between elements (\"resting her chin on her hand\"), not an unordered bag of tags. The good prompt specifies light source, quality, and direction \u2014 the highest-impact levers for Klein output.<\/p>\n<h3>Buried subject vs subject-first<\/h3>\n<p><strong>Intended content:<\/strong> An elderly woman arranging wildflowers in warm afternoon light.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>In a warm, nostalgic room with antique furniture, soft afternoon light streams through lace curtains. An elderly woman with silver hair is there arranging wildflowers.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>An elderly woman with silver hair carefully arranges wildflowers in a ceramic vase. Soft afternoon light streams through lace curtains, casting delicate shadows across her focused expression.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Klein pays more attention to what comes first. Priority order is subject \u2192 action \u2192 style \u2192 context \u2192 secondary details. Burying the subject behind setting description weakens adherence.<\/p>\n<h3>Weight syntax vs natural emphasis<\/h3>\n<p><strong>Intended content:<\/strong> Emphasize a red dress and golden-hour lighting.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>woman, (red dress:1.4), ((golden hour)), street, city\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A woman walking down a city street, prominently featuring a flowing red dress, with particular attention to the golden-hour lighting catching the fabric as she moves.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Klein does not support explicit weight syntax \u2014 <code>(word:1.4)<\/code> and <code>((word))<\/code> have no documented effect. Natural-language emphasis (\"prominently featuring\", \"with particular attention to\") is how the model understands priority.<\/p>\n<h3>Vague edit vs specific edit<\/h3>\n<p><strong>Intended content:<\/strong> Change a dress's color in an existing image; add storm clouds to a sky.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Make it better. Improve the lighting. Fix the image.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Change her dress from blue to deep burgundy. Add dramatic storm clouds to the sky behind her.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> For image-to-image, the reference image already carries all visual detail \u2014 the prompt's only job is to state exactly what changes and the target state. Vague instructions (\"make it better\") give the model no actionable transformation.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Photorealistic portrait<\/h3>\n<pre><code>A weathered fisherman in his late sixties stands at the bow of a small wooden boat, wearing a salt-stained wool sweater, hands gripping frayed rope. Golden hour sunlight filters through morning mist, catching the water droplets on his beard. Shot on 85mm portrait lens, f/1.8, shallow depth of field. Mood: quiet determination and solitude.\n<\/code><\/pre>\n<h3>Product shot<\/h3>\n<pre><code>A matte black wireless headphone resting on a slab of raw concrete. A single soft key light from camera-left creates a long gradient across the concrete, with a cool blue rim light separating the product from a dark background. Macro detail on the ear cushion texture. Color palette: #1A1A1A, #4A5568, deep slate tones. Commercial product photography.\n<\/code><\/pre>\n<h3>In-image typography<\/h3>\n<pre><code>A storefront at night with a large headline sign above the door that reads &quot;OPEN&quot; in glowing red neon capital letters, color #FF2200. The neon reflects off the wet pavement. Cinematic night photography, 35mm lens, high contrast.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Prompting like it's SDXL or FLUX.1<\/strong> \u2014 tag-soup keyword lists, quality tags, and <code>(word:1.4)<\/code> weighting are CLIP-era habits with no documented effect on Klein's Qwen3 encoder. Write prose.<\/li>\n<li><strong>Relying on negative prompts<\/strong> \u2014 distilled Klein runs at guidance 1.0 (CFG off), so negatives have no effect. Describe what you want affirmatively.<\/li>\n<li><strong>Expecting prompt upsampling<\/strong> \u2014 unlike FLUX.2 [dev], Klein does not auto-enhance your prompt; \"what you write is what you get.\" Describe thoroughly on the first pass.<\/li>\n<li><strong>Using distilled variants for fine-tuning<\/strong> \u2014 distilled (4-step) variants are for production speed; Base variants (50-step, guidance-capable) are for fine-tuning, LoRA training, and maximum diversity.<\/li>\n<li><strong>Burying key details in overlong prompts<\/strong> \u2014 with only 4 denoising steps on distilled variants, front-load what matters; prompts over ~100 words risk confusing the model (fal.ai guide).<\/li>\n<li><strong>Vague edit instructions<\/strong> \u2014 \"make it more professional\" is not actionable for the editor; specify the change and the target state.<\/li>\n<li><strong>Not specifying lighting<\/strong> \u2014 consistently the most-cited quality lever for Klein; photographer-grade lighting terms are the cheapest win.<\/li>\n<li><strong>Contradictory style instructions<\/strong> \u2014 \"photorealistic portrait\" + \"watercolor painting style\" in one prompt; commit to a primary aesthetic.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> FLUX.2 [klein] \u2014 rectified-flow transformer. Distilled variants are step-distilled to 4 steps and guidance-distilled (guidance = 1.0). Released January 2026 by Black Forest Labs.<\/li>\n<li><strong>Text Encoder:<\/strong> Qwen3 LLM text embedder \u2014 Qwen3 8B on the 9B variant (stated in BFL's launch blog); Qwen3-4B on the 4B variant (corroborated across ComfyUI's official split files, byte-level community verification, and independent implementations). Diffusers uses <code>Qwen3ForCausalLM<\/code> with <code>Qwen2TokenizerFast<\/code>, embeddings from layers (9, 18, 27).<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> <code>max_sequence_length<\/code> default 512 in the diffusers <code>Flux2KleinPipeline<\/code>; official truncation behavior beyond this is undocumented.<\/li>\n<li><strong>Training Data / Notes:<\/strong> Trained on detailed captions; official HF cards carry standard usage limitations (not a factual-information source; may amplify societal biases). Hugging Face repos under <code>black-forest-labs/<\/code>: <code>FLUX.2-klein-4B<\/code>, <code>FLUX.2-klein-9B<\/code>, <code>FLUX.2-klein-9b-kv<\/code>, <code>FLUX.2-klein-base-9B<\/code>, plus <code>-fp8<\/code> and <code>-nvfp4<\/code> quantized variants. BFL API endpoints: <code>flux-2-klein-4b<\/code>, <code>flux-2-klein-9b<\/code>.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://bfl.ai/blog/flux2-klein-towards-interactive-visual-intelligence<\/li>\n<li>https://github.com/black-forest-labs/flux2<\/li>\n<li>https://huggingface.co/black-forest-labs/FLUX.2-klein-9B<\/li>\n<li>https://huggingface.co/black-forest-labs/FLUX.2-klein-4B<\/li>\n<li>https://huggingface.co/black-forest-labs/FLUX.2-klein-9b-kv<\/li>\n<li>https://docs.bfl.ml/release-notes<\/li>\n<li>https://docs.bfl.ai/guides/prompting_guide_flux2<\/li>\n<li>https://docs.bfl.ml/guides/prompting_unified_basics<\/li>\n<li>https://docs.comfy.org/tutorials/flux/flux-2-klein<\/li>\n<li>https://huggingface.co/docs/diffusers/main/api/pipelines/flux2<\/li>\n<li>https://fal.ai/learn/devs/flux-2-klein-prompt-guide<\/li>\n<li>https://apatero.com/blog/flux-2-klein-prompting-techniques<\/li>\n<li>https://github.com/mflux-community/mflux/blob/HEAD/src/mflux/models/flux2/README.md<\/li>\n<li>https://github.com/bmtaco/image-gen-prompting-guide/blob/HEAD/skills/flux/SKILL.md<\/li>\n<li>https://github.com/cozy-art/super-skills/blob/HEAD/skills/image/flux-v2/SKILL.md<\/li>\n<li>https://github.com/vincentgourbin/flux-2-swift-mlx/blob/HEAD/docs/TextEncoders.md<\/li>\n<li>https://aihaberleri.org/en/news/flux2-klein-the-ai-image-generation-revolution-in-under-a-second<\/li>\n<\/ul>", "pairs": 4, "file": "models/image/flux.2-klein.md"}, "image/sdxl/0": {"title": "Prompt Guide: SDXL (Stable Diffusion XL)", "html": "\n<p><strong>Model:<\/strong> Stable Diffusion XL 1.0 (base + refiner)\n<strong>Developer:<\/strong> Stability AI\n<strong>Type:<\/strong> Image\n<strong>Text Encoder:<\/strong> OpenAI CLIP ViT-L + OpenCLIP ViT-bigG (dual CLIP encoders)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>SDXL is a 3.5B-parameter latent diffusion model family (base UNet + dedicated refiner) built on two CLIP text encoders and trained natively at 1024px. It remains the reference open ecosystem for community checkpoints, LoRAs, and ControlNet workflows. Its CLIP encoders are tag-and-phrase biased: they respond best to comma-separated descriptive phrases and explicit quality boosters, and each encoder's context truncates hard at 77 tokens. The base model handles composition while the optional refiner adds final detail; most production workflows run base only and skip the refiner for speed.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Think in <strong>comma-separated descriptive phrases, front-loaded with the most important tokens<\/strong> \u2014 SDXL does not read long literary sentences the way newer T5/Qwen-encoder models do. Put quality tags and the main subject first, then refine with style, lighting, and camera tokens. Short, dense, ordered phrasing beats prose.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>A lone wanderer traverses the endless desert dunes in the late afternoon\nas the wind kicks up golden sand around them, evoking a profound sense\nof solitude and the vastness of nature in this cinematic moment.\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>masterpiece, best quality, lone wanderer crossing vast desert dunes,\ngolden hour, wind-blown sand, sense of solitude, cinematic composition,\nepic scale, photorealistic, sharp focus\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Supported<\/td>\n<td>Frontend feature (A1111 / Forge / ComfyUI). Boosts a token's cross-attention strength.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Supported<\/td>\n<td>Each nesting \u2248 \u00d71.1 in A1111-style frontends; ComfyUI parses nested parens the same way.<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Supported<\/td>\n<td>Supported natively by ComfyUI's SDXL CLIP encoding and A1111. Forces the text before/after into separately encoded chunks \u2014 the standard fix for attribute bleed between subject and background.<\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Supported<\/td>\n<td>A1111/Forge syntax for scheduling prompt swaps across steps; use the same-step blend variant <code>[a:b:0.5]<\/code> style only where the frontend supports it.<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td>Strongly supported and usually necessary \u2014 a curated quality/anatomy negative is standard practice for SDXL.<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Supported<\/td>\n<td>Textual-inversion and LoRA trigger words work, resolved per-encoder; diffusers also accepts a separate <code>prompt_2<\/code>/<code>negative_prompt_2<\/code> targeted at the bigG encoder for style steering.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Supported<\/td>\n<td>Via frontend tooling (A1111 \"latent couple\" / ComfyUI conditioning masks), not a prompt-string syntax.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<p>Each encoder truncates at <strong>77 tokens<\/strong> (SOS + ~75 content tokens + EOS). Text past 77 tokens is silently dropped per encoder unless the frontend splits prompts into multiple chunks (A1111 long-prompt weighting) \u2014 tokens beyond the first chunk still get encoded, but weaker.<\/p>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Under ~10 tokens \u2192 generic, under-specified results; the model falls back to its average aesthetic. Add subject detail, style, lighting.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>~20\u201370 tokens of dense descriptive phrases plus a quality booster block. Front-load subject + style in the first ~30 tokens.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Beyond 77 tokens per encoder the tail is silently dropped \u2014 key details vanish without warning. Split with <code>BREAK<\/code> or trim.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<pre><code>[quality boosters] + [subject + key attributes] + [action/pose] + [environment/background]\n+ [medium/style] + [lighting] + [color/palette] + [camera/composition]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Quality boosters<\/td>\n<td>Lead with tokens that push toward high-fidelity output<\/td>\n<td><code>masterpiece, best quality, highly detailed<\/code><\/td>\n<\/tr>\n<tr>\n<td>Subject + attributes<\/td>\n<td>Who/what, with distinguishing features<\/td>\n<td><code>elderly fisherman, weathered face, wool coat<\/code><\/td>\n<\/tr>\n<tr>\n<td>Action / pose<\/td>\n<td>What the subject is doing<\/td>\n<td><code>mending a fishing net on a dock<\/code><\/td>\n<\/tr>\n<tr>\n<td>Environment<\/td>\n<td>Setting and background elements<\/td>\n<td><code>foggy harbor at dawn, moored boats<\/code><\/td>\n<\/tr>\n<tr>\n<td>Medium / style<\/td>\n<td>Photo, painting, render, illustration<\/td>\n<td><code>photorealistic, cinematic film still<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>Light source, quality, mood<\/td>\n<td><code>soft volumetric morning light, haze<\/code><\/td>\n<\/tr>\n<tr>\n<td>Camera / composition<\/td>\n<td>Lens, framing, depth<\/td>\n<td><code>85mm portrait, shallow depth of field<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Quality boosters (SDXL responds strongly to them)<\/td>\n<td><code>masterpiece, best quality, 8k, highly detailed, sharp focus<\/code><\/td>\n<\/tr>\n<tr>\n<td>Explicit medium/style tokens<\/td>\n<td><code>photorealistic, oil painting, anime illustration, 3d render, film still<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting descriptors<\/td>\n<td><code>golden hour, volumetric lighting, studio lighting, neon glow, soft shadows<\/code><\/td>\n<\/tr>\n<tr>\n<td>Camera / lens language<\/td>\n<td><code>85mm, wide angle, macro, shallow depth of field, bokeh<\/code><\/td>\n<\/tr>\n<tr>\n<td>Spatial layout cues<\/td>\n<td><code>in the foreground, in the background, left/right side, centered composition<\/code><\/td>\n<\/tr>\n<tr>\n<td>Palette / mood tokens<\/td>\n<td><code>muted colors, vibrant, cinematic color grading, monochrome<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rambling prose sentences<\/td>\n<td>Dense comma-separated phrases<\/td>\n<\/tr>\n<tr>\n<td>One-word prompts like <code>cat<\/code><\/td>\n<td><code>a fluffy orange tabby cat, green eyes, sitting on a windowsill, morning sunlight<\/code><\/td>\n<\/tr>\n<tr>\n<td>Putting <code>blurry, low quality<\/code> only in the positive as <code>no blur<\/code><\/td>\n<td>Put <code>blurry, low quality, deformed<\/code> in the <strong>negative prompt<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Burying the subject after 60 tokens of style tags<\/td>\n<td>Subject within the first ~30 tokens<\/td>\n<\/tr>\n<tr>\n<td>Contradictory style tags (<code>photorealistic oil painting watercolor<\/code>)<\/td>\n<td>Pick one medium: <code>photorealistic<\/code> OR <code>oil painting<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>text, words, letters<\/code> in the positive when you don't want text<\/td>\n<td><code>text, watermark, signature<\/code> in the <strong>negative prompt<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>25\u201340 (30 is a solid baseline; 40\u201350 for maximum detail)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>5\u20138 (7 is the common default; lower \u2248 more creative, higher \u2248 more rigid)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>1024\u00d71024 native; official presets include 1152\u00d7896, 896\u00d71152, 1216\u00d7832, 832\u00d71216, 1344\u00d7768, 1536\u00d7640<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>DPMSolverMultistep, DPM++ 2M Karras, or Euler \u2014 all strong on SDXL<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>fp16<\/td>\n<\/tr>\n<tr>\n<td><strong>Refiner<\/strong><\/td>\n<td>Optional: run refiner on the last ~20% (denoise start \u2248 0.8); base-only is standard for speed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Image<\/h3>\n<p>The prompt must carry everything: subject, style, lighting, camera, and quality control. Front-load the subject and quality boosters; reserve the negative prompt for quality/anatomy/content exclusion (<code>bad anatomy, bad hands, extra fingers, blurry, watermark, text, logo, low quality<\/code>).<\/p>\n<h3>Image-to-Image<\/h3>\n<p>The prompt describes the <strong>target change<\/strong>, not the whole scene \u2014 the source image already supplies composition. Use denoise strength ~0.4\u20130.6 for style transfer or light edits, ~0.6\u20130.8 for heavier re-imagining. Keep subject tokens consistent with the source, then add the style/medium tokens you want (<code>photorealistic \u2192 oil painting, warm palette<\/code>). Negative prompt stays useful for blocking artifacts the edit might introduce.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>Car on a mountain road<\/h3>\n<p><strong>Intended content:<\/strong> Matte black sports car on a wet mountain road at dawn<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>really cool fast car\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>masterpiece, best quality, matte black Porsche 911 GT3 RS on a wet mountain\nroad at dawn, motion blur on the wheels, dramatic fog, automotive photography,\nshot on Sony A7R V, 70-200mm lens, cinematic color grading\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt gives the CLIP encoders almost no visual signal \u2014 \"cool\" and \"fast\" are abstract, not visual. The good prompt front-loads a specific subject with material and color attributes, then adds environment, lighting, medium, and camera tokens SDXL's tag-style training responds to.<\/p>\n<h3>Portrait<\/h3>\n<p><strong>Intended content:<\/strong> Natural-light portrait of a woman in her 30s<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>a beautiful woman\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>(masterpiece, best quality:1.2), portrait of a woman in her 30s with freckles\nand auburn hair, wearing a cream linen shirt, soft window light from the left,\nshallow depth of field, Fujifilm film simulation, natural relaxed expression,\n(sharp focus on eyes:1.1)\n<\/code><\/pre>\n<p><strong>Negative:<\/strong> <code>(worst quality, low quality:1.4), blurry, deformed, disfigured, bad anatomy, bad hands<\/code><\/p>\n<p><strong>Why:<\/strong> \"Beautiful\" is subjective noise. The good prompt names concrete visual features (freckles, auburn hair, linen shirt), grounded lighting, and camera cues, and uses weighting to prioritize quality and eye sharpness while the negative prompt removes the anatomy/quality failures SDXL is prone to.<\/p>\n<h3>Volcano landscape<\/h3>\n<p><strong>Intended content:<\/strong> Erupting volcanic island at sunset, aerial view<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>a big island and volcano erupting into the sky\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>volcanic island with erupting crater, ash clouds rising into a crimson sunset\nsky, dark lava flowing into turquoise ocean, dramatic natural disaster scene,\naerial drone perspective, National Geographic style, highly detailed\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt is vague (\"big island\") and wastes tokens on filler. The good prompt specifies materials and colors (dark lava, turquoise ocean, crimson sky), a composition cue (aerial drone perspective), and a style anchor (National Geographic) that SDXL maps to richly detailed landscapes.<\/p>\n<h3>Logo icon with clean background<\/h3>\n<p><strong>Intended content:<\/strong> Flat-vector mountain logo icon on a pure white background<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>minimalist geometric logo, clean vector design, abstract mountain peak symbol,\nblue and white color scheme, professional branding, centered composition,\nflat design, white background\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>minimalist geometric logo, clean vector design, abstract mountain peak symbol,\nblue color scheme, professional branding, centered composition, flat design\nBREAK\npure white background, no texture, no pattern, no secondary elements, empty negative space\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Without <code>BREAK<\/code>, the color tokens (\"blue and white\") bleed across the whole image and the background often renders textured or tinted. <code>BREAK<\/code> forces the background description into a separately encoded chunk so the \"pure white background\" instruction binds to the background instead of being diluted by the logo tokens.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Photorealistic portrait<\/h3>\n<pre><code>(masterpiece, best quality:1.2), professional portrait photograph, young woman,\nnatural lighting, soft bokeh background, (sharp focus on eyes:1.1), neutral\ncolor grading, 85mm lens, f/1.8, studio quality\n<\/code><\/pre>\n<p>Negative: <code>(worst quality, low quality:1.4), blurry, deformed, disfigured, bad anatomy, bad hands<\/code><\/p>\n<h3>Concept art landscape<\/h3>\n<pre><code>breathtaking fantasy landscape, floating islands with waterfalls, golden hour\nlight, volumetric clouds, epic scale, matte painting, intricate details,\ncinematic composition\n<\/code><\/pre>\n<p>Negative: <code>blurry, low quality, watermark, text, deformed<\/code><\/p>\n<h3>Per-encoder style steering (diffusers)<\/h3>\n<pre><code class=\"language-python\">prompt = &quot;Astronaut in a jungle, cold color palette, muted colors, detailed, 8k&quot;   # \u2192 CLIP ViT-L\nprompt_2 = &quot;Van Gogh painting&quot;   # \u2192 OpenCLIP ViT-bigG (style steering)\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Key detail past token 77<\/strong> \u2192 silently dropped by each encoder; trim or chunk with <code>BREAK<\/code>, and front-load the subject.<\/li>\n<li><strong>No negative prompt<\/strong> \u2192 SDXL's training data includes low-quality imagery; without a quality/anatomy negative, defects and watermarks appear far more often.<\/li>\n<li><strong>Generating at 512\u00d7512 or odd resolutions<\/strong> \u2192 SDXL is trained at 1024px; small canvases produce distorted anatomy and mushy detail. Stay at/near 1024px per side.<\/li>\n<li><strong>Writing \"no blur / no text\" in the positive prompt<\/strong> \u2192 negation in the positive is weak; those concepts belong in the negative prompt.<\/li>\n<li><strong>Stacking contradictory mediums<\/strong> (<code>photorealistic oil painting watercolor 3d render<\/code>) \u2192 pick one medium so the style tokens reinforce instead of canceling.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> SDXL Base 1.0 (3.5B UNet) + SDXL Refiner 1.0 (optional second stage)<\/li>\n<li><strong>Text Encoder:<\/strong> CLIP ViT-L (OpenAI) + OpenCLIP ViT-bigG<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> 77 per encoder per chunk (~75 usable); frontends can chain chunks<\/li>\n<li><strong>Training Data / Notes:<\/strong> Trained natively at 1024\u00d71024 on a large-scale image-text corpus with synthetic captions; released July 2023 under the Stability AI Community License. The refiner was trained for the final detail pass at high resolution.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://huggingface.co/docs/diffusers/en/using-diffusers/sdxl (dual text encoders, <code>prompt_2<\/code> per-encoder prompts, textual inversion, 1024\u00d71024 native)<\/li>\n<li>https://huggingface.co/docs/diffusers/v0.22.0/using-diffusers/sdxl<\/li>\n<li>https://github.com/aiforhumans/comfyui-xdev-nodes/blob/HEAD/docs/docs/sdxl.md (aspect presets, steps 25\u201350, refiner guidance)<\/li>\n<li>https://github.com/mohamedabdallah-14/prompt-to-asset/blob/HEAD/docs/research/06-stable-diffusion-flux/6a-sd-15-21-xl-prompting-fundamentals.md (<code>BREAK<\/code> token-bleed mechanics on SDXL)<\/li>\n<li>https://whatshuang.com/posts/stable-diffusion-prompts (universal SDXL negative prompt; bad-vs-good example pairs)<\/li>\n<li>https://promptomania.com/models/stable-diffusion/sdxl-1-0 (CFG 5\u20139, steps 20\u201350, weighting syntax, example prompts)<\/li>\n<li>https://github.com/dwin-gharibi/runpod-sdxl (30 steps / guidance 7.0 baseline; refiner denoise 0.7\u20130.85)<\/li>\n<\/ul>", "pairs": 4, "file": "models/image/sdxl.md"}, "image/z-image/0": {"title": "Prompt Guide: Z-Image", "html": "\n<p><strong>Model:<\/strong> Z-Image (\u9020\u76f8) \u2014 base foundation checkpoint (sibling: Z-Image-Turbo, Z-Image-Omni-Base, Z-Image-Edit)\n<strong>Developer:<\/strong> Alibaba Tongyi-MAI (Tongyi Lab)\n<strong>Type:<\/strong> Image\n<strong>Text Encoder:<\/strong> Qwen3 4B encoder (per third-party model documentation; not named in the official README)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Z-Image is a 6-billion-parameter text-to-image family built on a <strong>Scalable Single-Stream DiT (S3-DiT)<\/strong> architecture, where text tokens, visual semantic tokens, and VAE tokens are concatenated into one unified sequence. It is released under Apache-2.0. The <strong>base Z-Image<\/strong> checkpoint (released 2026-01-27) prioritizes high-quality generation, rich aesthetics, diversity, and controllability with real classifier-free guidance and 28\u201350 steps; the distilled <strong>Z-Image-Turbo<\/strong> (released 2025-11-26) generates in 8 function evaluations with guidance removed. Standout strengths are photorealism, bilingual (English + Chinese) text rendering, and an official Prompt Enhancer that expands short prompts with reasoning. The base model explicitly supports effective negative prompting, while Turbo's CFG-free design makes negatives meaningless there.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write <strong>natural-language descriptive prompts, phrased positively<\/strong> \u2014 the Qwen-based encoder understands sentences, not tag soup, and responds best to concrete visual descriptions. If you want text rendered in the image, quote it exactly. Keep prompts descriptive rather than keyword-stuffed; the official Prompt Enhancer exists precisely to expand thin prompts for you.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>(masterpiece:1.5), ((beautiful)), 8k, ultra-detailed, girl, BREAK, neon city,\ncinematic lighting, trending on artstation, bad anatomy\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A young woman with freckles and windblown auburn hair stands on a rain-slicked\nneon-lit street at night. She wears a cream linen jacket. A glowing storefront\nsign behind her reads &quot;NIGHT MARKET&quot; in bright pink letters. Cinematic\ncomposition, shallow depth of field, reflections shimmering on the wet pavement.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not supported<\/td>\n<td>CLIP-era syntax; no evidence of support in Z-Image's Qwen3-encoder pipeline. Emphasize by describing, not by weighting.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not supported<\/td>\n<td>Same as above \u2014 use richer description instead.<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not supported<\/td>\n<td>BREAK is CLIP-tooling-specific chunking; the S3-DiT encoder takes one unified token stream.<\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not supported<\/td>\n<td>No evidence in official docs or diffusers <code>ZImagePipeline<\/code>.<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported (base); no effect on Turbo<\/td>\n<td>Official README: \"Negative prompts: Strongly recommended for better control\" for the base model. Turbo runs with <code>guidance_scale=0.0<\/code> and CFG removed, so a negative prompt does nothing there.<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Unknown<\/td>\n<td>No textual-inversion / trigger-token documentation found in official sources.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td>No official masked/regional prompting documentation found.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<p>The official demo caps prompts around <strong>512 tokens<\/strong>, and locally <code>max_sequence_length=1024<\/code> is supported (per a community skill verified against Tongyi-MAI sources \u2014 the widely quoted \"512-token cap\" is a configurable demo default, not a model limit). Third-party API wrappers accept up to ~2000 characters. Rich, specific prompts render well, but the encoder still truncates at the sequence limit.<\/p>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>A few vague words (\"a cat\") \u2192 the model fills in average-looking content; quality and specificity suffer. Use the official Prompt Enhancer or expand manually.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>A descriptive paragraph (~50\u2013200 words) covering subject, action, setting, style/medium, and lighting; quote any in-image text exactly.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Beyond the sequence limit (~512 tokens in the demo, 1024 locally) the tail is truncated \u2014 long dumps of adjectives at the end silently vanish.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<pre><code>[Subject + key attributes] + [action / pose] + [setting / background]\n+ [in-image text in &quot;quotes&quot; if any] + [medium / visual style] + [lighting + atmosphere]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject &amp; attributes<\/td>\n<td>Be specific \u2014 who, what they look like<\/td>\n<td><code>An elderly gardener with wrinkled skin, rough hands<\/code><\/td>\n<\/tr>\n<tr>\n<td>Action<\/td>\n<td>What the subject is doing<\/td>\n<td><code>pruning red roses in a Victorian garden<\/code><\/td>\n<\/tr>\n<tr>\n<td>In-image text<\/td>\n<td>Exact text in double quotes, with style + placement<\/td>\n<td><code>a rustic wooden sign clearly reads \"GARDEN OF LIFE\"<\/code><\/td>\n<\/tr>\n<tr>\n<td>Visual style / medium<\/td>\n<td>Texture and medium of the image<\/td>\n<td><code>Shot on Leica M6, Kodak Portra 400 film grain<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting &amp; atmosphere<\/td>\n<td>Light quality, time of day, mood<\/td>\n<td><code>Dappled sunlight through oak trees, soft backlighting, warm morning atmosphere<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Concrete subject details<\/td>\n<td>Age, clothing, textures, materials, colors (<code>wrinkled skin<\/code>, <code>rough hands<\/code>, <code>intricate embroidery<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Explicit in-image text in quotes<\/td>\n<td><code>a sign reading \"GARDEN OF LIFE\"<\/code>, <code>the cover headline \"SUMMER SALE\"<\/code> \u2014 English or Chinese<\/td>\n<\/tr>\n<tr>\n<td>Medium / photographic grounding<\/td>\n<td><code>shot on Leica M6<\/code>, <code>Kodak Portra 400<\/code>, <code>cinematic composition<\/code>, <code>natural light photography<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting and atmosphere<\/td>\n<td><code>dappled sunlight<\/code>, <code>soft backlighting<\/code>, <code>neon glow<\/code>, <code>warm morning atmosphere<\/code><\/td>\n<\/tr>\n<tr>\n<td>Composition cues<\/td>\n<td><code>close-up<\/code>, <code>wide shot<\/code>, <code>shallow depth of field<\/code>, <code>rule of thirds<\/code><\/td>\n<\/tr>\n<tr>\n<td>Positive quality phrasing (preferred over negative lists)<\/td>\n<td><code>sharp focus<\/code>, <code>highly detailed<\/code>, <code>clean composition<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tag-soup / keyword salad (<code>girl, neon, 8k, cinematic, ((beautiful))<\/code>)<\/td>\n<td>Ful
