e>cool color tones<\/code><\/td>\n<td>Blue, teal, and silver palette; calm, distant, clinical or serene.<\/td>\n<\/tr>\n<tr>\n<td>Muted / desaturated<\/td>\n<td><code>muted desaturated colors<\/code><\/td>\n<td>Restrained, faded palette; indie-film restraint and quiet realism.<\/td>\n<\/tr>\n<tr>\n<td>Vibrant / saturated<\/td>\n<td><code>vibrant saturated colors<\/code><\/td>\n<td>Punchy, electric color; energetic, joyful, commercial pop.<\/td>\n<\/tr>\n<tr>\n<td>Black and white<\/td>\n<td><code>black and white<\/code><\/td>\n<td>Monochrome; timeless, dramatic, strips the image to form and light.<\/td>\n<\/tr>\n<tr>\n<td>Duotone<\/td>\n<td><code>duotone color grade<\/code><\/td>\n<td>Two-hue treatment; graphic, poster-like, strong brand identity.<\/td>\n<\/tr>\n<tr>\n<td>Pastel<\/td>\n<td><code>soft pastel palette<\/code><\/td>\n<td>Powdery pinks, mints, lavenders; gentle, dreamy, Wes Anderson whimsy.<\/td>\n<\/tr>\n<tr>\n<td>High contrast<\/td>\n<td><code>high contrast<\/code><\/td>\n<td>Deep blacks against bright highlights; punchy, dramatic, graphic.<\/td>\n<\/tr>\n<tr>\n<td>Low contrast<\/td>\n<td><code>low contrast, soft tones<\/code><\/td>\n<td>Compressed tonal range; hazy, gentle, filmic softness.<\/td>\n<\/tr>\n<tr>\n<td>Film noir<\/td>\n<td><code>film noir mood<\/code><\/td>\n<td>Hard shadows, venetian blinds, moral darkness; 1940s crime cinema.<\/td>\n<\/tr>\n<tr>\n<td>Teal and orange<\/td>\n<td><code>teal and orange color grade<\/code><\/td>\n<td>Blockbuster complementary grade; skin pops against cool backgrounds.<\/td>\n<\/tr>\n<tr>\n<td>Sepia<\/td>\n<td><code>sepia tone<\/code><\/td>\n<td>Brown-aged monochrome; antique photographs and old-west nostalgia.<\/td>\n<\/tr>\n<tr>\n<td>Golden tones<\/td>\n<td><code>golden color palette<\/code><\/td>\n<td>Honeyed highlights and warm shadows; luxurious, sun-drenched glow.<\/td>\n<\/tr>\n<tr>\n<td>Neon palette<\/td>\n<td><code>neon color palette<\/code><\/td>\n<td>Electric pinks, cyans, purples; nightlife, cyberpunk, synth energy.<\/td>\n<\/tr>\n<tr>\n<td>Earthy tones<\/td>\n<td><code>earthy natural palette<\/code><\/td>\n<td>Browns, ochres, moss greens; grounded, organic, rustic calm.<\/td>\n<\/tr>\n<tr>\n<td>Jewel tones<\/td>\n<td><code>rich jewel tones<\/code><\/td>\n<td>Emerald, sapphire, ruby saturation; opulent, regal, dramatic.<\/td>\n<\/tr>\n<tr>\n<td>Infrared look<\/td>\n<td><code>infrared photography look<\/code><\/td>\n<td>White foliage and dark skies; surreal, otherworldly landscape.<\/td>\n<\/tr>\n<tr>\n<td>Cross-processed<\/td>\n<td><code>cross-processed colors<\/code><\/td>\n<td>Shifted chemical color casts; edgy fashion-editorial unpredictability.<\/td>\n<\/tr>\n<tr>\n<td>Bleach bypass<\/td>\n<td><code>bleach bypass look<\/code><\/td>\n<td>Desaturated with crushed contrast and silver grain; gritty war-film realism.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/image-color-mood.md"}, "components/video-components/0": {"title": "Prompt Component: Camera Movements (Video)", "html": "\n<p><strong>Category:<\/strong> Video prompt building blocks\n<strong>Block:<\/strong> Camera Movements<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Camera movement describes how the virtual camera behaves over time, and it is the single biggest lever for making AI video feel cinematic rather than static. It controls parallax, energy, and the viewer's relationship to the subject. In image-to-video prompts especially, the movement description often matters more than the scene description itself.<\/p>\n<h2>How to use<\/h2>\n<p>Pick one primary motion per clip: compatible pairs like orbit plus zoom (the dolly zoom) work, but combining two unrelated motions such as whip pan plus macro zoom confuses models. Place the movement keyword at the start or end of your prompt for best results. For glitch-free backgrounds prefer stable moves like tripod pans or slow dolly, and pair slow optical zoom-out with a lower creativity or chaos setting to reduce morphing.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Slow Dolly In<\/td>\n<td><code>Slow dolly in, camera moves slowly forward toward the subject.<\/code><\/td>\n<td>Dolly Moves: creates intimacy or tension.<\/td>\n<\/tr>\n<tr>\n<td>Slow Dolly Out<\/td>\n<td><code>Slow dolly out, camera moves slowly backwards away from the subject.<\/code><\/td>\n<td>Dolly Moves: reveals context or signifies an ending.<\/td>\n<\/tr>\n<tr>\n<td>Fast Dolly In<\/td>\n<td><code>Fast dolly in, camera moves rapidly forward toward the subject's face, urgent motion.<\/code><\/td>\n<td>Dolly Moves: aggressive; used for horror or action.<\/td>\n<\/tr>\n<tr>\n<td>Vertigo Effect (Zolly)<\/td>\n<td><code>Vertigo effect, dolly zoom, camera moves backward while zooming in, background expands.<\/code><\/td>\n<td>Dolly Moves: classic Hitchcock psychological distortion.<\/td>\n<\/tr>\n<tr>\n<td>Extreme Macro Zoom<\/td>\n<td><code>Extreme macro zoom, zoom transition from face to micro view of the eye.<\/code><\/td>\n<td>Infinite Scale Continuity: transitions from the visible world to the microscopic.<\/td>\n<\/tr>\n<tr>\n<td>Cosmic Hyper Zoom<\/td>\n<td><code>Cosmic hyper zoom, fast zoom transition from space down to street level.<\/code><\/td>\n<td>Infinite Scale Continuity: the 'Google Earth' effect.<\/td>\n<\/tr>\n<tr>\n<td>Over the Shoulder (OTS)<\/td>\n<td><code>Over the shoulder shot, camera mounted behind subject A framing subject B.<\/code><\/td>\n<td>Character-Mounted Framing: standard dialogue or stalking perspective.<\/td>\n<\/tr>\n<tr>\n<td>Fisheye / Peephole<\/td>\n<td><code>Fisheye lens, extreme wide-angle distortion, circular frame.<\/code><\/td>\n<td>Character-Mounted Framing: stylized surveillance or door-viewer look.<\/td>\n<\/tr>\n<tr>\n<td>Reveal from Behind (Wipe)<\/td>\n<td><code>Wipe movement, camera slides laterally from behind the pillar to reveal the street.<\/code><\/td>\n<td>Obstacle &amp; Environmental Interaction: uses an object to transition into the scene.<\/td>\n<\/tr>\n<tr>\n<td>Through Shot (Fly Through)<\/td>\n<td><code>Fly through, camera moves through the window opening into the room.<\/code><\/td>\n<td>Obstacle &amp; Environmental Interaction: moves through a gap to enter a new space.<\/td>\n<\/tr>\n<tr>\n<td>Reveal from Blur<\/td>\n<td><code>Rack focus, start completely out of focus, slowly pull focus until sharp.<\/code><\/td>\n<td>Focus &amp; Lens Manipulation: dreamy or waking-up effect.<\/td>\n<\/tr>\n<tr>\n<td>Rack Focus<\/td>\n<td><code>Rack focus, focus shifts from the coffee cup to the couple in the background.<\/code><\/td>\n<td>Focus &amp; Lens Manipulation: shifts attention from near to far.<\/td>\n<\/tr>\n<tr>\n<td>Tilt Up<\/td>\n<td><code>Tilt up, camera pans vertically up from legs to head.<\/code><\/td>\n<td>Tripod Moves: reveals height (skyscrapers, giants).<\/td>\n<\/tr>\n<tr>\n<td>Tilt Down<\/td>\n<td><code>Tilt down, camera pans vertically down from head to feet.<\/code><\/td>\n<td>Tripod Moves: reveals ground elements or defeat.<\/td>\n<\/tr>\n<tr>\n<td>Camera Truck Left<\/td>\n<td><code>Truck left, camera moves sideways on a track to the left.<\/code><\/td>\n<td>Slider Moves: lateral movement left; follows walking subjects from the side.<\/td>\n<\/tr>\n<tr>\n<td>Camera Truck Right<\/td>\n<td><code>Truck right, camera moves sideways on a track to the right.<\/code><\/td>\n<td>Slider Moves: lateral movement right.<\/td>\n<\/tr>\n<tr>\n<td>Orbit 180 (Spin)<\/td>\n<td><code>Orbit 180, camera moves in a half-circle around the subject.<\/code><\/td>\n<td>Orbital Movements: a standard half-circle; showcases the subject.<\/td>\n<\/tr>\n<tr>\n<td>Fast 360 Orbit (Spin)<\/td>\n<td><code>Fast 360 orbit, camera spins rapidly 360 degrees around the subject.<\/code><\/td>\n<td>Orbital Movements: high energy, disorienting.<\/td>\n<\/tr>\n<tr>\n<td>True Orbit 180<\/td>\n<td>&mdash;<\/td>\n<td>Orbital Movements: Seedance-exclusive true orbit; no prompt snippet in the source doc.<\/td>\n<\/tr>\n<tr>\n<td>True Orbit 360<\/td>\n<td>&mdash;<\/td>\n<td>Orbital Movements: Seedance-exclusive true orbit; no prompt snippet in the source doc.<\/td>\n<\/tr>\n<tr>\n<td>Slow Cinematic Arc<\/td>\n<td><code>Slow cinematic arc, camera moves in a wide curve to reveal side profile.<\/code><\/td>\n<td>Orbital Movements: dramatic and emotional.<\/td>\n<\/tr>\n<tr>\n<td>Pedestal Down<\/td>\n<td><code>Pedestal down, camera lowers vertically straight down.<\/code><\/td>\n<td>Vertical Movements: lowers the camera straight down.<\/td>\n<\/tr>\n<tr>\n<td>Pedestal Up<\/td>\n<td><code>Pedestal up, camera rises vertically straight up from waist to eye level.<\/code><\/td>\n<td>Vertical Movements: rises straight up.<\/td>\n<\/tr>\n<tr>\n<td>Crane Up (High Angle Reveal)<\/td>\n<td><code>Crane up, camera lifts high into the air.<\/code><\/td>\n<td>Vertical Movements: the 'epic movie' ending shot.<\/td>\n<\/tr>\n<tr>\n<td>Crane Down (Landing)<\/td>\n<td><code>Crane down, camera descends slowly to the subject.<\/code><\/td>\n<td>Vertical Movements: establishes a location descending from the sky.<\/td>\n<\/tr>\n<tr>\n<td>Smooth Optical Zoom In<\/td>\n<td><code>Smooth optical zoom in, lens magnifies subject, camera stays stationary.<\/code><\/td>\n<td>Optical Lens Effects: lens magnification with a stationary camera.<\/td>\n<\/tr>\n<tr>\n<td>Smooth Optical Zoom Out<\/td>\n<td><code>Smooth optical zoom out, lens widens, background becomes blurry.<\/code><\/td>\n<td>Optical Lens Effects: lens widens; background blurs.<\/td>\n<\/tr>\n<tr>\n<td>Snap Zoom (Crash Zoom)<\/td>\n<td><code>Snap zoom, crash zoom, rapid zoom directly into the eyes.<\/code><\/td>\n<td>Optical Lens Effects: comedy or intense action (kung fu movies).<\/td>\n<\/tr>\n<tr>\n<td>Drone Fly Over<\/td>\n<td><code>Drone fly over, high altitude flight moving forward over the landscape.<\/code><\/td>\n<td>Drone &amp; Aerial Views: standard travel videography.<\/td>\n<\/tr>\n<tr>\n<td>Epic Drone Reveal<\/td>\n<td><code>Epic drone reveal, rising and tilting down to reveal the scene.<\/code><\/td>\n<td>Drone &amp; Aerial Views: rises over an obstacle to reveal the view.<\/td>\n<\/tr>\n<tr>\n<td>Large Scale Drone Orbit<\/td>\n<td><code>Large scale drone orbit, massive sweeping circle around the island.<\/code><\/td>\n<td>Drone &amp; Aerial Views: massive sweeping circle.<\/td>\n<\/tr>\n<tr>\n<td>Top Down (God's Eye View)<\/td>\n<td><code>Top down shot, camera pointing straight down, slow twist.<\/code><\/td>\n<td>Drone &amp; Aerial Views: looking directly down.<\/td>\n<\/tr>\n<tr>\n<td>FPV Drone Dive<\/td>\n<td><code>FPV drone dive, aggressive diving motion down the waterfall.<\/code><\/td>\n<td>Drone &amp; Aerial Views: high speed, adrenaline-inducing.<\/td>\n<\/tr>\n<tr>\n<td>Handheld Documentary<\/td>\n<td><code>Handheld camera, shaky motion, natural movement, documentary style.<\/code><\/td>\n<td>Stylized &amp; Dynamic Movements: adds realism and grit.<\/td>\n<\/tr>\n<tr>\n<td>Whip Pan<\/td>\n<td><code>Whip pan, camera whips violently to the side with extreme directional motion blur.<\/code><\/td>\n<td>Stylized &amp; Dynamic Movements: perfect for hidden transitions between clips.<\/td>\n<\/tr>\n<tr>\n<td>Dutch Angle (Roll)<\/td>\n<td><code>Dutch angle, camera roll, tilted sideways on Z-axis.<\/code><\/td>\n<td>Stylized &amp; Dynamic Movements: uneasiness, madness, or villainy.<\/td>\n<\/tr>\n<tr>\n<td>Leading Shot (Backward Tracking)<\/td>\n<td><code>Leading shot, camera moves backward matching the subject's speed.<\/code><\/td>\n<td>Subject Tracking: moves back while the subject walks forward.<\/td>\n<\/tr>\n<tr>\n<td>Following Shot (Forward Tracking)<\/td>\n<td><code>Following shot, camera follows behind the subject matching speed.<\/code><\/td>\n<td>Subject Tracking: chases the subject.<\/td>\n<\/tr>\n<tr>\n<td>Side Tracking (Parallel)<\/td>\n<td><code>Side tracking, camera trucks alongside the subject.<\/code><\/td>\n<td>Subject Tracking: the 'walk and talk' shot.<\/td>\n<\/tr>\n<tr>\n<td>POV Walk (First Person)<\/td>\n<td><code>POV walk, first person camera moving forward with bobbing motion.<\/code><\/td>\n<td>Subject Tracking: immersive first-person view.<\/td>\n<\/tr>\n<tr>\n<td>Hyperlapse<\/td>\n<td><code>Hyperlapse, camera moves forward rapidly, time accelerated, fast motion, light trails.<\/code><\/td>\n<td>Time &amp; Speed Manipulation: fast motion through a city or landscape.<\/td>\n<\/tr>\n<tr>\n<td>Bullet Time (Frozen Moment)<\/td>\n<td><code>Bullet time, frozen moment, ultra slow motion, camera orbit right.<\/code><\/td>\n<td>Time &amp; Speed Manipulation: the 'Matrix' effect.<\/td>\n<\/tr>\n<tr>\n<td>Barrel Roll (Vortex Inception)<\/td>\n<td><code>Barrel roll, camera spins 360 degrees clockwise while moving forward, disorienting.<\/code><\/td>\n<td>Extreme Orientation: complete disorientation.<\/td>\n<\/tr>\n<tr>\n<td>Worm's Eye Tracking<\/td>\n<td><code>Worm's eye view, low angle tracking, camera moves along the ground looking up.<\/code><\/td>\n<td>Extreme Orientation: makes the subject look massive.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/video-camera-movements.md"}, "components/video-components/1": {"title": "Prompt Component: Shot Types &amp; Framing (Video)", "html": "\n<p><strong>Category:<\/strong> Video prompt building blocks\n<strong>Block:<\/strong> Shot Types &amp; Framing<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Shot scale and framing decide how much of the subject and environment the viewer sees, which sets the emotional distance of every moment. Close framings create intimacy and tension; wide framings establish place and scale. Naming the shot explicitly keeps the model from drifting between scales mid-clip.<\/p>\n<h2>How to use<\/h2>\n<p>Pick one shot scale per clip or per beat, and name it plainly near the subject description. Avoid stacking contradictory framings (close-up plus extreme wide shot) in the same prompt. In multi-beat prompts, sequence them deliberately, e.g. wide establishing into close-up.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Extreme Close-Up<\/td>\n<td><code>extreme close-up<\/code><\/td>\n<td>Isolates a tiny detail (an eye, a hand); maximum intimacy or tension.<\/td>\n<\/tr>\n<tr>\n<td>Close-Up<\/td>\n<td><code>close-up<\/code><\/td>\n<td>Frames the face; the standard for emotion and dialogue.<\/td>\n<\/tr>\n<tr>\n<td>Medium Close-Up<\/td>\n<td><code>medium close-up<\/code><\/td>\n<td>Head and shoulders; natural interview and dialogue framing.<\/td>\n<\/tr>\n<tr>\n<td>Medium Shot<\/td>\n<td><code>medium shot<\/code><\/td>\n<td>Waist up; balances the subject with their immediate surroundings.<\/td>\n<\/tr>\n<tr>\n<td>Medium Wide Shot<\/td>\n<td><code>medium wide shot<\/code><\/td>\n<td>Knees up; shows body language with environmental context.<\/td>\n<\/tr>\n<tr>\n<td>Cowboy Shot<\/td>\n<td><code>cowboy shot<\/code><\/td>\n<td>Mid-thigh up; classic western framing that keeps hands in play.<\/td>\n<\/tr>\n<tr>\n<td>Full Shot<\/td>\n<td><code>full shot<\/code><\/td>\n<td>Head to toe; showcases wardrobe, posture, and movement.<\/td>\n<\/tr>\n<tr>\n<td>Wide Shot<\/td>\n<td><code>wide shot<\/code><\/td>\n<td>Subject placed in the environment; establishes place and scale.<\/td>\n<\/tr>\n<tr>\n<td>Extreme Wide Shot<\/td>\n<td><code>extreme wide shot<\/code><\/td>\n<td>Vast landscape with a tiny subject; isolation or epic scale.<\/td>\n<\/tr>\n<tr>\n<td>Establishing Shot<\/td>\n<td><code>aerial establishing shot<\/code><\/td>\n<td>Opens a scene on location; often a drone or crane move.<\/td>\n<\/tr>\n<tr>\n<td>Aerial Shot<\/td>\n<td><code>aerial shot<\/code><\/td>\n<td>High overhead view; maps geography and subject movement.<\/td>\n<\/tr>\n<tr>\n<td>Over-the-Shoulder<\/td>\n<td><code>over-the-shoulder shot<\/code><\/td>\n<td>Dialogue staple; camera behind one character framing the other.<\/td>\n<\/tr>\n<tr>\n<td>POV Shot<\/td>\n<td><code>POV shot<\/code><\/td>\n<td>First-person perspective; immersive and subjective.<\/td>\n<\/tr>\n<tr>\n<td>Low Angle Shot<\/td>\n<td><code>low angle shot<\/code><\/td>\n<td>Camera below the subject looking up; conveys power.<\/td>\n<\/tr>\n<tr>\n<td>High Angle Shot<\/td>\n<td><code>high angle shot<\/code><\/td>\n<td>Camera above looking down; makes the subject feel small or vulnerable.<\/td>\n<\/tr>\n<tr>\n<td>Two Shot<\/td>\n<td><code>two shot<\/code><\/td>\n<td>Two subjects in frame; dialogue and relationship scenes.<\/td>\n<\/tr>\n<tr>\n<td>Single Shot<\/td>\n<td><code>single shot<\/code><\/td>\n<td>One subject isolated in frame; focus and intimacy.<\/td>\n<\/tr>\n<tr>\n<td>Group Shot<\/td>\n<td><code>group shot<\/code><\/td>\n<td>Multiple subjects; ensemble staging.<\/td>\n<\/tr>\n<tr>\n<td>Insert Shot<\/td>\n<td><code>insert shot<\/code><\/td>\n<td>Tight detail of an object or action beat inside the scene.<\/td>\n<\/tr>\n<tr>\n<td>Cutaway<\/td>\n<td><code>cutaway shot<\/code><\/td>\n<td>Brief shot away from the main action; smooths transitions.<\/td>\n<\/tr>\n<tr>\n<td>Mirror Shot<\/td>\n<td><code>mirror shot<\/code><\/td>\n<td>Subject seen in a mirror; duality and introspection.<\/td>\n<\/tr>\n<tr>\n<td>Silhouette Shot<\/td>\n<td><code>silhouette shot<\/code><\/td>\n<td>Backlit subject rendered as a dark shape; graphic mystery.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/video-shot-types-framing.md"}, "components/video-components/2": {"title": "Prompt Component: Lighting (Video)", "html": "\n<p><strong>Category:<\/strong> Video prompt building blocks\n<strong>Block:<\/strong> Lighting<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Lighting is the fastest way to set mood, genre, and production value in a video prompt. It tells the model the quality, color, and direction of light, which shapes skin tones, shadows, and atmosphere. Video-specific lighting language references fixtures and sources that read as motivated on screen.<\/p>\n<h2>How to use<\/h2>\n<p>Pick one dominant lighting setup per clip; one strong, specific choice beats three vague ones. Pair lighting with a time of day when relevant (golden hour, blue hour). Avoid contradictory sources such as harsh midday sun plus moonlight in the same prompt.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Golden Hour<\/td>\n<td><code>golden hour lighting<\/code><\/td>\n<td>Warm low sun; flattering, romantic, cinematic.<\/td>\n<\/tr>\n<tr>\n<td>Blue Hour<\/td>\n<td><code>blue hour lighting<\/code><\/td>\n<td>Twilight after sunset; cool tones, moody exteriors.<\/td>\n<\/tr>\n<tr>\n<td>Three-Point Lighting<\/td>\n<td><code>three-point lighting<\/code><\/td>\n<td>Key + fill + back light; the classic balanced talent setup.<\/td>\n<\/tr>\n<tr>\n<td>Practical Lights<\/td>\n<td><code>practical lights visible in frame<\/code><\/td>\n<td>Lamps and fixtures motivate the light; naturalistic interiors.<\/td>\n<\/tr>\n<tr>\n<td>Motivated Lighting<\/td>\n<td><code>motivated lighting<\/code><\/td>\n<td>Light reads as sourced from in-scene elements; believable night interiors.<\/td>\n<\/tr>\n<tr>\n<td>Neon-Noir<\/td>\n<td><code>neon-noir lighting<\/code><\/td>\n<td>Colored neon against darkness; cyberpunk urban mood.<\/td>\n<\/tr>\n<tr>\n<td>Sodium Vapor Night<\/td>\n<td><code>sodium vapor street lighting<\/code><\/td>\n<td>Orange night exteriors; gritty city atmosphere.<\/td>\n<\/tr>\n<tr>\n<td>Fluorescent Interior<\/td>\n<td><code>harsh fluorescent lighting<\/code><\/td>\n<td>Cold institutional interiors; clinical or bureaucratic dread.<\/td>\n<\/tr>\n<tr>\n<td>Candlelight<\/td>\n<td><code>candlelight<\/code><\/td>\n<td>Warm flickering practicals; intimate period mood.<\/td>\n<\/tr>\n<tr>\n<td>Moonlight<\/td>\n<td><code>moonlight<\/code><\/td>\n<td>Cool blue night exteriors; quiet and ethereal.<\/td>\n<\/tr>\n<tr>\n<td>Firelight<\/td>\n<td><code>flickering firelight<\/code><\/td>\n<td>Warm unstable glow; primal night scenes.<\/td>\n<\/tr>\n<tr>\n<td>Rembrandt Lighting<\/td>\n<td><code>Rembrandt lighting<\/code><\/td>\n<td>Triangle of light on the cheek; dramatic portrait modeling.<\/td>\n<\/tr>\n<tr>\n<td>Split Lighting<\/td>\n<td><code>split lighting<\/code><\/td>\n<td>Half the face lit, half in shadow; tension and duality.<\/td>\n<\/tr>\n<tr>\n<td>Butterfly Lighting<\/td>\n<td><code>butterfly lighting<\/code><\/td>\n<td>Overhead frontal light; glamorous classic portraiture.<\/td>\n<\/tr>\n<tr>\n<td>Rim Light<\/td>\n<td><code>rim lighting<\/code><\/td>\n<td>Edge light separating subject from background; depth and drama.<\/td>\n<\/tr>\n<tr>\n<td>Backlit Silhouette<\/td>\n<td><code>strong backlight, silhouette<\/code><\/td>\n<td>Subject dark against a bright background; graphic mystery.<\/td>\n<\/tr>\n<tr>\n<td>High-Key<\/td>\n<td><code>high-key lighting<\/code><\/td>\n<td>Bright, even, low contrast; cheerful commercial look.<\/td>\n<\/tr>\n<tr>\n<td>Low-Key<\/td>\n<td><code>low-key lighting<\/code><\/td>\n<td>Dark with selective highlights; noir and horror.<\/td>\n<\/tr>\n<tr>\n<td>Volumetric / God Rays<\/td>\n<td><code>volumetric god rays<\/code><\/td>\n<td>Visible light shafts through haze; epic atmosphere.<\/td>\n<\/tr>\n<tr>\n<td>TV Screen Glow<\/td>\n<td><code>flickering TV glow on faces<\/code><\/td>\n<td>Cool pulsing light; late-night interior realism.<\/td>\n<\/tr>\n<tr>\n<td>Car Headlights<\/td>\n<td><code>car headlights cutting through darkness<\/code><\/td>\n<td>Hard beams in night exteriors; road-movie tension.<\/td>\n<\/tr>\n<tr>\n<td>Overcast Daylight<\/td>\n<td><code>soft overcast daylight<\/code><\/td>\n<td>Diffused, shadowless light; natural documentary feel.<\/td>\n<\/tr>\n<tr>\n<td>Harsh Midday Sun<\/td>\n<td><code>harsh midday sun, hard shadows<\/code><\/td>\n<td>High-contrast desert or urban realism.<\/td>\n<\/tr>\n<tr>\n<td>Strobe Light<\/td>\n<td><code>strobe light effect<\/code><\/td>\n<td>Intermittent flashes; club, horror, or chaos energy.<\/td>\n<\/tr>\n<tr>\n<td>Underlighting<\/td>\n<td><code>underlighting<\/code><\/td>\n<td>Light from below; unnatural and menacing.<\/td>\n<\/tr>\n<tr>\n<td>Top Light<\/td>\n<td><code>harsh overhead top light<\/code><\/td>\n<td>Interrogation or institutional feel; deep eye shadows.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/video-lighting.md"}, "components/video-components/3": {"title": "Prompt Component: Camera Bodies (Video)", "html": "\n<p><strong>Category:<\/strong> Video prompt building blocks\n<strong>Block:<\/strong> Camera Bodies<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Naming a camera body is a style shortcut: models have learned the visual signature of famous cinema cameras and formats. It steers grain, color science, dynamic range, and overall production feel in a few words. Format choices like 16mm or VHS also carry strong era and genre associations.<\/p>\n<h2>How to use<\/h2>\n<p>Use at most one camera or format per prompt, placed with the style descriptors. Treat it as a flavor, not a specification: no model actually renders through that camera's sensor. Avoid mixing formats (35mm film plus VHS camcorder) in one clip.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ARRI Alexa<\/td>\n<td><code>shot on ARRI Alexa<\/code><\/td>\n<td>Industry cinema standard; creamy highlights, filmic color.<\/td>\n<\/tr>\n<tr>\n<td>RED Komodo<\/td>\n<td><code>shot on RED Komodo<\/code><\/td>\n<td>Compact cinema camera; sharp modern digital look.<\/td>\n<\/tr>\n<tr>\n<td>Sony Venice<\/td>\n<td><code>shot on Sony Venice<\/code><\/td>\n<td>Full-frame cinema; rich color, high-end commercial feel.<\/td>\n<\/tr>\n<tr>\n<td>Blackmagic Pocket Cinema<\/td>\n<td><code>shot on Blackmagic Pocket Cinema Camera<\/code><\/td>\n<td>Indie film aesthetic; filmic color science.<\/td>\n<\/tr>\n<tr>\n<td>Canon C70<\/td>\n<td><code>shot on Canon C70<\/code><\/td>\n<td>Documentary cinema; natural skin tones.<\/td>\n<\/tr>\n<tr>\n<td>GoPro<\/td>\n<td><code>GoPro footage<\/code><\/td>\n<td>Ultra-wide action cam; immersive POV energy.<\/td>\n<\/tr>\n<tr>\n<td>FPV Drone<\/td>\n<td><code>FPV drone footage<\/code><\/td>\n<td>High-speed acrobatic aerials; adrenaline.<\/td>\n<\/tr>\n<tr>\n<td>16mm Film<\/td>\n<td><code>shot on 16mm film<\/code><\/td>\n<td>Grainy and textured; indie and documentary nostalgia.<\/td>\n<\/tr>\n<tr>\n<td>35mm Film<\/td>\n<td><code>shot on 35mm film<\/code><\/td>\n<td>Classic cinema grain and color; timeless.<\/td>\n<\/tr>\n<tr>\n<td>70mm IMAX<\/td>\n<td><code>shot on 70mm IMAX<\/code><\/td>\n<td>Epic scale and detail; blockbuster grandeur.<\/td>\n<\/tr>\n<tr>\n<td>VHS Camcorder<\/td>\n<td><code>VHS camcorder footage<\/code><\/td>\n<td>Lo-fi analog artifacts; 80s-90s home-video nostalgia.<\/td>\n<\/tr>\n<tr>\n<td>Super 8<\/td>\n<td><code>Super 8 film<\/code><\/td>\n<td>Dreamy grainy home movies; intimate memory feel.<\/td>\n<\/tr>\n<tr>\n<td>Bodycam<\/td>\n<td><code>bodycam footage<\/code><\/td>\n<td>Raw found-footage realism; documentary urgency.<\/td>\n<\/tr>\n<tr>\n<td>CCTV<\/td>\n<td><code>CCTV security footage<\/code><\/td>\n<td>Fixed wide surveillance look; voyeuristic tension.<\/td>\n<\/tr>\n<tr>\n<td>Smartphone<\/td>\n<td><code>shot on smartphone<\/code><\/td>\n<td>Casual vertical-video realism; social-media native.<\/td>\n<\/tr>\n<tr>\n<td>Broadcast ENG Camera<\/td>\n<td><code>broadcast news camera<\/code><\/td>\n<td>Live-TV sharpness; journalistic immediacy.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/video-camera-bodies.md"}, "components/video-components/4": {"title": "Prompt Component: Lenses (Video)", "html": "\n<p><strong>Category:<\/strong> Video prompt building blocks\n<strong>Block:<\/strong> Lenses<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Lens choice shapes perspective distortion, bokeh character, and flare behavior. Anamorphic versus spherical is the classic fork: one reads as epic widescreen cinema, the other as clean modern digital. Specialty glass like probe or vintage lenses adds instant visual identity.<\/p>\n<h2>How to use<\/h2>\n<p>Pick one lens per clip and keep it consistent with the shot scale (telephoto compression suits distant subjects, ultra-wide suits tight spaces). Avoid stacking multiple lens looks in a single prompt. Note that extreme distortion terms can fight against realistic faces.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Anamorphic<\/td>\n<td><code>anamorphic lens<\/code><\/td>\n<td>Horizontal lens flares and oval bokeh; epic widescreen cinema.<\/td>\n<\/tr>\n<tr>\n<td>Spherical<\/td>\n<td><code>spherical lens<\/code><\/td>\n<td>Clean modern look; standard digital cinema.<\/td>\n<\/tr>\n<tr>\n<td>Vintage Glass<\/td>\n<td><code>vintage lens<\/code><\/td>\n<td>Soft halation and swirly bokeh; nostalgic character.<\/td>\n<\/tr>\n<tr>\n<td>Probe Lens<\/td>\n<td><code>probe lens<\/code><\/td>\n<td>Macro tunneling through tiny spaces; otherworldly miniatures.<\/td>\n<\/tr>\n<tr>\n<td>Fisheye<\/td>\n<td><code>fisheye lens<\/code><\/td>\n<td>Extreme wide distortion; skate-video and surveillance energy.<\/td>\n<\/tr>\n<tr>\n<td>Tilt-Shift<\/td>\n<td><code>tilt-shift lens<\/code><\/td>\n<td>Miniature effect; selective-focus dioramas.<\/td>\n<\/tr>\n<tr>\n<td>Telephoto<\/td>\n<td><code>long telephoto lens<\/code><\/td>\n<td>Compressed space; voyeuristic or nature-doc distance.<\/td>\n<\/tr>\n<tr>\n<td>Ultra-Wide<\/td>\n<td><code>ultra-wide angle lens<\/code><\/td>\n<td>Expansive distortion; epic landscapes, cramped interiors.<\/td>\n<\/tr>\n<tr>\n<td>Macro<\/td>\n<td><code>macro lens<\/code><\/td>\n<td>Extreme detail; textures and tiny worlds.<\/td>\n<\/tr>\n<tr>\n<td>50mm Prime<\/td>\n<td><code>50mm prime lens<\/code><\/td>\n<td>Natural human-eye perspective; intimate realism.<\/td>\n<\/tr>\n<tr>\n<td>85mm Portrait<\/td>\n<td><code>85mm portrait lens<\/code><\/td>\n<td>Flattering compression; creamy subject separation.<\/td>\n<\/tr>\n<tr>\n<td>24mm Wide<\/td>\n<td><code>24mm wide lens<\/code><\/td>\n<td>Environmental storytelling with mild distortion.<\/td>\n<\/tr>\n<tr>\n<td>Zoom Lens<\/td>\n<td><code>zoom lens<\/code><\/td>\n<td>Variable framing; documentary flexibility.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/video-lenses.md"}, "components/video-components/5": {"title": "Prompt Component: Aperture &amp; Depth of Field (Video)", "html": "\n<p><strong>Category:<\/strong> Video prompt building blocks\n<strong>Block:<\/strong> Aperture &amp; Depth of Field<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Depth of field controls what stays sharp and what melts away, directing the viewer's eye through the frame. Shallow focus isolates subjects and hides background artifacts; deep focus delivers epic clarity. Rack focus and focus pulls add time-based attention shifts unique to video.<\/p>\n<h2>How to use<\/h2>\n<p>Choose one depth-of-field treatment per clip. Pair shallow-focus terms with a clear subject so the model knows what to keep sharp. Avoid asking for shallow and deep focus simultaneously, and use rack focus only when two named subjects exist to shift between.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Shallow Depth of Field<\/td>\n<td><code>shallow depth of field<\/code><\/td>\n<td>Subject sharp, background melted; cinematic focus.<\/td>\n<\/tr>\n<tr>\n<td>Deep Focus<\/td>\n<td><code>deep focus<\/code><\/td>\n<td>Everything sharp front to back; epic clarity.<\/td>\n<\/tr>\n<tr>\n<td>Rack Focus<\/td>\n<td><code>rack focus<\/code><\/td>\n<td>Focus shifts between subjects over time; guides attention.<\/td>\n<\/tr>\n<tr>\n<td>f/1.4 Creamy Bokeh<\/td>\n<td><code>f/1.4, creamy bokeh<\/code><\/td>\n<td>Extreme background blur; dreamy subject isolation.<\/td>\n<\/tr>\n<tr>\n<td>f/2.8<\/td>\n<td><code>f/2.8<\/code><\/td>\n<td>Soft background separation; the standard cinematic look.<\/td>\n<\/tr>\n<tr>\n<td>f/8<\/td>\n<td><code>f/8<\/code><\/td>\n<td>Deep focus; landscapes and architecture tack sharp.<\/td>\n<\/tr>\n<tr>\n<td>Bokeh Lights<\/td>\n<td><code>bokeh background lights<\/code><\/td>\n<td>Out-of-focus city lights; romantic night mood.<\/td>\n<\/tr>\n<tr>\n<td>Slow Focus Pull<\/td>\n<td><code>slow focus pull<\/code><\/td>\n<td>Gradual focus shift; reveals or transitions within a shot.<\/td>\n<\/tr>\n<tr>\n<td>Soft Focus<\/td>\n<td><code>soft focus<\/code><\/td>\n<td>Diffused dreaminess; romance and memory.<\/td>\n<\/tr>\n<tr>\n<td>Tilt-Shift Miniature<\/td>\n<td><code>tilt-shift miniature effect<\/code><\/td>\n<td>Band of focus; makes real scenes look like models.<\/td>\n<\/tr>\n<tr>\n<td>Split Diopter<\/td>\n<td><code>split diopter<\/code><\/td>\n<td>Near and far both sharp; stylized deep staging.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/video-aperture-depth-of-field.md"}, "components/video-components/6": {"title": "Prompt Component: Audio &amp; Sound (Video)", "html": "\n<p><strong>Category:<\/strong> Video prompt building blocks\n<strong>Block:<\/strong> Audio &amp; Sound<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Native-audio video models (Veo 3/3.1, Wan 2.6+, Seedance) generate a soundtrack alongside the picture, and the prompt is the only way to direct it. Dialogue needs quoted lines with delivery notes for lip-sync; effects must be synced to visible events to feel real. Explicit negatives like 'no music' prevent unwanted scores and copyright refusals.<\/p>\n<h2>How to use<\/h2>\n<p>Keep audio direction to a few elements: one dialogue or voice element, one or two synced effects, and one ambient bed. Always tie effects to visible action. On models that police music, request diegetic or ambient sound instead of named songs or scores.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dialogue with Delivery<\/td>\n<td><code>\"We need to leave. Now.\" she whispers urgently<\/code><\/td>\n<td>Quoted dialogue plus a delivery note; drives lip-sync on native-audio models.<\/td>\n<\/tr>\n<tr>\n<td>Voiceover Narration<\/td>\n<td><code>deep voiceover narration<\/code><\/td>\n<td>Off-screen narrator; documentary and trailer structure.<\/td>\n<\/tr>\n<tr>\n<td>Footsteps SFX<\/td>\n<td><code>SFX: footsteps on gravel, synced to movement<\/code><\/td>\n<td>Foley tied to visible action; grounds realism.<\/td>\n<\/tr>\n<tr>\n<td>Synced Action SFX<\/td>\n<td><code>SFX: door slam synced to the visible door closing<\/code><\/td>\n<td>Sound locked to on-screen events; critical for believability.<\/td>\n<\/tr>\n<tr>\n<td>Character Vocalization<\/td>\n<td><code>she gasps sharply<\/code><\/td>\n<td>Non-dialogue vocal sound; emotion without words.<\/td>\n<\/tr>\n<tr>\n<td>Ambient Room Tone<\/td>\n<td><code>ambient room tone, quiet hum<\/code><\/td>\n<td>Subtle bed that makes interiors feel real instead of silent.<\/td>\n<\/tr>\n<tr>\n<td>City Ambience<\/td>\n<td><code>distant traffic, city ambience<\/code><\/td>\n<td>Urban bed; sells the exterior location.<\/td>\n<\/tr>\n<tr>\n<td>Nature Ambience<\/td>\n<td><code>birds chirping, leaves rustling<\/code><\/td>\n<td>Daytime exterior bed; peaceful or pastoral.<\/td>\n<\/tr>\n<tr>\n<td>Rain and Thunder<\/td>\n<td><code>rain patter with distant thunder<\/code><\/td>\n<td>Weather bed; stormy mood.<\/td>\n<\/tr>\n<tr>\n<td>Crowd Walla<\/td>\n<td><code>crowd murmur, indistinct chatter<\/code><\/td>\n<td>Background voices; busy public spaces.<\/td>\n<\/tr>\n<tr>\n<td>Phone Ring<\/td>\n<td><code>SFX: const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function findModel(groupId, modelId){
  const g = MANIFEST.groups.find(g => g.id === groupId);
  if(!g) return null;
  const m = g.models.find(m => m.id === modelId);
  return m ? {g, m} : null;
}

function enhanceContent(root){
  // wrap tables for horizontal scroll
  root.querySelectorAll('table').forEach(t => {
    if(t.parentElement.classList.contains('table-wrap')) return;
    const w = document.createElement('div'); w.className = 'table-wrap';
    t.before(w); w.appendChild(t);
  });
  // copy buttons on code blocks
  root.querySelectorAll('pre').forEach(pre => {
    const wrap = document.createElement('div'); wrap.className = 'code-wrap';
    pre.before(wrap); wrap.appendChild(pre);
    const btn = document.createElement('button'); btn.className = 'copy-btn'; btn.textContent = 'Copy';
    btn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(pre.innerText); btn.textContent = 'Copied'; }
      catch(e){ btn.textContent = 'Select + copy'; }
      setTimeout(() => btn.textContent = 'Copy', 1600);
    });
    wrap.appendChild(btn);
  });
  // group good-vs-bad pairs into cards
  (function groupPairs(){
    const kids = [...root.children];
    for(const el of kids){
      const strong = el.tagName === 'P' ? el.querySelector(':scope > strong') : null;
      if(strong && /^\s*❌/.test(strong.textContent) && /bad/i.test(strong.textContent)){
        const card = document.createElement('div'); card.className = 'pair-card';
        el.before(card);
        let node = el, done = false;
        while(node && !done){
          const next = node.nextSibling;
          const s = node.tagName === 'P' ? node.querySelector(':scope > strong') : null;
          if(s){
            if(/^\s*❌/.test(s.textContent)) node.classList.add('pair-bad');
            else if(/^\s*✅/.test(s.textContent)) node.classList.add('pair-good');
            else if(/^\s*why/i.test(s.textContent)){ node.classList.add('pair-why'); done = true; }
          }
          card.appendChild(node);
          node = (next && next.parentNode === root) ? next : null;
        }
        groupPairs();
        return;
      }
    }
  })();
  // principle callouts (not inside pair cards)
  root.querySelectorAll('p > strong').forEach(s => {
    const p = s.parentElement;
    if(p.closest('.pair-card')) return;
    if(/^\s*❌/.test(s.textContent)) p.classList.add('callout-bad');
    else if(/^\s*✅/.test(s.textContent)) p.classList.add('callout-good');
  });
}

function setActiveNav(groupId, modelId){
  $$('.nav-item').forEach(a => {
    a.classList.toggle('active', a.dataset.model === groupId + '/' + modelId);
  });
}

function showHome(){
  setActiveNav('', '');
  $('#tabbar').innerHTML = '<div class="crumbs"><span class="g-badge g-image">GUIDES</span><span>Home</span></div>'
    + '<h2 class="model-title" style="margin-bottom:14px">All prompt guides</h2>';
  const c = $('#content');
  c.innerHTML = HOME_HTML;
  enhanceContent(c);
  document.title = 'Prompt Atlas — AI Prompt Guides';
  window.scrollTo(0, 0);
}

function showGuide(groupId, modelId, tabIdx){
  const found = findModel(groupId, modelId);
  if(!found){ showHome(); return; }
  const {g, m} = found;
  tabIdx = Math.max(0, Math.min(tabIdx, m.tabs.length - 1));
  const key = groupId + '/' + modelId + '/' + tabIdx;
  const guide = GUIDES[key];
  if(!guide){ showHome(); return; }
  setActiveNav(groupId, modelId);
  const totalPairs = m.tabs.reduce((n, _, i) => n + (GUIDES[groupId + '/' + modelId + '/' + i] || {pairs:0}).pairs, 0);
  $('#tabbar').innerHTML =
    '<div class="crumbs"><span class="g-badge g-' + groupId + '">' + g.label + '</span><span>' + m.label + '</span></div>' +
    '<h2 class="model-title">' + guide.title + '</h2>' +
    '<p class="model-meta">' + m.tabs.length + ' version' + (m.tabs.length > 1 ? 's' : '') +
    ' &middot; ' + totalPairs + ' good-vs-bad prompt pairs</p>' +
    '<div class="tabs">' + m.tabs.map((t, i) =>
      '<button class="tab' + (i === tabIdx ? ' active' : '') + '" data-tab="' + i + '">' + t.label + '</button>'
    ).join('') + '</div>';
  $$('#tabbar .tab').forEach(b => b.addEventListener('click', () => {
    location.hash = '#/' + groupId + '/' + modelId + '/' + b.dataset.tab;
  }));
  const c = $('#content');
  c.innerHTML = guide.html + '<p class="src-note">Source file: <code>' + guide.file + '</code> &middot; blanks mean the detail could not be verified.</p>';
  enhanceContent(c);
  document.title = guide.title + ' — Prompt Atlas';
  window.scrollTo(0, 0);
}

function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/');
  if(parts.length === 3 && parts[0] && parts[1] && /^\d+$/.test(parts[2])){
    showGuide(parts[0], parts[1], parseInt(parts[2], 10));
  } else {
    showHome();
  }
  document.body.classList.remove('nav-open');
}

// sidebar search filter
$('#navSearch').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  $$('.nav-item').forEach(a => {
    a.style.display = (!q || a.dataset.search.includes(q)) ? '' : 'none';
  });
  $$('.nav-group').forEach(gr => {
    const anyVisible = [...gr.querySelectorAll('.nav-item')].some(a => a.style.display !== 'none');
    gr.style.display = anyVisible ? '' : 'none';
  });
});

// mobile sidebar
$('#hamburger').addEventListener('click', () => document.body.classList.toggle('nav-open'));
$('#sidebar').addEventListener('click', e => {
  if(e.target.closest('.nav-item') && window.innerWidth <= 900) document.body.classList.remove('nav-open');
});

window.addEventListener('hashchange', route);
route();
</script>
