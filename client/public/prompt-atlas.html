l natural-language sentences describing the scene<\/td>\n<\/tr>\n<tr>\n<td>CLIP weighting syntax <code>(word:1.4)<\/code>, <code>((word))<\/code>, <code>BREAK<\/code><\/td>\n<td>Plain descriptive emphasis \u2014 the encoder doesn't parse these<\/td>\n<\/tr>\n<tr>\n<td>Loading the negative with <code>blurry, bad quality, typo<\/code><\/td>\n<td>State quality positively: <code>sharp focus<\/code>, <code>highly detailed<\/code>, <code>perfect text<\/code><\/td>\n<\/tr>\n<tr>\n<td>Vague single-word prompts (<code>cat<\/code>, <code>poster<\/code>)<\/td>\n<td>A descriptive sentence, or use the Prompt Enhancer to expand<\/td>\n<\/tr>\n<tr>\n<td>Writing text-to-render without quotes (<code>GARDEN OF LIFE sign<\/code>)<\/td>\n<td>Quote the exact string: a sign reading <code>\"GARDEN OF LIFE\"<\/code><\/td>\n<\/tr>\n<tr>\n<td>Very long adjective dumps that exceed the token limit<\/td>\n<td>Keep the descriptive core under ~512 tokens; front-load the subject<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>Base: 28\u201350 (official); Turbo: 8 NFEs (9 <code>num_inference_steps<\/code> in diffusers = 8 DiT forwards)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>Base: 3.0\u20135.0; Turbo: 0.0 (CFG removed entirely)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>512\u00d7512 to 2048\u00d72048 total pixel area, any aspect ratio<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>diffusers <code>ZImagePipeline<\/code> defaults<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>bfloat16 recommended<\/td>\n<\/tr>\n<tr>\n<td><strong>CFG normalization<\/strong><\/td>\n<td><code>False<\/code> for general/stylized output, <code>True<\/code> for realism (base only, per official README)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Image<\/h3>\n<p>The prompt must carry the full scene: subject, action, setting, style, lighting. Lean into the model's strengths \u2014 photorealistic detail and exact bilingual text rendering \u2014 by quoting any in-image text verbatim and describing the lettering style and placement. For the base model, pair with a negative prompt for unwanted content; the official README strongly recommends negatives for better control. For Turbo, skip the negative (it has no effect) and keep CFG at 0.<\/p>\n<h3>Image-to-Image<\/h3>\n<p>The <strong>Z-Image-Edit<\/strong> variant is the purpose-built checkpoint for image-to-image: it takes natural-language editing instructions and performs creative edits with strong instruction following. Prompts should describe the desired change as an instruction (\"change the background to a snowy forest, keep the woman's pose and red Hanfu unchanged\") rather than re-describing the whole image. Bilingual editing instructions are supported.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>Garden portrait with sign text<\/h3>\n<p><strong>Intended content:<\/strong> Elderly gardener pruning roses, wooden sign reading \"GARDEN OF LIFE\"<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>gardener, old, roses, garden, sign, 8k, masterpiece, best quality, ((detailed)),\nno blurry, no watermark\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>An elderly gardener with wrinkled skin and rough hands, pruning red roses in a\nVictorian garden. In the background, a rustic wooden sign clearly reads &quot;GARDEN\nOF LIFE&quot;. Dappled sunlight filtering through oak trees. Shot on Leica M6, Kodak\nPortra 400 film grain, soft backlighting, highly detailed.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt is tag soup with CLIP-era syntax the Qwen3 encoder doesn't parse, and it never quotes the sign text \u2014 Z-Image renders in-image text only when the exact string is given. The good prompt uses natural language, quotes <code>\"GARDEN OF LIFE\"<\/code> verbatim with placement and style context, and grounds the look photographically.<\/p>\n<h3>Chinese fashion portrait<\/h3>\n<p><strong>Intended content:<\/strong> Young Chinese woman in red Hanfu holding a folding fan at night<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>beautiful chinese girl, red hanfu, fan, night, neon, (masterpiece:1.3), best\nquality, trending\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Young Chinese woman in red Hanfu with intricate embroidery, impeccable makeup\nand a red floral forehead pattern, elaborate high bun with a golden phoenix\nheaddress. She holds a round folding fan painted with a lady, trees and a bird.\nSoft-lit outdoor night background with a silhouetted tiered pagoda and blurred\ncolorful distant lights.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt relies on subjective filler (\"beautiful\") and weighting syntax with no visual signal for garment detail or composition. The good prompt \u2014 adapted from Tongyi-MAI's own example \u2014 names concrete visual elements (embroidery, phoenix headdress, fan painting) and describes the background, which is exactly the specificity the encoder uses to render coherent detail.<\/p>\n<h3>Cafe poster with headline text<\/h3>\n<p><strong>Intended content:<\/strong> Vintage cafe poster with the headline \"FRESH COFFEE\"<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>vintage cafe poster, FRESH COFFEE text, retro, aesthetic, 8k\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A vintage cafe poster with a cream background and art-deco borders. The\nheadline &quot;FRESH COFFEE&quot; appears in large dark-brown serif letters across the\ntop. Below it, an illustration of a steaming ceramic cup on a wooden table.\nWarm, nostalgic color palette, subtle paper texture.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Unquoted text (\"FRESH COFFEE text\") is parsed as a content hint, not a rendering instruction, and often comes out garbled. Quoting the exact string plus specifying typeface, size, color, and placement is how Z-Image's text-rendering strength is activated.<\/p>\n<h3>Photorealistic product shot<\/h3>\n<p><strong>Intended content:<\/strong> Luxury watch product photo, dramatic lighting<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>luxury watch, product photo, dramatic, ((hyperdetailed)), 8k uhd, no blur,\nno distortion, BREAK, studio\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A luxury chronograph watch with a brushed steel case and deep blue dial rests\non a dark slate surface. A single dramatic spotlight from the upper left\ncarves sharp highlights along the bezel, with deep shadows falling to the\nright. Macro product photography, shallow depth of field, dark moody\nbackground.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt mixes unsupported syntax (<code>BREAK<\/code>, double-paren emphasis) with vague quality adjectives and negative phrasing in the positive. The good prompt describes materials, surfaces, and lighting direction concretely \u2014 Z-Image's photorealism responds to physical description, not to buzzwords.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Photorealistic portrait (natural language)<\/h3>\n<pre><code>A young woman with freckles and windblown auburn hair stands on a rain-slicked\nneon-lit street at night, wearing a cream linen jacket. Cinematic composition,\nshallow depth of field, reflections shimmering on the wet pavement, natural\nskin texture.\n<\/code><\/pre>\n<p>Negative (base only): <code>blurry, distorted face, extra fingers, watermark, text errors<\/code><\/p>\n<h3>Bilingual text rendering<\/h3>\n<pre><code>A rustic wooden shop sign hanging above a tea house door reads &quot;\u6e05\u9999\u8336\u9986&quot; in\nelegant carved Chinese characters, warm lantern light glowing from inside the\nshop, evening street scene, photorealistic.\n<\/code><\/pre>\n<h3>Stylized illustration<\/h3>\n<pre><code>A stylized ink-wash illustration of misty mountains at dawn, layered ridges\nfading into pale gold fog, a lone fisherman in a small boat on a still lake,\nminimalist composition, traditional Chinese painting aesthetic.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Porting SDXL syntax<\/strong> (<code>(word:1.4)<\/code>, <code>((word))<\/code>, <code>BREAK<\/code>) \u2192 the encoder ignores or mangles these; write natural language instead.<\/li>\n<li><strong>Using a negative prompt on Turbo<\/strong> \u2192 Turbo's CFG is removed (<code>guidance_scale=0.0<\/code>), so negatives have no effect; phrase exclusions positively.<\/li>\n<li><strong>Not quoting in-image text<\/strong> \u2192 text renders garbled unless the exact string is in double quotes with style/placement context.<\/li>\n<li><strong>Prompts that exceed the token limit<\/strong> \u2192 the demo truncates around 512 tokens (1024 locally); trailing detail is silently dropped, so front-load.<\/li>\n<li><strong>Carrying over CFG/steps from other models<\/strong> \u2192 the single most common misconfiguration per community guides: base wants guidance 3\u20135 and 28\u201350 steps, Turbo wants 8 steps and zero guidance.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Z-Image 6B (S3-DiT single-stream diffusion transformer); variants: Z-Image-Turbo (distilled, 8 NFE), Z-Image-Omni-Base (generation + editing), Z-Image-Edit (editing)<\/li>\n<li><strong>Text Encoder:<\/strong> Qwen3 4B encoder (per third-party model documentation)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> ~512 in the official demo; up to 1024 via <code>max_sequence_length<\/code> locally<\/li>\n<li><strong>Training Data / Notes:<\/strong> Released by Alibaba Tongyi-MAI \u2014 Turbo 2025-11-26, base 2026-01-27 \u2014 under Apache-2.0. Post-training: SFT for the base, plus RL and Decoupled-DMD distillation for Turbo. Turbo ranked #1 open-source on the Artificial Analysis text-to-image leaderboard (Dec 2025). Diffusers support via <code>ZImagePipeline<\/code>; also runs in ComfyUI and mflux.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/Tongyi-MAI/Z-Image (official repo: model zoo, base/Turbo recommended parameters, inference examples, Prompt Enhancer, bilingual text rendering)<\/li>\n<li>https://hackmd.io/@PixSprout/SkYdKrvNZe (Z-Image Prompt Engineering Guide: 4-layer structure, positive phrasing, quoting text)<\/li>\n<li>https://github.com/maciejdzierzek/z-image-prompt-generator (token budget 512/1024, Turbo low-diversity notes, verified against Tongyi-MAI sources)<\/li>\n<li>https://github.com/ZizheRuan/awesome-Alibaba-Z-Image (community prompt gallery; family variants)<\/li>\n<li>https://vast.ai/model/z-image-turbo (architecture, Qwen3 4B encoder, 6B parameters, 8 function evaluations)<\/li>\n<li>https://lovegen.ai/z-image-turbo (release date, license, prompt-length/aspect-ratio specs)<\/li>\n<\/ul>", "pairs": 4, "file": "models/image/z-image.md"}, "image/krea-2/0": {"title": "Prompt Guide: Krea 2 (Raw)", "html": "\n<p><strong>Model:<\/strong> Krea 2 \u2014 Raw checkpoint (undistilled base/midtrain; sibling: Krea 2 Turbo, see <code>krea-2-turbo.md<\/code>)\n<strong>Developer:<\/strong> Krea AI\n<strong>Type:<\/strong> Image\n<strong>Text Encoder:<\/strong> Qwen3-VL 4B<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Krea 2 is a ~12.9B-parameter diffusion-transformer text-to-image model paired with a Qwen3-VL 4B text encoder (roughly 17.3B parameters total), released by Krea AI. Unlike CLIP-era models it is trained on natural-language captions and is \"faithfulness first\": it follows direct, concrete descriptions accurately without needing artificial weighting or quality buzzwords. The <strong>Raw<\/strong> checkpoint is the undistilled base: it runs with real classifier-free guidance over ~20\u201352 steps, supports genuine negative prompts, generates natively up to 1K resolution, and is the recommended checkpoint for LoRA training (Krea's official guidance: train LoRAs on Raw, apply them on Turbo for inference). For the distilled few-step variant, see the Turbo guide.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write <strong>flowing natural-language prose, not tag lists<\/strong> \u2014 Krea 2 was trained on natural language and punishes keyword stuffing. Describe the scene concretely in one cohesive paragraph: subject, setting, shot, camera, style, lighting. Start simple and add detail only where you need control; the model's aesthetic sense fills gaps.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>cyberpunk girl, neon lights, 8k, masterpiece, trending on artstation,\n((ultra-detailed)), photorealistic, cinematic\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A cinematic close-up of a cyberpunk girl with glowing neon implants standing\nin a rain-slicked city street at night, reflections shimmering on the wet\nasphalt, shallow depth of field, hyperrealistic detail.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not supported<\/td>\n<td>No evidence of support; the model follows direct description \u2014 emphasize by describing, not weighting.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not supported<\/td>\n<td>Same as above; avoid CLIP-era syntax.<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not supported<\/td>\n<td>CLIP-tooling-specific; not applicable to the Qwen3-VL encoder path.<\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not supported<\/td>\n<td>No evidence in official docs or community workflows.<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td>Raw runs real CFG, so a true negative prompt works \u2014 a meaningful difference from Turbo, whose negative is zeroed out.<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Supported<\/td>\n<td>LoRA trigger words are supported; Raw has the best LoRA fidelity of the family.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td>No official documentation found.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<p>Krea's official guidance is to match length to intent (per community documentation of Krea's prompting guidelines): explore with 5\u201320 words, generate in a controlled way with 30\u201380 words, and use 80\u2013140 words for complex scenes. Longer, detailed prose yields the best quality, but minimal prompts also produce strong results.<\/p>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Under ~5 words \u2192 the model improvises freely; fine for exploration, unreliable for directed work.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>30\u201380 words of flowing prose for controlled generation; 80\u2013140 for complex multi-element scenes. One cohesive paragraph, no bullets/JSON/markdown.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Over-specification backfires: inventing hyper-specific clothing/colors/materials the input doesn't imply degrades faithfulness. Respect existing detail \u2014 polish, don't bloat.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>Official Krea structure (from Krea's base agent): <strong>Subject \u2192 Mood \u2192 Visual style/medium \u2192 Composition/framing \u2192 Lighting \u2192 Grounded details<\/strong>.<\/p>\n<pre><code>[Subject with key attributes] + [setting/scene] + [shot type + camera/lens] +\n[visual style/medium] + [lighting] + [mood] + [texture, palette, material detail]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject<\/td>\n<td>Who/what, with distinguishing features<\/td>\n<td><code>A lone woman in a raincoat<\/code><\/td>\n<\/tr>\n<tr>\n<td>Setting / scene<\/td>\n<td>Where, spatial relationships<\/td>\n<td><code>at the edge of a cornfield, farmhouse window glowing behind her<\/code><\/td>\n<\/tr>\n<tr>\n<td>Composition / shot<\/td>\n<td>Framing and camera<\/td>\n<td><code>medium close-up portrait, shallow depth of field<\/code><\/td>\n<\/tr>\n<tr>\n<td>Visual style / medium<\/td>\n<td>Photo, film, illustration, render<\/td>\n<td><code>photorealistic 35mm film photograph<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>Light source and quality<\/td>\n<td><code>overcast dusk, practical low light from the farmhouse window<\/code><\/td>\n<\/tr>\n<tr>\n<td>Mood + grounded detail<\/td>\n<td>Emotional tone, textures, palette<\/td>\n<td><code>eerie folk horror mood, visible grain, damp fabric texture<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flowing natural-language description<\/td>\n<td><code>A tiny figure and a small white dog sit side-by-side in the deep green shadow of a massive tree<\/code><\/td>\n<\/tr>\n<tr>\n<td>Real medium grounding (anti \"AI-plastic\")<\/td>\n<td><code>shot on 35mm<\/code>, <code>Kodak Portra 400<\/code>, <code>visible grain<\/code>, <code>natural skin texture, visible pores, no retouching<\/code><\/td>\n<\/tr>\n<tr>\n<td>Technical photo detail words<\/td>\n<td><code>shallow depth of field<\/code>, <code>golden hour<\/code>, <code>soft natural lighting<\/code>, <code>bokeh background<\/code><\/td>\n<\/tr>\n<tr>\n<td>Exact text in quotes for text rendering<\/td>\n<td><code>a sign reading \"FRESH COFFEE\"<\/code><\/td>\n<\/tr>\n<tr>\n<td>Concrete spatial relationships<\/td>\n<td><code>steps carefully through knee-deep water<\/code>, <code>rests in the lower left foreground<\/code><\/td>\n<\/tr>\n<tr>\n<td>Mood words when tone matters<\/td>\n<td><code>eerie folk horror mood<\/code>, <code>serene<\/code>, <code>cinematic noir<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Comma-soup tag lists (<code>girl, neon, 8k, masterpiece<\/code>)<\/td>\n<td>Full clauses: <code>A cinematic close-up of a cyberpunk girl...<\/code><\/td>\n<\/tr>\n<tr>\n<td>Quality buzzwords (<code>8k, masterpiece, ultra-detailed, trending on artstation<\/code>)<\/td>\n<td>Nothing \u2014 drop them; they reduce prompt clarity and degrade accuracy<\/td>\n<\/tr>\n<tr>\n<td><code>flawless, smooth, perfect, hyperdetailed<\/code><\/td>\n<td><code>natural skin texture, visible pores, candid framing<\/code> (avoids the glossy AI look)<\/td>\n<\/tr>\n<tr>\n<td>Contradictory styles (<code>photorealistic oil painting<\/code>)<\/td>\n<td>One medium: <code>photorealistic<\/code> OR <code>oil painting<\/code><\/td>\n<\/tr>\n<tr>\n<td>Vague praise (<code>beautiful, amazing, awesome<\/code>)<\/td>\n<td>Concrete visual descriptors<\/td>\n<\/tr>\n<tr>\n<td>Over-specifying invented details<\/td>\n<td>Respect the input; don't invent clothing/colors/materials it doesn't imply<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>~20\u201352 (official example: 52; community workflows: 20\u201328)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>3.0\u20135.5 (official example: 3.5; InvokeAI default maps guidance 4.5 \u2248 CFG 5.5)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>Up to 1K (trained to 1K); 1024\u00d71024 default<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>Standard full sampler with CFG (reference <code>inference.py<\/code> pipeline)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>FP8 recommended on 24GB cards; GGUF Q4_K for lower VRAM<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Image<\/h3>\n<p>Write one cohesive paragraph in natural language, ordered subject \u2192 scene \u2192 shot \u2192 camera \u2192 style \u2192 lighting \u2192 medium \u2192 palette. The model is faithfulness-first: state subjects, actions, and spatial relationships explicitly and it will follow them. Negative prompts work (real CFG) \u2014 use them for content exclusion when needed. Krea recommends exploratory prompting: start intentionally vague (5\u201320 words), use first generations as research, then narrow like an art director.<\/p>\n<h3>Image-to-Image<\/h3>\n<p>Krea 2 supports reference-image workflows including style transfer: a reference image can transfer palette, lines, texture, lighting, and composition onto a new scene. When using references, the prompt should describe only what the reference does <em>not<\/em> already provide \u2014 replicate only the requested aspects (subject, pose, palette, lighting) and adapt or replace anything the user specifies. Preserve the requested medium; don't pivot away from it. (Native inpainting/outpainting support was not verified \u2014 leave to the tool you're using.)<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>Cyberpunk portrait<\/h3>\n<p><strong>Intended content:<\/strong> Cinematic close-up of a cyberpunk girl with neon implants in a rainy city street<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>cyberpunk girl, neon lights, 8k, masterpiece, trending on artstation,\n((ultra-detailed)), cinematic, photorealistic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A cinematic close-up of a cyberpunk girl with glowing neon implants standing\nin a rain-slicked city street at night. Neon glow with deep shadows and\ndramatic rim lighting, reflections shimmering on the wet asphalt, shallow\ndepth of field, hyperrealistic detail.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt is keyword stuffing with buzzwords Krea 2's own guidance says degrade accuracy \u2014 \"8k\", \"masterpiece\", \"trending on artstation\" carry no visual signal. The good prompt uses flowing sentences with grounded detail (rain-slicked street, rim lighting, reflections) that the natural-language encoder actually understands.<\/p>\n<h3>Forest scene<\/h3>\n<p><strong>Intended content:<\/strong> Forest with silver leaves and a purple glowing sky<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>forest, silver leaves, purple sky, trees, glowing, nature, beautiful, amazing\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A forest where the trees have silver leaves and the sky glows purple, mist\ndrifting between the trunks, soft ethereal light filtering through the\ncanopy, serene and otherworldly mood.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Disconnected tags and vague praise (\"beautiful\", \"amazing\") give the model no relationships to follow. The good version expresses the same content as clear clauses with spatial and lighting relationships, which Krea 2 follows faithfully.<\/p>\n<h3>Text on a sign<\/h3>\n<p><strong>Intended content:<\/strong> Vintage enamel shop sign reading \"FRESH COFFEE\" above a cafe door<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>vintage coffee shop sign, FRESH COFFEE, retro aesthetic, high quality\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A vintage enamel shop sign reading &quot;FRESH COFFEE&quot; in cream lettering on a\ndark green background, mounted above a cafe door. Warm morning light, subtle\nrust at the sign's edges, photorealistic detail.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Unquoted text is treated as a content hint and often renders garbled; Krea 2 renders short legible text when the exact string is in double quotes. The good prompt also states the lettering style, color, and placement \u2014 Krea's documented text-rendering formula.<\/p>\n<h3>Photorealistic portrait (avoiding AI-plastic)<\/h3>\n<p><strong>Intended content:<\/strong> Natural candid portrait of a young woman, film look<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>flawless beautiful woman portrait, perfect skin, smooth, 8k, hyperdetailed,\nmasterpiece, studio photography\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A close-up portrait of a young woman with straight black hair, loose strands\nsweeping across her face, natural skin texture with visible pores and no\nretouching. Soft directional window light, shallow depth of field, shot on\n35mm film with visible grain, candid documentary framing.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> \"Flawless / smooth / perfect / 8k / hyperdetailed\" push Krea 2 toward the glossy AI-plastic look community workflows explicitly warn about. Naming a real medium (<code>shot on 35mm film<\/code>), real texture (<code>visible pores, no retouching, visible grain<\/code>), and candid framing produces the naturalistic result instead.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Simple exploration (official doc)<\/h3>\n<pre><code>immense rocket launch exhaust as seen from extremely close up\n<\/code><\/pre>\n<h3>Detailed illustration (official doc, abbreviated)<\/h3>\n<pre><code>A surreal retro-futuristic space scene features liquid chrome forming an\nabstract face merging with a glowing planetary horizon... vintage 1980s\nairbrush aesthetic with smooth gradients, ethereal lighting, and high-contrast\nmetallic rendering.\n<\/code><\/pre>\n<h3>Candid portrait formula<\/h3>\n<pre><code>A lone woman in a raincoat standing at the edge of a cornfield, medium\nclose-up portrait, overcast dusk, practical low light from a farmhouse\nwindow, eerie folk horror mood, photorealistic 35mm film photograph,\nvisible grain, damp fabric texture, shallow depth of field.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Writing SDXL-style tag soup<\/strong> \u2192 Krea 2 is trained on natural language; keyword lists degrade accuracy. Use flowing sentences.<\/li>\n<li><strong>Stuffing quality buzzwords<\/strong> (<code>8k<\/code>, <code>masterpiece<\/code>, <code>trending on artstation<\/code>) \u2192 documented to reduce prompt clarity and visual accuracy on Krea 2.<\/li>\n<li><strong>Using \"flawless / perfect / hyperdetailed\"<\/strong> \u2192 brings back the glossy AI-plastic look; ground with real medium + texture cues instead.<\/li>\n<li><strong>Bullets, JSON, or markdown in the prompt<\/strong> \u2192 Krea's base-agent rules require one cohesive paragraph; structured wrappers leak into nothing useful.<\/li>\n<li><strong>Over-specifying invented details<\/strong> \u2192 if the input doesn't imply specific clothing/colors/materials, don't invent them; polish, don't bloat.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Krea 2 Raw \u2014 ~12.9B diffusion-transformer, undistilled midtrain base (Turbo is the TDM-distilled few-step sibling)<\/li>\n<li><strong>Text Encoder:<\/strong> Qwen3-VL 4B<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> Not officially documented; community guidance uses word-count targets (5\u201320 explore / 30\u201380 controlled / 80\u2013140 complex)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Released by Krea AI under an open-weight license; checkpoints on Hugging Face (<code>krea/Krea-2-Raw<\/code>, <code>krea/Krea-2-Turbo<\/code>). Official guidance: train LoRAs on Raw (best fidelity), run inference on Turbo. Raw trained to 1K resolution.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/krea-ai/krea-2/blob/main/docs/prompting.md (official prompting guidelines: natural language, long detailed prompts, quoted text rendering, example prompts; all examples generated on Turbo at 2K)<\/li>\n<li>https://github.com/krea-ai/krea-2/blob/HEAD/README.md (Raw vs Turbo checkpoints, official inference settings: Raw 52 steps / CFG 3.5, Turbo 8 steps / CFG 0, mu 1.15; resolutions)<\/li>\n<li>https://modl.run/guides/krea-2/ (Raw vs Turbo table: steps, guidance, negatives, LoRA; Qwen3-VL 4B encoder; 12.9B MMDiT)<\/li>\n<li>https://github.com/polymath-wtf/kinodel-ide/blob/HEAD/skills/prompt-engine/krea2/krea-prompting-guide.md (base-agent structure: subject/mood/style/composition/lighting/grounded details; one-paragraph rule)<\/li>\n<li>https://github.com/mskiller/wildcard-prompt-studio/blob/HEAD/docs/KREA2_PROMPTING_GUIDE.md (natural language priority, faithfulness first, zero buzzword pollution; Turbo variant preset)<\/li>\n<li>https://github.com/apothis/crucible/blob/HEAD/docs/KREA2.md (natural-language prose ordering; anti-AI-plastic cues; negative-prompt behavior)<\/li>\n<li>https://github.com/weikinhuang/dotfiles/blob/HEAD/./config/pi/skills/krea2-prompting/SKILL.md (word-count guidelines; quoted text rendering; no negative prompt on the distilled path)<\/li>\n<\/ul>", "pairs": 4, "file": "models/image/krea-2.md"}, "image/krea-2/1": {"title": "Prompt Guide: Krea 2 Turbo", "html": "\n<p><strong>Model:<\/strong> Krea 2 \u2014 Turbo checkpoint (distilled few-step variant; sibling: Krea 2 Raw, see <code>krea-2.md<\/code>)\n<strong>Developer:<\/strong> Krea AI\n<strong>Type:<\/strong> Image\n<strong>Text Encoder:<\/strong> Qwen3-VL 4B<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Krea 2 Turbo is the distilled version of Krea 2 (same ~12.9B diffusion transformer + Qwen3-VL 4B text encoder), produced by TDM distillation into an 8-step sampler. Distillation bakes classifier-free guidance into the weights: <strong>CFG is disabled (0 / 1.0), and any negative prompt is zeroed out rather than encoded<\/strong> \u2014 the model \"answers in one pass, already as though it had been guided.\" It generates natively at 1K\u20132K resolution and is the recommended checkpoint for everyday use and fast iteration; the undistilled Raw checkpoint remains the one for LoRA training and prompts that need real guidance. Prompting follows the same natural-language rules as Raw, but Turbo rewards concise, punchy prose and fast explore-iterate loops over heavy prompt engineering.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write <strong>concise, punchy natural language focused on subject, lighting, and camera angle<\/strong> \u2014 Turbo's distilled weights already carry the aesthetic and guidance, so you steer with clear content and look, not with quality buzzwords, weighting syntax, or negatives (which are ignored). Keep it tight, generate fast, and iterate: Turbo's speed makes the explore \u2192 refine loop the real prompt-engineering tool.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>(masterpiece:1.4), ((cyberpunk girl)), 8k, ultra-detailed, trending on\nartstation, neon lights, BREAK, cinematic\nNegative: blurry, low quality, deformed, watermark\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A cinematic close-up of a cyberpunk girl with glowing neon implants standing\nin a rain-slicked city street at night.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not supported<\/td>\n<td>No evidence of support; emphasize by describing.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not supported<\/td>\n<td>Same as above.<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not supported<\/td>\n<td>CLIP-tooling-specific; not applicable.<\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not supported<\/td>\n<td>No evidence in official docs or community workflows.<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Not supported (ignored)<\/td>\n<td>Turbo is CFG-distilled: the negative conditioning is zeroed out (<code>ConditioningZeroOut<\/code> in ComfyUI graphs) and diffusers ignores <code>negative_prompt<\/code> when guidance \u2264 0. Exclusions must be phrased positively in the prompt.<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Supported<\/td>\n<td>LoRA trigger words work; official guidance is to train LoRAs on Raw and apply them on Turbo.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td>No official documentation found.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<p>Turbo works with minimal prompt engineering, and its few-step nature favors <strong>concise prompts that iterate fast<\/strong> \u2014 but the official doc also states long detailed prompts yield the best results (all official examples were generated on Turbo). Practical split from community Turbo presets: keep it punchy (subject + lighting + camera angle) for exploration, expand to 30\u201380 words of prose when you need control.<\/p>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Under ~5 words \u2192 heavy improvisation; fine for Turbo's fast exploration loops, unreliable for directed output.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>10\u201340 words for quick iterations; 30\u201380 words of flowing prose for controlled generation. One cohesive paragraph, no bullets/JSON/markdown.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Over-specification and buzzword padding waste Turbo's main advantage (speed) and can muddy the few-step sampler; prefer clear clauses over long run-ons.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>Same Krea structure as Raw, tightened for Turbo: <strong>Subject \u2192 setting \u2192 shot/camera \u2192 style/medium \u2192 lighting \u2192 mood<\/strong>.<\/p>\n<pre><code>[Subject with key attributes] + [setting] + [composition/shot] +\n[lighting] + [medium/style] + [texture/palette detail]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject<\/td>\n<td>Who/what, distinguishing features<\/td>\n<td><code>3D rendered matte black designer toy figure<\/code><\/td>\n<\/tr>\n<tr>\n<td>Attributes<\/td>\n<td>Shape, clothing, accessories<\/td>\n<td><code>stylized round anthropomorphic shape, backward black baseball cap<\/code><\/td>\n<\/tr>\n<tr>\n<td>Setting<\/td>\n<td>Environment<\/td>\n<td><code>solid vibrant blue background<\/code><\/td>\n<\/tr>\n<tr>\n<td>Shot / composition<\/td>\n<td>Framing<\/td>\n<td><code>high contrast minimal composition<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>Light quality<\/td>\n<td><code>studio lighting<\/code><\/td>\n<\/tr>\n<tr>\n<td>Medium / texture<\/td>\n<td>Material and surface<\/td>\n<td><code>smooth vinyl texture<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Concrete subject + action in plain sentences<\/td>\n<td><code>A cinematic close-up of a cyberpunk girl with glowing neon implants...<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lighting and camera angle (Turbo's highest-leverage tokens)<\/td>\n<td><code>neon glow with deep shadows, dramatic rim lighting<\/code>, <code>low-angle<\/code>, <code>close-up<\/code><\/td>\n<\/tr>\n<tr>\n<td>Real medium grounding<\/td>\n<td><code>shot on 35mm<\/code>, <code>Kodak Portra 400<\/code>, <code>visible grain<\/code>, <code>natural skin texture<\/code><\/td>\n<\/tr>\n<tr>\n<td>Exact quoted text for text rendering<\/td>\n<td><code>a \"HELLO\" sign in neon<\/code><\/td>\n<\/tr>\n<tr>\n<td>Specific colors, materials, spatial relations<\/td>\n<td><code>oversized gold-rimmed aviator sunglasses<\/code>, <code>index finger touching a subtle smile<\/code><\/td>\n<\/tr>\n<tr>\n<td>Mood in a word or two<\/td>\n<td><code>noir<\/code>, <code>serene<\/code>, <code>eerie folk horror<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Relying on a negative prompt (<code>negative: blurry, deformed<\/code>)<\/td>\n<td>Phrase it positively: <code>clean, sharp, well-formed hands<\/code> \u2014 Turbo's negative is zeroed<\/td>\n<\/tr>\n<tr>\n<td>Raising CFG to \"sharpen\" the image<\/td>\n<td>Leave CFG at 0/1.0 \u2014 raising it degrades Turbo output; iterate the prompt and seed instead<\/td>\n<\/tr>\n<tr>\n<td>Quality buzzwords (<code>8k, masterpiece, trending on artstation<\/code>)<\/td>\n<td>Nothing \u2014 they reduce clarity and degrade accuracy<\/td>\n<\/tr>\n<tr>\n<td><code>(word:1.4)<\/code> / <code>((word))<\/code> / <code>BREAK<\/code><\/td>\n<td>Plain descriptive sentences; the encoder doesn't parse these<\/td>\n<\/tr>\n<tr>\n<td>Long over-engineered prompts for a quick test<\/td>\n<td>Start short (5\u201320 words), use Turbo's speed to explore, then add detail<\/td>\n<\/tr>\n<tr>\n<td><code>flawless, smooth, perfect, hyperdetailed<\/code><\/td>\n<td><code>natural skin texture, visible pores, no retouching, candid framing<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>8 (the checkpoint was distilled for 8 steps)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>0 (disabled) / 1.0 \u2014 do not raise; raising CFG degrades the image<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>1024\u20132048 (up to 2K); all official examples generated at 2K<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>Few-step distilled sampler per the reference <code>inference.py<\/code> pipeline<\/td>\n<\/tr>\n<tr>\n<td><strong>Timestep-shift mu<\/strong><\/td>\n<td>1.15 recommended for Turbo (official README)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>FP8 recommended on 24GB cards; GGUF Q4_K for lower VRAM<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Image<\/h3>\n<p>Turbo's speed is the workflow: start intentionally vague (5\u201320 words), generate several directions, keep the strongest visual language, then add camera, lighting, material, mood, and composition detail. Because there is no second guided pass, control comes from prompt specificity + seed iteration, not from CFG or negatives. Long detailed prompts still yield the best final quality \u2014 use them once you've found the direction.<\/p>\n<h3>Image-to-Image<\/h3>\n<p>Same reference-image mechanics as the family: style transfer can carry palette, lines, texture, lighting, and composition from a reference into a new scene. Describe only what the reference doesn't supply; replicate only requested aspects. Native inpainting/outpainting support was not verified for Turbo \u2014 check your tool's docs. (For training adapters or needing real guidance/negatives, switch to the Raw checkpoint.)<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>Cyberpunk street (Turbo-style concise)<\/h3>\n<p><strong>Intended content:<\/strong> Cyberpunk girl with neon implants, rainy night street<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>cyberpunk girl, neon lights, 8k, masterpiece, trending on artstation\nNegative: blurry, low quality, deformed\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A cinematic close-up of a cyberpunk girl with glowing neon implants standing\nin a rain-slicked city street at night.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> On Turbo, the negative prompt is silently dropped (no CFG), so the \"Negative:\" line does nothing \u2014 exclusions must be phrased positively. The buzzwords add no visual signal for a distilled natural-language model. The short, concrete sentence gives Turbo everything it needs: subject, attributes, lighting, setting.<\/p>\n<h3>Sharpening a soft result<\/h3>\n<p><strong>Intended content:<\/strong> Crisp detailed portrait after a soft first generation<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>same prompt but with CFG raised to 7 and 50 steps for more detail\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A close-up portrait of a young East Asian woman with straight black hair and\nan intense gaze, soft directional studio lighting highlighting her facial\nfeatures, shallow depth of field, natural skin texture with visible pores,\nshot on 85mm.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Raising CFG on Turbo degrades the image \u2014 distillation already internalized guidance, and there is no second pass to strengthen. Detail on Turbo comes from a more specific prompt and seed iteration at the native 8 steps, not from forcing the sampler.<\/p>\n<h3>Designer toy figure<\/h3>\n<p><strong>Intended content:<\/strong> Matte black designer toy with gold sunglasses on blue background<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>designer toy, black, gold sunglasses, blue background, (best quality:1.5),\n((detailed)), studio, 8k\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>3D rendered matte black designer toy figure, stylized round anthropomorphic\nshape, backward black baseball cap, oversized gold-rimmed aviator sunglasses,\nsmooth vinyl texture, studio lighting, solid vibrant blue background, high\ncontrast minimal composition.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Weighting syntax is inert on Krea 2 and buzzwords dilute the signal. The good prompt \u2014 adapted from Krea's official example set \u2014 lists concrete attributes in flowing prose (shape, cap, sunglasses, texture, background), which is exactly what the distilled model follows.<\/p>\n<h3>Text on a neon sign<\/h3>\n<p><strong>Intended content:<\/strong> Neon sign reading \"HELLO\" in a dark room<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>neon sign, HELLO text, dark room, cool lighting, high quality render\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A dark room lit only by a &quot;HELLO&quot; sign in glowing pink neon mounted on a\nbrick wall, soft magenta light spilling across the floor, moody cinematic\natmosphere.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Unquoted text is parsed as a content hint and often renders garbled. Krea 2 renders short legible strings when the exact wording is in double quotes with lettering style and placement stated \u2014 and that quoting rule applies equally to Turbo.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Fast exploration (official doc)<\/h3>\n<pre><code>immense rocket launch exhaust as seen from extremely close up\n<\/code><\/pre>\n<h3>Controlled generation (official doc)<\/h3>\n<pre><code>close-up anime portrait of a young woman, large amber-brown eyes with\nintricate sparkling reflections, index finger delicately touching a subtle\nsmile, messy dark blue hair with loose strands crossing her face, white and\nnavy school uniform, bright high-key lighting, luminous shadows with cool\nblue undertones, detailed digital painting, dynamic tilted framing, shallow\ndepth of field on hand\n<\/code><\/pre>\n<h3>Photoreal macro (official doc, abbreviated)<\/h3>\n<pre><code>A tiny, russet-brown harvest mouse clings to a slender diagonal branch amid\nvibrant green lobed leaves... an extremely shallow depth of field sharply\nfocuses on the animal's face... soft, diffused natural lighting that\nhighlights the intricate details of the fur and foliage.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Raising CFG to \"improve\" Turbo<\/strong> \u2192 distilled models degrade with CFG &gt; 0/1.0; iterate prompt and seed instead.<\/li>\n<li><strong>Depending on a negative prompt<\/strong> \u2192 it's zeroed out on Turbo; any exclusion must be stated positively in the prompt.<\/li>\n<li><strong>Over-engineering the first prompt<\/strong> \u2192 Turbo's advantage is speed; start at 5\u201320 words, explore, then narrow like an art director.<\/li>\n<li><strong>CLIP-era syntax<\/strong> (<code>(word:1.4)<\/code>, <code>((word))<\/code>, <code>BREAK<\/code>) \u2192 inert on Krea 2; use descriptive sentences.<\/li>\n<li><strong>Buzzword padding<\/strong> (<code>8k<\/code>, <code>masterpiece<\/code>, <code>trending on artstation<\/code>) \u2192 documented to reduce clarity and accuracy.<\/li>\n<li><strong>Training LoRAs on Turbo<\/strong> \u2192 not recommended; official guidance is train on Raw, apply on Turbo.<\/li>\n<\/ol>\n<hr />\n<h2>Turbo vs Raw: Prompting Differences<\/h2>\n<table>\n<thead>\n<tr>\n<th>Aspect<\/th>\n<th>Raw (base)<\/th>\n<th>Turbo (distilled)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Steps<\/td>\n<td>~20\u201352<\/td>\n<td>8 (distilled for this)<\/td>\n<\/tr>\n<tr>\n<td>CFG<\/td>\n<td>Real, 3.0\u20135.5<\/td>\n<td>Disabled (0 / 1.0); raising it degrades output<\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported and effective<\/td>\n<td>Zeroed out / ignored \u2014 phrase exclusions positively<\/td>\n<\/tr>\n<tr>\n<td>Resolution<\/td>\n<td>Trained to 1K<\/td>\n<td>1K\u20132K (official examples at 2K)<\/td>\n<\/tr>\n<tr>\n<td>Prompt style<\/td>\n<td>Longer detailed prose best; negatives add control<\/td>\n<td>Concise punchy prose works; same natural-language rules, but iterate fast<\/td>\n<\/tr>\n<tr>\n<td>Best for<\/td>\n<td>LoRA training, precise control<\/td>\n<td>Everyday generation, rapid prototyping, applying Raw-trained LoRAs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Krea 2 Turbo \u2014 TDM/CFG-distilled few-step checkpoint of the ~12.9B diffusion transformer<\/li>\n<li><strong>Text Encoder:<\/strong> Qwen3-VL 4B<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> Not officially documented; favor concise-to-medium prose (5\u201380 words typical)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Released by Krea AI alongside Raw on Hugging Face (<code>krea/Krea-2-Turbo<\/code>). Distillation removed CFG entirely (upstream diffusers blocks expose no guider and no negative-prompt argument for this checkpoint). Recommended timestep-shift mu: 1.15.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/krea-ai/krea-2/blob/main/docs/prompting.md (official prompting guidelines; all examples generated on Turbo at 2K)<\/li>\n<li>https://github.com/krea-ai/krea-2/blob/HEAD/README.md (Turbo: 8 steps, CFG 0, mu 1.15, 1K\u20132K; Raw: 52 steps, CFG 3.5, 1K)<\/li>\n<li>https://github.com/alperktt/krea-2-svdquant-comfyui/blob/HEAD/workflows/README.md (Turbo vs base: cfg-distilled, negative zeroed via ConditioningZeroOut, raising cfg degrades)<\/li>\n<li>https://modl.run/guides/krea-2/ (Raw vs Turbo comparison table; encoder details; \"reach for Turbo when you want a picture, Raw when you want control\")<\/li>\n<li>https://github.com/catnuko/gisflow/blob/HEAD/docs/src/content/docs/features/krea-2.mdx (Turbo 8 steps CFG 1.0; Raw ~28 steps CFG ~5.5 with negatives)<\/li>\n<li>https://github.com/mskiller/wildcard-prompt-studio/blob/HEAD/docs/KREA2_PROMPTING_GUIDE.md (Turbo preset: concise punchy natural language \u2014 subject, lighting, camera angle)<\/li>\n<li>https://github.com/ling0322/libwaifu/commit/1c290aef49ac46a01d5c06b79c2cfc27eeb25064 (distilled models: no guider, negative_prompt ignored when guidance \u2264 0)<\/li>\n<\/ul>", "pairs": 4, "file": "models/image/krea-2-turbo.md"}, "image/qwen-image/0": {"title": "Prompt Guide: Qwen-Image 2.x", "html": "\n<p><strong>Model:<\/strong> Qwen-Image 2.x (2.0, 2.0-RL, 2.1; related open-weights sibling Qwen-Image-2512)\n<strong>Developer:<\/strong> Alibaba Qwen team\n<strong>Type:<\/strong> Image\n<strong>Text Encoder:<\/strong> Qwen2.5-VL (2.0); Qwen3-VL (2.1, per diffusers pipeline docs)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Qwen-Image 2.x is Alibaba's second-generation image family (2026), aimed at \"precision, variety, completeness, beauty, and authenticity.\" It is a unified text-to-image + image-editing architecture whose headline strength is multilingual text rendering (notably Chinese + English) inside images. Unlike 3.0 (closed, hosted-only), the 2.x line spans both hosted API releases and open weights. Prompting across the whole 2.x family is driven by one fact: the text encoder is a large vision-language LLM, not CLIP \u2014 so prompts behave like instructions to a language model.<\/p>\n<p><strong>Per-version differences (documented):<\/strong>\n- <strong>Qwen-Image-2.0<\/strong> (released May 2026): hosted/API flagship (fal.ai, DashScope <code>qwen-image-2.0<\/code>, <code>qwen-image-2.0-pro<\/code>). Recommended: 50 steps, <code>true_cfg_scale<\/code> 4.0, 1328\u00d71328-class resolutions. Prompt budget up to ~1,000 tokens for dense layouts.\n- <strong>Qwen-Image-2.0-RL<\/strong>: RL-tuned variant of 2.0 (GRPO + on-policy distillation), reported +2.61 on Qwen-Image-Bench and arena Elo gains in T2I and edit. No separate prompting guidance published \u2014 use 2.0 guidance.\n- <strong>Qwen-Image-2512<\/strong> (2025): open-weights sibling used for local/ComfyUI deployment; same prompt syntax as 2.0, prompt rewrites via <code>enable_prompt_expansion<\/code> on some endpoints.\n- <strong>Qwen-Image-2.1<\/strong> (released 2026-09-20 \u2014 note: <em>newer<\/em> than 3.0): open weights under the Qwen Research License Agreement (non-commercial only), 7B visual-generation component (32 single-stream DiT layers) with Qwen3-VL encoding prompt + condition images jointly. New capabilities: native RGBA transparency, up to 10 reference images for editing, official prompt-rewriting models. Defaults: 40 steps, <strong>no guidance (CFG off)<\/strong> \u2014 guidance only activates if you pass <code>negative_prompt<\/code> together with <code>true_cfg_scale &gt; 1<\/code>.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write natural-language sentences and paragraphs, not tag lists. The Qwen-VL text encoder weights earlier tokens more heavily, so the subject \u2014 the most important element \u2014 must come first.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>A nice landscape photo featuring somewhere a red sports car, masterpiece, 8k, (car:1.3)\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>Red sports car on mountain road, aerial drone shot, golden hour lighting, cinematic wide angle\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not supported<\/td>\n<td>Not parsed by the VLM encoder; reported to cause artifacts<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not supported<\/td>\n<td>Same as above<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not supported<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not supported<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported (with caveats)<\/td>\n<td>2.0/API: works best as full NLP sentences, not keyword dumps. 1.x-era finding: negative prompts were nearly ineffective for content exclusion; mold docs recommend starting with no negative prompt at all and only adding one for a specific failure mode. 2.1: CFG is off by default; passing <code>negative_prompt<\/code> + <code>true_cfg_scale &gt; 1<\/code> turns guidance on (doubles compute per step).<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Partially<\/td>\n<td>The 2.1 transparent mode uses a fixed natural-language trigger phrase (see Prompt Examples); no special token syntax<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Partially (2.1)<\/td>\n<td>2.1 supports local edits specified via circles, painted annotations, or separate masks; no token-based regional syntax<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Under ~10 words leaves composition, lighting, and style to chance; the model's prompt-rewrite/expansion features exist precisely because short prompts underperform<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>15\u201350 words for simple portrait/landscape; 50\u2013150 words for standard production images; 100\u2013300 words for posters/products with text; 300\u2013500+ words for infographics/slides (2.0, up to ~1,000 tokens). Alibaba recommends using the official prompt-rewriting models (Qwen-Image-2.1-PE-T2I / -PE-I2I) to expand short prompts into detailed descriptions<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>2.0 dense-layout ceiling \u2248 1,000 tokens; beyond that, later instructions lose attention (front-loading matters because the encoder weights early tokens more). Long prompts also interact badly with <code>enable_prompt_expansion<\/code> auto-rewrites on API endpoints<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>Recommended: the Five-Element Framework (subject first).<\/p>\n<pre><code>[Subject + Core Action] \u2192 [Environment / Setting] \u2192 [Style / Rendering Mode] \u2192 [Lighting / Atmosphere] \u2192 [Text / Layout (if needed)]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject + Core Action<\/td>\n<td>The main element, front-loaded<\/td>\n<td>\"Red sports car on mountain road\"<\/td>\n<\/tr>\n<tr>\n<td>Environment / Setting<\/td>\n<td>Where the scene takes place<\/td>\n<td>\"winding coastal highway, pine forest\"<\/td>\n<\/tr>\n<tr>\n<td>Style / Rendering Mode<\/td>\n<td>One clear style anchor<\/td>\n<td>\"Editorial photography style\"<\/td>\n<\/tr>\n<tr>\n<td>Lighting / Atmosphere<\/td>\n<td>Light direction, quality, mood<\/td>\n<td>\"golden hour backlit, cinematic wide angle\"<\/td>\n<\/tr>\n<tr>\n<td>Text / Layout<\/td>\n<td>Exact quoted copy + placement + font + \"no other text\"<\/td>\n<td><code>Top third: the text \"ALTITUDE FESTIVAL\" in large bold condensed sans-serif, white, all caps<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Front-loaded subject<\/td>\n<td>Put the most important element in the first sentence<\/td>\n<\/tr>\n<tr>\n<td>Natural-language sentences<\/td>\n<td>\"standing in soft window light indoors. Candid, unposed expression.\"<\/td>\n<\/tr>\n<tr>\n<td>Exact in-image text in quotes<\/td>\n<td><code>The sign reads \"GRAND OPENING\" in bold red letters<\/code><\/td>\n<\/tr>\n<tr>\n<td>Chinese characters written directly<\/td>\n<td><code>\u901a\u4e49\u5343\u95ee<\/code>, <code>\u6b22\u8fce\u5149\u4e34<\/code> \u2014 never romanized, never described<\/td>\n<\/tr>\n<tr>\n<td>Font style + color + spatial placement for text<\/td>\n<td>\"serif, bold, cream white, top-center\"; \"small widely-spaced capitals directly beneath\"<\/td>\n<\/tr>\n<tr>\n<td>Multilingual script relationships<\/td>\n<td>\"on the same line\", \"stacked directly beneath\" \u2014 matched size and weight<\/td>\n<\/tr>\n<tr>\n<td>One clear style anchor<\/td>\n<td>\"Editorial photography style\" / \"Flat editorial illustration, two-colour palette\"<\/td>\n<\/tr>\n<tr>\n<td>Camera language<\/td>\n<td>\"aerial drone shot\", \"medium shot, eye level\", \"shallow depth of field\"<\/td>\n<\/tr>\n<tr>\n<td>Closing constraint for text work<\/td>\n<td>\"No other text.\" \u2014 prevents invented lettering in margins<\/td>\n<\/tr>\n<tr>\n<td>For RGBA (2.1)<\/td>\n<td><code>This is an RGBA image with transparency. &lt;description&gt;. The image has alpha channel and the background is transparent.<\/code><\/td>\n<\/tr>\n<tr>\n<td>For multi-reference editing (2.1)<\/td>\n<td>Explicit roles per image, e.g. \"Image 1: edit target, original cafe interior. Image 2: product identity reference.\"<\/td>\n<\/tr>\n<tr>\n<td>Magic quality suffix (1.0/2.0-era official examples)<\/td>\n<td>English: <code>, Ultra HD, 4K, cinematic composition.<\/code> \u2014 Chinese: <code>, \u8d85\u6e05\uff0c4K\uff0c\u7535\u5f71\u7ea7\u6784\u56fe.<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>masterpiece, best quality, 8k, ultra HD<\/code> as quality boosters<\/td>\n<td>Describe the visual instead: \"sharp focus, fine fabric texture, crisp detail\" (these tokens are ignored by the VLM encoder)<\/td>\n<\/tr>\n<tr>\n<td><code>(keyword:1.4)<\/code> or <code>((keyword))<\/code> weighting<\/td>\n<td>Plain emphasis through wording and front-loading<\/td>\n<\/tr>\n<tr>\n<td>Danbooru-style tag lists (<code>1girl, blue_hair, sunset, ...<\/code>)<\/td>\n<td>Full sentences: \"A young woman with blue hair standing at sunset\"<\/td>\n<\/tr>\n<tr>\n<td>\"The Chinese word for orbit\" / describing text<\/td>\n<td>Paste the actual characters: <code>\u8f68\u9053\u529b\u5b66<\/code><\/td>\n<\/tr>\n<tr>\n<td>Negation in the positive prompt (\"Not a child\", \"no people\")<\/td>\n<td>For 2.x this is unreliable; put exclusions in the negative-prompt parameter as sentences, or phrase positively (\"empty street, no people visible\" is inconsistent \u2014 describe the scene as if the unwanted element isn't there)<\/td>\n<\/tr>\n<tr>\n<td>Generic negative keyword dumps (<code>blurry, bad anatomy, ugly, deformed, watermark<\/code>)<\/td>\n<td>Full sentences: \"No watermarks, no distorted faces, no blurry backgrounds, avoid artificial plastic skin texture\"<\/td>\n<\/tr>\n<tr>\n<td>Leaving text-heavy margins undescribed<\/td>\n<td>End with \"no other text\" or list exactly which texts may appear<\/td>\n<\/tr>\n<tr>\n<td><code>enable_prompt_expansion: true<\/code> during iteration<\/td>\n<td>Lock it to <code>false<\/code> \u2014 auto-rewrite makes results non-reproducible while testing wording<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>2.0: 50 \u00b7 2.1: 40 (defaults; official recommendation)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>2.0: <code>true_cfg_scale<\/code> 4.0 \u00b7 2.1: off by default; <code>true_cfg_scale &gt; 1<\/code> + <code>negative_prompt<\/code> to enable<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>2.0: 1328\u00d71328-class (1:1 \u2192 1328\u00d71328; 16:9 \u2192 1664\u00d7928; 9:16 \u2192 928\u00d71664; 4:3 \u2192 1472\u00d71140; 3:4 \u2192 1140\u00d71472; 3:2 \u2192 1584\u00d71056; 2:3 \u2192 1056\u00d71584) \u00b7 2.1: native 2K (1:1 \u2192 2048\u00d72048; 4:3 \u2192 2400\u00d71792; 3:4 \u2192 1792\u00d72400; 3:2 \u2192 2528\u00d71696; 2:3 \u2192 1696\u00d72528; 16:9 \u2192 2752\u00d71536; 9:16 \u2192 1536\u00d72752)<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>bfloat16 recommended<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>(2.1 API/text workflows: use PNG output and avoid high acceleration for images containing text.)<\/p>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Image<\/h3>\n<p>The prompt must carry everything: subject (first), environment, one style anchor, lighting/atmosphere, and \u2014 for graphics \u2014 exact quoted copy with font/color/placement. For best results, short prompts should be expanded first with the official prompt-rewriting models (Qwen-Image-2.1-PE-T2I, or API <code>enable_prompt_expansion<\/code>).<\/p>\n<h3>Image-to-Image<\/h3>\n<p>The prompt is an <strong>instruction applied to the input image<\/strong>, not a description of the final scene: name the change, then state what must be preserved. 2.1 accepts up to 10 reference images \u2014 assign each a role so they don't conflict. For local/point edits, describe circles, painted annotations, or masks. Example instruction style: \"Change the background to a sunset beach.\" / \"Replace only the four black plastic chairs with pale oak chairs; preserve architecture, camera position, people, and all text.\"<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>Neon sign with text<\/h3>\n<p><strong>Intended content:<\/strong> A neon shop sign reading \"QWEN IMAGE 2.1\" on a rainy night with reflections on wet pavement.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>neon sign, rainy night, text, QWEN IMAGE 2.1, reflections, masterpiece, 8k, (sign:1.3)\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A neon shop sign that reads &quot;QWEN IMAGE 2.1&quot;, rainy night, reflections on wet pavement\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The good version (from the official 2.1 README) quotes the exact text so the renderer treats it as literal copy, uses natural language the VLM encoder understands, and drops weight syntax and quality boosters that the encoder ignores or that cause artifacts.<\/p>\n<h3>Event poster with bilingual text<\/h3>\n<p><strong>Intended content:<\/strong> A vertical event poster: deep navy background, gold mountain line art, title \"ALTITUDE FESTIVAL\", details below.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>poster, festival, mountain, navy blue, gold, elegant, premium design, best quality, ultra detailed, text &quot;altitude festival&quot;, june 20-22 telluride\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A vertical event poster. Background: deep navy blue with subtle star-field grain texture.\nCenter: a geometric illustration of a mountain range in gold line art.\nTop third: the text &quot;ALTITUDE FESTIVAL&quot; in large bold condensed sans-serif, white, all caps.\nBelow title: &quot;June 20\u201322 | Telluride, Colorado&quot; in smaller weight, gold color.\nBottom: &quot;altitudefestival.com&quot; in minimal small caps, white.\nBalanced whitespace. Modern editorial design. Print-ready at 2K resolution. No other text.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Text rendering is Qwen's headline feature and it needs a layout spec, not adjectives: exact quoted strings, font/size/color, spatial placement, and the \"no other text\" close that stops the model filling margins with invented lettering. The bad prompt's vague \"text ...\" and booster tags produce garbled or misplaced type.<\/p>\n<h3>Chinese storefront sign<\/h3>\n<p><strong>Intended content:<\/strong> A traditional Chinese restaurant storefront at evening with a neon sign reading \u7f8e\u5473\u9910\u5385.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Traditional Chinese restaurant storefront with neon sign saying the Chinese words for &quot;delicious restaurant&quot;, busy street, evening\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Traditional Chinese restaurant storefront with neon sign saying '\u7f8e\u5473\u9910\u5385', busy street scene, evening atmosphere\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Write the characters, never describe them. Describing the meaning (\"the Chinese words for...\") produces something that is not that word; pasting \u7f8e\u5473\u9910\u5385 with its characters lets the model render the exact glyphs.<\/p>\n<h3>Simple portrait (front-loading)<\/h3>\n<p><strong>Intended content:<\/strong> A red sports car on a mountain road at golden hour, aerial drone shot.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A nice landscape photo featuring somewhere a red sports car, cinematic, beautiful, high quality\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Red sports car on mountain road, aerial drone shot, golden hour lighting, cinematic wide angle\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The Qwen-VL encoder weights earlier tokens more heavily \u2014 the subject (\"red sports car\") must come first, not buried mid-sentence. The good version also replaces empty adjectives (\"beautiful\", \"cinematic\") with concrete camera and lighting terms.<\/p>\n<h3>Negative prompt<\/h3>\n<p><strong>Intended content:<\/strong> A portrait that should avoid watermarks, distorted faces, and plastic-looking skin.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>blurry, bad anatomy, ugly, deformed, watermark, low quality, extra limbs\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>No watermarks, no distorted faces, no blurry backgrounds, avoid artificial plastic skin texture\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The VLM encoder responds to natural-language sentences, not keyword dumps. (Also note: for the 1.x-era models, community testing found negative prompts nearly ineffective for content exclusion \u2014 start with no negative prompt and only add one for a specific failure mode.)<\/p>\n<h3>Image edit instruction<\/h3>\n<p><strong>Intended content:<\/strong> Edit a photo of a cafe interior to replace four black plastic chairs with pale oak chairs, keeping everything else.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>a cafe interior with pale oak chairs, cozy, warm afternoon light, photorealistic, high quality\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Replace only the four black plastic chairs with pale oak chairs. Preserve the architecture, camera position, table positions, people, window view, wall artwork and all text; match the existing perspective, contact shadows and warm afternoon light; do not add or remove any other object.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Edit prompts are instructions, not scene descriptions. The bad prompt re-describes the whole scene and invites the model to regenerate everything; the good prompt names the change and locks invariants so the rest of the image survives.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Text-heavy poster layout<\/h3>\n<pre><code>A vertical science poster. Title &quot;\u8f68\u9053\u529b\u5b66&quot; in large bold characters across the upper third, subtitle &quot;Orbital Mechanics&quot; in small widely-spaced capitals directly beneath. Three labelled diagram panels down the centre, captions &quot;\u8fd1\u5730\u70b9&quot;, &quot;\u8fdc\u5730\u70b9&quot;, &quot;\u8f6c\u79fb\u8f68\u9053&quot; under each. A thin rule separates the diagram block from a footer reading &quot;\u7b2c\u4e09\u7248 \u00b7 2026&quot;. Flat editorial illustration, two-colour palette. No other text.\n<\/code><\/pre>\n<h3>Transparent sticker (2.1)<\/h3>\n<pre><code>This is an RGBA image with transparency. A cute cartoon dragon sticker. The image has alpha channel and the background is transparent.\n<\/code><\/pre>\n<h3>Multi-reference composition (2.1)<\/h3>\n<pre><code>Image 1: base scene and final composition. Image 2: product identity and label reference. Image 3: material and color reference only. Place the exact product from Image 2 on the center table in Image 1. Use Image 3 only for the brushed-copper finish. Preserve Image 1 camera, people and background. Match scale, perspective, reflections, occlusion and shadows.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Tag soup instead of sentences<\/strong> \u2014 the VLM encoder was trained on language, not booru tags; tag lists produce worse results.<\/li>\n<li><strong>Burying the subject<\/strong> \u2014 anything after the first sentence gets less attention; front-load the key element.<\/li>\n<li><strong>Describing text instead of quoting it<\/strong> \u2014 \"a sign with Chinese characters\" never renders the intended words; paste them in quotes.<\/li>\n<li><strong>SD-style weight syntax<\/strong> \u2014 <code>(word:1.3)<\/code> is not parsed and may cause artifacts.<\/li>\n<li><strong>Quality-booster padding<\/strong> \u2014 \"masterpiece, 8k, ultra HD\" is ignored; describe observable detail instead.<\/li>\n<li><strong>Iterating with prompt expansion on<\/strong> \u2014 API auto-rewrite (<code>enable_prompt_expansion<\/code>) makes A/B comparisons meaningless; disable while testing.<\/li>\n<li><strong>Negation in the positive prompt<\/strong> \u2014 \"not a child\" introduces the word \"child\" and makes it worse; exclude via negative-prompt parameter or positive phrasing.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> 2.0: ~20B MMDiT (+ Qwen2.5-VL text encoder) \u00b7 2.1: 7B single-stream DiT (32 layers), block-causal transformer, Qwen3-VL joint prompt+image encoder, 64-channel VAE<\/li>\n<li><strong>Text Encoder:<\/strong> Qwen2.5-VL (2.0); Qwen3-VL (2.1)<\/li>\n<li><strong>Max Prompt Tokens:<\/strong> 2.0: up to ~1,000 tokens for dense layouts (per community skill docs; 3.0's 4,500 is a different line) \u00b7 2.1: not officially stated \u2014 left blank<\/li>\n<li><strong>Training Data / Notes:<\/strong> Qwen-Image 2.0 released May 2026 (hosted/API); 2.0-RL is the RL-tuned variant (GRPO + on-policy distillation); Qwen-Image-2512 is the open-weights sibling for local/ComfyUI use; Qwen-Image-2.1 released 2026-09-20 under Qwen Research License Agreement (non-commercial only). Official prompt-rewrite checkpoints: Qwen/Qwen-Image-2.1-PE-T2I and Qwen/Qwen-Image-2.1-PE-I2I (fine-tuned Qwen3.5-VL 9B).<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/QwenLM/Qwen-Image-2.1 (official 2.1 README: defaults, aspect ratios, RGBA trigger phrase, prompt-rewrite models, multi-reference)<\/li>\n<li>https://huggingface.co/Qwen/Qwen-Image-2.1/blob/main/README.md<\/li>\n<li>https://huggingface.co/docs/diffusers/main/api/pipelines/qwenimage21 (Qwen3-VL joint encoding, 40 steps / no guidance defaults, <code>negative_prompt<\/code> + <code>true_cfg_scale &gt; 1<\/code> enables CFG)<\/li>\n<li>https://www.orcarouter.ai/blog/qwen-image-2-1-vs-qwen-image-3-0 (version timeline, licensing positions, 2.1 newer than 3.0)<\/li>\n<li>https://github.com/cozy-art/super-skills/blob/HEAD/skills/image/qwen-image-v2/SKILL.md (front-loading rule, five-element framework, syntax rules, prompt-length table, negative-prompt format, workflow)<\/li>\n<li>https://github.com/brndngln/nodetool/blob/HEAD/packages/system-skills/qwen-image-prompting/SKILL.md (\"quote the copy\" habits: write characters, state script relationships, close with \"no other text\")<\/li>\n<li>https://github.com/yayimiko/astrbot_plugin_qwen_image/blob/HEAD/skills/qwen-image-21-prompt-expert/SKILL.md (natural language over tags for 2.1, edit-mode policies)<\/li>\n<li>https://github.com/utensils/mold/blob/HEAD/website/models/qwen-image.md (negative-prompt guidance: start with none; upstream Chinese negative prompt for full-precision paths)<\/li>\n<li>https://blog.promptmaster.pro/posts/qwen-image-negative-prompts/ (community finding that 1.x-era negative prompts were ineffective for content exclusion)<\/li>\n<li>https://arxiv.org/pdf/2606.27608 (Qwen-Image-2.0-RL technical report)<\/li>\n<li>https://qwen-image.ai/blog/Qwen-Image-Practical-Guide (text-rendering tips: font, size relationships, placement, quoting)<\/li>\n<li>https://dev.to/aimodels-fyi/a-beginners-guide-to-the-qwen-image-2-pro-model-by-qwen-on-replicate-3k1 (<code>enable_prompt_expansion<\/code> default-true behavior, negative-prompt notes)<\/li>\n<\/ul>", "pairs": 6, "file": "models/image/qwen-image-2.x.md"}, "image/qwen-image/1": {"title": "Prompt Guide: Qwen-Image 3.x", "html": "\n<p><strong>Model:<\/strong> Qwen-Image-3.0 (Standard and Pro editions)\n<strong>Developer:<\/strong> Alibaba Qwen team\n<strong>Type:<\/strong> Image\n<strong>Text Encoder:<\/strong><\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Qwen-Image-3.0 (invite-only launch 2026-07-21, general availability 2026-08-05) is the third generation of Alibaba's image line, and it is a <strong>different product line<\/strong> from 2.x \u2014 note that 2.1 (2026-09-20) is actually <em>newer<\/em> than 3.0. Where 2.x balances generation quality with open weights, 3.0 is closed: no weights, no stated license, no model card, no published parameter count, no technical report, and no published benchmark table at launch. It is reachable only through hosted APIs (Qwen Chat, Alibaba Cloud Model Studio / DashScope, fal.ai <code>alibaba/qwen-image-3<\/code>, third-party apps) in <strong>Standard<\/strong> and <strong>Pro<\/strong> editions \u2014 Pro positioned for production/API use, Standard for chat trial.<\/p>\n<p>The design goal is summed up as \"Real\"/useful: the model accepts prompts up to <strong>~4,500 tokens<\/strong> (4.5\u00d7 the previous generation), renders text legible down to <strong>~10 pixels<\/strong>, supports <strong>12 languages natively<\/strong> (incl. Japanese, Korean, Spanish), <strong>20+ fonts<\/strong>, <strong>100+ art styles<\/strong>, and full <strong>LaTeX<\/strong> rendering \u2014 built for information-dense, functional images: newspapers, complex infographics, exam sheets, storyboards, UI mockups, multi-panel comics. Prompting shifts from \"describe a picture\" to \"write an executable visual specification.\"<\/p>\n<p><strong>Qwen-Image-3.1:<\/strong> no evidence of a 3.1 release as of October 2026 \u2014 nothing below should be assumed to apply to a future 3.1.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>State the task first, then write the prompt as a layout/content specification, not a mood description. With a 4,500-token budget, the prompt's job is to define the deliverable (use case, audience, reading order, exact verbatim copy, acceptance constraints) \u2014 adjectives like \"stunning\" or \"epic\" define no success criteria and should be replaced with observable composition, material, and lighting.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>\u9ad8\u7ea7\u3001\u6781\u7b80\u3001\u7535\u5f71\u611f\u7684\u5496\u5561\u6d77\u62a5\u3002(High-end, minimalist, cinematic coffee poster.)\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>\u4e3a\u4e00\u5bb6\u793e\u533a\u5496\u5561\u9986\u5236\u4f5c 4:5 \u65b0\u5e97\u5f00\u4e1a\u6d77\u62a5\uff1b\u8def\u4eba\u5e94\u5728 2 \u79d2\u5185\u770b\u61c2\u5e97\u540d\u3001\u5f00\u4e1a\u65e5\u671f\u3001\u5730\u5740\u548c\u4e3b\u6253\u624b\u51b2\u5496\u5561\u3002(Make a 4:5 grand-opening poster for a neighborhood caf\u00e9; a passerby should grasp the shop name, opening date, address, and signature pour-over within 2 seconds.)\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not supported<\/td>\n<td>(Generalization from 2.x: VLM-encoder family does not parse weight syntax \u2014 labeled generalization, not 3.0-documented)<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not supported<\/td>\n<td>(Same generalization)<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td>API schema includes <code>negative_prompt<\/code> (cap ~500 chars on some endpoints); best as specific, executable constraints \u2014 see \"What to Avoid\"<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>For short single-subject images the 4,500-token budget changes nothing; for dense layouts, underspecified prompts produce invented labels, numbers, and filler text<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>Simple images: 15\u201350 words \u00b7 standard production: 50\u2013150 words \u00b7 poster/product with text: 100\u2013300 words \u00b7 infographic/slide/multi-element layout: 300\u2013500+ words. Use the full budget for multi-panel specs (example: nine infographic panels with diagrams, formulas, captions, and fine print rendered in a single pass)<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>\"Longer \u2260 better\": give each line one responsibility; delete adjectives that don't affect acceptance (replace \"8K, masterpiece\" with observable structure)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>Recommended: the four-layer information structure.<\/p>\n<pre><code>[Task layer] \u2192 [Visual layer] \u2192 [Content layer] \u2192 [Acceptance layer]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Task layer<\/td>\n<td>Use case, asset type/size, goal, audience<\/td>\n<td>\"Goal: \u505a\u4e00\u5f20\u53ef\u6253\u5370\u7684\u81ea\u7136\u79d1\u5b66\u5c55\u677f\u3002Audience: 10\u201413 \u5c81\u5b66\u751f\u3002Canvas: A3 \u7ad6\u7248\uff0c3mm \u51fa\u8840\u5b89\u5168\u533a\u3002\"<\/td>\n<\/tr>\n<tr>\n<td>Visual layer<\/td>\n<td>Scene, subject, style medium, camera, composition, light, color, reading order, negative space<\/td>\n<td>\"Reading order: \u6807\u9898 \u2192 \u5256\u9762\u4e3b\u56fe \u2192 \u7269\u79cd\u5361\u7247 \u2192 \u98df\u7269\u7f51 \u2192 \u4fdd\u62a4\u63d0\u793a\u3002\"<\/td>\n<\/tr>\n<tr>\n<td>Content layer<\/td>\n<td>All verbatim titles/body/labels/data/units, multilingual correspondences, panel logic<\/td>\n<td><code>Text (verbatim): 1. \"\u57ce\u5e02\u7f13\u6162\u751f\u6d3b\u8282\" 2. \"WALK \u00b7 TASTE \u00b7 LISTEN\" ...<\/code> plus a Typography map per line<\/td>\n<\/tr>\n<tr>\n<td>Acceptance layer<\/td>\n<td>What must be kept, what may change, what is forbidden, what counts as unusable<\/td>\n<td>\"Constraints: \u4e0d\u865a\u6784\u7edf\u8ba1\u6570\u636e\uff1b\u751f\u7269\u5f62\u6001\u53ef\u8fa8\u8ba4\uff1b\u6587\u5b57\u4e0d\u538b\u56fe\u3002\" / \"No invented numbers, citations, percentages or footnotes.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The task in the first sentence<\/td>\n<td>\"\u4e3a\u4e00\u5bb6\u793e\u533a\u5496\u5561\u9986\u5236\u4f5c 4:5 \u65b0\u5e97\u5f00\u4e1a\u6d77\u62a5\" \u2014 what the image must accomplish, for whom<\/td>\n<\/tr>\n<tr>\n<td>Exact copy as data, numbered verbatim<\/td>\n<td><code>Text (verbatim): 1. \"\u57ce\u5e02\u7f13\u6162\u751f\u6d3b\u8282\" 2. \"WALK \u00b7 TASTE \u00b7 LISTEN\" 3. \"10.18\u201410.20\"<\/code><\/td>\n<\/tr>\n<tr>\n<td>A typography map for each text line<\/td>\n<td>\"Line 1: \u6700\u5927\u5b57\u53f7\uff0c\u73b0\u4ee3\u5b8b\u4f53\u6c14\u8d28\uff0c\u9876\u90e8\u5c45\u4e2d\uff1bLine 2: \u7a84\u4f53\u65e0\u886c\u7ebf\uff0c\u5168\u5927\u5199\"<\/td>\n<\/tr>\n<tr>\n<td>Layout skeleton before content<\/td>\n<td>\"Layout: 3 columns \u00d7 3 rows, nine equal panels, 24px gutters.\" / \"Flow: left to right, exactly six nodes. Edges: 1\u21922\u21923\u21924\u21925\u21926, no branching.\"<\/td>\n<\/tr>\n<tr>\n<td>Reading order<\/td>\n<td>\"Reading order: \u6807\u9898 \u2192 \u5256\u9762\u4e3b\u56fe \u2192 \u7269\u79cd\u5361\u7247 \u2192 \u98df\u7269\u7f51 \u2192 \u4fdd\u62a4\u63d0\u793a\u3002\"<\/td>\n<\/tr>\n<tr>\n<td>Panel-by-panel specs for storyboards<\/td>\n<td>\"Panel 1: a cat stares at an empty bowl, caption 'Monday'. Panel 2: cat knocks a mug off the table...\"<\/td>\n<\/tr>\n<tr>\n<td>Multilingual correspondence<\/td>\n<td>Keep translated strings intact; state script relationships explicitly<\/td>\n<\/tr>\n<tr>\n<td>Product lock for packaging<\/td>\n<td>\"do not change silhouette, camera angle, cap, label size or liquid color\"<\/td>\n<\/tr>\n<tr>\n<td>Character identity anchor, repeated per panel<\/td>\n<td>Visible traits list + \"In
