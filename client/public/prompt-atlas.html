shots<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.2<\/strong><\/td>\n<td>80-120 words<\/td>\n<td>Single 5s motion arc<\/td>\n<td><code>dolly zoom<\/code>, <code>tilt up/down<\/code>, 360-degree <code>camera roll<\/code><\/td>\n<td>MoE architecture; high/low-noise LoRAs<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.5<\/strong><\/td>\n<td>Medium length<\/td>\n<td>One committed move per 5s clip<\/td>\n<td><code>panoramic drone push<\/code>, <code>tracking shot<\/code><\/td>\n<td>Flash tier; strong atmospheric layering<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.6<\/strong><\/td>\n<td>Up to 800 chars<\/td>\n<td>Timing brackets (<code>Shot 1 [0-4s]: ...<\/code>)<\/td>\n<td><code>push<\/code>, <code>pull<\/code>, <code>orbit<\/code>, <code>FPV drone<\/code><\/td>\n<td>Multi-shot cuts; R2V (<code>@Video1<\/code>); native audio<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 2.7<\/strong><\/td>\n<td>6-part shot list<\/td>\n<td>Thinking-Mode reasoning directives<\/td>\n<td><code>dolly in<\/code>, <code>tracking shot<\/code>, <code>slow push<\/code><\/td>\n<td>Pre-render reasoning; FLF2V 5s control<\/td>\n<\/tr>\n<tr>\n<td><strong>Wan 3.0<\/strong><\/td>\n<td>30s narrative arc<\/td>\n<td>SPACE framework (continuous take)<\/td>\n<td>One single sustained camera move<\/td>\n<td>Native 30s takes; Omni-Reference (20 assets)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Source: user's Wan prompting reference (Oct 2026).<\/em><\/p>\n<pre><code>[Visible beats in order] + [camera behavior] + [dialogue: quoted words + speaker + voice] + [diegetic audio: ambience/effects] + [constraints]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Visible beats<\/td>\n<td>Each action in the shot, in order<\/td>\n<td><code>A baker slides a tray of loaves from the oven, sets it on the steel bench, and turns to open the shutter<\/code><\/td>\n<\/tr>\n<tr>\n<td>Camera behavior<\/td>\n<td>One continuous move, no cuts for long takes<\/td>\n<td><code>The camera drifts with her, never cutting<\/code>, <code>Slow push in<\/code><\/td>\n<\/tr>\n<tr>\n<td>Dialogue<\/td>\n<td>Exact quoted words, speaker identified, voice described<\/td>\n<td><code>She says \"Fresh out of the oven\" in a warm, tired voice<\/code><\/td>\n<\/tr>\n<tr>\n<td>Diegetic audio<\/td>\n<td>Sound sources that exist in the scene<\/td>\n<td><code>Ambient room tone: the scrape of the tray, the click of the oven door<\/code><\/td>\n<\/tr>\n<tr>\n<td>Constraints<\/td>\n<td>What to exclude<\/td>\n<td><code>No music<\/code>, <code>no text or logos<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reference roles<\/td>\n<td>Each reference's job, named per-type<\/td>\n<td><code>Image 1 is MAYA's face reference; describe her blue jacket in every shot<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Exact quoted dialogue with speaker<\/td>\n<td><code>\"Welcome to the future,\" the presenter says<\/code> \u2014 drives lip-sync<\/td>\n<\/tr>\n<tr>\n<td>Voice, ambience, effects, music direction in the same brief<\/td>\n<td><code>low hum of the wheel<\/code>, <code>water dripping into a bucket<\/code>, <code>distant gull calls<\/code><\/td>\n<\/tr>\n<tr>\n<td>Diegetic-only audio for long takes<\/td>\n<td>Name sources that exist in the scene; end with <code>No music<\/code> \u2014 explicit music requests risk refusal on copyright checks<\/td>\n<\/tr>\n<tr>\n<td>Character name in capitals + wardrobe re-described per prompt<\/td>\n<td><code>MAYA walks into the workshop...<\/code> \u2014 cheapest defense against drift across shots<\/td>\n<\/tr>\n<tr>\n<td>Reference roles for every attached input<\/td>\n<td><code>Image 1 is the character; Image 2 is the location<\/code><\/td>\n<\/tr>\n<tr>\n<td>Explicit duration<\/td>\n<td>Set <code>duration<\/code> yourself (2\u201330s); combined input + output must stay \u2264 30s when using reference video<\/td>\n<\/tr>\n<tr>\n<td>First/last frame pairing for a specific move<\/td>\n<td>Pin both ends of the shot to get a defined camera move instead of default drift<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Requesting a music score (<code>epic orchestral soundtrack<\/code>)<\/td>\n<td>Diegetic sound only: <code>Ambient room tone: ... No music<\/code><\/td>\n<\/tr>\n<tr>\n<td>Leaving <code>prompt_extend<\/code> on for an art-directed prompt<\/td>\n<td>Set <code>prompt_extend: false<\/code> \u2014 the rewrite will quietly redirect a shot you already blocked out<\/td>\n<\/tr>\n<tr>\n<td>Passing <code>aspect_ratio<\/code> alongside a first frame or reference<\/td>\n<td>It is silently ignored when framing input sets the shape \u2014 crop the input instead<\/td>\n<\/tr>\n<tr>\n<td>Attaching stray inputs \"just in case\"<\/td>\n<td>Every attached image/video/audio changes the inferred mode; a forgotten parameter silently moves you into a different mode<\/td>\n<\/tr>\n<tr>\n<td>Combining document/web context with first/last-frame anchors<\/td>\n<td>They are mutually exclusive \u2014 choose one conditioning style per request<\/td>\n<\/tr>\n<tr>\n<td>Depending on legible on-screen text or polished audio<\/td>\n<td>Alibaba flags both as still-improving; budget a second pass in a dedicated tool<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>480P / 720P / 1080P (set explicitly; providers differ on defaults)<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Additional parameters (API): <code>duration<\/code> 2\u201330s (explicit; <code>-1<\/code> matches source when editing); <code>aspect_ratio<\/code> 16:9, 4:3, 1:1, 3:4, 9:16, or adaptive (upstream default); <code>audio<\/code> default true (no price difference); <code>prompt_extend<\/code> default true; <code>enable_thinking<\/code> optional extra planning pass (reasons about composition and motion before rendering); <code>seed<\/code>; <code>watermark<\/code> default false. Fixed 30fps. All input URLs must be publicly reachable \u2014 the backend fetches media itself.<\/p>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>Send only a prompt and you get text-to-video \u2014 but the prompt must carry the whole production: every visible beat in order, the camera behavior, exact quoted dialogue with the speaker identified, and the diegetic soundscape. Because the model can hold a continuous 30-second take, write for one unbroken shot (\"the camera drifts with her, never cutting\") rather than a montage. Keep audio descriptions diegetic \u2014 name sources that exist in the scene. If the prompt is already precise, set <code>prompt_extend<\/code> to false so the rewrite doesn't redirect your blocking.<\/p>\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>30-second continuous take (T2V + LoRA) template \u2014 the SPACE framework:<\/strong><\/p>\n<pre><code>Subject: [Concrete subject + LoRA trigger].\nPerformance: [30-second motion arc: Beginning -&gt; Turn/Reveal -&gt; Resolution].\nAmbiance: [Environment, directional lighting, static elements].\nCamera: [ONE sustained camera move across the full 30 seconds].\nExtra Cues: [In-pass audio bed, beat timing, fixed constraints].\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>Subject: A violinist in a dark auditorium, lora_stage_realism.<\/code> <code>Performance: The violinist finishes a musical phrase, slowly lowers her bow, holds completely still as the last note decays, and turns her head toward the empty balcony.<\/code> <code>Ambiance: Single top-down spotlight on stage, deep shadows in background.<\/code> <code>Camera: One unbroken slow drift to the left across thirty seconds.<\/code> <code>Extra Cues: Violin note decaying into room reverb, quiet ambient silence, spotlight stays locked throughout.<\/code><\/p>\n<\/blockquote>\n<p><strong>Tips:<\/strong> Outline a continuous 30-second narrative arc (Beginning -&gt; Turn/Reveal -&gt; Resolution), not a static hold. Commit to ONE sustained camera move across the whole take \u2014 multiple competing moves cause model compromise. Explicitly name what every reference controls (<code>The courier from Reference 1 in the street from Reference 2<\/code>).<\/p>\n<h3>Image-to-Video<\/h3>\n<p>Adding <code>image<\/code> switches the same endpoint to image-to-video \u2014 there is no mode flag. The first frame sets the composition (and the aspect ratio, overriding any <code>aspect_ratio<\/code> you passed), and the prompt invents only the motion: describe the action unfolding from the frame, the camera move, and the ambient sound. Add <code>last_frame<\/code> to pin both ends of the shot, which is how you get a specific move rather than the model's default drift. For character work across several shots, swap frames for <code>reference_images<\/code> (up to 10): they carry identity rather than composition \u2014 name the character in capitals in every prompt and re-describe the wardrobe each time.<\/p>\n<hr />\n<h4>Prompt Templates (Wan prompting reference)<\/h4>\n<p><strong>Document-to-Video / Omni-reference template:<\/strong><\/p>\n<pre><code>Source Input: [Name uploaded document/reference asset].\nReference Tagging: [Assign roles: Reference 1 = Subject, Reference 2 = Setting, Reference 3 = Data/Doc].\nMotion &amp; Sequence: [How document figures or sections translate into video action].\nCamera &amp; Pacing: [Sustained camera move], [Fixed elements to keep legible throughout].\n<\/code><\/pre>\n<p><strong>Example:<\/strong><\/p>\n<blockquote>\n<p><code>Source Input: Quarterly_Report.pdf (Chart on page 3).<\/code> <code>Reference Tagging: Product model from Reference 1, background studio from Reference 2.<\/code> <code>Motion &amp; Sequence: Studio rotation of brushed steel kettle while financial chart figures from Page 3 animate quietly on a translucent background screen.<\/code> <code>Camera &amp; Pacing: Slow 360-degree orbital camera move, logo and chart typography remain legible throughout the turn, ambient studio audio bed.<\/code><\/p>\n<\/blockquote>\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V \u2014 30-second bakery take<\/h3>\n<p><strong>Intended content:<\/strong> One continuous dawn shot in a bakery with natural sound.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>a cozy bakery in the morning, a baker at work, warm and cinematic with nice background music\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A single continuous handheld take inside a small neighborhood bakery before dawn. A baker slides a tray of loaves from the oven, sets it on the steel bench, and turns to open the shutter as the first grey light comes through the window. The camera drifts with her, never cutting. Ambient room tone only: the scrape of the tray, the click of the oven door, the rattle of the shutter. No music.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The good prompt is written for the model's strength \u2014 one unbroken 30-second take \u2014 with ordered beats, a no-cuts camera instruction, and a diegetic-only soundscape. The bad prompt asks for a montage (\"morning\" as a vibe) and background music, which risks a copyright refusal and gives the model no shot structure to hold for 30 seconds.<\/p>\n<h3>T2V \u2014 Dialogue with lip-sync<\/h3>\n<p><strong>Intended content:<\/strong> A presenter walks through a workshop and speaks to camera.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>a woman presenting in a workshop, talking about the future, camera moving alongside\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A documentary presenter walks through a detailed workshop and says &quot;Welcome to the future&quot; in a clear, confident voice as the camera tracks beside her. Subtle machine hum and footsteps on concrete. No music.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Quoting the exact words and identifying the speaker drives the lip-sync and voice generation; describing the voice and the diegetic ambience gives the native-audio pass something concrete to render. The bad prompt's paraphrase (\"talking about the future\") leaves the model guessing at both words and voice.<\/p>\n<h3>I2V \u2014 Beach sunset first frame<\/h3>\n<p><strong>Intended content:<\/strong> A still of a sunset beach comes alive: waves, gulls, gentle push-in.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A beautiful sunset beach with orange sky, waves and seagulls, palm trees on the side, photorealistic, 4K\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>The waves roll in and spread across the wet reflective sand as the low sun sinks toward the horizon, sea foam bubbling and receding. The seagulls glide slowly across the glowing sky. The camera pushes in gently, no cuts. Natural realistic motion. Ambient sound only: rolling surf, sea breeze, distant gull calls. No music.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The frame already shows the beach \u2014 re-describing it wastes the prompt on visible content. The good prompt describes only temporal change (rolling waves, sinking sun, gliding gulls), one camera move, and the ambient soundscape.<\/p>\n<h3>I2V \u2014 First and last frame pinned<\/h3>\n<p><strong>Intended content:<\/strong> A shot that opens on a closed door and ends on the open doorway revealing a garden.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>animate between these two images, make it smooth and cinematic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A slow, continuous move from the closed wooden door to the open doorway revealing the sunlit garden beyond. The door swings inward gradually as warm light spills across the floor. Handheld, gentle drift. Ambient sound: the creak of hinges, birdsong growing louder. No music.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> With both frames pinned, the prompt's job is to describe the transition between the two states \u2014 the door swinging, the light spilling \u2014 not to ask for generic \"smooth animation.\" The bad prompt gives the model no motion to render between the endpoints.<\/p>\n<h3>Reference \u2014 Character carried across a shot<\/h3>\n<p><strong>Intended content:<\/strong> A named character walks into a workshop, identity carried from two reference photos.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>a person walks into a workshop and picks up a kettle (references attached)\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>MAYA walks into the workshop and picks up the kettle. Image 1 is MAYA's face reference; she wears a blue canvas jacket and her hair is tied back. Warm practical lighting, slow push-in. No music.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> References need explicit roles \u2014 the model won't reliably infer which attached image is the character versus the location. Naming the character in capitals and re-describing the wardrobe in every prompt is the documented defense against identity drift; the bad prompt leaves both to chance.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>T2V \u2014 Craft close-up with diegetic sound<\/h3>\n<pre><code>A potter's hands centre a ball of grey clay on a spinning wheel in a sunlit studio, water glistening as the walls rise between their fingers. Slow push in. Natural realistic motion. Ambient room tone: the low hum of the wheel and water dripping into a bucket. No music.\n<\/code><\/pre>\n<h3>I2V \u2014 Motion between pinned frames<\/h3>\n<pre><code>The camera pushes slowly past her as the rain intensifies. Droplets streak the window, streetlights smearing into reflections. Natural realistic motion. Ambient sound: rain on glass, distant traffic. No music.\n<\/code><\/pre>\n<h3>Reference \u2014 Loose multimodal conditioning<\/h3>\n<pre><code>Image 1 is the lead dancer's costume reference; Video 1 supplies the choreography to borrow \u2014 the spins and floor work, not the original stage. A dim theater, single spotlight following the dancer. Describe the motion, timing, and style to borrow from Video 1.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li>Attaching a first frame while also passing <code>aspect_ratio<\/code> \u2014 the frame wins silently; crop the input if you need a specific ratio.<\/li>\n<li>Leaving <code>prompt_extend<\/code> on for precise prompts \u2014 the rewrite redirects blocked-out shots; disable it when wording is a hard requirement.<\/li>\n<li>Requesting a music score \u2014 keep audio diegetic and end with <code>No music<\/code> to avoid copyright-check refusals.<\/li>\n<li>Attaching references without naming their roles \u2014 address each as <code>Image 1<\/code>, <code>Video 1<\/code>, <code>Audio 1<\/code> and state its job.<\/li>\n<li>Mixing document/web context with first/last-frame anchors \u2014 they are mutually exclusive; pick one per request.<\/li>\n<li>Assuming mode from intent instead of payload \u2014 the model infers T2V/I2V/R2V/edit from attached media; audit the payload, not your mental model.<\/li>\n<li>Depending on readable on-screen text \u2014 Alibaba's own caveat says text rendering is still improving.<\/li>\n<\/ol>\n<hr />\n<h2>Spicy / Uncensored Variants<\/h2>\n<p>Yes \u2014 <strong>Wan 3 Uncensored<\/strong> (Sogni model ID <code>wan3-uncensored<\/code>), built by the \"Wan 3 Enhanced Team\" on Alibaba's Wan 3 and served on Sogni, is a mature-theme build that accepts subject matter the standard Wan 3 declines. Prompting differences: state wardrobe, framing, and action directly instead of hinting; give every supplied frame or reference a specific role; quote exact dialogue with speaker and voice; note that it does not expose document/web context, watermark control, source-video editing, or extension. Every depicted person must be 18 or older and requests must stay lawful under Sogni's and the vendor's terms \u2014 it is more permissive, not restriction-free. It is priced separately from standard Wan 3 and is pay-as-you-go on every render.<\/p>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Wan 3.0 (unified <code>wan3.0-video<\/code> endpoint)<\/li>\n<li><strong>Text Encoder:<\/strong><\/li>\n<li><strong>Max Prompt Tokens:<\/strong> Not published; leave to provider limits<\/li>\n<li><strong>Training Data / Notes:<\/strong> Changes from Wan 2.7: four separate model slugs merged into one endpoint with mode inferred from inputs; max duration 15s \u2192 30s at fixed 30fps; native synchronized audio on by default at no extra cost; new document/webpage context (upstream only); up to 10 image / 5 video / 5 audio references; first/last-frame anchoring; optional thinking/planning pass. Alibaba labels the upstream API as preview (as of August 2026). Closed model \u2014 no open weights as of October 2026.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://blog.segmind.com/wan-3-guide-features-examples-and-what-developers-should-know/ (Wan 3 guide: parameters, 2.7 comparison, prompting practices)<\/li>\n<li>https://www.sogni.ai/models/wan-3 (Wan 3 prompting tips, reference naming, mode inference)<\/li>\n<li>https://www.sogni.ai/models/wan-3-uncensored (Wan 3 Uncensored prompting tips and differences)<\/li>\n<li>https://fal.ai/wan-3 (Wan 3 capabilities: 30s, 1080p, native audio, thinking mode, positional references)<\/li>\n<li>https://www.reuters.com/business/retail-consumer/alibaba-launches-wan30-ai-video-model-after-10-billion-share-sale-2026-08-24/ (Wan 3.0 launch, Aug 24 2026)<\/li>\n<li>https://dataconomy.com/2026/08/24/alibaba-launches-wan30-a-30-second-ai-video-generation-model/ (Wan 3.0 specs: 30s, 1080p, document input, pricing)<\/li>\n<li>https://github.com/monid-ai/monid/blob/HEAD/openspec/changes/add-connector-alibaba/tasks.md (wan3.0-video / prime tier API parameters)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/wan-3.0.md"}, "video/seedance/0": {"title": "Prompt Guide: Seedance 2.0", "html": "\n<p><strong>Model:<\/strong> Seedance 2.0 (Dreamina Seedance 2.0 series; variants: Standard, Fast, Mini)\n<strong>Developer:<\/strong> ByteDance (via BytePlus ModelArk)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong><\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Seedance 2.0 is a multimodal video generation model that reads text, images, video, and audio <strong>simultaneously<\/strong> and decomposes them into a spatial layer (what is in the frame) and a temporal layer (how things change over time). It natively co-generates <strong>synchronized audio<\/strong> (dialogue with lip-sync, SFX, ambience, music) alongside video in a single pass. Its signature strength is multi-shot storytelling from one prompt \u2014 it holds character identity and style across cuts better than most contemporaries \u2014 and precise interpretation of reference assets via an <code>@Image N / @Video N / @Audio N<\/code> binding syntax.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Think like a <strong>director handing a shot list to a crew<\/strong>, not a tourist describing a postcard. The model responds best to cinematographic language: named subjects, concrete action beats, one camera move per shot, and explicit audio. Vague adjectives (\"beautiful\", \"cinematic\") do far less work than concrete blocking.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>A beautiful cinematic video of a woman walking through a rainy city street at night\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>Shot 1: Slow push-in on a woman in her late 30s, charcoal wool coat, red scarf, hair pulled back, walking briskly across a rain-slick European plaza; her heels strike wet stone. Overcast afternoon light, cool blue tones, soft reflections. Audio: rain patter and distant thunder, steady.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not documented<\/td>\n<td>No weight syntax documented for Seedance 2.0; use concrete wording instead.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>As inline constraint words only<\/td>\n<td>No separate negative-prompt API field; exclusions go in the prompt as natural-language constraints (e.g. \"keep it subtitle-free\", \"do not generate a watermark\").<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Supported<\/td>\n<td><code>@Image N<\/code>, <code>@Video N<\/code>, <code>@Audio N<\/code> reference binding tokens; <code>Define<\/code> keyword to name subjects from references; <code>{dialogue}<\/code> or quoted dialogue for lip-sync.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>The model guesses missing slots \u2014 subject detail, camera, motion, audio \u2014 producing generic output.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>BytePlus recommends keeping prompts under <strong>1,000 words<\/strong> so information stays focused. Community evidence suggests 60\u2013100 characters for a single shot, 200\u2013700 for multi-shot prompts.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Dilutes focus; the official ceiling is <strong>32,000 characters<\/strong> per prompt (hard limit, not a quality target). Generation parameters (duration, resolution, aspect ratio) belong in the API/UI, not the prompt.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>Recommended order from the official BytePlus prompt guide:<\/p>\n<pre><code>Asset preparation: \u2192 Subject definitions: \u2192 Prompt: (task type) \u2192 Shot 1: \u2192 Shot 2: \u2192 Quality and constraints:\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Asset preparation<\/td>\n<td>Inventory every reference with <code>@Image N<\/code> / <code>@Video N<\/code> / <code>@Audio N<\/code> and its role<\/td>\n<td><code>@Image 1: female lead character portrait<\/code><\/td>\n<\/tr>\n<tr>\n<td>Subject definitions<\/td>\n<td>Bind assets to stable labels using the <code>Define<\/code> keyword, with 2\u20133 static features<\/td>\n<td><code>Define the young woman with long dark hair and a white blouse in @Image 1 as Girl<\/code><\/td>\n<\/tr>\n<tr>\n<td>Prompt / Task type<\/td>\n<td>Declare the mode: Multimodal Reference, Video Editing, Video Extension, or Combined Tasks<\/td>\n<td><code>Task type: Multimodal Reference<\/code><\/td>\n<\/tr>\n<tr>\n<td>Shot 1 / Shot 2 / ...<\/td>\n<td>Timeline storyboard in event order; each shot covers one coherent action beat<\/td>\n<td><code>Shot 1: Match the steady medium-shot follow movement from @Video 1. Girl @Image 1 walks briskly toward the dormitory entrance...<\/code><\/td>\n<\/tr>\n<tr>\n<td>Quality and constraints<\/td>\n<td>Closing paragraph: image quality, style, and natural-language exclusions<\/td>\n<td><code>Quality: high-definition cinematic style... Constraints: keep it subtitle-free; do not generate a watermark<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Each shot should describe, in order: (1) camera movement or transition \u2014 one per shot; (2) subject actions at body-part level; (3) position/spatial changes; (4) lighting &amp; color tone; (5) audio (dialogue, SFX, ambience).<\/p>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cinematographic camera language<\/td>\n<td><code>slow push-in<\/code>, <code>whip pan<\/code>, <code>crane rise<\/code>, <code>handheld follow<\/code>, <code>medium tracking shot from the left<\/code>, <code>low angle<\/code>, <code>over-the-shoulder<\/code><\/td>\n<\/tr>\n<tr>\n<td>Time-segmented beats (when you want them)<\/td>\n<td><code>Between 0 and 4 seconds, this happens. Between 4 and 8 seconds...<\/code> (documented as supported by community practice)<\/td>\n<\/tr>\n<tr>\n<td>Explicit audio design<\/td>\n<td><code>Audio: rain patter and distant thunder<\/code>, <code>sizzling oil and jazz music<\/code>, <code>quiet room ambience<\/code><\/td>\n<\/tr>\n<tr>\n<td>Dialogue with speaker and emotion<\/td>\n<td><code>{How did the exam go? Did you pass?}<\/code> or <code>{Speaker A, urgent}: Did you hear that?<\/code> \u2014 use when <code>generate_audio<\/code> is on for lip-sync<\/td>\n<\/tr>\n<tr>\n<td>Reference binding in every shot<\/td>\n<td><code>Girl @Image 1<\/code>, <code>dormitory entrance from @Image 2<\/code>, <code>Match the medium-shot dolly movement from @Video 1<\/code>, <code>Blend the indoor ambience from @Audio 1<\/code><\/td>\n<\/tr>\n<tr>\n<td>Body-part-level action detail<\/td>\n<td><code>fingers tighten briefly around her bag strap<\/code>, <code>lowers her head and lets her shoulders drop<\/code><\/td>\n<\/tr>\n<tr>\n<td>Spatial continuity contract for movement-heavy scenes<\/td>\n<td><code>Start: [positions] \u2192 Travel axis: [origin \u2192 destination] \u2192 End: [final positions]<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lens/format anchors<\/td>\n<td><code>Sony A7S3<\/code>, <code>35mm follow<\/code>, <code>shallow depth of field<\/code>, <code>subtle film grain<\/code> (community evidence shows lens tokens work)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>A sad woman walks away<\/code> (abstract emotion)<\/td>\n<td>Externalize: <code>she lowers her head, shoulders trembling slightly, fingers unconsciously clutching her coat<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>He runs very fast and jumps dramatically<\/code> (high-burst action)<\/td>\n<td><code>he walks briskly<\/code>; <code>slowly raise a hand<\/code> \u2014 prefer slow, gentle, continuous motion; avoid sprinting, big jumps, violent rolls<\/td>\n<\/tr>\n<tr>\n<td><code>\"very sad\"<\/code>, <code>\"extremely angry\"<\/code> (intensity adverbs)<\/td>\n<td>Physical details from the emotion table (anger = <code>both fists clenched, jawline tense, chest heaving<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>no people<\/code>, <code>no text<\/code> (bare negations)<\/td>\n<td>Positive constraint phrasing: <code>an empty street<\/code>, <code>keep it subtitle-free<\/code>, <code>do not generate a logo, watermark, or text overlay<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>Shot 1 (0-4s), Shot 2 (4-8s)<\/code> when the API duration is different<\/td>\n<td>Set total length with the API <code>duration<\/code> parameter; use second-level timecodes only when explicitly needed, contiguous and matching the API duration<\/td>\n<\/tr>\n<tr>\n<td>Describing expression/pose as a subject's fixed identity<\/td>\n<td><code>Define<\/code> subjects with <strong>static<\/strong> features only (clothing, hairstyle, build) \u2014 never mutable attributes like expression or pose<\/td>\n<\/tr>\n<tr>\n<td>Uploading real human faces as references<\/td>\n<td>Not accepted directly; use Seedance/Seedream-generated outputs (within 30 days), preset digital characters, or verified authorized assets<\/td>\n<\/tr>\n<tr>\n<td>Relying on \"no aura\" to suppress a reference's unwanted pixels<\/td>\n<td>Clean or replace the reference \u2014 reference content overpowers negative wording<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Duration<\/strong><\/td>\n<td>4\u201315 s per generation (set via API <code>duration<\/code> parameter)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>Standard: 480P / 720P / 1080P / 4K; Fast &amp; Mini: 480P / 720P only<\/td>\n<\/tr>\n<tr>\n<td><strong>Aspect ratio<\/strong><\/td>\n<td>16:9, 9:16, 4:3, 3:4, 21:9, 1:1 (match to composition: vertical favors portraits, ultrawide favors establishing shots)<\/td>\n<\/tr>\n<tr>\n<td><strong>Audio<\/strong><\/td>\n<td><code>generate_audio: true<\/code> to enable native synchronized audio; dialogue needs the spoken line in <code>{braces}<\/code> or quotes<\/td>\n<\/tr>\n<tr>\n<td><strong>Seed<\/strong><\/td>\n<td>Pin once a look is approved to reproduce the same visual family<\/td>\n<\/tr>\n<tr>\n<td><strong>camera_fixed<\/strong><\/td>\n<td>Default <code>false<\/code>; set <code>true<\/code> to lock camera position<\/td>\n<\/tr>\n<tr>\n<td><strong>return_last_frame<\/strong><\/td>\n<td>Set <code>true<\/code> to chain multi-shot continuity<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt must carry the <strong>entire scene<\/strong>: subject identity, environment, action, camera, lighting, style, and audio. Since there is no visual anchor, be exhaustive about visual specifics \u2014 wardrobe, setting detail, shot size \u2014 and give the model a timeline (shots or time blocks) so it can pace the clip. Prefer at most <strong>3 major action beats or 4 tightly related shots<\/strong> in a 15-second generation; beyond that, split into separate generations.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>Seedance 2.0 has three mutually exclusive image modes \u2014 do not combine them:<\/p>\n<ul>\n<li><strong>First-frame (I2V):<\/strong> single image submitted as <code>role=first_frame<\/code>; the model animates from it. The prompt's job shifts to <strong>motion, camera movement, and action<\/strong> \u2014 do not re-describe what the image already shows. Example: <code>Slow push-in; the woman turns her head toward camera and smiles; rain begins to fall; ambient patter and distant thunder.<\/code><\/li>\n<li><strong>First + last frame (FLF2V):<\/strong> two images lock start and end state; the prompt describes the <strong>transition/motion between them<\/strong>.<\/li>\n<li><strong>Multimodal reference-to-video (R2V):<\/strong> 0\u20139 images + 0\u20133 videos + 0\u20133 audio as references (15 total). Reference images provide identity, style, and scene lock; reference videos transfer camera language and motion (not pixel transfer); reference audio provides voice timbre, SFX, ambience. Bind each reference inline in the shots where it applies.<\/li>\n<\/ul>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>1. T2V \u2014 Structured shot list vs vague one-liner<\/h3>\n<p><strong>Intended content:<\/strong> A chef flamb\u00e9s a pan in a rustic kitchen at golden hour.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A chef cooking in a kitchen, cinematic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Shot 1: Close-up of a chef flamb\u00e9ing a pan in a rustic kitchen, flames licking the pan's edge as he tosses with one flick of the wrist; golden hour light through the window; shallow depth of field; handheld camera. Audio: sizzling oil and low jazz.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt leaves subject detail, action, camera, lighting, and audio to chance \u2014 every slot the model must guess is a slot it can get wrong. The good prompt fills them with concrete, filmable direction, including audio.<\/p>\n<h3>2. I2V \u2014 Motion-focused vs re-describing the image<\/h3>\n<p><strong>Intended content:<\/strong> Animate a photo of a woman standing on a beach at sunset.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A beautiful woman with long dark hair wearing a white dress standing on a sandy beach with the ocean behind her at sunset, orange sky, cinematic lighting\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Keep the woman and beach exactly as in the image. She turns slightly toward the lens and her hair and dress move gently in the sea breeze; waves roll softly in the background. Slow push-in, steady. Audio: soft surf and light wind.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The source image already provides subject, scene, and style \u2014 re-describing it fights the first-frame constraint and risks identity drift. The good prompt says what to <strong>preserve<\/strong> and then directs only motion, camera, and sound.<\/p>\n<h3>3. Dialogue \u2014 Quoted lines with emotion vs bare narration<\/h3>\n<p><strong>Intended content:<\/strong> Two roommates exchange dialogue in a dormitory.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Two girls talk in a dorm room. One asks about the exam and the other says she was kidding.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Shot 1: One roommate smiles and asks {How did the exam go? Did you pass?}, voice bright with curiosity. Shot 2: The girl lowers her head, shoulders dropping, then lifts her head with a grin and laughs while saying {I was kidding}. Blend their voices naturally with soft indoor ambience.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Seedance 2.0's lip-sync locks to quoted or braced dialogue with an identified speaker; summarizing speech gives the model nothing to sync. Naming the delivery emotion also steers the performance instead of leaving it neutral.<\/p>\n<h3>4. Emotion \u2014 Externalized vs labeled<\/h3>\n<p><strong>Intended content:<\/strong> A woman receives bad news and looks sad.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>The woman looks very sad when she hears the news\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>She lowers her head and her shoulders tremble slightly; her eyes redden and her fingers unconsciously clutch the edge of her sleeve as a tear wells but does not fall\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The official guide is explicit: never write abstract emotions like \"very sad\" or \"extremely angry\". The model cannot render adjectives of feeling; it renders bodies. Physical detail gives it something drawable.<\/p>\n<h3>5. Pacing \u2014 Time-blocked beats vs \"and then\" stacking<\/h3>\n<p><strong>Intended content:<\/strong> A 12-second clip: plaza crossing \u2192 cafe door \u2192 interior.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A woman walks across a plaza and then she checks her watch and then she goes to a cafe and then she opens the door and then she goes inside\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Between 0 and 4 seconds: she walks briskly across the rain-slick plaza, checking her watch without breaking stride. Between 4 and 8 seconds: she reaches the cafe on the far side and pushes the door open. Between 8 and 12 seconds: she steps inside as the camera holds on the doorway; warm interior light spills out.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Stacking events with \"then\" gives the model no pacing guidance and crams five beats into whatever duration it invents. Contiguous time blocks (matching the API duration) choreograph the beats and give each one room.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Product / commercial (R2V with subject binding)<\/h3>\n<pre><code>Asset preparation:\n@Image 1: ceramic cup product shot \u2014 identity and label only\n@Video 1: slow product-orbit camera movement reference\n\nSubject definitions:\nDefine the pale blue ceramic cup with blank label in @Image 1 as Cup\n\nPrompt:\nTask type: Multimodal Reference\n\nShot 1: Match the slow orbit from @Video 1. Cup @Image 1 sits on a sunlit wooden table, steam rising gently. Audio: quiet room ambience, faint ceramic clink.\n\nQuality and constraints:\nQuality: high-definition product photography, soft natural light\nConstraints: keep the cup's label blank and geometry stable; no text overlays, no watermark\n<\/code><\/pre>\n<h3>Portrait animation (I2V)<\/h3>\n<pre><code>Preserve the woman's face, hair, and clothing exactly as in the supplied photograph. She turns slightly toward the lens, smiles gently, then holds a relaxed expression. Steady medium close-up, soft daylight, subtle room ambience. Keep the background and lighting consistent.\n<\/code><\/pre>\n<h3>Dialogue scene (T2V)<\/h3>\n<pre><code>Shot 1: Steady medium-shot follow on Girl @Image 1 walking briskly toward the dormitory entrance at dusk; warm yellow sunlight spills through the hallway window; her fingers tighten briefly around her bag strap. Audio: footsteps and indoor ambience.\nShot 2: Girl @Image 1 pushes open the door; her roommates look up. One roommate asks {How did the exam go? Did you pass?}. Keep the ambience beneath the dialogue.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Contradicting the brief across sections<\/strong> (e.g. \"single continuous shot\" plus several cuts, or \"no powers\" plus a reference containing an aura) \u2014 a contradiction is more damaging than a missing adjective; check for them before generating.<\/li>\n<li><strong>Only naming references in the inventory but never binding them inline<\/strong> \u2014 the asset list alone doesn't bind; every shot must repeat the applicable <code>@Image N<\/code> / <code>@Video N<\/code> / <code>@Audio N<\/code> where it's used.<\/li>\n<li><strong>Using mutable attributes in <code>Define<\/code><\/strong> (expression, pose) \u2014 labels must use stable static features (clothing, hairstyle, build) so they survive across shots.<\/li>\n<li><strong>Requesting high-burst action<\/strong> (sprinting, big jumps, violent rolls) \u2014 prefer slow, gentle, continuous motion for clean results.<\/li>\n<li><strong>Stacking too many beats into 15 seconds<\/strong> \u2014 cap at ~3 major action beats or 4 tightly related shots; split larger scenes into separate generations chained with <code>return_last_frame<\/code>.<\/li>\n<li><strong>Putting generation parameters in the prompt text<\/strong> \u2014 duration, resolution, and aspect ratio go in the API/UI, not the prompt.<\/li>\n<li><strong>Re-describing first-frame content in I2V<\/strong> \u2014 describe motion, camera, and audio; leave the image's content alone.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Seedance 2.0 (ByteDance); variants Standard / Fast / Mini (version-dated model IDs, e.g. <code>dreamina-seedance-2-0-260128<\/code> for Standard)<\/li>\n<li><strong>Text Encoder:<\/strong><\/li>\n<li><strong>Max Prompt Tokens:<\/strong> 32,000 characters hard ceiling; &lt;1,000 words recommended<\/li>\n<li><strong>Training Data / Notes:<\/strong> Multimodal architecture reading text + image + video + audio jointly; decomposes input into spatial and temporal layers. Prompt languages: English, Chinese, Japanese, Indonesian, Spanish, Portuguese. Reference budget: up to 15 assets (9 images, 3 videos, 3 audio). Real human faces not accepted as direct reference uploads.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/byteplus-sa/seed-prompt-studio/blob/HEAD/.agents/skills/seedance-prompt-20/SKILL.md (structure and rules sourced from the official BytePlus Seedance 2.0 prompt guide at docs.byteplus.com/en/docs/ModelArk/2222480)<\/li>\n<li>https://github.com/rrebiz/seedance-2.0-api (cinematographic prompting template and lip-sync/reference guidance)<\/li>\n<li>https://medium.com/@cliprise/writing-seedance-2-0-prompts-like-a-director-not-a-tourist-db70af20e7b8 (six-slot formula and worked example)<\/li>\n<li>https://www.socialmediaexaminer.com/how-to-think-like-a-filmmaker-ai-video-with-seedance/ (time-segmented prompting, 5\u201330s duration guidance)<\/li>\n<li>https://github.com/Hao0321/ai-media-generator/releases/tag/v1.1.0 (community evidence: lens tokens, time-block formats, bilingual prompts)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/seedance-2.0.md"}, "video/seedance/1": {"title": "Prompt Guide: Seedance 2.5", "html": "\n<p><strong>Model:<\/strong> Seedance 2.5 (BytePlus ModelArk <code>dreamina-seedance-2-5-260628<\/code>; Volcano <code>doubao-seedance-2-5-260628<\/code>)\n<strong>Developer:<\/strong> ByteDance (via BytePlus ModelArk / Dreamina)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong><\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Seedance 2.5 is the successor to Seedance 2.0 and the long-form specialist of the family: up to <strong>30 seconds of video in a single pass<\/strong> with natively co-generated audio (dialogue, SFX, ambience, music in one latent space). The biggest changes from 2.0 are scale and control: up to <strong>50 multimodal reference materials<\/strong> (vs 15), structured <strong>video editing<\/strong> (subject/background replacement, audio editing, edits by timestamp), <strong>forward/backward video extension<\/strong>, first/last-frame generation, one-click video, and seamless transitions. Prompting moves from 2.0's strict headed structure to a more flexible <strong>six-part formula<\/strong> \u2014 only Subject + Action is required \u2014 with timestamp pacing for longer scene arcs.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write a <strong>compact directing brief, not a pile of style adjectives<\/strong>: state the subject and its action first, then add only the parts that matter \u2014 scene, visual style, camera move, audio. 2.5's strength is time: the prompt should read as a timeline (establishment \u2192 action \u2192 turn \u2192 final frame), with each stage containing one primary change and a clear end state.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>A cinematic, beautiful, epic, stunning video of a potter making a vase, hyper detailed, 8k quality\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A ceramic artist finishes a pale blue cup in a studio at dawn, lifts it from the wheel, and places it in the center of a wooden shelf. Soft morning light enters through the window. Begin with a medium shot of the wheel, slowly push in toward the cup's texture, then cut to a frontal view of the shelf. Audio: the low hum of the pottery wheel, clay friction, subtle indoor ambience.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not documented<\/td>\n<td>No weight syntax documented; use concrete wording instead.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>As inline constraint words only<\/td>\n<td>No separate negative-prompt field documented; exclusions go in the prompt as natural language (e.g. \"no redesign, duplicates, fake text, watermark\").<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Supported<\/td>\n<td>Reference binding tokens (<code>@Image N<\/code>-style asset labels; give each reference an explicit role), dialogue in double quotes, timestamp ranges like <code>00:00\u201300:04<\/code>.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>The model fills gaps in subject, motion, and audio with defaults; multi-beat scenes lose their pacing.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>State subject + action first, then add detail only to critical movements. Describe the primary action at body-part level (range, speed, force). One strong action beats four unrelated actions for short clips.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>A third-party platform guide advises staying under <strong>15,000 characters<\/strong> and spending the budget on composition, lighting, and motion rather than filler adjectives. (Platform guidance, not official BytePlus.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>The official six-part formula (per the Dreamina Seedance 2.5 prompt guide, via BytePlus):<\/p>\n<pre><code>[Subject] + [Action or Event] + [Scene and Environment (optional)] + [Visual Style (optional)] + [Camera Movement/Cut (optional)] + [Audio (optional)]\n<\/code><\/pre>\n<p>Only <strong>Subject + Action<\/strong> is required. Do not describe the same action twice. Generation parameters (duration, resolution, aspect ratio) belong in the interface/API, not the prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject<\/td>\n<td>Who/what the shot is about<\/td>\n<td><code>A ceramic artist<\/code><\/td>\n<\/tr>\n<tr>\n<td>Action or Event<\/td>\n<td>What happens, at body-part level: range, speed, force, physics grounding<\/td>\n<td><code>finishes a pale blue cup, lifts it from the wheel, and places it in the center of a wooden shelf<\/code><\/td>\n<\/tr>\n<tr>\n<td>Scene and Environment (optional)<\/td>\n<td>Where/when: set, time, palette<\/td>\n<td><code>in a studio at dawn<\/code><\/td>\n<\/tr>\n<tr>\n<td>Visual Style (optional)<\/td>\n<td>Lighting \u2192 lens character \u2192 color grade \u2192 sensor/film look, chained in that order<\/td>\n<td><code>soft morning light entering through the window, delicate sheen on wet clay<\/code><\/td>\n<\/tr>\n<tr>\n<td>Camera Movement/Cut (optional)<\/td>\n<td>One clear move per beat with start, path, and end<\/td>\n<td><code>Begin with a medium shot of the wheel, slowly push in toward the cup's surface texture, then cut to a frontal view of the shelf<\/code><\/td>\n<\/tr>\n<tr>\n<td>Audio (optional)<\/td>\n<td>Dialogue, ambience, foley, music, sync cues<\/td>\n<td><code>Retain the low hum of the pottery wheel, the friction of clay, and subtle indoor ambience<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>For longer scenes, stage the action with <strong>timestamps<\/strong> allocating time to events (not frame-accurate edit points):<\/p>\n<pre><code>00:00\u201300:04 \u2014 Establish the place and visual rule.\n00:04\u201300:10 \u2014 Perform the primary action with one camera move.\n00:10\u201300:15 \u2014 Introduce a reaction, reveal, or proof point.\n00:15\u201300:20 \u2014 Decelerate into a deliberate final composition.\n<\/code><\/pre>\n<p>For reference-to-video, add a nine-part directing brief on top: Mode \u2192 Goal \u2192 Reference roles \u2192 Visual anchors \u2192 Timeline \u2192 Camera \u2192 Performance/physics \u2192 Audio \u2192 Continuity \u2192 Avoid.<\/p>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject + action first, always<\/td>\n<td><code>A lone cyclist<\/code> + <code>rides through a neon-lit alley<\/code><\/td>\n<\/tr>\n<tr>\n<td>Named reference roles<\/td>\n<td><code>Image 1 locks identity; Video 1 provides camera path only<\/code> \u2014 give every asset a job and a \"do not use for\" boundary<\/td>\n<\/tr>\n<tr>\n<td>Continuity invariants<\/td>\n<td><code>What must never change: bottle silhouette, cap, label position<\/code> \u2014 restate where it matters<\/td>\n<\/tr>\n<tr>\n<td>Timestamped beats for multi-shot scenes<\/td>\n<td><code>00:00\u201300:04 \u2014 establish...<\/code> (time allocation, not edit points)<\/td>\n<\/tr>\n<tr>\n<td>Observable motion acceptance criteria<\/td>\n<td>Direction, relationship, contact, or end state \u2014 e.g. <code>arc 20 degrees and stop on the hero frame<\/code><\/td>\n<\/tr>\n<tr>\n<td>Concrete camera moves with endpoints<\/td>\n<td><code>eye-level medium shot, 20-degree arc, slow rack focus to the bottle<\/code><\/td>\n<\/tr>\n<tr>\n<td>Audio as sound direction<\/td>\n<td><code>Cap click at 00:08, fine bubbles, low original rhythm<\/code> \u2014 dialogue, SFX, ambience with sync cues<\/td>\n<\/tr>\n<tr>\n<td>Dialogue: short, quoted, with delivery tone<\/td>\n<td><code>\"Watch the wheel.\"<\/code> \u2014 keep lines short; name the tone if a specific read is needed<\/td>\n<\/tr>\n<tr>\n<td>Explicit editing instructions (edit mode)<\/td>\n<td>One editing master, edit scope, target quantity, and what to preserve<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>A then B then C then D<\/code> event stacking<\/td>\n<td>Timestamped beats or numbered stages, each with one primary change<\/td>\n<\/tr>\n<tr>\n<td><code>very sad<\/code>, <code>extremely angry<\/code> (abstract emotion)<\/td>\n<td>Externalize: <code>shoulders drop, eyes redden, voice softens<\/code> (generalized from the Seedance family rule \u2014 documented for 2.0)<\/td>\n<\/tr>\n<tr>\n<td>Prompting every reference to appear at once<\/td>\n<td>Select references per scene: \"Image 2 controls the set only\" \u2014 the goal is selecting correct materials, not piling them in<\/td>\n<\/tr>\n<tr>\n<td><code>30 seconds of everything<\/code> in one pass<\/td>\n<td>Set the actual duration via the <code>duration<\/code> parameter; split ideas needing location + costume + VFX + dialogue changes into separate generations<\/td>\n<\/tr>\n<tr>\n<td>Putting duration/aspect ratio/resolution in the prompt text<\/td>\n<td>Use the generation controls; keep the prompt about the frame's look and motion<\/td>\n<\/tr>\n<tr>\n<td>Assuming timestamps are edit points<\/td>\n<td>They allocate time; do not rely on them for frame-accurate cuts<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Duration<\/strong><\/td>\n<td>4\u201330 s per generation (set via API <code>duration<\/code> parameter; 30 s is the ceiling, not the target)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>480p / 720p (per platform; <strong>4K is not supported by 2.5<\/strong> \u2014 use Seedance 2.0 for 4K output)<\/td>\n<\/tr>\n<tr>\n<td><strong>Aspect ratio<\/strong><\/td>\n<td>16:9, 4:3, 1:1, 3:4, 9:16 (21:9 also reported via BytePlus docs)<\/td>\n<\/tr>\n<tr>\n<td><strong>Audio<\/strong><\/td>\n<td>Co-generated natively; dialogue needs short quoted lines and a delivery tone<\/td>\n<\/tr>\n<tr>\n<td><strong>Seed<\/strong><\/td>\n<td>Pin for reproducible looks (generalized from Seedance family)<\/td>\n<\/tr>\n<tr>\n<td><strong>Task auto-locks<\/strong><\/td>\n<td>Video editing locks aspect ratio and duration to the input; first/last-frame generation locks ratio to the first image; extension locks ratio to the input<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt carries the whole production brief: subject, action, environment, style, camera, audio. Because 2.5 can run 30 seconds, structure the prompt as <strong>scene staging<\/strong>: establishment \u2192 action \u2192 turn \u2192 final frame, with timestamps where pacing matters. For a short clip, one strong action beats four unrelated ones; if a beat needs a location change, costume change, complex VFX, and dialogue at once, split it into another generation.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>The image defines the look; the prompt's job is <strong>motion, camera, audio, and the transition<\/strong>. For first/last-frame generation, describe how the shot travels from the start image to the end image (both must share the aspect ratio; ratio locks to the first image). For reference-to-video (up to 50 materials: \u226430 images, \u226410 videos, \u226410 audio per third-party specs), assign each reference a role and bind characters, products, and props to their references by name. State what each asset must <strong>not<\/strong> influence \u2014 a camera-path video supplies no appearance; a control diagram supplies no pixels. Translate planning diagrams into concise textual choreography rather than uploading them raw.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>1. T2V \u2014 Six-part formula vs adjective pile<\/h3>\n<p><strong>Intended content:<\/strong> A lone cyclist riding through a neon-lit Tokyo alley at night in the rain.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Cinematic epic stunning video of a cyclist in Tokyo at night, hyper detailed, neon, rain, 8k, masterpiece\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A lone cyclist rides through a neon-lit Tokyo alley at night, tires hissing on wet asphalt. Wide aerial tracking shot follows from above and behind, slow push-in. Volumetric rain catches the neon; cool blue-magenta grade. Audio: rain, distant thunder, the whir of the chain.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> 2.5 needs subject + action + camera + audio, not quality adjectives. The good prompt fills each formula slot with concrete, filmable direction and keeps style anchored to lighting and grade.<\/p>\n<h3>2. I2V \u2014 Motion direction vs re-describing the photo<\/h3>\n<p><strong>Intended content:<\/strong> Animate a product photo of a ceramic cup on a sunlit table.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A pale blue ceramic cup on a wooden table in warm sunlight with a window behind it, product photography, beautiful\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Preserve the cup exactly: silhouette, glaze, and label position. Slow camera push-in as steam rises from the cup and dust motes drift through the sunlight. End on a still close-up. Quiet room ambience.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The image already owns appearance; re-describing it risks drift. The good prompt names what must stay identical, then directs only camera, motion, audio, and the end state.<\/p>\n<h3>3. Multi-shot \u2014 Timestamp staging vs \"and then\" chain<\/h3>\n<p><strong>Intended content:<\/strong> An explorer discovers jungle ruins in a 20-second clip.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>An explorer walks through the jungle and finds ancient ruins and looks amazed and runs her hand over a wall and then we see the whole temple\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>00:00\u201300:04 \u2014 Medium shot from behind a young explorer pushing aside a large jungle vine to reveal a hidden path.\n00:04\u201300:10 \u2014 Reverse shot of her freckled face, expression shifting to awe as moss-covered ruins fill the background. SFX: rustling leaves, distant bird calls.\n00:10\u201300:15 \u2014 Tracking shot follows her into the clearing; she runs her hand over intricate carvings on a crumbling wall.\n00:15\u201300:20 \u2014 Wide high-angle crane shot revealing her small in the center of the vast temple complex. SFX: a swelling, gentle score begins.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> \"And then\" stacking gives the model no pacing and crams four locations of action into an unbudgeted timeline. Timestamps allocate time per beat and pair each stage with one camera move and its audio.<\/p>\n<h3>4. Dialogue \u2014 Short quoted line with tone vs summarized speech<\/h3>\n<p><strong>Intended content:<\/strong> A detective questions a woman in his office; she answers mysteriously.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A detective talks to a woman in his office and she gives a mysterious answer. They have a conversation with dialogue.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Using the provided images for the detective, the woman, and the office setting: medium shot of the detective behind his desk. He looks up at the woman and says in a weary voice, &quot;Of all the offices in this town, you had to walk into mine.&quot; Cut to the woman; a slight, mysterious smile plays on her lips as she replies, &quot;You were highly recommended.&quot; Low office ambience beneath the dialogue.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Summarizing dialogue gives the lip-sync engine nothing to sync. Quoted lines with an identified speaker, delivery tone, and framing let 2.5 generate matched mouth movement and vocal performance.<\/p>\n<h3>5. Reference-to-video \u2014 Role-labeled assets vs reference soup<\/h3>\n<p><strong>Intended content:<\/strong> A 15-second vertical ecommerce demo for a skincare bottle, using two reference images.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Using the attached images, make a video of the product with nice lighting and camera movement, 15 seconds\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Mode: Image-to-video, 15-second vertical ecommerce demo.\nReference roles: Image 1 locks the bottle (silhouette, cap, blank label, liquid level); Image 2 controls the set only \u2014 do not transfer its products.\nTimeline: macro detail \u2192 20-degree orbit \u2192 cap twist action \u2192 clean hero frame.\nCamera: eye-level medium shot, slow arc, rack focus to the label.\nAudio: cap click at 00:08, fine bubbles, low rhythm.\nAvoid: redesign, duplicates, fake text, watermarks.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Unlabeled references bleed into each other \u2014 the set image's products can overwrite the bottle's identity. Assigning each asset a role and an explicit \"do not use for\" boundary keeps appearance authorities separated.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Long-form one-take (T2V, 30 s)<\/h3>\n<pre><code>Mode: Text-to-video, 30-second single take, 16:9.\nA street musician sets up on a rain-wet Lisbon corner at dusk. 00:00\u201300:06 \u2014 Wide establishing shot: trams, awnings, warm shop lights. 00:06\u201300:14 \u2014 Slow dolly-in as he rosins the bow and begins to play; close on his hands. 00:14\u201300:22 \u2014 Passersby slow; a child drops a coin, the tinny clink lands on the downbeat. 00:22\u201300:30 \u2014 Crane rises gently to reveal the street now gathered around him. Audio: violin lead, city ambience, rain easing off. Avoid: extra instruments, fake signage, watermark.\n<\/code><\/pre>\n<h3>First/last-frame transition<\/h3>\n<pre><code>First frame: the supplied portrait in a sunlit cafe. Last frame: the same portrait at night in the same seat. Transition: over the shot, daylight drains through the window behind her, lamps flicker on, and her posture settles \u2014 she lifts her coffee cup once, mid-transition. Audio: cafe murmur fading to evening quiet, one cup clink.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Describing the same action twice<\/strong> \u2014 the six-part formula warns against it; repetition reads as a second, conflicting action.<\/li>\n<li><strong>Overloading one generation<\/strong> \u2014 a beat needing location + costume + complex VFX + dialogue at once should be split; 2.5 can stage a lot, but each stage should hold one primary change.<\/li>\n<li><strong>Treating timestamps as edit points<\/strong> \u2014 they allocate time, not frame-accurate cuts; plan transitions loosely.<\/li>\n<li><strong>Letting references leak<\/strong> \u2014 a motion-reference video or control diagram can bleed pixels and colors into the frame; translate control images to text and give every asset a role plus a \"do not use for\" boundary.<\/li>\n<li><strong>Expecting pixel-accurate text or typography<\/strong> \u2014 for subtitles, signage, or product specs that must be exact, combine prepared references with post-production; the model cannot guarantee frame-level accuracy.<\/li>\n<li><strong>Chasing 4K on 2.5<\/strong> \u2014 4K output is unsupported by 2.5; use Seedance 2.0 (Standard) for 4K.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Seedance 2.5 (ByteDance); API IDs <code>dreamina-seedance-2-5-260628<\/code> (BytePlus), <code>doubao-seedance-2-5-260628<\/code> (Volcano) \u2014 version-dated, confirm against the live model list<\/li>\n<li><strong>Text Encoder:<\/strong><\/li>\n<li><strong>Max Prompt Tokens:<\/strong> Not verified from official docs (a third-party platform advises &lt;15,000 characters)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Natively co-generates audio and video in one latent space. Up to 50 multimodal references (reported as \u226430 images + \u226410 videos + \u226410 audio). Prompting languages reported as English and Chinese by community sources; dialogue generation reported across 11 languages (including Arabic, Thai, Indonesian, Vietnamese) per a third-party comparison citing BytePlus docs. Six supported aspect ratios reported via BytePlus (16:9, 4:3, 1:1, 3:4, 9:16, plus 21:9).<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://github.com/byteplus-sa/seed-prompt-studio/blob/HEAD/.agents/skills/seedance-prompt-25/SKILL.md (six-part formula, 50-reference budget, task auto-locks, and usage limitations sourced from the official Dreamina Seedance 2.5 prompt guide)<\/li>\n<li>https://github.com/seaimagineai/awesome-seedance-2-5-prompts/blob/HEAD/docs/prompting-guide.md (nine-part prompt anatomy, timestamp pacing)<\/li>\n<li>https://www.seedance.tv/blog/how-to-use-seedance-2-5 (t2v/i2v workflow, 30s single-pass capability)<\/li>\n<li>https://venice.ai/blog/seedance-2-5-prompt-tips (dialogue quoting, camera-move naming, 15,000-char platform guidance)<\/li>\n<li>https://github.com/gbeyrouti/seedance-prompting-claude-skill (model spec: 97\u2013721 frames, reference budgets, API model IDs)<\/li>\n<li>https://synthesys.io/blog/seedance-vs-kling/ (Seedance 2.0 vs 2.5 comparison: durations, resolutions, reference counts, dialogue languages)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/seedance-2.5.md"}, "video/ltx/0": {"title": "Prompt Guide: LTX-2.3", "html": "\n<p><strong>Model:<\/strong> LTX-2.3\n<strong>Developer:<\/strong> Lightricks\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong> Gemma 3 (per third-party integration reports; official text-encoder identity not published in the main repo docs)<\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>LTX-2.3 is the March 2026 open-weight release of Lightricks' LTX-2 audio-video foundation model (weights on HuggingFace as <code>Lightricks/LTX-2.3<\/code>; code repo <code>Lightricks/LTX-2<\/code>). It generates synchronized video and audio together in a single diffusion model, and was released alongside a desktop video editor enabling the model to run locally on consumer hardware. Like the rest of the LTX-2 family it is designed for very fast iteration (the \"Fast\" operating mode), so prompt refinement is part of the intended workflow. Versus LTX-2 (base, January 2026 open release), 2.3 brought higher resolution, richer color, and improved subject consistency. It predates LTX-2.5's native multi-shot generation, so 2.3 prompts are single continuous takes.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Write one flowing, present-tense paragraph that describes the action chronologically, like a cinematographer dictating a shot list \u2014 never comma-separated tag soup or a shot list with sluglines.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>cinematic, woman, cabin, night, lantern, 35mm, film grain, warm lighting, 8k, highly detailed\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>The interior of a dark wooden cabin at night, lit by a single flickering lantern. A 30-year-old woman in a red leather jacket sits at a rough table and slowly turns toward the window, reaching for the curtain. The camera dollies in gently, keeping her face in shallow focus as warm lamplight flares across the frame. 35mm film look, soft halation, quiet crackling ambience.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support in official prompting guidance<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Unknown<\/td>\n<td>No documented support<\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported (pipeline-level)<\/td>\n<td>Pipeline recipes supply a default negative prompt; ComfyUI integrations expose it (e.g. \"still image, no movements\" for i2v stiffness). However, the official prompting guide gives no general negative-prompt instruction.<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Unknown<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Under-described motion and scene; LTX's automatic prompt enhancer (<code>enhance_prompt<\/code>) is recommended when the prompt is short, rough, or was written for a different model<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>4\u20138 descriptive sentences, within 200 words (official guidance); every sentence must add concrete visual or audio detail<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Overcomplicated prompts with too many characters, layered actions, or excessive objects reduce clarity and model accuracy (scene complexity overload)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<pre><code>[Scene/Environment]. [Subject]. [Action/Motion]. [Camera movement]. [Style/Aesthetic]. [Audio]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Main action (first sentence)<\/td>\n<td>Start with the action in a single sentence<\/td>\n<td>\"A monster truck drives fast toward the camera.\"<\/td>\n<\/tr>\n<tr>\n<td>Subject details<\/td>\n<td>Age, appearance, clothing, distinguishing features; emotions via physical cues only<\/td>\n<td>\"A 30-year-old woman in a red leather jacket, short black hair\"<\/td>\n<\/tr>\n<tr>\n<td>Movement &amp; gestures<\/td>\n<td>Specific movements, gestures, body positions, facial micro-expressions; present-tense verbs<\/td>\n<td>\"She slowly turns toward the window, reaching for the curtain\"<\/td>\n<\/tr>\n<tr>\n<td>Background &amp; environment<\/td>\n<td>Lighting, color palette, textures, atmosphere, weather<\/td>\n<td>\"Dark wooden cabin at night, flickering lantern, dust in the air\"<\/td>\n<\/tr>\n<tr>\n<td>Camera<\/td>\n<td>Shot scale, camera movement relative to the subject, speed, technical details<\/td>\n<td>\"Slow dolly in, shallow depth of field, handheld feel\"<\/td>\n<\/tr>\n<tr>\n<td>Style / lighting / color<\/td>\n<td>Genre-appropriate cinematography terms<\/td>\n<td>\"35mm film look, warm color grading, halation\"<\/td>\n<\/tr>\n<tr>\n<td>Audio<\/td>\n<td>Ambient sound, music, dialogue in quotation marks with language/accent if needed<\/td>\n<td>\"Quiet crackling ambience\"; <code>She says softly, \"That's it...\"<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Scene set FIRST (official tip: prevents morphing/scene changes)<\/td>\n<td>\"Rain-soaked neon-lit Tokyo alley at night.\"<\/td>\n<\/tr>\n<tr>\n<td>Present-tense action verbs<\/td>\n<td>\"walks, turns, exhales, reaches, strides, grips\"<\/td>\n<\/tr>\n<tr>\n<td>Chronological sequencing<\/td>\n<td>\"first\u2026 then\u2026 as\u2026 while\u2026\"; note any changes or sudden events<\/td>\n<\/tr>\n<tr>\n<td>Cinematic camera language<\/td>\n<td>\"slow dolly in, handheld tracking, over-the-shoulder, wide establishing shot, rack focus, static frame\"<\/td>\n<\/tr>\n<tr>\n<td>Precise physical detail<\/td>\n<td>Age, ethnicity, clothing, facial micro-expressions; exact body/hand positions<\/td>\n<\/tr>\n<tr>\n<td>Lighting and color specifics<\/td>\n<td>\"golden hour, fluorescent, neon glow, flickering candles, dramatic shadows, muted palette\"<\/td>\n<\/tr>\n<tr>\n<td>Atmospheric elements<\/td>\n<td>\"fog, rain, dust, particles, smoke, mist\"<\/td>\n<\/tr>\n<tr>\n<td>Audio description<\/td>\n<td>Ambient sounds, music, dialogue in quotation marks, language/accent<\/td>\n<\/tr>\n<tr>\n<td>Era/genre terms<\/td>\n<td>\"1940s film, 70s TV drama, 80s news broadcast, film noir, documentary\"<\/td>\n<\/tr>\n<tr>\n<td>Style terms named early<\/td>\n<td>\"painterly, noir, analog film look, fashion editorial, stop-motion, cyberpunk\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Emotional labels (\"she is sad, confused\")<\/td>\n<td>Physical cues: \"her face crumples; she takes a shaky breath\"<\/td>\n<\/tr>\n<tr>\n<td>Comma-separated tag lists<\/td>\n<td>A single flowing paragraph with present-tense verbs<\/td>\n<\/tr>\n<tr>\n<td>Mixed/conflicting light sources (\"warm sunset with cold fluorescent glow\")<\/td>\n<td>One coherent light logic per shot, unless clearly motivated<\/td>\n<\/tr>\n<tr>\n<td>Prompts written for other models (e.g. Kling/Seedance shot lists) pasted in unchanged<\/td>\n<td>Rewrite into LTX's flowing-paragraph structure, or run through the prompt enhancer<\/td>\n<\/tr>\n<tr>\n<td>Text, signage, logos, brand names<\/td>\n<td>Leave out \u2014 2.3 does not render readable on-screen text<\/td>\n<\/tr>\n<tr>\n<td>Chaotic fast-twisting motion (jumping, juggling)<\/td>\n<td>Simpler, plausible motion; dancing works better than acrobatics<\/td>\n<\/tr>\n<tr>\n<td>Crowded frames with many characters and layered actions<\/td>\n<td>A few clear characters and actions per shot<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>30 (one-stage default for LTX-2.3; distilled pipelines reduce further)<\/td>\n<\/tr>\n<tr>\n<td><strong>Guidance / CFG Scale<\/strong><\/td>\n<td>Video 3.0 / audio 7.0 (pipeline defaults)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>768\u00d7512 default; up to ~1024\u00d71536 reported in community integrations; native 4K rendering claimed for the family<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduler / Sampler<\/strong><\/td>\n<td>(leave blank \u2014 not documented in official materials)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dtype / Precision<\/strong><\/td>\n<td>(leave blank \u2014 not documented in official materials)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Frame defaults: 121 frames at 24 fps (\u22485 s) in one-stage pipelines. Valid frame counts follow (n\u22121)%8==0. Three operating modes exist across the family: Fast, Pro, Ultra.<\/p>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt must carry the FULL scene: environment, subject(s) with distinguishing details, the chronological action, camera behavior, lighting, style, and audio. Official guidance: \"Give each sentence a verb that does something \u2014 walks, turns, exhales, reaches \u2014 rather than only describing how things look. Appearance alone gives the model little to animate.\" Keep it a single flowing paragraph of 4\u20138 sentences. Very short prompts underperform unless the prompt enhancer is on.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>The prompt's job shifts to MOTION: the image already supplies the content, so do not re-describe what is in the frame. Focus on the <em>sequence of actions<\/em> (\"first this happens, then this, after that this happens\") plus camera movement. For i2v from a first frame, prefer a single continuous take rather than describing cuts away from the opening image. Community-verified fix for \"stiff/still\" i2v outputs: add a negative prompt such as \"still image, no movements, frozen still image\" (via pipeline/ComfyUI negative-prompt inputs), lower the image input strength, and emphasize action sequencing over image description.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>T2V: Night market chase<\/h3>\n<p><strong>Intended content:<\/strong> A vendor runs through a night market, camera tracking alongside him, neon signs and steam.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>night market, running man, vendor, neon, steam, cinematic, tracking shot, 4k, dramatic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A crowded night market glows under rows of neon signs, steam rising from food stalls. A street vendor in a grease-stained apron runs down the narrow aisle, clutching a crate of oranges. The camera tracks alongside him at medium distance, weaving between stalls as hanging lanterns blur past. Warm neon light mixes with cool shadows; shouts and sizzling woks fill the air. Handheld feel, shallow depth of field, film-noir mood.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The good prompt follows the official formula \u2014 scene first, specific subject, chronological present-tense action, explicit camera behavior, lighting, and audio \u2014 giving the model concrete motion to animate. The bad prompt is tag soup with no verbs and no temporal flow; LTX animates from described action, not keywords.<\/p>\n<h3>T2V: Emotional dialogue beat<\/h3>\n<p><strong>Intended content:<\/strong> Two people argue quietly in a sunlit backyard; deadpan absurd tone with the grandfather flapping butterfly wings.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A woman is sad and confused in a backyard. Her dad is being weird. Dramatic, emotional scene, funny.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A warm sunny backyard. The camera starts in a tight cinematic close-up of a woman and a man in their 30s, facing each other with serious expressions. The woman, emotional and dramatic, says softly, &quot;That's it... Dad's lost it. And we've lost Dad.&quot; The camera slowly pans right, revealing the grandfather in the garden wearing enormous butterfly wings, waving his arms in the air like he's trying to take off. The woman covers her face, on the verge of tears. The tone is deadpan, absurd, and quietly tragic.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Adapted from an official LTX-2 sample prompt. Emotions are shown through physical cues and quoted dialogue (never abstract labels like \"sad\" or \"confused\"), camera movement is described relative to subjects, and the action flows chronologically in present tense.<\/p>\n<h3>I2V: Animating a portrait<\/h3>\n<p><strong>Intended content:<\/strong> A still portrait of a woman in a caf\u00e9 comes alive \u2014 she looks up, smiles slightly, steam rises from her cup.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A photorealistic portrait of a young woman with brown hair sitting in a cozy caf\u00e9, wearing a green sweater, warm lighting, wooden tables in background, highly detailed\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>She looks up from her cup and smiles faintly, eyes brightening. Steam rises from the coffee in slow curls. The camera pushes in very slowly toward her face. Warm caf\u00e9 ambience, soft clinking of cups.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The i2v prompt describes only motion and camera movement \u2014 the image already contains the woman, the caf\u00e9, and the sweater, so re-describing them wastes the prompt and can fight the reference frame. The bad prompt is a static image description with no action, which is exactly what produces \"still image\" i2v results.<\/p>\n<h3>I2V: Stiff output fix<\/h3>\n<p><strong>Intended content:<\/strong> A photo of a lighthouse at dusk should show waves crashing and light sweeping; outputs keep coming back nearly static.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Animate this lighthouse image with dramatic waves and make it cinematic and beautiful\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>First, white-capped waves crash against the rocks at the base of the lighthouse. Then the beam of light sweeps slowly across the darkening sky from left to right. The camera holds steady, then tilts up slightly to follow the beam. Distant foghorn and the low roar of surf.\n<\/code><\/pre>\n<p>(plus negative prompt: <code>still image, no movements, frozen still image<\/code>)<\/p>\n<p><strong>Why:<\/strong> Per community-verified practice, i2v works best when the prompt is a <em>sequence of actions<\/em> (\"first\u2026 then\u2026\") rather than a description of the image, with explicit camera movement and a motion-oriented negative prompt to break stillness.<\/p>\n<h3>T2V: Pacing control<\/h3>\n<p><strong>Intended content:<\/strong> A tense interrogation scene that needs a deliberate pause before the reveal.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Interrogation room scene, detective reveals the twist dramatically, tense, cinematic\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A dim interrogation ro
