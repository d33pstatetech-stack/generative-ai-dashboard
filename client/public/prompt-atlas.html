 stories as separate clips<\/td>\n<\/tr>\n<tr>\n<td>Named mood<\/td>\n<td><code>melancholic<\/code>, <code>ominous<\/code>, <code>tranquil<\/code> \u2014 guides color grade and pacing<\/td>\n<\/tr>\n<tr>\n<td>Aspect-ratio-aware composition<\/td>\n<td><code>9:16<\/code> for portraits/tall objects (buildings, trees, waterfalls); <code>16:9<\/code> for landscapes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>A detective finds a clue in a library, then drives across the city at night, and then confronts a suspect in a warehouse<\/code><\/td>\n<td>One focused moment per clip; generate three separate clips (documented \"not recommended\" example)<\/td>\n<\/tr>\n<tr>\n<td><code>I envision a scene where, like, the main focus, a dude, is kinda sad...<\/code><\/td>\n<td><code>Low-angle close-up shot of a man with a somber expression. The scene is dimly lit, conveying a melancholic mood<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>A woman says: \"My name is Clara.\"<\/code> (quotes can render as text in the video)<\/td>\n<td><code>A woman says: My name is Clara.<\/code> \u2014 colon after the speaker's action, no quotation marks<\/td>\n<\/tr>\n<tr>\n<td><code>no cars<\/code>, <code>no people<\/code> (bare negations in negativePrompt)<\/td>\n<td>Positive exclusion phrasing: <code>a street with no cars or traffic<\/code><\/td>\n<\/tr>\n<tr>\n<td>Audio cues (<code>SFX:<\/code>, dialogue, ambience)<\/td>\n<td>Nothing \u2014 Veo 2 is silent; leave sound out of the prompt and plan post-production audio<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Duration<\/strong><\/td>\n<td>8 s standard; <code>durationSeconds<\/code> 5\u20138 supported on Vertex AI<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>720p (1080p not supported for Veo 2)<\/td>\n<\/tr>\n<tr>\n<td><strong>Aspect ratio<\/strong><\/td>\n<td>16:9 or 9:16<\/td>\n<\/tr>\n<tr>\n<td><strong>enhancePrompt<\/strong><\/td>\n<td><code>true<\/code> \u2014 Veo 2-only automatic prompt rewriter that adds cinematic detail (default on)<\/td>\n<\/tr>\n<tr>\n<td><strong>negativePrompt<\/strong><\/td>\n<td>Free text describing what to exclude (Vertex AI)<\/td>\n<\/tr>\n<tr>\n<td><strong>personGeneration<\/strong><\/td>\n<td><code>allow_adult<\/code> / <code>allow_all<\/code> / <code>dont_allow<\/code> (region-restricted; i2v modes allow <code>allow_adult<\/code> only)<\/td>\n<\/tr>\n<tr>\n<td><strong>seed<\/strong><\/td>\n<td>Integer for semi-reproducible output (Vertex AI; not perfectly deterministic)<\/td>\n<\/tr>\n<tr>\n<td><strong>sampleCount<\/strong><\/td>\n<td>1\u20134 videos per request<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt carries everything: subject, action, setting, style, camera, mood. Focus each prompt on a single scene \u2014 Google's docs explicitly warn against chaining distinct events (\"A then B then C\") in one short prompt, recommending separate clips instead. With <code>enhancePrompt<\/code> enabled, a decent core prompt gets enriched automatically; with it off, you must supply the cinematic detail yourself.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>Veo uses the input image as the <strong>initial frame<\/strong> \u2014 it already defines character detail, lighting, and artistic style, so use a sharp, clear, well-composed source image (\"the stronger the start, the better the finish\"). <strong>Prompt for motion only<\/strong>: camera movement, subject animation, environmental changes. Do not re-describe the character, background, or lighting \u2014 redundant prompts confuse the model and lead to poor results. Refer to characters with general terms (\"the subject\", \"the woman\", \"he\", \"she\", \"they\"). Three motion types can be directed alone or combined: camera motion (<code>Slow dolly in on the subject<\/code>), subject animation (<code>The character's hair and clothes flutter gently in the wind<\/code>), environmental animation (<code>Fog rolls in slowly across the landscape<\/code>). No audio fields apply \u2014 output is silent.<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>1. T2V \u2014 Focused single scene vs event chain<\/h3>\n<p><strong>Intended content:<\/strong> A detective story moment.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A detective finds a clue in a library, then drives across the city at night, and then confronts a suspect in a warehouse\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Close-up on a detective's gloved hand brushing dust off an old book in a dark library, revealing a hidden symbol\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Google's docs flag exactly this pattern as \"not recommended\": chaining A-then-B-then-C in one short prompt produces muddled, incomplete videos. One focused moment per clip renders cleanly; the other beats become separate clips.<\/p>\n<h3>2. T2V \u2014 Specific vs vague<\/h3>\n<p><strong>Intended content:<\/strong> A sad man seen from below in a dark scene.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>I envision a scene where, like, the main focus, a dude, is kinda sad, and it's like, dark, and the camera is sort of, from below, you know?\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Low-angle close-up shot of a man with a somber expression. The scene is dimly lit, conveying a melancholic mood\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The documented \"not recommended / recommended\" pair: clear, direct prompts that eliminate ambiguity beat hedged, conversational ones. Camera language (<code>low-angle close-up<\/code>) and named mood (<code>melancholic<\/code>) are actionable; \"kinda sad\" is not.<\/p>\n<h3>3. I2V \u2014 Motion-only vs re-description<\/h3>\n<p><strong>Intended content:<\/strong> Animate a photo of an old blue pickup truck in a sunflower field.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>An old, somewhat beat-up blue pickup truck with rust spots parked in front of a field of yellow sunflowers under a bright blue sky with white clouds, photorealistic style\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A sweeping drone-like aerial view starting from ground level and rising to reveal the entire landscape in epic proportions\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The image already supplies the truck, the field, the style \u2014 re-describing them fights the first-frame constraint and confuses the model. The good prompt (from Google's docs) directs only the camera move and leaves the scene alone.<\/p>\n<h3>4. Detail level \u2014 Expanded vs bare<\/h3>\n<p><strong>Intended content:<\/strong> A desperate man making a phone call in a noir scene.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>The camera dollies to show a close up of a desperate man in a green trench coat. He's making a call on a rotary-style wall phone with a green neon light. It looks like a movie scene.\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A close-up cinematic shot follows a desperate man in a weathered green trench coat as he dials a rotary phone mounted on a gritty brick wall, bathed in the eerie glow of a green neon sign. The camera dollies in, revealing the tension in his jaw. Shallow depth of field focuses on his furrowed brow and the black rotary phone, blurring the background into a sea of neon colors, creating a sense of urgency and isolation.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The official docs' \"less detail / more detail\" pair: the same scene rendered flat vs. with cinematic intent. Specific texture (<code>weathered<\/code>, <code>gritty<\/code>), visible emotion cues (<code>tension in his jaw<\/code>), and lens language (<code>shallow depth of field<\/code>) are what turn a description into direction.<\/p>\n<h3>5. Quotation marks \u2014 Text-safe vs text-rendering risk<\/h3>\n<p><strong>Intended content:<\/strong> A woman introducing herself on camera.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A woman says: &quot;My name is Clara.&quot;\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A woman says: My name is Clara.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Documented Vertex AI best practice: quotation marks can cause the model to render text in the video. Use a colon after the speaker's action with no quotes. (And since Veo 2 has no audio, no voice will speak the line either \u2014 keep any \"speech\" minimal.)<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Ambient / nature<\/h3>\n<pre><code>Aerial shot of a cozy mountain village at dusk, snow falling gently, warm lights glowing from cottage windows, smoke rising from chimneys\n<\/code><\/pre>\n<h3>Noir<\/h3>\n<pre><code>Cinematic close-up of a detective in a trench coat walking down a rain-soaked alley at night, neon lights reflecting on puddles\n<\/code><\/pre>\n<h3>I2V motion prompt (subject animation + environmental)<\/h3>\n<pre><code>The character's hair and clothes flutter gently in the wind. Fog rolls in slowly across the landscape.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Chaining multiple events in one 8-second prompt<\/strong> \u2014 the documented top failure; one focused moment per clip.<\/li>\n<li><strong>Writing audio cues<\/strong> (dialogue, SFX, ambience) \u2014 Veo 2 is silent; they are ignored, so keep prompts visual-only.<\/li>\n<li><strong>Using quotation marks<\/strong> \u2014 they risk rendered text; use a colon after the speaker's action instead.<\/li>\n<li><strong>Re-describing the source image in image-to-video<\/strong> \u2014 prompt for motion only; redundant description degrades results.<\/li>\n<li><strong>Disabling <code>enhancePrompt<\/code> while writing sparse prompts<\/strong> \u2014 if you rely on the auto-rewriter, keep it on; if you turn it off, you must supply the cinematic detail yourself.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Veo 2 \u2014 Google DeepMind (<code>veo-2.0-generate-001<\/code>)<\/li>\n<li><strong>Text Encoder:<\/strong><\/li>\n<li><strong>Max Prompt Tokens:<\/strong><\/li>\n<li><strong>Training Data / Notes:<\/strong> Silent output (no native audio). 8-second clips (5\u20138 s configurable on Vertex), 720p, 16:9 or 9:16. Supports text-to-video and image-to-video (initial frame). <code>enhancePrompt<\/code> automatic rewriting is Veo 2-only. All generated videos carry SynthID watermarking.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://ai.google.dev/gemini-api/docs/veo (prompt writing basics, element examples, model versions)<\/li>\n<li>https://docs.cloud.google.com/vertex-ai/generative-ai/docs/video/best-practice (recommended/not-recommended pairs, single-scene rule, quotation-mark guidance, image-to-video motion-only guidance)<\/li>\n<li>https://github.com/chef-daio/agentic-skills/blob/HEAD/content-gen/video-meme/SKILL.md (Veo 2 parameter reference: enhancePrompt, durations, negative prompt)<\/li>\n<li>https://github.com/sutt/vidstr (Veo 2 config notes: 8 s, 720p, no 1080p)<\/li>\n<li>https://github.com/alexnodeland-bot/skill-veo/blob/HEAD/SKILL.md (input modes, Gemini API limitations)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/veo-2.md"}, "video/veo/1": {"title": "Prompt Guide: Veo 3", "html": "\n<p><strong>Model:<\/strong> Veo 3 (<code>veo-3.0-generate-001<\/code>; also <code>veo-3.0-fast-generate-001<\/code>)\n<strong>Developer:<\/strong> Google DeepMind (via Gemini API / Vertex AI)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong><\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Veo 3 (announced at Google I/O in May 2025) was the first Veo generation to natively generate <strong>audio with video<\/strong> \u2014 dialogue and speech, sound effects, and ambient sound, all synchronized to the visuals in a single generation. It kept the 8-second clip format and the same prompt fundamentals as Veo 2 (subject/context, action, style, camera, ambiance), but prompts now also carry a <strong>sound layer<\/strong>: who speaks, how they deliver it, and what the environment sounds like. On the Gemini API it is now listed as deprecated in favor of Veo 3.1, which Google says improves prompt adherence and image-to-video audiovisual quality.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Veo 3 renders what it can <strong>see and hear simultaneously<\/strong> \u2014 so direct both. A prompt that describes the scene but stays silent about sound gets a less complete clip; a prompt that names the speaker, their delivery, the sound effects, and the ambience gets a full scene with synced audio.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>Two people look at a cryptic drawing on a wall\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>A close up of two people staring at a cryptic drawing on a wall, torchlight flickering. A man murmurs, &quot;This must be it. That's the secret code.&quot; The woman looks at him and whispers excitedly, &quot;What did you find?&quot;\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not documented<\/td>\n<td>No weight syntax; use descriptive language instead.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported (Vertex AI)<\/td>\n<td><code>negativePrompt<\/code> parameter \u2014 describe what to exclude.<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>Generic composition and thin or missing audio design.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>1\u20133 well-structured sentences carrying the visual elements <strong>plus<\/strong> the audio layer (dialogue lines with speaker/delivery, named SFX, ambience). More detailed prompts improve motion and scene fidelity.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>Same documented Veo formula used across versions:<\/p>\n<pre><code>[Cinematography] + [Subject] + [Action] + [Context] + [Style &amp; Ambiance] + [Audio]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cinematography<\/td>\n<td>Camera work and shot composition<\/td>\n<td><code>Drone shot following<\/code>, <code>close up<\/code>, <code>slow pan<\/code><\/td>\n<\/tr>\n<tr>\n<td>Subject<\/td>\n<td>Main character or focal point<\/td>\n<td><code>a classic red convertible driven by a man<\/code><\/td>\n<\/tr>\n<tr>\n<td>Action<\/td>\n<td>What the subject does<\/td>\n<td><code>accelerates fast<\/code><\/td>\n<\/tr>\n<tr>\n<td>Context<\/td>\n<td>Environment and background elements<\/td>\n<td><code>along a winding coastal road at sunset, waves crashing against the rocks below<\/code><\/td>\n<\/tr>\n<tr>\n<td>Style &amp; Ambiance<\/td>\n<td>Aesthetic, mood, lighting<\/td>\n<td><code>cinematic realism<\/code><\/td>\n<\/tr>\n<tr>\n<td>Audio<\/td>\n<td>Dialogue, SFX, ambience cues<\/td>\n<td><code>The engine roars loudly<\/code> / <code>\"This must be it,\" he murmurs<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Audio cues documented for the Veo 3 generation: <strong>dialogue<\/strong> \u2014 put specific speech in quotes and identify the speaker and their delivery; <strong>sound effects<\/strong> \u2014 describe sounds with clarity and sync them to visible events; <strong>ambient sound<\/strong> \u2014 define the background soundscape; <strong>music cues<\/strong> \u2014 can be requested in the prompt.<\/p>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Subject \u2192 action \u2192 setting \u2192 style \u2192 mood (+ audio)<\/td>\n<td>The one-sentence-screenplay structure<\/td>\n<\/tr>\n<tr>\n<td>Film language for camera<\/td>\n<td><code>slow dolly-in<\/code>, <code>wide establishing shot<\/code>, <code>aerial view<\/code>, <code>POV<\/code>, <code>tracking drone<\/code><\/td>\n<\/tr>\n<tr>\n<td>Identified speakers with delivery<\/td>\n<td><code>A woman says in a weary voice, \"...\"<\/code><\/td>\n<\/tr>\n<tr>\n<td>Synchronized SFX<\/td>\n<td>Sounds tied to visible events, described clearly<\/td>\n<\/tr>\n<tr>\n<td>Defined ambience<\/td>\n<td>The environmental soundscape, not just \"background noise\"<\/td>\n<\/tr>\n<tr>\n<td>One focused scene per clip<\/td>\n<td>Multi-event stories work better as separate clips<\/td>\n<\/tr>\n<tr>\n<td>Rich, specific, concise language<\/td>\n<td>Visual description, not quality superlatives<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>A detective finds a clue in a library, then drives across the city at night...<\/code> (event chain)<\/td>\n<td>One focused moment per 8-second clip; separate clips for each beat<\/td>\n<\/tr>\n<tr>\n<td>Dialogue with no speaker or delivery (<code>\"We have to leave now.\"<\/code> floating unattributed)<\/td>\n<td><code>A woman says urgently, \"We have to leave now.\"<\/code> \u2014 identify who speaks and how<\/td>\n<\/tr>\n<tr>\n<td>Sounds disconnected from the picture (<code>thunder sounds<\/code>)<\/td>\n<td><code>SFX: thunder cracks in the distance<\/code> tied to a visible storm<\/td>\n<\/tr>\n<tr>\n<td>Bare negations (<code>no cars<\/code>)<\/td>\n<td>Exclusion phrasing: <code>a street with no cars or traffic<\/code><\/td>\n<\/tr>\n<tr>\n<td>Quotation marks for dialogue where text-rendering is a risk<\/td>\n<td>Vertex AI best practice: use a colon after the speaker's action (<code>Clara says: It has to be here<\/code>) to avoid rendered text; the Veo 3.1 guide uses quotes for speech \u2014 check output either way<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Duration<\/strong><\/td>\n<td>8 s<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>720p or 1080p (Vertex AI)<\/td>\n<\/tr>\n<tr>\n<td><strong>Aspect ratio<\/strong><\/td>\n<td>16:9 or 9:16<\/td>\n<\/tr>\n<tr>\n<td><strong>Audio<\/strong><\/td>\n<td>Native, enabled by default (<code>includeAudio<\/code>); disable only to cut cost on visual-only drafts<\/td>\n<\/tr>\n<tr>\n<td><strong>negativePrompt<\/strong><\/td>\n<td>Free text describing what to exclude (Vertex AI)<\/td>\n<\/tr>\n<tr>\n<td><strong>personGeneration<\/strong><\/td>\n<td><code>allow_adult<\/code> / <code>allow_all<\/code> / <code>dont_allow<\/code> (region-restricted)<\/td>\n<\/tr>\n<tr>\n<td><strong>seed<\/strong><\/td>\n<td>Integer for semi-reproducible output (Vertex AI)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt carries the full scene <strong>and the full soundtrack<\/strong>. Veo 3's native audio is its defining upgrade over Veo 2: write dialogue as quoted lines attributed to identified speakers with delivery notes, describe SFX with clarity, and define the ambient soundscape. More detail improves both motion and scene fidelity. Keep each clip to one focused scene.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>The input image is the initial frame \u2014 it owns subject, lighting, and style. \"Photo-to-video\" on Veo 3: upload the image, then use the prompt to <strong>create motion, change the camera, and generate voice or ambient sound<\/strong>. Prompt for motion and sound, not re-description: camera moves, subject animation, environmental changes, plus the audio layer. Do not re-describe the character, background, or lighting \u2014 redundant prompts confuse the model. (Veo 3.1 later improved image-to-video prompt adherence and audiovisual quality further.)<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>1. T2V \u2014 Sound-directed vs silent scene description<\/h3>\n<p><strong>Intended content:<\/strong> Two people examining a cryptic drawing by torchlight, exchanging whispered dialogue.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Two people look at a cryptic drawing on a wall with torchlight\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A close up of two people staring at a cryptic drawing on a wall, torchlight flickering. A man murmurs, &quot;This must be it. That's the secret code.&quot; The woman looks at him and whispers excitedly, &quot;What did you find?&quot;\n<\/code><\/pre>\n<p><strong>Why:<\/strong> On Veo 3 the audio layer is generated from the prompt \u2014 the bad prompt yields a silent-looking scene with no designed sound. The good prompt (Google's own documented example) gives identified speakers, delivery (<code>murmurs<\/code>, <code>whispers excitedly<\/code>), and quoted lines for lip-synced dialogue.<\/p>\n<h3>2. T2V \u2014 Audio tied to action vs audio ignored<\/h3>\n<p><strong>Intended content:<\/strong> A red convertible speeding along a coastal road at sunset.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>Drone shot following a classic red convertible along a winding coastal road at sunset\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Drone shot following a classic red convertible driven by a man along a winding coastal road at sunset, waves crashing against the rocks below. The convertible accelerates fast and the engine roars loudly.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The bad prompt leaves the soundtrack undesigned. The good prompt (Google's documented realism example) names an action (<code>accelerates fast<\/code>) and its sound (<code>the engine roars loudly<\/code>), plus environmental audio (<code>waves crashing<\/code>) \u2014 Veo 3 syncs the roar to the acceleration.<\/p>\n<h3>3. I2V \u2014 Motion + sound vs re-description<\/h3>\n<p><strong>Intended content:<\/strong> Animate a still photo of a waterfall into a living scene.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A majestic waterfall in a lush rainforest with detailed foliage and mist, photorealistic, peaceful\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Use smooth, cinematic camera movement: a slow push toward the waterfall as the water flow intensifies. Capture the rushing water, misty atmosphere, and dappled sunlight. Audio: the roar of falling water with distant bird calls.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The image already shows the waterfall, foliage, and mood \u2014 re-describing it risks drift. The good prompt directs only what the image can't supply: camera move, intensifying motion, and the audio layer.<\/p>\n<h3>4. Dialogue \u2014 Attributed with delivery vs unattributed<\/h3>\n<p><strong>Intended content:<\/strong> A detective questions a woman; both speak.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A detective and a woman talk in an office. &quot;Did you see anything that night?&quot; &quot;I already told the police everything.&quot;\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Medium shot of a detective behind his desk in a dim office. He looks up at the woman and asks in a weary voice, &quot;Did you see anything that night?&quot; She meets his gaze, voice steady, and replies, &quot;I already told the police everything.&quot; Low office ambience beneath the dialogue.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Documented guidance: specific dialogue should identify the speaker and the delivery. Unattributed lines leave casting, lip-sync targets, and vocal tone to chance; attribution plus delivery notes give the model a performable script.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Dialogue &amp; sound effects (Google's documented example)<\/h3>\n<pre><code>A close up of two people staring at a cryptic drawing on a wall, torchlight flickering. A man murmurs, &quot;This must be it. That's the secret code.&quot; The woman looks at him and whispering excitedly, &quot;What did you find?&quot;\n<\/code><\/pre>\n<h3>Cinematic realism with synced SFX (Google's documented example)<\/h3>\n<pre><code>Drone shot following a classic red convertible driven by a man along a winding coastal road at sunset, waves crashing against the rocks below. The convertible accelerates fast and the engine roars loudly.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Forgetting the audio layer<\/strong> \u2014 Veo 3's headline feature is native audio; prompts that describe only visuals leave dialogue, SFX, and ambience undesigned.<\/li>\n<li><strong>Unattributed dialogue<\/strong> \u2014 floating quoted lines with no speaker or delivery weaken lip-sync and performance; name who speaks and how.<\/li>\n<li><strong>Chaining multiple events in one 8-second clip<\/strong> \u2014 one focused moment per clip; split multi-beat stories into separate generations.<\/li>\n<li><strong>Re-describing the source image in image-to-video<\/strong> \u2014 the image owns the look; direct motion, camera, and sound.<\/li>\n<li><strong>Using Veo 3's deprecated API IDs in new work<\/strong> \u2014 <code>veo-3.0-generate-001<\/code> is listed as deprecated on the Gemini API; new builds should target Veo 3.1.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Veo 3 \u2014 Google DeepMind (<code>veo-3.0-generate-001<\/code>, <code>veo-3.0-fast-generate-001<\/code>)<\/li>\n<li><strong>Text Encoder:<\/strong><\/li>\n<li><strong>Max Prompt Tokens:<\/strong><\/li>\n<li><strong>Training Data / Notes:<\/strong> First Veo generation with natively generated audio (dialogue, SFX, ambience) synchronized to video. 8-second clips, 720p/1080p, 16:9 or 9:16. Supports text-to-video and image-to-video. Listed as deprecated on the Gemini API in favor of Veo 3.1. All generated videos carry SynthID watermarking.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://ai.google.dev/gemini-api/docs/veo (Veo 3 dialogue/SFX examples, model version table showing Veo 3 as deprecated)<\/li>\n<li>https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-veo-3-1 (five-part prompt formula; Veo 3.1 builds on Veo 3 with stronger prompt adherence and improved image-to-video quality)<\/li>\n<li>https://www.escapism.ai/p/how-to-use-google-veo-3-1-in-flora (Veo 3 baseline capabilities: 8 s clips, native audio, photo-to-video workflow)<\/li>\n<li>https://docs.cloud.google.com/vertex-ai/generative-ai/docs/video/best-practice (single-scene rule, quotation-mark guidance, image-to-video motion-only guidance)<\/li>\n<li>https://github.com/lixpi/lixpi/issues/216 (summary of Google's Veo prompt guidance: audio cue types, speaker identification, SFX synchronization)<\/li>\n<\/ul>", "pairs": 4, "file": "models/video/veo-3.md"}, "video/veo/2": {"title": "Prompt Guide: Veo 3.1", "html": "\n<p><strong>Model:<\/strong> Veo 3.1 (<code>veo-3.1-generate-preview<\/code>; Fast: <code>veo-3.1-fast-generate-preview<\/code>; Lite: <code>veo-3.1-lite-generate-preview<\/code>)\n<strong>Developer:<\/strong> Google DeepMind (via Gemini API / Vertex AI)\n<strong>Type:<\/strong> Video\n<strong>Text Encoder:<\/strong><\/p>\n<hr />\n<h2>Overview<\/h2>\n<p>Veo 3.1 (released October 2025; current on the Gemini API as of early 2026) is Google's flagship video model: 8-second clips at up to 4K with <strong>natively generated, synchronized audio<\/strong> \u2014 dialogue with lip-sync, precisely timed sound effects, and ambient soundscapes, all directed from the prompt. It builds on Veo 3 with stronger prompt adherence and improved audiovisual quality when turning images into videos. Its distinctive creative controls are <strong>timestamp prompting<\/strong> (multi-shot sequences with timed segments in one generation), <strong>first-and-last-frame<\/strong> transitions, <strong>ingredients-to-video<\/strong> reference images (up to 3), and <strong>video extension<\/strong>. The Fast and Lite variants trade speed/cost for quality with the same prompting language.<\/p>\n<hr />\n<h2>Core Prompting Principle<\/h2>\n<p>Veo 3.1 is a <strong>directing instrument, not a slot machine<\/strong>: the five-part formula \u2014 cinematography, subject, action, context, style &amp; ambiance \u2014 plus an explicit soundstage direction gives it complete, testable instructions for picture and sound. Treat the 8 seconds as one unbroken take you are choreographing, not a story you are summarizing.<\/p>\n<p><strong>\u274c DON'T:<\/strong><\/p>\n<pre><code>A detective in an office, cinematic, with dialogue\n<\/code><\/pre>\n<p><strong>\u2705 DO:<\/strong><\/p>\n<pre><code>Medium shot, a tired detective behind his desk in a dim 1980s office late at night, rubbing his temples in exhaustion. Harsh fluorescent overhead light, green glow of a monochrome monitor. He looks up and says in a weary voice, &quot;Of all the offices in this town, you had to walk into mine.&quot; Ambient noise: the quiet hum of the computer, distant traffic.\n<\/code><\/pre>\n<hr />\n<h2>Prompt Syntax<\/h2>\n<table>\n<thead>\n<tr>\n<th>Syntax<\/th>\n<th>Supported?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Weighting <code>(word:1.4)<\/code><\/td>\n<td>Not documented<\/td>\n<td>No weight syntax; use descriptive language instead.<\/td>\n<\/tr>\n<tr>\n<td>Emphasis <code>((word))<\/code><\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>BREAK<\/code> keyword<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>[from:to:step]<\/code> blending<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Negative prompt<\/td>\n<td>Supported<\/td>\n<td><code>negativePrompt<\/code> parameter (Vertex AI). Describe what to exclude as a positive statement: \"a desolate landscape with no buildings or roads\" rather than \"no man-made structures\".<\/td>\n<\/tr>\n<tr>\n<td>Special / trigger tokens<\/td>\n<td>Supported<\/td>\n<td>Timestamp ranges (<code>[00:00-00:02]<\/code>), audio labels (<code>SFX:<\/code>, <code>Ambient noise:<\/code>), quotation marks for dialogue, colon-after-speaker for speech.<\/td>\n<\/tr>\n<tr>\n<td>Regional / masked prompting<\/td>\n<td>Not documented<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Ideal Prompt Length<\/h2>\n<table>\n<thead>\n<tr>\n<th>Length<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Too short<\/td>\n<td>The model guesses composition, motion, and audio \u2014 thin, generic 8-second clips.<\/td>\n<\/tr>\n<tr>\n<td>Ideal<\/td>\n<td>1\u20133 well-structured sentences carrying all five formula elements plus audio direction. Google's docs demonstrate that the \"more detail\" revision of the same prompt produces markedly better motion fidelity and scene quality.<\/td>\n<\/tr>\n<tr>\n<td>Too long<\/td>\n<td>Text input is capped at <strong>1,024 tokens<\/strong> on the Gemini API \u2014 content beyond that is cut off, so prioritize subject, action, camera, and audio cues.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Structure<\/h2>\n<p>Google's official five-part formula for Veo 3.1:<\/p>\n<pre><code>[Cinematography] + [Subject] + [Action] + [Context] + [Style &amp; Ambiance]\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cinematography<\/td>\n<td>Camera work and shot composition \u2014 the most powerful tone tool<\/td>\n<td><code>Medium shot<\/code>, <code>Crane shot starting low ... and ascending high above<\/code><\/td>\n<\/tr>\n<tr>\n<td>Subject<\/td>\n<td>Main character or focal point<\/td>\n<td><code>a lone hiker<\/code>, <code>a tired corporate worker<\/code><\/td>\n<\/tr>\n<tr>\n<td>Action<\/td>\n<td>What the subject does<\/td>\n<td><code>rubbing his temples in exhaustion<\/code><\/td>\n<\/tr>\n<tr>\n<td>Context<\/td>\n<td>Environment and background elements<\/td>\n<td><code>in front of a bulky 1980s computer in a cluttered office late at night<\/code><\/td>\n<\/tr>\n<tr>\n<td>Style &amp; Ambiance<\/td>\n<td>Aesthetic, mood, lighting<\/td>\n<td><code>Retro aesthetic, shot as if on 1980s color film, slightly grainy<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Directing the soundstage<\/strong> (the sixth, Veo-3-generation skill):\n- <strong>Dialogue:<\/strong> quotation marks for specific speech, speaker identified, delivery named \u2014 <code>A woman says, \"We have to leave now.\"<\/code>\n- <strong>Sound effects:<\/strong> described with clarity \u2014 <code>SFX: thunder cracks in the distance<\/code>\n- <strong>Ambient noise:<\/strong> the background soundscape \u2014 <code>Ambient noise: the quiet hum of a starship bridge<\/code><\/p>\n<p><strong>Timestamp prompting<\/strong> for multi-shot sequences in one generation:<\/p>\n<pre><code>[00:00-00:02] Medium shot from behind a young female explorer ... as she pushes aside a large jungle vine to reveal a hidden path.\n[00:02-00:04] Reverse shot of the explorer's freckled face ... SFX: The rustle of dense leaves, distant exotic bird calls.\n[00:04-00:06] Tracking shot following the explorer ... Emotion: Wonder and reverence.\n[00:06-00:08] Wide, high-angle crane shot ... SFX: A swelling, gentle orchestral score begins to play.\n<\/code><\/pre>\n<hr />\n<h2>What to Include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Include<\/th>\n<th>Example keywords / phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The five formula elements in every prompt<\/td>\n<td>Cinematography, subject, action, context, style &amp; ambiance<\/td>\n<\/tr>\n<tr>\n<td>Camera movement vocabulary<\/td>\n<td><code>dolly shot<\/code>, <code>tracking shot<\/code>, <code>crane shot<\/code>, <code>aerial view<\/code>, <code>slow pan<\/code>, <code>POV shot<\/code><\/td>\n<\/tr>\n<tr>\n<td>Composition<\/td>\n<td><code>wide shot<\/code>, <code>close-up<\/code>, <code>extreme close-up<\/code>, <code>low angle<\/code>, <code>two-shot<\/code><\/td>\n<\/tr>\n<tr>\n<td>Lens &amp; focus<\/td>\n<td><code>shallow depth of field<\/code>, <code>wide-angle lens<\/code>, <code>soft focus<\/code>, <code>macro lens<\/code>, <code>deep focus<\/code><\/td>\n<\/tr>\n<tr>\n<td>Full character description for consistency<\/td>\n<td>Name + unchangeable features (build, hair, eyes, marks) + voice style \u2014 pasted unchanged into every scene's prompt, with the same seed<\/td>\n<\/tr>\n<tr>\n<td>Timestamped beats for multi-shot pacing<\/td>\n<td><code>[00:00-00:02]<\/code>, <code>[00:02-00:04]<\/code>... with SFX per beat<\/td>\n<\/tr>\n<tr>\n<td>Audio direction for every scene that needs it<\/td>\n<td>Dialogue with delivery, synced SFX, defined ambience<\/td>\n<\/tr>\n<tr>\n<td>Aspect-ratio-intent<\/td>\n<td><code>16:9<\/code> widescreen / <code>9:16<\/code> portrait chosen for the platform and subject<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What to Avoid<\/h2>\n<table>\n<thead>\n<tr>\n<th>Instead of...<\/th>\n<th>Write...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>A detective finds a clue in a library, then drives across the city at night, and then confronts a suspect in a warehouse<\/code><\/td>\n<td>One focused moment per clip, or timestamped beats if the shots fit in 8 seconds<\/td>\n<\/tr>\n<tr>\n<td><code>negativePrompt: \"no man-made structures\"<\/code> (bare negation)<\/td>\n<td><code>\"a desolate landscape with no buildings or roads\"<\/code> \u2014 describe the exclusion positively<\/td>\n<\/tr>\n<tr>\n<td><code>A woman says: \"My name is Clara.\"<\/code> (quotes risk rendered text)<\/td>\n<td>Vertex best practice: <code>A woman says: My name is Clara.<\/code> \u2014 colon, no quotes. (The 3.1 guide uses quotes for dialogue; verify output either way.)<\/td>\n<\/tr>\n<tr>\n<td>Prompting past the 1,024-token cap<\/td>\n<td>Prioritize subject, action, camera, audio; cut filler adjectives<\/td>\n<\/tr>\n<tr>\n<td><code>Vague quality terms<\/code> (<code>stunning<\/code>, <code>masterpiece<\/code>, <code>8k quality<\/code>)<\/td>\n<td>Descriptive visual language \u2014 what the camera sees, not superlatives<\/td>\n<\/tr>\n<tr>\n<td>Extending a clip whose voice isn't in the last second<\/td>\n<td>Voice can't be effectively extended unless present in the final ~1 s (24 frames) of the source clip<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Recommended Settings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Duration<\/strong><\/td>\n<td>4, 6, or 8 s (set per request; default 8 s)<\/td>\n<\/tr>\n<tr>\n<td><strong>Resolution<\/strong><\/td>\n<td>720p / 1080p / 4K (1080p and 4K for 8 s only)<\/td>\n<\/tr>\n<tr>\n<td><strong>Aspect ratio<\/strong><\/td>\n<td>16:9 or 9:16<\/td>\n<\/tr>\n<tr>\n<td><strong>Audio<\/strong><\/td>\n<td>Native, enabled by default; the complete soundtrack is directed from the prompt<\/td>\n<\/tr>\n<tr>\n<td><strong>negativePrompt<\/strong><\/td>\n<td>Free text describing exclusions, phrased positively (Vertex AI)<\/td>\n<\/tr>\n<tr>\n<td><strong>personGeneration<\/strong><\/td>\n<td>Text-to-video: <code>allow_all<\/code> only; image-to-video, interpolation, and reference-image modes: <code>allow_adult<\/code> only (region restrictions apply)<\/td>\n<\/tr>\n<tr>\n<td><strong>seed<\/strong><\/td>\n<td>Integer for consistency across scenes (Vertex AI)<\/td>\n<\/tr>\n<tr>\n<td><strong>Variants<\/strong><\/td>\n<td><code>veo-3.1<\/code> (quality, default) / <code>veo-3.1-fast<\/code> (speed) / <code>veo-3.1-lite<\/code> (cheapest; no video extension) \u2014 same prompting language, different price/quality/speed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Prompt Modes<\/h2>\n<h3>Text-to-Video<\/h3>\n<p>The prompt carries the full directing brief: the five-part formula plus the soundstage. Veo 3.1 cannot cut \u2014 it generates one unbroken take \u2014 so design the 8 seconds as a single continuous shot, or use <strong>timestamp prompting<\/strong> to pace multiple distinct shots within it. For multi-scene stories, the \"ingredients to video\" workflow (reference images for character/scene/object) maintains consistency across separately generated shots. Need more detail? Use Gemini to enrich a simple prompt into cinematic language.<\/p>\n<h3>Image-to-Video<\/h3>\n<p>Veo uses the input image as the <strong>initial frame<\/strong> \u2014 it owns subject, lighting, and style, so feed it a sharp, clear, well-composed image (\"the stronger the start, the better the finish\"). <strong>Prompt for motion only<\/strong>: camera movement, subject animation, environmental changes \u2014 and the audio. Do not re-describe the character, background, or lighting; redundant prompts confuse the model. Refer to characters with general terms (<code>the subject<\/code>, <code>the woman<\/code>, <code>he<\/code>, <code>she<\/code>, <code>they<\/code>). Three combinable motion types: camera motion (<code>Slow dolly in on the subject<\/code>), subject animation (<code>The character's hair and clothes flutter gently in the wind<\/code>), environmental animation (<code>Fog rolls in slowly across the landscape<\/code>). Advanced variants: <strong>first-and-last-frame<\/strong> (describe the transition between the two images \u2014 Google's documented example: \"The camera performs a smooth 180-degree arc shot, starting with the front-facing view of the singer and circling around her to seamlessly end on the POV shot from behind her on stage. The singer sings 'when you look me in the eyes, I can see a million stars.'\"), and <strong>ingredients to video<\/strong> (up to 3 reference images for consistent characters/objects across shots).<\/p>\n<hr />\n<h2>Good vs Bad Prompt Examples<\/h2>\n<h3>1. T2V \u2014 Full formula vs bare description<\/h3>\n<p><strong>Intended content:<\/strong> A tired office worker at a retro computer late at night.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A tired office worker at a computer, retro style\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>Medium shot, a tired corporate worker, rubbing his temples in exhaustion, in front of a bulky 1980s computer in a cluttered office late at night. The scene is lit by the harsh fluorescent overhead lights and the green glow of the monochrome monitor. Retro aesthetic, shot as if on 1980s color film, slightly grainy.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Google's own formula example. The bad prompt names subject and a style word but gives no cinematography, action detail, context, or ambiance \u2014 the good prompt fills all five slots, down to the light sources.<\/p>\n<h3>2. T2V audio \u2014 Directed soundstage vs assumed silence<\/h3>\n<p><strong>Intended content:<\/strong> A man examines a drawing by torchlight and speaks; a woman answers.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>A close up of two people staring at a cryptic drawing on a wall, torchlight flickering\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A close up of two people staring at a cryptic drawing on a wall, torchlight flickering. A man murmurs, &quot;This must be it. That's the secret code.&quot; The woman looks at him and whispering excitedly, &quot;What did you find?&quot;\n<\/code><\/pre>\n<p><strong>Why:<\/strong> On 3.1 the soundtrack is generated from the prompt \u2014 omit it and you get an undesigned one. The good prompt (Google's documented example) identifies both speakers, names their delivery, and puts the exact lines in quotes for lip-sync.<\/p>\n<h3>3. I2V \u2014 Motion-only vs re-description<\/h3>\n<p><strong>Intended content:<\/strong> Animate a photo of an old blue pickup truck in a sunflower field.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>An old, somewhat beat-up blue pickup truck with rust spots parked in front of a field of yellow sunflowers under a bright blue sky with white clouds, photorealistic style\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>A sweeping drone-like aerial view starting from ground level and rising to reveal the entire landscape in epic proportions\n<\/code><\/pre>\n<p><strong>Why:<\/strong> The documented rule: the image already provides subject, scene, and style \u2014 re-describing them fights the first-frame constraint and leads to poor results. The good prompt (Google's docs) directs only the camera move.<\/p>\n<h3>4. Multi-shot \u2014 Timestamp pacing vs event pile<\/h3>\n<p><strong>Intended content:<\/strong> An explorer discovers jungle ruins in 8 seconds.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>An explorer walks through the jungle and finds ancient ruins and looks amazed and runs her hand over a wall carving and then the camera pulls back to show the temple\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>[00:00-00:02] Medium shot from behind a young female explorer with a leather satchel and messy brown hair in a ponytail, as she pushes aside a large jungle vine to reveal a hidden path.\n[00:02-00:04] Reverse shot of the explorer's freckled face, her expression filled with awe as she gazes upon ancient, moss-covered ruins in the background. SFX: The rustle of dense leaves, distant exotic bird calls.\n[00:04-00:06] Tracking shot following the explorer as she steps into the clearing and runs her hand over the intricate carvings on a crumbling stone wall. Emotion: Wonder and reverence.\n[00:06-00:08] Wide, high-angle crane shot, revealing the lone explorer standing small in the center of the vast, forgotten temple complex, half-swallowed by the jungle. SFX: A swelling, gentle orchestral score begins to play.\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Google's documented timestamp workflow. The bad prompt stacks four shots with \"and then\" and no pacing; the good prompt assigns each beat a timed segment, one camera move, and its own SFX \u2014 a complete multi-shot sequence in one generation.<\/p>\n<h3>5. Negative prompt \u2014 Positive exclusion vs bare negation<\/h3>\n<p><strong>Intended content:<\/strong> A desolate landscape with nothing man-made.<\/p>\n<p><strong>\u274c Bad:<\/strong><\/p>\n<pre><code>negativePrompt: &quot;no man-made structures&quot;\n<\/code><\/pre>\n<p><strong>\u2705 Good:<\/strong><\/p>\n<pre><code>negativePrompt: &quot;a desolate landscape with no buildings or roads&quot;\n<\/code><\/pre>\n<p><strong>Why:<\/strong> Google's documented guidance: describe what you wish to exclude as a positive statement. Bare negations are weaker instructions; describing the desired absence (\"no buildings or roads\") gives the model a concrete visual to avoid.<\/p>\n<hr />\n<h2>Prompt Examples<\/h2>\n<h3>Camera language \u2014 crane shot (Google's documented example)<\/h3>\n<pre><code>Crane shot starting low on a lone hiker and ascending high above, revealing they are standing on the edge of a colossal, mist-filled canyon at sunrise, epic fantasy style, awe-inspiring, soft morning light\n<\/code><\/pre>\n<h3>Lens &amp; focus \u2014 shallow depth of field (Google's documented example)<\/h3>\n<pre><code>Close-up with very shallow depth of field, a young woman's face, looking out a bus window at the passing city lights with her reflection faintly visible on the glass, inside a bus at night during a rainstorm, melancholic mood with cool blue tones, moody, cinematic\n<\/code><\/pre>\n<h3>Portrait aspect ratio (Google's documented example)<\/h3>\n<pre><code>Create a video highlighting the smooth motion of a majestic Hawaiian waterfall within a lush rainforest. Focus on realistic water flow, detailed foliage, and natural lighting to convey tranquility. Capture the rushing water, misty atmosphere, and dappled sunlight filtering through the dense canopy. Use smooth, cinematic camera movements to showcase the waterfall and its surroundings. Aim for a peaceful, realistic tone, transporting the viewer to the serene beauty of the Hawaiian rainforest.\n<\/code><\/pre>\n<hr />\n<h2>Common Mistakes to Avoid<\/h2>\n<ol>\n<li><strong>Prompting past the 1,024-token cap<\/strong> \u2014 excess text is silently cut; prioritize subject, action, camera, audio.<\/li>\n<li><strong>Asking for cuts in a plain prompt<\/strong> \u2014 3.1 generates one unbroken take; use timestamp prompting for multi-shot sequences.<\/li>\n<li><strong>Re-describing the source image in image-to-video<\/strong> \u2014 prompt for motion only; redundancy degrades results.<\/li>\n<li><strong>Writing negative prompts as bare negations<\/strong> \u2014 describe the exclusion positively (\"a landscape with no buildings\").<\/li>\n<li><strong>Forgetting the audio layer<\/strong> \u2014 dialogue needs identified speakers with delivery; SFX need clarity and sync; ambience needs definition.<\/li>\n<li><strong>Expecting the Lite variant to extend video<\/strong> \u2014 extension is not available for Veo 3.1 Lite.<\/li>\n<\/ol>\n<hr />\n<h2>Technical Details<\/h2>\n<ul>\n<li><strong>Base Model:<\/strong> Veo 3.1 \u2014 Google DeepMind (<code>veo-3.1-generate-preview<\/code>, <code>veo-3.1-fast-generate-preview<\/code>, <code>veo-3.1-lite-generate-preview<\/code>); latest doc updates January 2026 (3.1/Fast), March 2026 (Lite)<\/li>\n<li><strong>Text Encoder:<\/strong><\/li>\n<li><strong>Max Prompt Tokens:<\/strong> 1,024 tokens text input (Gemini API)<\/li>\n<li><strong>Training Data / Notes:<\/strong> Natively generates synchronized audio (dialogue, SFX, ambience) at 48kHz per third-party technical reporting. Latent diffusion transformer architecture per third-party reporting. 8-second clips (4/6/8 s selectable), 720p/1080p/4K, 16:9 or 9:16. Supports text-to-video, image-to-video (initial frame), first-and-last-frame, reference images (up to 3), video extension, and add/remove-object editing (add/remove uses the Veo 2 model, no audio). All outputs carry SynthID watermarking.<\/li>\n<\/ul>\n<hr />\n<h2>Sources<\/h2>\n<ul>\n<li>https://ai.google.dev/gemini-api/docs/veo (prompt writing basics, dialogue/SFX examples, element-by-element examples, image-to-video/reference/first-last-frame/extension sections, model version table)<\/li>\n<li>https://cloud.google.com/blog/products/ai-machine-learning/ultimate-prompting-guide-for-veo-3-1 (five-part formula, soundstage directing, timestamp prompting, first/last frame and ingredients-to-video workflows)<\/li>\n<li>https://docs.cloud.google.com/vertex-ai/generative-ai/docs/video/best-practice (recommended/not-recommended pairs, single-scene rule, quotation-mark guidance, image-to-video motion-only guidance, character/voice consistency)<\/li>\n<li>https://blog.buildfastwithai.com/google-veo-3-1-ai-video-generator (Veo 3.1 release context, resolution/audio/extension capabilities)<\/li>\n<li>https://github.com/finpeakinc/frevana-skills/blob/HEAD/skills/veo-3.1/SKILL.md (Veo 3.1 parameter reference: resolutions, durations, reference images, negativePrompt, personGeneration)<\/li>\n<\/ul>", "pairs": 5, "file": "models/video/veo-3.1.md"}, "components/image-components/0": {"title": "Prompt Component: Lighting (Image)", "html": "\n<p><strong>Category:<\/strong> Image prompt building blocks\n<strong>Block:<\/strong> Lighting<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Lighting controls mood, depth, and realism more than almost any other prompt element. A named lighting setup tells the model exactly how light should fall on the subject and scene. Pick one primary lighting term per prompt to keep the look coherent.<\/p>\n<h2>How to use<\/h2>\n<p>Choose one lighting option per prompt and place it near the subject description. Avoid stacking contradictory lights (e.g. golden hour plus neon noir) unless you describe how they mix. Pair with a direction or mood word for stronger results.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Golden hour<\/td>\n<td><code>golden hour lighting<\/code><\/td>\n<td>Warm low sunlight just after sunrise or before sunset; flattering, the lifestyle-photography standard.<\/td>\n<\/tr>\n<tr>\n<td>Blue hour<\/td>\n<td><code>blue hour lighting<\/code><\/td>\n<td>Cool deep-blue ambient light after sunset; moody, cinematic, urban.<\/td>\n<\/tr>\n<tr>\n<td>Overcast<\/td>\n<td><code>soft overcast daylight<\/code><\/td>\n<td>Even, shadowless, diffused daylight; clean fashion lookbook and product look.<\/td>\n<\/tr>\n<tr>\n<td>Direct midday sun<\/td>\n<td><code>harsh direct midday sunlight<\/code><\/td>\n<td>Hard shadows and high contrast; gritty documentary or desert scenes.<\/td>\n<\/tr>\n<tr>\n<td>Window light<\/td>\n<td><code>soft window light from the side<\/code><\/td>\n<td>Gentle directional indoor light; flattering for portraits, food, and lifestyle.<\/td>\n<\/tr>\n<tr>\n<td>Backlit<\/td>\n<td><code>backlit, contre-jour<\/code><\/td>\n<td>Subject between camera and light source; glowing edges, ethereal or dreamy feel.<\/td>\n<\/tr>\n<tr>\n<td>Dappled light<\/td>\n<td><code>dappled light through leaves<\/code><\/td>\n<td>Light filtered through trees or blinds; organic, romantic, textured shadows.<\/td>\n<\/tr>\n<tr>\n<td>Sunrise glow<\/td>\n<td><code>warm sunrise glow<\/code><\/td>\n<td>Soft pink-gold morning light; hopeful, fresh, gentle atmosphere.<\/td>\n<\/tr>\n<tr>\n<td>Sunset glow<\/td>\n<td><code>dramatic sunset glow<\/code><\/td>\n<td>Rich orange-red evening light; romantic or epic outdoor scenes.<\/td>\n<\/tr>\n<tr>\n<td>Twilight<\/td>\n<td><code>twilight ambient light<\/code><\/td>\n<td>Dim purple-blue fading light; quiet, transitional, slightly melancholic.<\/td>\n<\/tr>\n<tr>\n<td>Moonlight<\/td>\n<td><code>cool moonlight<\/code><\/td>\n<td>Silvery night illumination; mysterious, serene, or eerie.<\/td>\n<\/tr>\n<tr>\n<td>Foggy / misty light<\/td>\n<td><code>soft light diffused through fog<\/code><\/td>\n<td>Flattened, atmospheric glow; mystery, isolation, dreamlike depth.<\/td>\n<\/tr>\n<tr>\n<td>Rembrandt lighting<\/td>\n<td><code>Rembrandt lighting<\/code><\/td>\n<td>Key light 45 degrees to the side; triangle of light on the shadow-side cheek; dramatic portrait.<\/td>\n<\/tr>\n<tr>\n<td>Butterfly / Paramount<\/td>\n<td><code>butterfly lighting<\/code><\/td>\n<td>Overhead frontal key light with shadow under the nose; classic beauty and glamour.<\/td>\n<\/tr>\n<tr>\n<td>Loop lighting<\/td>\n<td><code>loop lighting<\/code><\/td>\n<td>Key light slightly off-center; small nose shadow loops onto the cheek; most universally flattering portrait.<\/td>\n<\/tr>\n<tr>\n<td>Split lighting<\/td>\n<td><code>split lighting<\/code><\/td>\n<td>Light from the direct side; half the face lit, half in shadow; dramatic, editorial.<\/td>\n<\/tr>\n<tr>\n<td>Rim / edge light<\/td>\n<td><code>rim lighting from behind<\/code><\/td>\n<td>Bright outline separating subject from background; dramatic hair light and depth.<\/td>\n<\/tr>\n<tr>\n<td>Clamshell lighting<\/td>\n<td><code>clamshell lighting<\/code><\/td>\n<td>Key above plus fill below the face; eliminates under-eye shadows; pure beauty lighting.<\/td>\n<\/tr>\n<tr>\n<td>Broad lighting<\/td>\n<td><code>broad lighting<\/code><\/td>\n<td>Illuminates the side of the face toward camera; widens and brightens the subject.<\/td>\n<\/tr>\n<tr>\n<td>Short lighting<\/td>\n<td><code>short lighting<\/code><\/td>\n<td>Illuminates the side of the face away from camera; slims and sculpts with depth.<\/td>\n<\/tr>\n<tr>\n<td>Softbox<\/td>\n<td><code>large softbox key light<\/code><\/td>\n<td>Big diffused studio source; soft flattering light with gentle shadow transitions.<\/td>\n<\/tr>\n<tr>\n<td>Ring light<\/td>\n<td><code>ring light<\/code><\/td>\n<td>Circular catchlights in the eyes; flat even beauty light, influencer-portrait look.<\/td>\n<\/tr>\n<tr>\n<td>Beauty dish<\/td>\n<td><code>beauty dish lighting<\/code><\/td>\n<td>Crisp but flattering mid-size modifier; fashion and beauty editorial standard.<\/td>\n<\/tr>\n<tr>\n<td>Strip light<\/td>\n<td><code>strip light from the side<\/code><\/td>\n<td>Narrow vertical source; sleek edge highlights on products and bodies.<\/td>\n<\/tr>\n<tr>\n<td>Bare bulb<\/td>\n<td><code>bare bulb tungsten light<\/code><\/td>\n<td>Hard unmodified point source; raw, intimate, lo-fi nightclub feel.<\/td>\n<\/tr>\n<tr>\n<td>Chiaroscuro<\/td>\n<td><code>chiaroscuro lighting<\/code><\/td>\n<td>Extreme light-dark contrast in the painterly tradition; theatrical, baroque drama.<\/td>\n<\/tr>\n<tr>\n<td>Low-key<\/td>\n<td><code>low-key lighting<\/code><\/td>\n<td>Mostly dark tones with selective highlights; brooding, mysterious, dramatic.<\/td>\n<\/tr>\n<tr>\n<td>High-key<\/td>\n<td><code>high-key lighting<\/code><\/td>\n<td>Bright, predominantly light tones; airy, cheerful, commercial-clean.<\/td>\n<\/tr>\n<tr>\n<td>Neon noir<\/td>\n<td><code>neon noir lighting<\/code><\/td>\n<td>Colored neon sources in darkness; cyberpunk streets, nightclubs, rainy cities.<\/td>\n<\/tr>\n<tr>\n<td>Volumetric / god rays<\/td>\n<td><code>volumetric god rays<\/code><\/td>\n<td>Visible light shafts through haze or dust; epic, spiritual, cinematic scale.<\/td>\n<\/tr>\n<tr>\n<td>Cinematic lighting<\/td>\n<td><code>cinematic lighting<\/code><\/td>\n<td>Motivated movie-style light with shaped shadows; instantly filmic mood.<\/td>\n<\/tr>\n<tr>\n<td>Candlelight<\/td>\n<td><code>warm candlelight<\/code><\/td>\n<td>Flickering warm point sources; intimate, historic, romantic.<\/td>\n<\/tr>\n<tr>\n<td>Firelight<\/td>\n<td><code>flickering firelight<\/code><\/td>\n<td>Orange dancing light with deep shadows; campfire, forge, primal scenes.<\/td>\n<\/tr>\n<tr>\n<td>Silhouette<\/td>\n<td><code>silhouette against bright background<\/code><\/td>\n<td>Subject rendered as dark shape; graphic, mysterious, emphasizes form.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/image-lighting.md"}, "components/image-components/1": {"title": "Prompt Component: Framing &amp; Composition (Image)", "html": "\n<p><strong>Category:<\/strong> Image prompt building blocks\n<strong>Block:<\/strong> Framing &amp; Composition<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Framing decides how close the viewer feels to the subject and how the eye travels through the image. Shot scale sets intimacy, camera angle sets power dynamics, and composition techniques organize the frame. Together they turn a description into a directed photograph.<\/p>\n<h2>How to use<\/h2>\n<p>Pick one shot scale and, optionally, one camera angle and one composition technique. Avoid combining contradictory scales (close-up plus wide shot) in a single prompt.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Extreme close-up<\/td>\n<td><code>extreme close-up<\/code><\/td>\n<td>Fills the frame with a detail like an eye or texture; maximum intimacy and intensity.<\/td>\n<\/tr>\n<tr>\n<td>Close-up<\/td>\n<td><code>close-up<\/code><\/td>\n<td>Face or key object dominates; emotion and fine detail take center stage.<\/td>\n<\/tr>\n<tr>\n<td>Medium close-up<\/td>\n<td><code>medium close-up<\/code><\/td>\n<td>Head and shoulders; the classic portrait and interview framing.<\/td>\n<\/tr>\n<tr>\n<td>Medium shot<\/td>\n<td><code>medium shot<\/code><\/td>\n<td>Waist up; balances subject expression with body language.<\/td>\n<\/tr>\n<tr>\n<td>Cowboy shot<\/td>\n<td><code>cowboy shot<\/code><\/td>\n<td>Mid-thigh up; western-inspired framing that shows stance and gear.<\/td>\n<\/tr>\n<tr>\n<td>Full shot<\/td>\n<td><code>full body shot<\/code><\/td>\n<td>Entire subject head to toe; shows pose, outfit, and proportions.<\/td>\n<\/tr>\n<tr>\n<td>Wide shot<\/td>\n<td><code>wide shot<\/code><\/td>\n<td>Subject plus generous environment; establishes place and context.<\/td>\n<\/tr>\n<tr>\n<td>Extreme wide shot<\/td>\n<td><code>extreme wide shot<\/code><\/td>\n<td>Vast landscape with tiny subject; emphasizes scale and isolation.<\/td>\n<\/tr>\n<tr>\n<td>Aerial / drone view<\/td>\n<td><code>aerial drone view<\/code><\/td>\n<td>High overhead perspective; patterns, geography, sweeping establishing shots.<\/td>\n<\/tr>\n<tr>\n<td>Macro detail<\/td>\n<td><code>macro detail shot<\/code><\/td>\n<td>Extreme magnification of tiny subjects; texture, insects, jewelry, water drops.<\/td>\n<\/tr>\n<tr>\n<td>Eye level<\/td>\n<td><code>eye-level camera angle<\/code><\/td>\n<td>Neutral, honest perspective; viewer meets the subject as an equal.<\/td>\n<\/tr>\n<tr>\n<td>Low angle<\/td>\n<td><code>low angle shot<\/code><\/td>\n<td>Camera below the subject looking up; power, dominance, heroism.<\/td>\n<\/tr>\n<tr>\n<td>High angle<\/td>\n<td><code>high angle shot<\/code><\/td>\n<td>Camera above looking down; vulnerability, smallness, overview.<\/td>\n<\/tr>\n<tr>\n<td>Bird's eye view<\/td>\n<td><code>bird's eye view<\/code><\/td>\n<td>Directly overhead; graphic patterns, maps, stylized layouts.<\/td>\n<\/tr>\n<tr>\n<td>Worm's eye view<\/td>\n<td><code>worm's eye view<\/code><\/td>\n<td>Ground level looking straight up; towering scale, dramatic vertigo.<\/td>\n<\/tr>\n<tr>\n<td>Dutch tilt<\/td>\n<td><code>dutch tilt<\/code><\/td>\n<td>Canted, off-kilter frame; unease, chaos, psychological tension.<\/td>\n<\/tr>\n<tr>\n<td>Overhead / top-down<\/td>\n<td><code>overhead top-down view<\/code><\/td>\n<td>Flat-lay perspective; food, products, and organized compositions.<\/td>\n<\/tr>\n<tr>\n<td>POV<\/td>\n<td><code>first-person POV<\/code><\/td>\n<td>Seen through the subject's own eyes; immersion and immediacy.<\/td>\n<\/tr>\n<tr>\n<td>Rule of thirds<\/td>\n<td><code>rule of thirds composition<\/code><\/td>\n<td>Subject placed on third-line intersections; balanced, natural, photographic.<\/td>\n<\/tr>\n<tr>\n<td>Leading lines<\/td>\n<td><code>leading lines composition<\/code><\/td>\n<td>Roads, rails, or architecture guiding the eye to the subject.<\/td>\n<\/tr>\n<tr>\n<td>Symmetry<\/td>\n<td><code>symmetrical composition<\/code><\/td>\n<td>Mirrored balance around a central axis; formal, powerful, Wes Anderson-like.<\/td>\n<\/tr>\n<tr>\n<td>Negative space<\/td>\n<td><code>generous negative space<\/code><\/td>\n<td>Large empty areas around the subject; minimalism, calm, focus.<\/td>\n<\/tr>\n<tr>\n<td>Frame within a frame<\/td>\n<td><code>frame within a frame<\/code><\/td>\n<td>Doorways or windows enclosing the subject; layered depth and voyeurism.<\/td>\n<\/tr>\n<tr>\n<td>Golden ratio<\/td>\n<td><code>golden ratio composition<\/code><\/td>\n<td>Spiral-based classical placement; harmonious, painterly balance.<\/td>\n<\/tr>\n<tr>\n<td>Centered composition<\/td>\n<td><code>centered composition<\/code><\/td>\n<td>Subject dead center; confrontational, iconic, poster-like.<\/td>\n<\/tr>\n<tr>\n<td>Diagonal composition<\/td>\n<td><code>dynamic diagonal composition<\/code><\/td>\n<td>Strong diagonal energy across the frame; movement and tension.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/image-framing-composition.md"}, "components/image-components/2": {"title": "Prompt Component: Camera Bodies (Image)", "html": "\n<p><strong>Category:<\/strong> Image prompt building blocks\n<strong>Block:<\/strong> Camera Bodies<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Naming a camera or film stock steers the model toward a specific capture aesthetic: sensor look, color science, grain, and contrast. One capture identity per prompt keeps the result believable instead of a muddled mix of looks.<\/p>\n<h2>How to use<\/h2>\n<p>Pick at most one camera or film stock per prompt. Place it near the end of the prompt as the capture credit. Do not stack multiple bodies (e.g. Hasselblad plus iPhone) in one prompt.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Canon EOS R5<\/td>\n<td><code>shot on Canon EOS R5<\/code><\/td>\n<td>Modern full-frame mirrorless; crisp, clean, high-resolution digital look.<\/td>\n<\/tr>\n<tr>\n<td>Sony A7R IV<\/td>\n<td><code>shot on Sony A7R IV<\/code><\/td>\n<td>High-resolution full-frame; sharp, neutral, detail-rich digital capture.<\/td>\n<\/tr>\n<tr>\n<td>Nikon Z9<\/td>\n<td><code>shot on Nikon Z9<\/code><\/td>\n<td>Flagship mirrorless; punchy, precise, professional sports and wildlife look.<\/td>\n<\/tr>\n<tr>\n<td>Leica M6<\/td>\n<td><code>shot on Leica M6<\/code><\/td>\n<td>Classic 35mm rangefinder; timeless, slightly soft, documentary soul.<\/td>\n<\/tr>\n<tr>\n<td>Leica Q3<\/td>\n<t zval lens<\/code><\/td>\n<td>Swirly bokeh and soft edges; dreamy 19th-century optical character.<\/td>\n<\/tr>\n<tr>\n<td>Pinhole<\/td>\n<td><code>pinhole camera<\/code><\/td>\n<td>Infinite depth, soft dreamy blur; primitive, meditative, lo-fi.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/image-lenses.md"}, "components/image-components/4": {"title": "Prompt Component: Aperture &amp; Depth of Field (Image)", "html": "\n<p><strong>Category:<\/strong> Image prompt building blocks\n<strong>Block:<\/strong> Aperture &amp; Depth of Field<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Aperture controls how much of the image is in sharp focus. Wide apertures isolate the subject against creamy blur; narrow apertures keep everything tack sharp. This is one of the fastest ways to add photographic credibility to a prompt.<\/p>\n<h2>How to use<\/h2>\n<p>Pick one aperture or depth-of-field term per prompt, paired with a lens choice. Wide apertures suit portraits and subject isolation; narrow apertures suit landscapes and architecture.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>f/1.2<\/td>\n<td><code>f/1.2<\/code><\/td>\n<td>Extreme shallow focus; dreamy, razor-thin plane of sharpness.<\/td>\n<\/tr>\n<tr>\n<td>f/1.4<\/td>\n<td><code>f/1.4<\/code><\/td>\n<td>Very shallow depth of field; the classic fast-prime portrait look.<\/td>\n<\/tr>\n<tr>\n<td>f/1.8<\/td>\n<td><code>f/1.8<\/code><\/td>\n<td>Shallow focus with a touch more room; versatile low-light prime look.<\/td>\n<\/tr>\n<tr>\n<td>f/2.8<\/td>\n<td><code>f/2.8<\/code><\/td>\n<td>Soft background separation while keeping the subject fully sharp; pro zoom standard.<\/td>\n<\/tr>\n<tr>\n<td>f/4<\/td>\n<td><code>f/4<\/code><\/td>\n<td>Moderate depth; subject sharp with gently softened background.<\/td>\n<\/tr>\n<tr>\n<td>f/5.6<\/td>\n<td><code>f/5.6<\/code><\/td>\n<td>Balanced depth; group shots and street scenes stay readable.<\/td>\n<\/tr>\n<tr>\n<td>f/8<\/td>\n<td><code>f/8<\/code><\/td>\n<td>Deep focus sweet spot; landscapes and architecture tack sharp.<\/td>\n<\/tr>\n<tr>\n<td>f/11<\/td>\n<td><code>f/11<\/code><\/td>\n<td>Very deep focus; maximum detail across near and far.<\/td>\n<\/tr>\n<tr>\n<td>f/16<\/td>\n<td><code>f/16<\/code><\/td>\n<td>Everything sharp with sunstar highlights; epic deep-focus scenes.<\/td>\n<\/tr>\n<tr>\n<td>Shallow depth of field<\/td>\n<td><code>shallow depth of field<\/code><\/td>\n<td>Subject sharp, background melts away; instant photographic depth.<\/td>\n<\/tr>\n<tr>\n<td>Deep focus<\/td>\n<td><code>deep focus<\/code><\/td>\n<td>Foreground to background all sharp; epic clarity and detail.<\/td>\n<\/tr>\n<tr>\n<td>Creamy bokeh<\/td>\n<td><code>creamy bokeh<\/code><\/td>\n<td>Silky out-of-focus background; romantic, premium portrait glow.<\/td>\n<\/tr>\n<tr>\n<td>Bokeh balls<\/td>\n<td><code>glowing bokeh balls in background<\/code><\/td>\n<td>Round out-of-focus light orbs; festive nights and dreamy city scenes.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<p><em>This page is generated from <code>components.json<\/code> \u2014 the structured source for the future prompt builder's dropdowns. Edit the JSON, not this file.<\/em><\/p>", "pairs": 0, "file": "models/components/image-aperture-depth-of-field.md"}, "components/image-components/5": {"title": "Prompt Component: Style &amp; Medium (Image)", "html": "\n<p><strong>Category:<\/strong> Image prompt building blocks\n<strong>Block:<\/strong> Style &amp; Medium<\/p>\n<hr />\n<h2>About this block<\/h2>\n<p>Style and medium define the visual universe of the image: photograph, painting, illustration, or render. This is the highest-level aesthetic decision, so state it once, clearly, and let every other building block support it.<\/p>\n<h2>How to use<\/h2>\n<p>Pick one style per prompt and state it early. Avoid mixing mediums (photorealistic plus oil painting) unless the blend itself is the concept.<\/p>\n<h2>Options<\/h2>\n<p>Pick from the dropdown column \u2014 the prompt text is the exact snippet to paste into your prompt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Prompt text<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Photorealistic<\/td>\n<td><code>photorealistic<\/code><\/td>\n<td>Indistinguishable from a real photograph; the default for lifelike imagery.<\/td>\n<\/tr>\n<tr>\n<td>Cinematic film still<\/td>\n<td><code>cinematic film still<\/code><\/td>\n<td>Movie-frame look with dramatic light and widescreen composition.<\/td>\n<\/tr>\n<tr>\n<td>Anime<\/td>\n<td><code>anime style<\/code><\/td>\n<td>Japanese animation aesthetic; clean lines, expressive eyes, vibrant color.<\/td>\n<\/tr>\n<tr>\n<td>Manga<\/td>\n<td><code>black and white manga style<\/code><\/td>\n<td>Ink-heavy Japanese comic art; screentones, speed lines, dramatic panels.<\/td>\n<\/tr>\n<tr>\n<td>Oil painting<\/td>\n<td><code>oil painting<\/code><\/td>\n<td>Rich textured brushwork; classical to impressionist painterly depth.<\/td>\n<\/tr>\n<tr>\n<td>Watercolor<\/td>\n<td><code>watercolor painting<\/code><\/td>\n<td>Translucent washes and soft edges; delicate, airy, artistic.<\/td>\n<\/tr>\n<tr>\n<td>Gouache<\/td>\n<td><code>gouache painting<\/code><\/td>\n<td>Opaque matte watercolor; flat bold color, vintage illustration feel.<\/td>\n<\/tr>\n<tr>\n<td>Acrylic painting<\/td>\n<td><code>acrylic painting<\/code><\/td>\n<td>Bold saturated strokes; modern, textured, expressive.<\/td>\n<\/tr>\n<tr>\n<td>Pixel art<\/td>\n<td><code>pixel art<\/code><\/td>\n<td>Retro game sprite aesthetic; chunky, nostalgic, deliberately low-res.<\/td>\n<\/tr>\n<tr>\n<td>3D render<
